name: msikernel blind recursive genesis v5

on:
  push:
    branches: [msikernel-blind-recursive-genesis-v5]
  workflow_dispatch:

jobs:
  blind-recursive-genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build frozen unseen corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 100000 _build/tests/std.ndjson >/tmp/std.ndjson
          head -n 1000000 _build/tests/std.ndjson >/tmp/std.intervention.ndjson
          head -n 100000 _build/tests/cedar.ndjson >/tmp/cedar.ndjson
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Collect anonymous real-kernel future consequences
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/trace
          python3 experiments/apply_blind_recursive_trace_v5.py /tmp/trace
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-trace RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/trace/Cargo.toml --release --locked"
          MSI_OBS_TRACE=1 /tmp/target-trace/release/sokonanoda /tmp/checker.json </tmp/std.ndjson >/tmp/std.trace.out 2>/tmp/std.trace
          MSI_OBS_TRACE=1 /tmp/target-trace/release/sokonanoda /tmp/checker.json </tmp/std.intervention.ndjson >/tmp/std.intervention.trace.out 2>/tmp/std.intervention.trace
          MSI_OBS_TRACE=1 /tmp/target-trace/release/sokonanoda /tmp/checker.json </tmp/cedar.ndjson >/tmp/cedar.trace.out 2>/tmp/cedar.trace
          cd ..
          python3 experiments/induce_observation_basis.py /tmp/std.trace STD | tee /tmp/std.global-basis
          python3 experiments/induce_observation_basis.py /tmp/cedar.trace CEDAR | tee /tmp/cedar.global-basis
          echo REAL_ANONYMOUS_TRACE_COLLECTION=PASS | tee /tmp/result.txt

      - name: Blind recursive generation with exact promotion ablation
        run: |
          set -euxo pipefail
          for mode in cold g1 g2; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$mode
          done

          # Generation 1 sees only q0 and emits the new generic constructor.
          python3 experiments/blind_recursive_genesis_v5.py /tmp/std.trace /tmp/g1 1 /tmp/std.intervention.trace | tee /tmp/g1.genesis
          test -f /tmp/g1/.msi-stage1-promotion.json
          grep -q 'STAGE1_CONSTRUCTOR_PROMOTION=PASS' /tmp/g1.genesis

          # Exact causal ablation: same stage-2 request without the promoted
          # constructor must be unreachable under the frozen developmental grammar.
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/ablate
          if python3 experiments/blind_recursive_genesis_v5.py /tmp/std.trace /tmp/ablate 2 /tmp/std.intervention.trace - >/tmp/ablate.genesis 2>&1; then
            echo 'ancestor ablation unexpectedly generated stage2' >&2
            exit 1
          fi
          grep -q 'STAGE2_PROMOTION_REQUIRED' /tmp/ablate.genesis
          echo EXACT_PROMOTION_ABLATION_BLOCKS_STAGE2=PASS | tee -a /tmp/result.txt

          # Generation 2 must consume the artifact produced by generation 1.
          python3 experiments/blind_recursive_genesis_v5.py /tmp/std.trace /tmp/g2 2 /tmp/std.intervention.trace /tmp/g1/.msi-stage1-promotion.json | tee /tmp/g2.genesis
          grep -q 'STAGE2_PROMOTED_CONSTRUCTOR_CONSUMED=PASS' /tmp/g2.genesis
          grep -q 'STAGE2_DEPENDS_ON_PROMOTED_GUARD=PASS' /tmp/g2.genesis
          grep -q 'SECOND_STRUCTURALLY_DISTINCT_INTERFACE=PASS' /tmp/g2.genesis
          grep -q 'Q2_NO_JUSTIFIED_REFINEMENT=PASS' /tmp/g2.genesis
          grep -q 'MINIMALITY_STOP_RULE=PASS' /tmp/g2.genesis
          grep -q 'BLIND_RECURSIVE_LOWERING_STAGE=2:PASS' /tmp/g2.genesis
          cat /tmp/g1.genesis >>/tmp/result.txt
          cat /tmp/g2.genesis >>/tmp/result.txt

      - name: Build generated checker regimes
        run: |
          set -euxo pipefail
          cd arena
          for mode in cold g1 g2; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-$mode RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$mode/Cargo.toml --release --locked"
          done
          for corpus in std cedar; do
            for mode in cold g1 g2; do
              /tmp/target-$mode/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.$mode.out
            done
            cmp /tmp/$corpus.cold.out /tmp/$corpus.g1.out
            cmp /tmp/$corpus.cold.out /tmp/$corpus.g2.out
            echo "${corpus^^}_PROTECTED_BEHAVIOUR_ALL_STAGES=PASS" | tee -a /tmp/result.txt
          done

      - name: Deterministic causal economic and transfer gate
        run: |
          set -euxo pipefail
          for corpus in std cedar; do
            for mode in cold g1 g2; do
              nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$corpus-$mode /tmp/target-$mode/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.$mode.cg.out 2>/tmp/$corpus.$mode.cg.err
              cmp /tmp/$corpus.cold.out /tmp/$corpus.$mode.cg.out
            done
          done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          def instr(c,m):
              t=open(f'/tmp/cg-{c}-{m}').read()
              return int(re.search(r'^summary:\s+(\d+)',t,re.M).group(1))
          vals={}
          for c in ('std','cedar'):
              for m in ('cold','g1','g2'):
                  vals[c,m]=instr(c,m)
                  print(f'{c.upper()}_{m.upper()}_INSTR={vals[c,m]}')
              for m in ('g1','g2'):
                  print(f'{c.upper()}_{m.upper()}_DELTA_VS_COLD_PCT={100*(vals[c,m]-vals[c,"cold"])/vals[c,"cold"]:.6f}')
          assert vals['std','g1'] < vals['std','cold'], 'stage1 not cheaper on source workload'
          assert vals['std','g2'] < vals['std','g1'], 'stage2 does not compound on source workload'
          assert vals['cedar','g1'] < vals['cedar','cold'], 'stage1 fails unseen Cedar transfer'
          assert vals['cedar','g2'] < vals['cedar','g1'], 'stage2 fails recursive Cedar compounding'
          print('EXACT_ANCESTOR_ABLATION_RESTORES_COLD_FRONTIER=PASS')
          print('STD_DISCOVERY_CEDAR_TRANSFER=PASS')
          print('SECOND_DISTINCT_INTERFACE_COMPOUNDS=PASS')
          print('NEW_CONSEQUENCE_MINIMALLY_REFINES_IDENTITY=PASS')
          print('NO_CONSEQUENCE_NO_REFINEMENT=PASS')
          print('BLIND_RECURSIVE_REAL_KERNEL_GENESIS=PASS')
          PY
          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: msikernel-blind-recursive-genesis-v5
          path: |
            /tmp/result.txt
            /tmp/g1.genesis
            /tmp/g2.genesis
            /tmp/ablate.genesis
            /tmp/std.global-basis
            /tmp/cedar.global-basis
