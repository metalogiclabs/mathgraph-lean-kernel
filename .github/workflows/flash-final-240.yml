name: Flash final exact 240-case current-round qualification
on:
  push:
    branches: [research/flash-current-arena-open-shift-20261125]
    paths: [.github/workflows/flash-final-240.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTFLAGS: -C target-cpu=native
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact final candidate and six-guard baseline
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/final-portable"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/commit.txt"
          git rev-parse HEAD:src > "$OUT/source-tree.txt"
          git diff --exit-code 3b5a4ba64b4e47f5da06f6d4a3eda35f0ed64968 -- src Cargo.toml Cargo.lock
          git worktree add --detach "$RUNNER_TEMP/six-guard" 6c2889330be236b3bc063b3415de6e9af65ecfe1
          cargo test --release --locked nat_shift_huge_exact_identities -- --nocapture | tee "$OUT/native-shift.log"
          grep -q '1 passed; 0 failed' "$OUT/native-shift.log"
          cargo build --release --locked
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/six-guard/Cargo.toml"
      - name: Strict all-230 portable oracle comparison
        run: |
          set -euxo pipefail
          python3 experiments/flash-current-arena-20261125/combined.py portable --out "$RUNNER_TEMP/final-portable" --before "$RUNNER_TEMP/six-guard/target/release/sokonanoda" --candidate "$PWD/target/release/sokonanoda"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-final-portable
          path: |
            ${{ runner.temp }}/final-portable/*.json
            ${{ runner.temp }}/final-portable/*.txt
            ${{ runner.temp }}/final-portable/*.log
            ${{ runner.temp }}/final-portable/logs/
          if-no-files-found: error
          retention-days: 30
  large:
    needs: portable
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: cedar
            test: cedar
          - id: con-leche
            test: con-leche
          - id: cslib
            test: cslib
          - id: init
            test: init
          - id: navier-stokes-euler
            test: navier-stokes-euler
          - id: magma-string-n4
            test: perf/magma-string-n4
          - id: magma-string-pair-n9
            test: perf/magma-string-pair-n9
          - id: reachability
            test: reachability
          - id: std
            test: std
          - id: mathlib
            test: mathlib
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C target-cpu=native
      CASE: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact combined candidate and build
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/large-evidence"
          git diff --exit-code 3b5a4ba64b4e47f5da06f6d4a3eda35f0ed64968 -- src Cargo.toml Cargo.lock
          git rev-parse HEAD:src > "$RUNNER_TEMP/large-evidence/source-tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/large-evidence/commit.txt"
          rustc -Vv > "$RUNNER_TEMP/large-evidence/compiler.txt"
          cargo build --locked --release
          sha256sum target/release/sokonanoda > "$RUNNER_TEMP/large-evidence/binary.txt"
      - name: Retrieve pinned Arena source and prepare exporter
        run: |
          set -euxo pipefail
          A="$RUNNER_TEMP/arena-source"
          git init "$A"
          git -C "$A" remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C "$A" fetch --depth 1 origin 99195b6b009bc3df2c946ddbcfa4a2ab1eb40350
          git -C "$A" checkout --detach FETCH_HEAD
          test "$(git -C "$A" rev-parse HEAD)" = 99195b6b009bc3df2c946ddbcfa4a2ab1eb40350
          # Cedar specifies bash-only shopt. Preserve the exact pre-build text
          # and run it in bash instead of /bin/sh. Input SHA must still match.
          if [ "$CASE" = cedar ]; then
            python3 - "$A/tests/cedar.yaml" <<'PY'
          import pathlib,sys,re,shlex
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          pattern=r"(?m)^pre-build: (shopt[^\n]+)$"
          s,n=re.subn(pattern,lambda m:"pre-build: "+repr("bash -c "+shlex.quote(m.group(1))),s)
          # YAML double-quote encoding avoids nested single-quote ambiguity.
          if n==1:
              import json
              original=p.read_text(); s,n=re.subn(pattern,lambda m:"pre-build: "+json.dumps("bash -c "+shlex.quote(m.group(1))),original)
          assert n==1, "Cedar recipe changed"
          p.write_text(s)
          PY
            git -C "$A" diff -- tests/cedar.yaml > "$RUNNER_TEMP/large-evidence/cedar-shell-repair.txt"
          fi
          python3 -m venv "$RUNNER_TEMP/arena-venv"
          "$RUNNER_TEMP/arena-venv/bin/pip" install jinja2 jsonschema markdown pyyaml
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Regenerate exact official test input
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/arena-source"
          "$RUNNER_TEMP/arena-venv/bin/python" lka.py build-test "$CASE" 2>&1 | tee "$RUNNER_TEMP/large-evidence/export.log"
          test -s "_build/tests/$CASE.ndjson"
      - name: Verify input bytes and require strict ACCEPT
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("recovery", Path("experiments/flash-current-arena-20261125/recovery.py"))
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          out = Path(os.environ["RUNNER_TEMP"]) / "large-evidence"
          tests = m.source_manifest(out)
          name = os.environ["CASE"]
          meta = tests[name]
          assert meta["outcome"] == "accept" and meta["size"] > 10 * 1024 * 1024
          fixture = Path(os.environ["RUNNER_TEMP"]) / "arena-source/_build/tests" / (name + ".ndjson")
          actual = {"size":fixture.stat().st_size,"sha256":m.sha(fixture)}
          m.dump(out/"input-identity.json",{"name":name,"actual":actual,"expected_size":meta["size"],"expected_sha256":meta["sha256"]})
          assert actual == {"size":meta["size"],"sha256":meta["sha256"]}
          logs=out/"logs"
          logs.mkdir()
          binary=Path("target/release/sokonanoda").resolve()
          row=m.run_one([str(binary),str(m.config(out))],fixture,int(meta["timeout"]), "candidate",logs,name)
          row.update({"expected":"accept","input_sha256":actual["sha256"],"binary_sha256":m.sha(binary)})
          m.dump(out/"large-verdict.json",row)
          print("LARGE_VERDICT",json.dumps(row),flush=True)
          assert row["raw_exit"] == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-final-large-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/large-evidence/*.json
            ${{ runner.temp }}/large-evidence/*.txt
            ${{ runner.temp }}/large-evidence/*.log
            ${{ runner.temp }}/large-evidence/logs/
          if-no-files-found: error
          retention-days: 30
