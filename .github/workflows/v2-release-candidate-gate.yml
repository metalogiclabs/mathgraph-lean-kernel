name: V2 release candidate gate

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/v2-release-candidate.trigger'
      - 'experiments/v2-eval-additive.trigger'
  workflow_dispatch:

jobs:
  massive-gain-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Run exact V2 semantic census
        run: bash scripts/run_massive_gain_semantic_census.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: massive-gain-semantic-census
          path: |
            /tmp/census.txt
            /tmp/decision.txt
            /tmp/init.err
            /tmp/std.err
            /tmp/mathlib.err
