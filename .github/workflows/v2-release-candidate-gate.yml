name: V2 release candidate gate

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/v2-release-candidate.trigger'
      - 'experiments/v2-eval-additive.trigger'
  workflow_dispatch:

jobs:
  canonical-env-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Run canonical environment capacity separator
        run: bash scripts/run_canonical_env_capacity_separator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-env-capacity-separator
          path: |
            /tmp/instructions.csv
            /tmp/summary.txt
            /tmp/*-mathlib.err
            /tmp/*-std.err
