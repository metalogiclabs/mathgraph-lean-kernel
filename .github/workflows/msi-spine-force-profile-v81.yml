name: MSI spine force profile v81
on:
  push:
    branches:
      - experiment/msi-spine-force-profile-v81
  workflow_dispatch:
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Profile frozen spine force callsite
        run: bash experiments/run_msi_spine_force_profile_v81.sh
      - name: Upload v81 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-spine-force-profile-v81
          path: |
            /tmp/v81/profile.csv
            /tmp/v81/profile.json
            /tmp/v81/timings.csv
            /tmp/v81/binaries.csv
            /tmp/v81/out
            /tmp/v81/profile/src/eval.rs
