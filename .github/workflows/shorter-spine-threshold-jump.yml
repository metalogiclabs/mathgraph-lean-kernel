name: Shorter spine threshold jump

on:
  push:
    branches:
      - experiment/shorter-spine-threshold-jump
  workflow_dispatch:

jobs:
  jump:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          set_as_trusted_user: true
      - name: Run threshold jump
        run: bash scripts/run_shorter_spine_threshold_jump.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorter-spine-threshold-jump
          path: |
            jump-times.tsv
            jump-decision.txt
            jump-semantic-gate.txt
