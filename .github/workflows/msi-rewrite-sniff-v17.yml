name: MSI rewrite sniff v17
on:
  push:
    branches: [msi-rewrite-sniff-v17]
  workflow_dispatch:

jobs:
  sniff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build Std prefix and sniff checker
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          head -n 1000000 _build/tests/std.ndjson > /tmp/std-prefix.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/cand
          cp experiments/apply_msi_rewrite_sniff_v17.py /tmp/cand/patch.py
          (cd /tmp/cand && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/cand-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/cand/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Run five-way sniff tournament
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -f 'NATIVE=%e RSS=%M' /tmp/cand-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/std.out 2>/tmp/std.err
          grep 'MSI_SNIFF' /tmp/std.err | tail -1 > /tmp/snapshot.txt
          cat /tmp/snapshot.txt
          python3 - <<'PY' | tee /tmp/result.txt
          import re
          line=open('/tmp/snapshot.txt').read().strip()
          v={k:int(x) for k,x in re.findall(r'(\w+)=(\d+)', line)}
          T=v['total']
          pct=lambda n,d=T: 100*n/d if d else 0.0
          raw=pct(v['raw_eq'])
          post=pct(v['post_eq_new'])
          force_noop=pct(v['force_x_noop']+v['force_y_noop'],2*T)
          draw=pct(v['digest_eq_raw'],v['digest_sample'])
          dpost=pct(v['digest_eq_post'],v['digest_post_sample'])
          sptr=pct(v['spine_ptr_eq'],v['spine_call'])
          sarg=pct(v['spine_arg_raw_eq'],v['spine_app'])
          sdigest=pct(v['spine_digest_eq'],v['spine_digest_sample'])
          proof=pct(v['proof_skip'],v['spine_app'])
          sigmask=pct(v['sig_mask'],v['sig_call'])
          branches={
            'rigid_bvar':v['direct_rigid_bvar'],'named_rigid':v['direct_named'],
            'recursor_quot':v['direct_recquot'],'pi':v['direct_pi'],'lam':v['direct_lam'],
            'unfold':v['direct_unfold'],'atomic':v['direct_atomic']}
          bsum=sum(branches.values())
          concentration=pct(max(branches.values()) if branches else 0, bsum)
          print(line)
          print('\nFIVE_WAY_SNIFF')
          print(f'1_CAUSAL_ORDER raw_identity_before_force={raw:.3f}% post_force_new_identity={post:.3f}% PRIOR_DETERMINISTIC_GAIN=0.1340%')
          print(f'2_TYPED_MINIMAL_INTERFACES cache_decisions={(pct(v["uf_hit"]+v["neg_hit"])):.3f}% proof_mask={proof:.3f}% sig_mask={sigmask:.3f}% PRIOR_APP_ONLY_GAIN=0.223378%')
          print(f'3_CANONICAL_PERSISTENT_REFS sampled_raw_nonptr_digest_equal={draw:.3f}% sampled_postforce_nonptr_digest_equal={dpost:.3f}% spine_identity={sptr:.3f}% arg_identity={sarg:.3f}% sampled_nonptr_arg_digest_equal={sdigest:.3f}%')
          print(f'4_DEMAND_DRIVEN_REFINEMENT force_calls_noop={force_noop:.3f}% cold_fallback={pct(v["cold"]):.3f}% direct_success={pct(v["direct_ok"]):.3f}%')
          print(f'5_LEARNED_CONSTRUCTOR_MACHINE direct_branch_concentration={concentration:.3f}% direct_branches={branches}')
          print('\nINTERPRETATION_GATES')
          print('canonical_refs_HIGH' if draw>=10 or sdigest>=10 else 'canonical_refs_LOW_TO_MODERATE')
          print('demand_rewrite_HIGH' if force_noop>=80 else 'demand_rewrite_MODERATE')
          print('constructor_specialization_HIGH' if concentration>=50 else 'constructor_specialization_DISTRIBUTED')
          print('\nIMPORTANT: digest equality is a structural headroom proxy, not proof of behavioural equivalence or a safe canonicalization rule.')
          PY
          tail -20 /tmp/std.err
      - name: Upload sniff results
        uses: actions/upload-artifact@v4
        with:
          name: msi-rewrite-sniff-v17
          path: |
            /tmp/result.txt
            /tmp/snapshot.txt
