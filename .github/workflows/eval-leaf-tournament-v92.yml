name: Evaluation leaf tournament v92
on:
  push:
    branches: [experiment/eval-leaf-tournament-v92]
    paths:
      - 'experiments/eval_leaf_tournament_v92.py'
      - '.github/workflows/eval-leaf-tournament-v92.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tournament:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        variant: [var, nat, string, var_nat, var_string, nat_string, all]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONOPTIMIZE: '0'
      V92_ROOT: /tmp/v92-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tournament source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B experiments/eval_leaf_tournament_v92.py --self-test
          python3 -m py_compile experiments/eval_leaf_tournament_v92.py
          git diff --exit-code -- src/
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Fresh-PGO exact-replay tournament arm
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/toolchain-arena
          git -C /tmp/toolchain-arena checkout -q 91f376e4baacf2df0c478e7173bccb2a6adac5c5
          test "$(git -C /tmp/toolchain-arena rev-parse HEAD)" = 91f376e4baacf2df0c478e7173bccb2a6adac5c5
          cd /tmp/toolchain-arena
          nix develop -c python3 -B "$GITHUB_WORKSPACE/experiments/eval_leaf_tournament_v92.py" "${{ matrix.variant }}" |& tee "$V92_ROOT/ci.log"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-leaf-tournament-v92-${{ matrix.variant }}
          path: /tmp/v92-${{ matrix.variant }}/out/
          if-no-files-found: warn
