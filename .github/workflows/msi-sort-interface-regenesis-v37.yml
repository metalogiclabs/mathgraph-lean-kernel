name: MSI Sort interface regenesis v37

on:
  push:
    branches: [msi-semantic-rediscovery-frontier-v36]

jobs:
  regenesis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build corpora and three checker arms
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 1000000 _build/tests/std.ndjson >/tmp/std-1m.ndjson
          head -n 1000000 _build/tests/cedar.ndjson >/tmp/cedar-1m.ndjson
          cd ..
          for mode in local shared ablate; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/v37-$mode
            cp experiments/apply_msi_sort_interface_regenesis_v37.py /tmp/v37-$mode/patch.py
            (cd /tmp/v37-$mode && python3 patch.py $mode)
          done
          cd arena
          for mode in local shared ablate; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/v37-$mode-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/v37-$mode/Cargo.toml --release --locked"
          done
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Correctness and deterministic comparison
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          for corpus in std cedar; do
            for mode in local shared ablate; do
              /tmp/v37-$mode-target/release/sokonanoda /tmp/checker.json </tmp/$corpus-1m.ndjson >/tmp/$corpus-$mode.out
            done
            cmp /tmp/$corpus-local.out /tmp/$corpus-shared.out
            cmp /tmp/$corpus-local.out /tmp/$corpus-ablate.out
            echo "${corpus^^}_OUTPUT_EQ=PASS" | tee -a /tmp/result.txt
            for mode in local shared ablate; do
              nix develop -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$corpus-$mode /tmp/v37-$mode-target/release/sokonanoda /tmp/checker.json </tmp/$corpus-1m.ndjson >/tmp/$corpus-$mode-cg.out 2>/tmp/$corpus-$mode-cg.err
              cmp /tmp/$corpus-local.out /tmp/$corpus-$mode-cg.out
            done
            python3 - "$corpus" <<'PY' | tee -a /tmp/result.txt
          import re,sys
          corpus=sys.argv[1]
          vals={}
          for mode in ('local','shared','ablate'):
              s=open(f'/tmp/cg-{corpus}-{mode}').read()
              m=re.search(r'^summary:\s+(\d+)',s,re.M)
              if not m: raise SystemExit(f'no callgrind summary {corpus} {mode}')
              vals[mode]=int(m.group(1))
          u=corpus.upper()
          for k,v in vals.items(): print(f'{u}_{k.upper()}_INSTR={v}')
          print(f'{u}_SHARED_VS_LOCAL_PCT={100*(vals["shared"]-vals["local"])/vals["local"]:.6f}')
          print(f'{u}_SHARED_VS_ABLATE_PCT={100*(vals["shared"]-vals["ablate"])/vals["ablate"]:.6f}')
          print(f'{u}_DECISION=' + ('SHARED_INTERFACE_ECONOMIC' if vals['shared'] < vals['local'] and vals['shared'] < vals['ablate'] else 'SHARED_INTERFACE_NOT_ECONOMIC'))
          PY
          done
          cat /tmp/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msi-sort-interface-regenesis-v37
          path: /tmp/result.txt
