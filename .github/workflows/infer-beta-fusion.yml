name: Infer beta fusion phase change

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/apply_infer_beta_fusion.py'
      - 'scripts/apply_force_pi_fastpath.py'
      - 'experiments/infer-beta-fusion.precommit.md'
      - '.github/workflows/infer-beta-fusion.yml'
      - 'experiments/infer-beta-fusion.trigger'

jobs:
  fast-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Build baseline and intervention arms
        run: |
          set -euxo pipefail
          V1=1e209dad266d59b4d43cdea189876bc6ea551339
          git worktree add /tmp/base "$V1"
          cp -a /tmp/base /tmp/fusion
          cp -a /tmp/base /tmp/combo
          python3 scripts/apply_infer_beta_fusion.py /tmp/fusion
          python3 scripts/apply_infer_beta_fusion.py /tmp/combo
          python3 scripts/apply_force_pi_fastpath.py /tmp/combo
          for arm in base fusion combo; do
            (cd /tmp/$arm && cargo test --release --locked)
            (cd /tmp/$arm && RUSTFLAGS='-C target-cpu=x86-64-v3' cargo build --release --locked)
            cp /tmp/$arm/target/release/sokonanoda /tmp/$arm-bin
          done
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Build deciding Arena exports
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena
          cd /tmp/arena
          for n in 4000 8000; do
            cp tests/perf/beta-ladder.lean tests/perf/beta-ladder-$n.lean
            sed -i "s/let n := 2000/let n := $n/" tests/perf/beta-ladder-$n.lean
            printf "description: beta ladder N=$n\nleanfile: tests/perf/beta-ladder-$n.lean\nexport-decls: [\"beta_ladder\"]\noutcome: accept\ncompare-perf: true\n" > tests/perf/beta-ladder-$n.yaml
          done
          nix develop -c ./lka.py build-test perf/beta-ladder
          nix develop -c ./lka.py build-test perf/beta-ladder-4000
          nix develop -c ./lka.py build-test perf/beta-ladder-8000
          for t in app-lam let-ladder grind-ring-5; do
            nix develop -c ./lka.py build-test perf/$t
          done
      - name: Semantic equality gate
        run: |
          set -euxo pipefail
          cd /tmp/arena
          for f in \
            _build/tests/perf/beta-ladder.ndjson \
            _build/tests/perf/beta-ladder-4000.ndjson \
            _build/tests/perf/beta-ladder-8000.ndjson \
            _build/tests/perf/app-lam.ndjson \
            _build/tests/perf/let-ladder.ndjson \
            _build/tests/perf/grind-ring-5.ndjson; do
            /tmp/base-bin /tmp/checker.json < "$f" >/tmp/base.out 2>/tmp/base.err
            for arm in fusion combo; do
              /tmp/$arm-bin /tmp/checker.json < "$f" >/tmp/$arm.out 2>/tmp/$arm.err
              cmp /tmp/base.out /tmp/$arm.out
            done
          done
      - name: Five-run wall scaling separator
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/wall.txt
          for spec in \
            'beta2000 _build/tests/perf/beta-ladder.ndjson' \
            'beta4000 _build/tests/perf/beta-ladder-4000.ndjson' \
            'beta8000 _build/tests/perf/beta-ladder-8000.ndjson' \
            'app-lam _build/tests/perf/app-lam.ndjson' \
            'let-ladder _build/tests/perf/let-ladder.ndjson' \
            'grind _build/tests/perf/grind-ring-5.ndjson'; do
            set -- $spec; label=$1; f=$2
            for arm in base fusion combo; do
              for r in 1 2 3 4 5; do
                /usr/bin/time -f '%e' -o /tmp/t /tmp/$arm-bin /tmp/checker.json < "$f" >/dev/null 2>/dev/null
                echo "$label $arm $(cat /tmp/t)" | tee -a /tmp/wall.txt
              done
            done
          done
      - name: Decision summary
        run: |
          python3 - <<'PY' | tee /tmp/decision.txt
          from pathlib import Path
          from statistics import median
          rows={}
          for line in Path('/tmp/wall.txt').read_text().splitlines():
              t,a,x=line.split(); rows.setdefault((t,a),[]).append(float(x))
          for t in ('beta2000','beta4000','beta8000','app-lam','let-ladder','grind'):
              b=median(rows[(t,'base')])
              print(t,'base',b)
              for a in ('fusion','combo'):
                  x=median(rows[(t,a)])
                  print(t,a,x,'delta_pct',round((x/b-1)*100,2),'speedup_x',round(b/x,4))
          b2=median(rows[('beta2000','base')]); b8=median(rows[('beta8000','base')])
          for a in ('fusion','combo'):
              a2=median(rows[('beta2000',a)]); a8=median(rows[('beta8000',a)])
              print('SCALING',a,'base_8k_over_2k',round(b8/b2,3),'arm_8k_over_2k',round(a8/a2,3),'beta8000_speedup',round(b8/a8,3))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: infer-beta-fusion-fast-gate
          path: |
            /tmp/wall.txt
            /tmp/decision.txt
