name: Flash frozen batch512 final correctness case
on:
  push:
    branches: [research/flash-upstream-reconciliation-20261126]
    paths: ['.github/workflows/flash-chunk512-finalize.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mathlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reconciled-input/mathlib.ndjson
          key: flash-upstream-exact-mathlib-f749dfd084fc0727d107c7aaded7d492cebfc0b517cfaa7337d8a7578a6c0dec
          fail-on-cache-miss: true
      - name: Replay complete Mathlib on the unchanged frozen candidate
        run: |
          set -euo pipefail
          gh api repos/metalogiclabs/mathgraph-lean-kernel/actions/artifacts/15079511997/zip > "$RUNNER_TEMP/chunk512-frozen.zip"
          python3 experiments/flash-chunk512-20261126/qualify_frozen_whole.py --archive "$RUNNER_TEMP/chunk512-frozen.zip" --fixture "$RUNNER_TEMP/reconciled-input/mathlib.ndjson" --out "$RUNNER_TEMP/chunk512-final"
          git rev-parse HEAD > "$RUNNER_TEMP/chunk512-final/harness-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-chunk512-frozen-final-case
          path: ${{ runner.temp }}/chunk512-final/
          retention-days: 90
