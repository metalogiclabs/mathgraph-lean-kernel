name: V4 Retained10 Final Qualification

on:
  workflow_dispatch:
  push:
    branches: [mathgraph-v4-bvdecide-residual]
    paths:
      - '.github/workflows/v4-retained10-final-qualification.yml'

permissions:
  contents: read

jobs:
  semantic:
    name: full-current-arena-semantic-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Clone current Arena and build current CI corpus
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          git rev-parse HEAD | tee /tmp/arena-rev.txt
          nix develop -c ./lka.py build-test --skip-ci
      - name: Materialize exact retained10 candidate
        run: |
          set -euxo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/cand
          git -C /tmp/cand checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          python3 experiments/apply_v4_retained10.py /tmp/cand
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}' > /tmp/cand/config.json
          git -C /tmp/cand diff -- src > /tmp/retained10.diff
      - name: Build retained10
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/arena"
          cd /tmp/cand
          RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-generate=$PWD/pgo" cargo build --release --locked
          target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
          nix shell nixpkgs#llvm -c llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
          rm -rf target
          RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
      - name: Check every current non-skip Arena verdict
        run: |
          set -euxo pipefail
          cd arena
          nix develop -c python3 - <<'PY' | tee /tmp/semantic-summary.txt
          import pathlib, subprocess, sys, yaml
          root = pathlib.Path('.')
          built = root / '_build/tests'
          checked = correct = either = failures = 0
          bad = []
          for nd in sorted(built.rglob('*.ndjson')):
              name = str(nd.relative_to(built).with_suffix(''))
              ypath = root / 'tests' / (name + '.yaml')
              if not ypath.exists():
                  continue
              data = yaml.safe_load(ypath.read_text()) or {}
              if data.get('skip-on-ci', False):
                  continue
              expected = data.get('outcome')
              if expected not in {'accept','reject','either'}:
                  continue
              checked += 1
              with nd.open('rb') as inp:
                  try:
                      p = subprocess.run(
                          ['/tmp/cand/target/release/sokonanoda','/tmp/cand/config.json'],
                          stdin=inp, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                          timeout=900)
                      rc = p.returncode
                  except subprocess.TimeoutExpired:
                      rc = 124
              observed = 'accept' if rc == 0 else 'reject'
              ok = expected == 'either' or observed == expected
              if expected == 'either':
                  either += 1
              if ok:
                  correct += 1
              else:
                  failures += 1
                  bad.append((name, expected, observed, rc))
                  print(f'BAD\t{name}\texpected={expected}\tobserved={observed}\trc={rc}')
          print(f'ARENA_SEMANTIC_CHECKED={checked}')
          print(f'ARENA_SEMANTIC_CORRECT_OR_EITHER={correct}')
          print(f'ARENA_SEMANTIC_EITHER={either}')
          print(f'ARENA_SEMANTIC_FAILURES={failures}')
          print('V4_FULL_SEMANTIC_GATE=' + ('PASS' if failures == 0 else 'FAIL'))
          if failures:
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-retained10-semantic
          path: |
            /tmp/semantic-summary.txt
            /tmp/arena-rev.txt
            /tmp/retained10.diff

  perf:
    name: perf-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        suite: [init-prelude, init, std, cedar, cslib, mathlib]
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build exact current Arena workload
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          git rev-parse HEAD | tee /tmp/arena-rev.txt
          nix develop -c ./lka.py build-test init-prelude
          if [ "$SUITE" != init-prelude ]; then
            nix develop -c ./lka.py build-test "$SUITE"
          fi
      - name: Materialize untouched live base and retained10
        run: |
          set -euxo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          git -C /tmp/base checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          cp -a /tmp/base /tmp/cand
          python3 experiments/apply_v4_retained10.py /tmp/cand
          for k in base cand; do
            printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' > /tmp/$k/config.json
          done
          git -C /tmp/cand diff -- src > /tmp/retained10.diff
      - name: Build both with identical PGO
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/arena"
          for k in base cand; do
            cd /tmp/$k
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-generate=$PWD/pgo" cargo build --release --locked
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            nix shell nixpkgs#llvm -c llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            rm -rf target
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
          done
      - name: Semantic acceptance smoke
        run: |
          set -euxo pipefail
          IN="$GITHUB_WORKSPACE/arena/_build/tests/$SUITE.ndjson"
          /tmp/base/target/release/sokonanoda /tmp/base/config.json < "$IN" >/dev/null
          /tmp/cand/target/release/sokonanoda /tmp/cand/config.json < "$IN" >/dev/null
      - name: Deterministic Callgrind instruction comparison
        run: |
          set -euxo pipefail
          IN="$GITHUB_WORKSPACE/arena/_build/tests/$SUITE.ndjson"
          for k in base cand; do
            timeout 15000 nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/${k}.callgrind /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < "$IN" >/dev/null
            grep '^summary:' /tmp/${k}.callgrind | awk '{print $2}' > /tmp/${k}.ir
          done
          b=$(cat /tmp/base.ir); c=$(cat /tmp/cand.ir)
          python3 - <<PY | tee /tmp/result.txt
          b=$b
          c=$c
          print('SUITE=$SUITE')
          print(f'BASE_IR={b}')
          print(f'V4_IR={c}')
          print(f'DELTA={c-b}')
          print(f'DELTA_PCT={(c/b-1)*100:.6f}')
          print('INSTRUCTION_GATE=' + ('PASS' if c < b else 'FAIL'))
          PY
      - name: Alternating wall comparison
        run: |
          set -euxo pipefail
          IN="$GITHUB_WORKSPACE/arena/_build/tests/$SUITE.ndjson"
          : > /tmp/wall.tsv
          for i in 1 2 3; do
            for k in base cand; do
              /usr/bin/time -f "$k\t%e" -o /tmp/one.time /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < "$IN" >/dev/null
              cat /tmp/one.time >> /tmp/wall.tsv
            done
          done
          cat /tmp/wall.tsv | tee -a /tmp/result.txt
          python3 - <<'PY' | tee -a /tmp/result.txt
          import statistics
          d={'base':[],'cand':[]}
          for line in open('/tmp/wall.tsv'):
              k,v=line.split(); d[k].append(float(v))
          b=statistics.median(d['base']); c=statistics.median(d['cand'])
          print(f'BASE_WALL_MEDIAN={b}')
          print(f'V4_WALL_MEDIAN={c}')
          print(f'WALL_DELTA_PCT={(c/b-1)*100:.6f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-retained10-${{ matrix.suite }}
          path: |
            /tmp/result.txt
            /tmp/arena-rev.txt
            /tmp/retained10.diff
            /tmp/*.ir
