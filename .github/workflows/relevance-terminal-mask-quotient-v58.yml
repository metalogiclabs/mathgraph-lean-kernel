name: Relevance terminal mask quotient v58

on:
  pull_request:
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Put llvm-profdata on PATH
        run: |
          LLVM_OUT=$(nix build 'github:NixOS/nixpkgs/nixos-26.05#llvmPackages_21.llvm' --no-link --print-out-paths)
          echo "$LLVM_OUT/bin" >> "$GITHUB_PATH"
      - name: Run v58 relevance terminal mask quotient
        run: bash experiments/run_relevance_terminal_mask_quotient_v58.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relevance-terminal-mask-quotient-v58
          path: |
            /tmp/v58-decision.txt
            /tmp/v58-*.time
            /tmp/v58-*.err
