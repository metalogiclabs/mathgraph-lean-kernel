name: Nucleus Arena Fast Screen V1

on:
  workflow_dispatch:
  push:
    branches: [nucleus-final-architecture-tournament-v1]
    paths: [.github/workflows/nucleus-arena-fast-screen-v1.yml]

concurrency:
  group: nucleus-arena-fast-screen-v1
  cancel-in-progress: true

env:
  ARENA_SHA: 95496f5376b089dfd5889d88c73e390a9d98653d

jobs:
  corpus:
    name: Build Mathlib once
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Build exact Arena Mathlib export
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$ARENA_SHA"
          cd /tmp/arena
          nix develop -c ./lka.py build-test mathlib
          cp _build/tests/mathlib.ndjson /tmp/mathlib.ndjson
          sha256sum /tmp/mathlib.ndjson >/tmp/mathlib.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: arena-mathlib
          path: |
            /tmp/mathlib.ndjson
            /tmp/mathlib.sha256

  build:
    name: Build ${{ matrix.arm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arm: base, sha: 78c7502bac8a5ba000057b3f083bc0595ac65750}
          - {arm: v3, sha: 399b62b4a452f53a4ee5b0e51efde079ff2fdccc}
          - {arm: v4, sha: 366b6d1378a591493190ed7bd90c3cb905d94694}
          - {arm: v5, sha: c7477f622f41f34d2735a53dde284d20c0377849}
          - {arm: v6, sha: cdcbec3f08f5964e2e1962769363d42dd53d26bf}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/src "${{ matrix.sha }}"
          cd /tmp/src
          RUSTFLAGS='-C target-cpu=native' cargo build --release --locked
          cp target/release/sokonanoda "/tmp/${{ matrix.arm }}.bin"
          stat -c '%s' "/tmp/${{ matrix.arm }}.bin" >"/tmp/${{ matrix.arm }}.bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-bin-${{ matrix.arm }}
          path: |
            /tmp/${{ matrix.arm }}.bin
            /tmp/${{ matrix.arm }}.bytes

  measure:
    name: Arena metric ${{ matrix.arm }}
    needs: [corpus, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arm: [base, v3, v4, v5, v6]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arena-mathlib
          path: /tmp/corpus
      - uses: actions/download-artifact@v4
        with:
          name: nucleus-bin-${{ matrix.arm }}
          path: /tmp/bin
      - name: Measure Mathlib
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "/tmp/bin/${{ matrix.arm }}.bin"
          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":2,"print_success_message":false}
          EOF
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/tmp/perf-sysctl.txt 2>&1 || true

          run_one () {
            rep=$1
            set +e
            perf stat -j -o "/tmp/rep${rep}.perf" -e instructions:u -e task-clock --               /usr/bin/time -f 'real_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M'               -o "/tmp/rep${rep}.time"               "/tmp/bin/${{ matrix.arm }}.bin" /tmp/config.json               </tmp/corpus/mathlib.ndjson >/tmp/rep${rep}.out 2>/tmp/rep${rep}.err
            rc=$?
            set -e
            echo "$rc" >"/tmp/rep${rep}.rc"
            test "$rc" -eq 0
          }
          run_one 1
          run_one 2

          python3 - <<'PY' | tee /tmp/result.json
          import json, statistics
          from pathlib import Path
          arm = "${{ matrix.arm }}"
          shas = {
            "base":"78c7502bac8a5ba000057b3f083bc0595ac65750",
            "v3":"399b62b4a452f53a4ee5b0e51efde079ff2fdccc",
            "v4":"366b6d1378a591493190ed7bd90c3cb905d94694",
            "v5":"c7477f622f41f34d2735a53dde284d20c0377849",
            "v6":"cdcbec3f08f5964e2e1962769363d42dd53d26bf",
          }
          def read(rep):
              ins=0; task_ms=0.0; t={}
              for line in Path(f"/tmp/rep{rep}.perf").read_text(errors="replace").splitlines():
                  try: d=json.loads(line)
                  except Exception: continue
                  ev=str(d.get("event","")).split(":")[0]
                  try: val=float(str(d.get("counter-value","0")).replace(",",""))
                  except Exception: val=0.0
                  if ev=="instructions": ins=int(val)
                  elif ev=="task-clock": task_ms=val
              for line in Path(f"/tmp/rep{rep}.time").read_text().splitlines():
                  if "=" in line:
                      k,v=line.split("=",1); t[k]=float(v)
              return {"instructions":ins,"task_clock_ms":task_ms,**t}
          runs=[read(1),read(2)]
          def med(k):
              xs=[r.get(k,0) for r in runs if r.get(k,0)>0]
              return statistics.median(xs) if xs else 0
          instructions=med("instructions")
          cpu=(med("task_clock_ms")/1000.0) if med("task_clock_ms") else med("user_seconds")+med("sys_seconds")
          out={
            "arm":arm,
            "sha":shas[arm],
            "mathlib_instructions":int(instructions),
            "arena_virtual_cpu_seconds":(instructions/6_000_000_000) if instructions else cpu,
            "wall_seconds":med("real_seconds"),
            "cpu_seconds":cpu,
            "max_rss_kb":med("max_rss_kb"),
            "binary_bytes":int(Path(f"/tmp/bin/{arm}.bytes").read_text().strip()),
            "pmu_available":bool(instructions),
            "runs":runs,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arena-fast-result-${{ matrix.arm }}
          path: /tmp/result.json

  rank:
    name: Rank Arena fast screen
    needs: [measure]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arena-fast-result-*
          path: /tmp/results
      - name: Rank
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/summary.txt
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("/tmp/results").rglob("result.json"))]
          exact=bool(rows) and all(r["pmu_available"] for r in rows)
          if exact:
              rows.sort(key=lambda r:(r["mathlib_instructions"],r["wall_seconds"],r["max_rss_kb"],r["binary_bytes"]))
              mode="ARENA_INSTRUCTION_EXACT_SCREEN"
          else:
              rows.sort(key=lambda r:(r["arena_virtual_cpu_seconds"],r["wall_seconds"],r["max_rss_kb"],r["binary_bytes"]))
              mode="CPU_FALLBACK_SCREEN_NOT_OFFICIAL_RANK_METRIC"
          print("NUCLEUS_ARENA_FAST_SCREEN_V1="+mode)
          for i,r in enumerate(rows,1):
              print(f'{i}. {r["arm"]} instructions={r["mathlib_instructions"]} virtual_cpu={r["arena_virtual_cpu_seconds"]:.6f}s wall={r["wall_seconds"]:.3f}s rss_kb={r["max_rss_kb"]:.0f} bytes={r["binary_bytes"]}')
          Path("/tmp/ranking.json").write_text(json.dumps({"mode":mode,"ranking":rows},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-arena-fast-screen-v1
          path: |
            /tmp/summary.txt
            /tmp/ranking.json
