name: Wide read-set qualification v100
on:
  push:
    paths:
      - 'src/eval.rs'
      - 'src/value.rs'
      - 'src/util.rs'
      - 'experiments/run_wide_readset_v100.sh'
      - '.github/workflows/wide-readset-v100.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build, test, and probe wide read-set candidate
        run: bash experiments/run_wide_readset_v100.sh
      - name: Preserve v100 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wide-readset-v100
          path: /tmp/v100-wide/out/
          if-no-files-found: warn
