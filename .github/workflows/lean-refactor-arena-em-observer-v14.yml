name: Lean Refactor Arena EM V14 minimally typed observed-divergence codomain
on:
  workflow_dispatch:
  push:
    branches: ['competition/lra-em-observer-codomain-v14']
    paths:
      - 'competitions/lean_refactor_arena/experiments/em_observer_codomain_v14.jsonl'
      - '.github/workflows/lean-refactor-arena-em-observer-v14.yml'

concurrency:
  group: lra-em-observer-v14-primary
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PUBLIC_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      TARGET: Electromagnetism.ElectromagneticPotential.time_deriv_time_deriv_electricField_of_isExtrema
      BANK: competitions/lean_refactor_arena/experiments/em_observer_codomain_v14.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Bind ten unique representations to exact V12 incumbent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lra-em-v14
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          read=lambda p:[json.loads(x) for x in pathlib.Path(p).read_text().splitlines() if x.strip()]
          root=pathlib.Path('competitions/lean_refactor_arena')
          bank=read(os.environ['BANK'])
          active=read(root/'portfolio/warmup_portfolio_v1.jsonl')
          name=os.environ['TARGET']
          assert len(active)==15 and len({x['name'] for x in active})==15
          assert len(bank)==len({x['label'] for x in bank})==len({x['proof'] for x in bank})==7
          old=next(x for x in active if x['name']==name)
          assert old['label']=='warranted_em_congrarg_inferred_551'
          assert bank[0]['label']=='em_v14_551_control' and bank[0]['proof']==old['proof']
          header=old['proof'].split(' := by\n',1)[0]+' := by\n'
          forbidden=('sorry','sorryAx','admit','native_decide','run_elab','run_cmd','axiom ','unsafe')
          assert all(x['name']==name and x['proof'].startswith(header) for x in bank)
          assert all(not any(w in x['proof'] for w in forbidden) for x in bank)
          summary={'schema':'mathgraph.lra.em.observer-v14.frozen-bank',
            'state':'UNVERIFIED_PROPOSALS','source':'V12_exact_551_token_proof',
            'source_pin':os.environ['PUBLIC_SHA'],
            'proposals':len(bank)-1,'protected_versions':['v4.32.0'],
            'proof_fingerprints':{x['label']:hashlib.sha256(x['proof'].encode()).hexdigest() for x in bank},
            'portfolio_mutated':False,'external_submission':False}
          pathlib.Path('/tmp/lra-em-v14/frozen.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('VERIFIED_FROZEN_OBSERVER_SOURCE_AND_THEOREM_BOUNDARY')
          PY
      - name: Materialize pinned Physlib v4.32 target
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_SHA"
          cd /tmp/lean-refactor/competition/projects/v4.32
          lake update > /tmp/lra-em-v14/update.log 2>&1 || { tail -n 120 /tmp/lra-em-v14/update.log; exit 1; }
          lake exe cache get > /tmp/lra-em-v14/cache.log 2>&1 || echo 'CACHE_MISS_FALLBACK'
          lake build Physlib.Electromagnetism.Dynamics.IsExtrema > /tmp/lra-em-v14/build.log 2>&1 || {
            tail -n 150 /tmp/lra-em-v14/build.log; exit 1;
          }
          echo VERIFIED_PINNED_PHYSLIB_EM_TARGET
      - name: Compare all observer quotient variants against pinned public score
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/lra-em-v14/labels
          import json,os
          rows=[json.loads(s) for s in open(os.environ['BANK']) if s.strip()]
          assert len(rows)==7
          for x in rows: print(x['label'])
          PY
          : > /tmp/lra-em-v14/scores.jsonl
          while IFS= read -r label; do
            echo "EM_OBSERVER=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.32 \
              --name "$TARGET" --candidate "$BANK" --label "$label"
            (cd /tmp/lean-refactor/competition && python3 arena.py check --name "$TARGET" --timeout 1200) \
              > /tmp/lra-em-v14/one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' \
              /tmp/lra-em-v14/one.json >> /tmp/lra-em-v14/scores.jsonl
          done < /tmp/lra-em-v14/labels
      - name: Classify bounded gains, failures, and preserve active V12 portfolio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,hashlib,os
          root=pathlib.Path('/tmp/lra-em-v14')
          rows=[json.loads(x) for x in (root/'scores.jsonl').read_text().splitlines() if x.strip()]
          bank=[json.loads(x) for x in pathlib.Path(os.environ['BANK']).read_text().splitlines() if x.strip()]
          assert len(rows)==len(bank)==7 and {r['candidate_label'] for r in rows}=={x['label'] for x in bank}
          def good(r):
            p=r.get('per_version') or []
            return (r.get('compiled') is True and r.get('statement_ok') is True and
              r.get('eligible') is True and not r.get('forbidden') and
              not r.get('extra_toplevel_decls') and not r.get('untested') and
              r.get('compat')=={'v4.32.0':True} and len(p)==1 and
              p[0].get('version')=='v4.32.0' and p[0].get('ok') is True and p[0].get('tested') is True)
          control=next(x for x in rows if x['candidate_label']=='em_v14_551_control')
          assert good(control),'ACTIVE_CONTROL_LOST_VALIDATION'
          assert (control['length'],control['heartbeats'])==(551,10403),'CONTROL_COST_REGRESSED'
          assert round(float(control['objective_sum_pct']),2)==122.47
          positives=[x for x in rows if x is not control and good(x) and float(x['objective_sum_pct'])>float(control['objective_sum_pct'])]
          positives.sort(key=lambda x:(-float(x['objective_sum_pct']),int(x['length']),int(x['heartbeats'])))
          best=positives[0] if positives else None
          out={'schema':'mathgraph.lra.em.observed-divergence.v14',
            'state':'WARRANTED_REQUIRED_VERSION_CANDIDATE_PENDING_PACKET' if best else 'REJECTED_BOUNDED_NO_GAIN',
            'pinned_source':os.environ['PUBLIC_SHA'],
            'control':{'tokens':control['length'],'heartbeats':control['heartbeats'],'objective':control['objective_sum_pct']},
            'tested':len(rows),'compiled':sum(good(r) for r in rows),
            'qualified':[{'label':r['candidate_label'],'tokens':r['length'],'heartbeats':r['heartbeats'],
              'objective':r['objective_sum_pct']} for r in rows if good(r)],
            'failures':[{'label':r['candidate_label'],
              'errors':(r.get('per_version') or [{}])[0].get('errors',[])} for r in rows if not good(r)],
            'best':None if best is None else
              {'label':best['candidate_label'],'tokens':best['length'],'heartbeats':best['heartbeats'],
              'objective':best['objective_sum_pct'],
              'sha256':hashlib.sha256(next(x['proof'] for x in bank if x['label']==best['candidate_label']).encode()).hexdigest()},
            'protected_unchanged':True,'official_submission':False,
            'promotion_rule':'Exact required Lean v4.32 proof source + 15-row packet reclosure before merge'}
          (root/'result.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='failures'},indent=2,ensure_ascii=False))
          if best:
            winner=next(x for x in bank if x['label']==best['candidate_label'])
            (root/'candidate.jsonl').write_text(json.dumps(winner,ensure_ascii=False)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-em-observer-v14
          path: /tmp/lra-em-v14
