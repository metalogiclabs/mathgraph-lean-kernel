name: Lean Refactor Arena Typing compact probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lean-refactor-arena-track1'
    paths:
      - 'competitions/lean_refactor_arena/probes/cslib_typing_progress_v1.jsonl'
      - 'competitions/lean_refactor_arena/public_harness_bridge.py'
      - '.github/workflows/lean-refactor-arena-typing-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and public harness
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          rm -rf /tmp/lean-refactor
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor sparse-checkout set competition
          cd /tmp/lean-refactor/competition
          ./build-all.sh v4.33
      - name: Score compact candidates
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/typing-scores.jsonl
          for label in grind_derivation_v1 grind_derivation_v2 public_informed_derivation_339; do
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition \
              --project v4.33 \
              --name "Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress" \
              --candidate competitions/lean_refactor_arena/probes/cslib_typing_progress_v1.jsonl \
              --label "$label"
            cd /tmp/lean-refactor/competition
            python3 arena.py check --name "Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress" \
              > "/tmp/$label.json"
            cd "$GITHUB_WORKSPACE"
            jq -c --arg label "$label" '. + {candidate_label:$label}' "/tmp/$label.json" \
              >> /tmp/typing-scores.jsonl
          done
          cat /tmp/typing-scores.jsonl
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open('/tmp/typing-scores.jsonl') if x.strip()]
          good=[r for r in rows if r.get('compiled') and r.get('statement_ok')]
          if not good: raise SystemExit('NO_COMPILED_TYPING_CANDIDATE')
          best=max(good,key=lambda r:r.get('objective_sum_pct') or -1e9)
          print('BEST_TYPING=',json.dumps({k:best.get(k) for k in
            ('candidate_label','length','heartbeats','objective_sum_pct','combined_pct')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-typing-compact
          path: /tmp/typing-scores.jsonl
