name: MathGraph beta residual expedition

on:
  push:
    branches: [mathgraph-expedition-beta]
  workflow_dispatch:

jobs:
  representation-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph-expedition-beta

      - name: Toolchain
        run: |
          rustup show
          sudo apt-get update
          sudo apt-get install -y time

      - name: Build retained MathGraph
        run: |
          set -euxo pipefail
          cargo test --locked
          cargo build --release --locked
          cp target/release/sokonanoda /tmp/mathgraph

      - name: Build nanoclo reference
        run: |
          set -euxo pipefail
          git clone https://github.com/sgraf812/nanoclo /tmp/nanoclo
          cd /tmp/nanoclo
          git checkout b27e4c5f788717c884020f1dde4bb7193bca2276
          cargo build --release --locked || cargo build --release
          cp target/release/nanoclo /tmp/nanoclo-bin

      - name: Fetch frozen Arena tests
        run: |
          set -euxo pipefail
          mkdir -p /tmp/arena-tests
          curl -L --fail --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena-tests.tar.gz
          tar -xzf /tmp/arena-tests.tar.gz -C /tmp/arena-tests
          find /tmp/arena-tests/good/perf -type f -name '*.ndjson' | sort | tee /tmp/perf-files.txt
          test -s /tmp/perf-files.txt

      - name: Configure checkers
        run: |
          cat > /tmp/config.json <<'EOF'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          EOF

      - name: Paired perf representation map
        run: |
          set -euxo pipefail
          printf 'test,arm,rep,wall_s,maxrss_kb,exit\n' > /tmp/perf-map.csv
          while IFS= read -r f; do
            name=${f#/tmp/arena-tests/good/perf/}
            name=${name%.ndjson}
            for rep in 1 2 3; do
              if (( rep % 2 )); then ARMS='mathgraph nanoclo'; else ARMS='nanoclo mathgraph'; fi
              for arm in $ARMS; do
                if [ "$arm" = mathgraph ]; then BIN=/tmp/mathgraph; else BIN=/tmp/nanoclo-bin; fi
                set +e
                /usr/bin/time -f "$name,$arm,$rep,%e,%M,%x" -o /tmp/time.txt "$BIN" /tmp/config.json < "$f" >/dev/null 2>&1
                rc=$?
                set -e
                cat /tmp/time.txt >> /tmp/perf-map.csv
                if [ "$rc" -ne 0 ]; then echo "nonzero $name $arm rc=$rc"; fi
              done
            done
          done < /tmp/perf-files.txt
          python3 - <<'PY'
          import csv, statistics
          rows=list(csv.DictReader(open('/tmp/perf-map.csv')))
          tests=sorted(set(r['test'] for r in rows))
          print('REPRESENTATION MAP')
          print('test,mathgraph_med,nanoclo_med,mg_over_nc,winner')
          for t in tests:
              by={a:[float(r['wall_s']) for r in rows if r['test']==t and r['arm']==a and r['exit']=='0'] for a in ('mathgraph','nanoclo')}
              if not by['mathgraph'] or not by['nanoclo']:
                  print(t,'INCOMPLETE',by)
                  continue
              mg=statistics.median(by['mathgraph']); nc=statistics.median(by['nanoclo'])
              print(f'{t},{mg:.4f},{nc:.4f},{mg/nc:.3f},{"nanoclo" if nc<mg else "mathgraph"}')
          PY

      - name: Full small semantic corpus agreement
        run: |
          set -euxo pipefail
          find /tmp/arena-tests/good /tmp/arena-tests/bad -type f -name '*.ndjson' ! -path '*/perf/*' | sort > /tmp/semantic-files.txt
          printf 'file,mathgraph,nanoclo\n' > /tmp/semantic.csv
          count=0
          while IFS= read -r f; do
            set +e
            /tmp/mathgraph /tmp/config.json < "$f" >/dev/null 2>&1; a=$?
            /tmp/nanoclo-bin /tmp/config.json < "$f" >/dev/null 2>&1; b=$?
            set -e
            echo "$f,$a,$b" >> /tmp/semantic.csv
            count=$((count+1))
          done < /tmp/semantic-files.txt
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('/tmp/semantic.csv')))
          bad=[r for r in rows if r['mathgraph']!=r['nanoclo']]
          print('semantic_cases=',len(rows),'disagreements=',len(bad))
          for r in bad[:30]: print('DISAGREE',r)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-representation-map
          path: |
            /tmp/perf-map.csv
            /tmp/semantic.csv
            /tmp/perf-files.txt
