name: Lean Refactor Arena Wick repair probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lean-refactor-arena-track1'
    paths:
      - 'competitions/lean_refactor_arena/probes/physlib_wick_repair_v1.jsonl'
      - 'competitions/lean_refactor_arena/public_harness_bridge.py'
      - '.github/workflows/lean-refactor-arena-wick-repair.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Materialize public Arena v4.32
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -rf /tmp/lean-refactor
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor sparse-checkout set competition
          cd /tmp/lean-refactor/competition
          ./build-all.sh v4.32
      - name: Score repaired near-misses
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/wick-scores.jsonl
          for label in wick_module_residual_v1 wick_simp_only_comm_v1; do
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition \
              --project v4.32 \
              --name "FieldSpecification.WickAlgebra.ι_timeOrderF_superCommuteF_eq_time" \
              --candidate competitions/lean_refactor_arena/probes/physlib_wick_repair_v1.jsonl \
              --label "$label"
            cd /tmp/lean-refactor/competition
            python3 arena.py check --name "FieldSpecification.WickAlgebra.ι_timeOrderF_superCommuteF_eq_time" > "/tmp/$label.json"
            cd "$GITHUB_WORKSPACE"
            jq -c --arg label "$label" '. + {candidate_label:$label}' "/tmp/$label.json" >> /tmp/wick-scores.jsonl
          done
          cat /tmp/wick-scores.jsonl
          python3 - <<'PY'
          import json
          for line in open('/tmp/wick-scores.jsonl'):
              r=json.loads(line)
              print('WICK_EXACT_FAILURE',r.get('candidate_label'),json.dumps(r.get('per_version'),ensure_ascii=False))
          PY
          python3 - <<'PY'
          import json
          for line in open('/tmp/wick-scores.jsonl'):
              r=json.loads(line)
              print('RESIDUAL',r.get('candidate_label'),json.dumps(r.get('per_version'),ensure_ascii=False))
          PY
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open('/tmp/wick-scores.jsonl') if x.strip()]
          good=[r for r in rows if r.get('compiled') and r.get('statement_ok') and float(r.get('survival_pct') or 0)==100]
          if not good:
              print('WICK_RESIDUAL_UNRESOLVED: preserve failed candidates for diagnosis')
              raise SystemExit(0)
          best=max(good,key=lambda r:r.get('objective_sum_pct') or -1e9)
          print('BEST_WICK_REPAIR=',json.dumps({k:best.get(k) for k in
            ('candidate_label','length','heartbeats','objective_sum_pct','combined_pct','survival_pct')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-wick-repair
          path: /tmp/wick-scores.jsonl
