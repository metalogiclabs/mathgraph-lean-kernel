name: Flash rigid V2 + app_hc Callgrind gate

on:
  workflow_dispatch:
  push:
    branches:
      - qckn-flash-rigid-v2-apphc-v1

concurrency:
  group: qckn-flash-rigid-v2-apphc-callgrind-v1
  cancel-in-progress: true

jobs:
  callgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build exact Arena exports
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 510fbfead6f02bed1a0179d01729a6ddf5bfd06d
          cd /tmp/arena
          nix develop -c ./lka.py build-test init-prelude >/dev/null
          nix develop -c ./lka.py build-test mathlib >/dev/null
          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF

      - name: Materialize three arms
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add /tmp/champion 28bc6a91d68ee547ee94fca395f58e8f100879ea
          git worktree add /tmp/source "$GITHUB_SHA"
          cp -a /tmp/source /tmp/rigid
          cp -a /tmp/source /tmp/combined
          python3 - <<'PY'
          from pathlib import Path
          for arm,prealloc in [('rigid',False),('combined',True)]:
              p=Path('/tmp')/arm/'src/flash.rs'
              s=p.read_text()
              s=s.replace('pub(crate) const RIGID_INDUCTIVE_NEUTRAL: bool = false;',
                          'pub(crate) const RIGID_INDUCTIVE_NEUTRAL: bool = true;')
              if prealloc:
                  s=s.replace('pub(crate) const APP_HC_PREALLOC: bool = false;',
                              'pub(crate) const APP_HC_PREALLOC: bool = true;')
              p.write_text(s)
          PY

      - name: Deterministic PGO build
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_PROFDATA=$(nix shell nixpkgs#llvmPackages_21.llvm -c sh -c 'command -v llvm-profdata')
          FLAGS='-C target-cpu=x86-64 -C target-feature=-avx,-avx2,-avx512f,-fma'
          for arm in champion rigid combined; do
            rm -rf /tmp/$arm/target /tmp/$arm/pgo
            mkdir -p /tmp/$arm/pgo
            (
              cd /tmp/$arm
              RUSTFLAGS="$FLAGS -Cprofile-generate=/tmp/$arm/pgo" cargo build --release --locked
              target/release/sokonanoda /tmp/config.json </tmp/arena/_build/tests/init-prelude.ndjson >/dev/null
              "$LLVM_PROFDATA" merge -o /tmp/$arm/pgo/merged.profdata /tmp/$arm/pgo
              rm -rf target
              RUSTFLAGS="$FLAGS -Cprofile-use=/tmp/$arm/pgo/merged.profdata" cargo build --release --locked
              cp target/release/sokonanoda /tmp/$arm.bin
            )
          done

      - name: Verify Mathlib parity
        shell: bash
        run: |
          set -euxo pipefail
          f=/tmp/arena/_build/tests/mathlib.ndjson
          for arm in champion rigid combined; do
            set +e
            /tmp/$arm.bin /tmp/config.json <"$f" >/tmp/$arm.out 2>/tmp/$arm.err
            rc=$?
            set -e
            printf '%s\t%s\n' "$arm" "$rc" >>/tmp/parity.tsv
          done
          test "$(cut -f2 /tmp/parity.tsv | sort -u | wc -l)" -eq 1
          cmp /tmp/champion.out /tmp/rigid.out
          cmp /tmp/champion.out /tmp/combined.out

      - name: Callgrind rank proxy
        shell: bash
        run: |
          set -euxo pipefail
          VALGRIND=$(nix shell nixpkgs#valgrind -c sh -c 'command -v valgrind')
          f=/tmp/arena/_build/tests/mathlib.ndjson
          : >/tmp/callgrind.tsv
          for arm in champion rigid combined; do
            out=/tmp/$arm.callgrind
            timeout 7200s "$VALGRIND" --tool=callgrind --quiet --collect-jumps=no \
              --callgrind-out-file="$out" /tmp/$arm.bin /tmp/config.json <"$f" >/dev/null 2>/dev/null
            ir=$(awk '/^summary:/ {print $2; exit}' "$out")
            test -n "$ir"
            printf '%s\t%s\n' "$arm" "$ir" | tee -a /tmp/callgrind.tsv
          done
          python3 - <<'PY' | tee /tmp/scorecard.txt
          vals={}
          for l in open('/tmp/callgrind.tsv'):
              a,n=l.rstrip().split('\t'); vals[a]=int(n)
          c,r,x=vals['champion'],vals['rigid'],vals['combined']
          print(f'CHAMPION_IR={c}')
          print(f'RIGID_V2_IR={r}')
          print(f'COMBINED_IR={x}')
          print(f'RIGID_V2_IR_SPEEDUP={c/r:.9f}')
          print(f'COMBINED_IR_SPEEDUP={c/x:.9f}')
          print(f'COMBINED_VS_RIGID_IR_SPEEDUP={r/x:.9f}')
          winner=min(vals,key=vals.get)
          print('CALLGRIND_WINNER='+winner)
          if winner=='combined':
              print('FLASH_RIGID_V2_APPHC_CALLGRIND_COMPOUNDING_PASS')
          elif winner=='rigid':
              print('FLASH_RIGID_V2_ONLY_CALLGRIND_WINNER')
          else:
              print('FLASH_CHAMPION_REMAINS_CALLGRIND_WINNER')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-flash-rigid-v2-apphc-callgrind-v1
          path: |
            /tmp/parity.tsv
            /tmp/callgrind.tsv
            /tmp/scorecard.txt
          if-no-files-found: warn
