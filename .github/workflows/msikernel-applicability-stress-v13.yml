name: msikernel applicability stress v13

on:
  push:
    branches: [msikernel-compiled-applicability-v13]
  workflow_dispatch:

jobs:
  applicability-stress-v13:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          set_as_trusted_user: true

      - name: Build complete Std and Cedar exports
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          wc -l _build/tests/std.ndjson _build/tests/cedar.ndjson | tee /tmp/corpus-lines.txt
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Instantiate frozen G3, V12 guard, and probe
        run: |
          set -euxo pipefail
          for mode in g3 guard probe; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$mode
          done
          python3 experiments/applicability_genesis_v12.py /tmp/g3 guard ''
          python3 experiments/applicability_genesis_v12.py /tmp/guard guard inductive
          python3 experiments/applicability_genesis_v12.py /tmp/probe probe
          cat APPLICABILITY_STRESS_TRANSFER_V13.md >/tmp/prereg.md
          echo V13_FROZEN_GAMMA=inductive >/tmp/result.txt

      - name: Build variants
        run: |
          set -euxo pipefail
          cd arena
          for mode in g3 guard probe; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-$mode RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$mode/Cargo.toml --release --locked"
          done

      - name: Full-corpus probe and frozen-rule semantic transfer
        run: |
          set -euxo pipefail
          for c in std cedar; do
            src="arena/_build/tests/$c.ndjson"
            /tmp/target-g3/release/sokonanoda /tmp/checker.json <"$src" >"/tmp/$c.g3.out"
            /tmp/target-guard/release/sokonanoda /tmp/checker.json <"$src" >"/tmp/$c.guard.out"
            cmp "/tmp/$c.g3.out" "/tmp/$c.guard.out"
            echo "${c^^}_V13_FULL_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
            /tmp/target-probe/release/sokonanoda /tmp/checker.json <"$src" >"/tmp/$c.probe.out" 2>"/tmp/$c.probe.log"
          done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          from collections import defaultdict
          counts=defaultdict(lambda:[0,0])
          for c in ('std','cedar'):
              for line in open(f'/tmp/{c}.probe.log', errors='replace'):
                  m=re.search(r'APPGEN_V12 pre=(\w+) unchanged=(\d)', line)
                  if not m: continue
                  t=m.group(1); u=int(m.group(2))
                  counts[t][0]+=1; counts[t][1]+=u
          for t in sorted(counts):
              n,u=counts[t]
              print(f'V13_TAG_{t.upper()} total={n} unchanged={u} changed={n-u}')
          assert counts['inductive'][0] > 0, 'no inductive events observed'
          assert counts['inductive'][0] == counts['inductive'][1], 'frozen inductive applicability rule falsified'
          new_tags=sorted(t for t in counts if t not in {'inductive','recursor'})
          print('V13_NEW_OBSERVED_TAGS=' + (','.join(new_tags) if new_tags else 'NONE'))
          print('V13_FROZEN_RULE_ALL_INDUCTIVE_UNCHANGED=PASS')
          print('APPLICABILITY_STRESS_TRANSFER_V13=BOUNDED_POSITIVE')
          PY
          cat /tmp/corpus-lines.txt | tee -a /tmp/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msikernel-applicability-stress-v13
          path: |
            /tmp/result.txt
            /tmp/prereg.md
            /tmp/corpus-lines.txt
