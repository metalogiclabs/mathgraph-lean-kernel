name: Arena build separator v96
on:
  push:
    branches:
      - experiment/arena-build-separator-v96
    paths:
      - 'experiments/arena_build_separator_v96.py'
      - '.github/workflows/arena-build-separator-v96.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-release-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check experiment syntax and source guards
        run: |
          python3 -m py_compile experiments/arena_build_separator_v96.py
          python3 - <<'PY'
          import ast, hashlib
          from pathlib import Path
          p = Path('experiments/run_direct_framed_retain_and_profile_v94.sh')
          b = p.read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          assert sha == 'b28fcc231d3dd2237de37a2ee824a6a41f5dd969'
          block = b.decode().split('python3 - "$ROOT/candidate" <<\'PY\'\n', 1)[1].split('\nPY\n', 1)[0]
          ast.parse(block)
          print('V96_PATCH_FIXTURE=PASS')
          PY
      - name: Run native and exact Arena PGO comparison
        run: python3 experiments/arena_build_separator_v96.py
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-build-separator-v96
          path: |
            /tmp/v96/results.json
            /tmp/v96/direct-framed.patch
            /tmp/v96/config.json
            /tmp/v96/arena-results/*.json
            /tmp/v96/arena/_build/tests/*.stats.json
