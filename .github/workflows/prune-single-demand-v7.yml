name: Prune single-demand v7

on:
  push:
    branches: [experiment/prune-single-demand-v7]
    paths:
      - '.github/workflows/prune-single-demand-v7.yml'
      - 'experiments/prune-single-demand-v7.trigger'

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build exact base and sparse-retention arm
        run: |
          set -euxo pipefail
          BASE=2de1895a52d21ad266b77002defe3e6bc69bbcfd
          git worktree add /tmp/prune-base "$BASE"
          cp -a /tmp/prune-base /tmp/prune-candidate
          cp experiments/apply_prune_single_demand_v7.py /tmp/prune-candidate/
          (cd /tmp/prune-candidate && python3 apply_prune_single_demand_v7.py)
          for arm in base candidate; do
            (cd /tmp/prune-$arm && cargo test --locked)
            (cd /tmp/prune-$arm && CARGO_TARGET_DIR=/tmp/prune-$arm-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked)
            cp /tmp/prune-$arm-target/release/sokonanoda /tmp/prune-$arm-bin
          done
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' >/tmp/checker.json
      - name: Build Arena semantic and performance workloads
        run: |
          set -euxo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena /tmp/prune-arena
          cd /tmp/prune-arena
          git checkout f0fe3b379dbce91537417b529140d0ca250f271c
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          for T in perf/app-lam perf/beta-ladder perf/let-ladder perf/grind-ring-5; do
            nix develop -c ./lka.py build-test "$T"
          done
      - name: Exact semantic equality gate
        run: |
          set -euxo pipefail
          cd /tmp/prune-arena
          for spec in \
            std:_build/tests/std.ndjson \
            cedar:_build/tests/cedar.ndjson \
            app-lam:_build/tests/perf/app-lam.ndjson \
            beta-ladder:_build/tests/perf/beta-ladder.ndjson \
            let-ladder:_build/tests/perf/let-ladder.ndjson \
            grind-ring-5:_build/tests/perf/grind-ring-5.ndjson; do
            T=${spec%%:*}; F=${spec#*:}
            /tmp/prune-base-bin /tmp/checker.json < "$F" > "/tmp/prune-base-$T.out" 2> "/tmp/prune-base-$T.err"
            /tmp/prune-candidate-bin /tmp/checker.json < "$F" > "/tmp/prune-candidate-$T.out" 2> "/tmp/prune-candidate-$T.err"
            cmp "/tmp/prune-base-$T.out" "/tmp/prune-candidate-$T.out"
          done
          echo SEMANTIC_GATE=PASS | tee /tmp/prune-semantic.txt
      - name: Deterministic Callgrind separator
        run: |
          set -euxo pipefail
          cd /tmp/prune-arena
          head -n 1000000 _build/tests/std.ndjson >/tmp/std-1m.ndjson
          printf 'test,arm,instructions\n' >/tmp/prune-callgrind.csv
          nix shell github:NixOS/nixpkgs/0ad6f47ea4fe188f4bc8f0380f93ae8523337c6c#valgrind -c bash -lc '
            set -euo pipefail
            for spec in std-1m:/tmp/std-1m.ndjson beta-ladder:_build/tests/perf/beta-ladder.ndjson grind-ring-5:_build/tests/perf/grind-ring-5.ndjson; do
              T=${spec%%:*}; F=${spec#*:}
              for arm in base candidate; do
                cf="/tmp/prune-$T-$arm.cg"
                valgrind --tool=callgrind --callgrind-out-file="$cf" "/tmp/prune-$arm-bin" /tmp/checker.json < "$F" >/dev/null 2>"/tmp/prune-$T-$arm.vg"
                ir=$(awk "/^summary:/ {print \$2; exit}" "$cf")
                test -n "$ir"
                printf "%s,%s,%s\n" "$T" "$arm" "$ir" >>/tmp/prune-callgrind.csv
              done
            done
          '
          python3 - <<'PY' | tee /tmp/prune-decision.txt
          import csv
          rows=list(csv.DictReader(open('/tmp/prune-callgrind.csv')))
          d={(r['test'],r['arm']):int(r['instructions']) for r in rows}
          deltas=[]
          for t in ('std-1m','beta-ladder','grind-ring-5'):
              b=d[(t,'base')]; c=d[(t,'candidate')]
              delta=(c/b-1)*100
              deltas.append(delta)
              print(f'{t} base={b} candidate={c} delta={delta:+.4f}%')
          best=min(deltas); worst=max(deltas)
          if best <= -2.0 and worst <= 0.2:
              print('DECISION=PROMOTE__SPARSE_RETENTION_MAJOR')
          elif best <= -0.25 and worst <= 0.2:
              print('DECISION=KEEP__EXTEND_TO_TWO_AND_FOUR_BINDINGS')
          elif all(x < 0 for x in deltas):
              print('DECISION=WEAK_POSITIVE__KEEP_LAW_MOVE_TO_CONSTRUCTION_COST')
          else:
              print('DECISION=KILL__TRAVERSAL_NOT_THE_RESIDUAL_TARGET_FRAME_INTERNING')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prune-single-demand-v7
          path: |
            /tmp/prune-callgrind.csv
            /tmp/prune-decision.txt
            /tmp/prune-semantic.txt
            /tmp/prune-*.err
