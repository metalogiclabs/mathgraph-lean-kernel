name: Lean Refactor Arena live leaderboard inspect

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lean-refactor-arena-track1'
    paths:
      - '.github/workflows/lean-refactor-arena-live-leaderboard.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect public Space API surface
        shell: bash
        run: |
          set -euo pipefail
          base="https://delta-lab-ai-lean-refactor-arena.hf.space"
          curl -fsSL --retry 3 "$base/config" -o /tmp/lra-space-config.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/lra-space-config.json'))
          deps=c.get('dependencies') or []
          rows=[]
          for d in deps:
              api=d.get('api_name')
              if api is False: continue
              rows.append({
                  'id':d.get('id'),
                  'api_name':api,
                  'inputs':d.get('inputs'),
                  'outputs':d.get('outputs'),
                  'trigger_mode':d.get('trigger_mode'),
                  'queue':d.get('queue'),
              })
          print(json.dumps(rows,indent=2))
          open('/tmp/lra-api-surface.json','w').write(json.dumps(rows,indent=2)+'\n')
          print('VERIFIED_PUBLIC_SPACE_API_SURFACE')
          PY

      - name: Probe only read-like leaderboard endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          c=json.load(open('/tmp/lra-space-config.json'))
          names=[]
          for d in c.get('dependencies') or []:
              api=d.get('api_name')
              if isinstance(api,str) and any(k in api.lower() for k in ('leader','refresh','status')):
                  names.append(api)
          print('READ_LIKE_APIS=',names)
          open('/tmp/lra-read-like-apis.json','w').write(json.dumps(names,indent=2)+'\n')
          PY

      - name: Fetch live closed-track leaderboard
        shell: bash
        run: |
          set -euo pipefail
          base="https://delta-lab-ai-lean-refactor-arena.hf.space"
          response="$(curl -fsSL --retry 3 -X POST -H 'Content-Type: application/json' \
            -d '{"data":[]}' "$base/gradio_api/call/leaderboard")"
          echo "$response" | tee /tmp/lra-leaderboard-call.json
          event_id="$(echo "$response" | jq -r '.event_id // empty')"
          test -n "$event_id"
          curl -fsSL --retry 3 "$base/gradio_api/call/leaderboard/$event_id" \
            -o /tmp/lra-leaderboard.sse
          cat /tmp/lra-leaderboard.sse
          python3 - <<'PY'
          import json,re
          txt=open('/tmp/lra-leaderboard.sse').read()
          payloads=[]
          for line in txt.splitlines():
              if line.startswith('data: '):
                  raw=line[6:]
                  try: payloads.append(json.loads(raw))
                  except Exception: pass
          print('PAYLOAD_COUNT=',len(payloads))
          if not payloads:
              raise SystemExit('NO_LEADERBOARD_PAYLOAD')
          open('/tmp/lra-leaderboard-payloads.json','w').write(json.dumps(payloads,indent=2,ensure_ascii=False)+'\n')
          print('VERIFIED_LIVE_LEADERBOARD_FETCH')
          PY

      - name: Extract dated Closed leader from read-only payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, html, json, re
          p=json.load(open('/tmp/lra-leaderboard-payloads.json'))
          def walk(o):
              if isinstance(o,str):
                  yield o
              elif isinstance(o,list):
                  for x in o: yield from walk(x)
              elif isinstance(o,dict):
                  for x in o.values(): yield from walk(x)
          rows=[]
          for s in walk(p):
              for m in re.finditer(r"<tr data-rank=['\"](\d+)['\"]>(.*?)</tr>",s,re.S):
                  body=m.group(2)
                  name=re.search(r"<td class=['\"]who['\"][^>]*>(.*?)</td>",body,re.S)
                  pct=re.search(r"<td data-col=['\"]combined['\"] data-sort=['\"]([\d.]+)",body)
                  if name and pct:
                      clean=html.unescape(re.sub(r'<[^>]*>','',name.group(1))).strip()
                      rows.append({'rank':int(m.group(1)),'team':clean,'combined_pct':float(pct.group(1))})
          dedup={r['rank']:r for r in rows}
          ordered=[dedup[k] for k in sorted(dedup)]
          if not ordered or ordered[0]['rank']!=1:
              raise SystemExit('NO_RELIABLE_CLOSED_LEADER')
          out={'schema':'mathgraph.lra.live-closed.readonly.v1',
               'observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'status':'READ_ONLY_PUBLIC_LEADERBOARD',
               'top_10':ordered[:10],
               'leader':ordered[0],
               'authority':'public Gradio leaderboard response; no submission or credential access'}
          open('/tmp/lra-dated-closed-leader.json','w').write(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print('WARRANTED_READ_ONLY_CLOSED_LEADER=',json.dumps(out,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-live-space-api
          path: |
            /tmp/lra-space-config.json
            /tmp/lra-api-surface.json
            /tmp/lra-read-like-apis.json
            /tmp/lra-leaderboard-call.json
            /tmp/lra-leaderboard.sse
            /tmp/lra-leaderboard-payloads.json
            /tmp/lra-dated-closed-leader.json

