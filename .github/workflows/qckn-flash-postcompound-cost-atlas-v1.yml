name: Flash post-compounding Mathlib cost atlas v1

on:
  push:
    branches:
      - qckn-flash-postcompound-cost-atlas-v1
  workflow_dispatch:

concurrency:
  group: qckn-flash-postcompound-cost-atlas-v1
  cancel-in-progress: true

jobs:
  cost-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run post-compounding Mathlib cost atlas
        run: bash experiments/run_qckn_flash_postcompound_cost_atlas_v1.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-flash-postcompound-cost-atlas-v1
          path: /tmp/qckn-flash-postcompound-cost-atlas-v1/evidence
          if-no-files-found: warn
