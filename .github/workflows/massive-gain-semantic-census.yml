name: V2 massive-gain semantic census

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/massive-gain-semantic-census.trigger'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build exact scored V2 with semantic counters
        run: |
          set -euxo pipefail
          V2=3d7585c21242f29fdaa48ae9a16e16c6afe42238
          git worktree add /tmp/v2 "$V2"
          python3 - <<'PY'
          from pathlib import Path

          # eval.rs: count ubiquitous environment, forcing and iota events.
          p=Path('/tmp/v2/src/eval.rs')
          s=p.read_text()
          anchor='use std::collections::hash_map::Entry;\n'
          probe=r'''use std::sync::atomic::{AtomicU64, Ordering};
static MG_KEY_ENV_CALLS: AtomicU64 = AtomicU64::new(0);
static MG_KEY_ENV_CLOSED: AtomicU64 = AtomicU64::new(0);
static MG_KEY_ENV_WIDE: AtomicU64 = AtomicU64::new(0);
static MG_KEY_ENV_PROJECT: AtomicU64 = AtomicU64::new(0);
static MG_PRUNE_COLD: AtomicU64 = AtomicU64::new(0);
static MG_FORCE_ALL: AtomicU64 = AtomicU64::new(0);
static MG_IOTA_STEP: AtomicU64 = AtomicU64::new(0);
static MG_IOTA_VALUE: AtomicU64 = AtomicU64::new(0);
static MG_RECURSOR_IOTA: AtomicU64 = AtomicU64::new(0);

pub fn report_massive_gain_eval_census() {
    if std::env::var_os("MATHGRAPH_MASSIVE_CENSUS").is_none() { return; }
    eprintln!("MG_EVAL key_env_calls={} key_env_closed={} key_env_wide={} key_env_project={} prune_cold={} force_all={} iota_step={} iota_value={} recursor_iota={}",
        MG_KEY_ENV_CALLS.load(Ordering::Relaxed),
        MG_KEY_ENV_CLOSED.load(Ordering::Relaxed),
        MG_KEY_ENV_WIDE.load(Ordering::Relaxed),
        MG_KEY_ENV_PROJECT.load(Ordering::Relaxed),
        MG_PRUNE_COLD.load(Ordering::Relaxed),
        MG_FORCE_ALL.load(Ordering::Relaxed),
        MG_IOTA_STEP.load(Ordering::Relaxed),
        MG_IOTA_VALUE.load(Ordering::Relaxed),
        MG_RECURSOR_IOTA.load(Ordering::Relaxed));
}
'''
          assert anchor in s
          s=s.replace(anchor,anchor+probe,1)

          old='''    #[inline]\n    pub(crate) fn key_env(&mut self, env: E<'t>, e: ExprPtr<'t>) -> E<'t> {\n        let k = e.num_loose_bvars();\n        if k == 0 {\n            return self.lsub_base(env.lsub());\n        }\n        if k > 64 {\n            return env;\n        }\n        self.prune_env(env, e.as_ref().fv_mask())\n    }'''
          new='''    #[inline]\n    pub(crate) fn key_env(&mut self, env: E<'t>, e: ExprPtr<'t>) -> E<'t> {\n        MG_KEY_ENV_CALLS.fetch_add(1, Ordering::Relaxed);\n        let k = e.num_loose_bvars();\n        if k == 0 {\n            MG_KEY_ENV_CLOSED.fetch_add(1, Ordering::Relaxed);\n            return self.lsub_base(env.lsub());\n        }\n        if k > 64 {\n            MG_KEY_ENV_WIDE.fetch_add(1, Ordering::Relaxed);\n            return env;\n        }\n        MG_KEY_ENV_PROJECT.fetch_add(1, Ordering::Relaxed);\n        self.prune_env(env, e.as_ref().fv_mask())\n    }'''
          assert old in s
          s=s.replace(old,new,1)

          old='        self.prune_env_cold(e, mask, slot)\n'
          new='        MG_PRUNE_COLD.fetch_add(1, Ordering::Relaxed);\n        self.prune_env_cold(e, mask, slot)\n'
          assert old in s
          s=s.replace(old,new,1)

          old="    pub(crate) fn force_all(&mut self, depth: u32, v: V<'t>) -> V<'t> {\n"
          new=old+'        MG_FORCE_ALL.fetch_add(1, Ordering::Relaxed);\n'
          assert old in s
          s=s.replace(old,new,1)

          old="    fn iota_step(&mut self, depth: u32, v: V<'t>) -> ForceStep<'t> {\n"
          new=old+'        MG_IOTA_STEP.fetch_add(1, Ordering::Relaxed);\n'
          assert old in s
          s=s.replace(old,new,1)

          old="    pub(crate) fn iota_value(&mut self, depth: u32, v: V<'t>) -> Option<V<'t>> {\n"
          new=old+'        MG_IOTA_VALUE.fetch_add(1, Ordering::Relaxed);\n'
          assert old in s
          s=s.replace(old,new,1)

          old="    fn do_recursor_iota(&mut self, depth: u32, name: NamePtr<'t>, levels: LevelsPtr<'t>, args: &[V<'t>]) -> Option<V<'t>> {\n"
          new=old+'        MG_RECURSOR_IOTA.fetch_add(1, Ordering::Relaxed);\n'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # infer.rs: count inference shape, cache effectiveness and beta-fusion reach.
          p=Path('/tmp/v2/src/infer.rs')
          s=p.read_text()
          anchor='use InferFlag::*;\n'
          probe=r'''use std::sync::atomic::{AtomicU64, Ordering};
static MG_INFER_CALLS: AtomicU64 = AtomicU64::new(0);
static MG_INFER_APP: AtomicU64 = AtomicU64::new(0);
static MG_INFER_LAMBDA: AtomicU64 = AtomicU64::new(0);
static MG_INFER_PI: AtomicU64 = AtomicU64::new(0);
static MG_INFER_LET: AtomicU64 = AtomicU64::new(0);
static MG_INFER_PROJ: AtomicU64 = AtomicU64::new(0);
static MG_TYPE_CACHE_HIT: AtomicU64 = AtomicU64::new(0);
static MG_TYPE_CACHE_MISS: AtomicU64 = AtomicU64::new(0);
static MG_BETA_FUSED: AtomicU64 = AtomicU64::new(0);
static MG_APP_GENERIC: AtomicU64 = AtomicU64::new(0);

pub fn report_massive_gain_infer_census() {
    if std::env::var_os("MATHGRAPH_MASSIVE_CENSUS").is_none() { return; }
    eprintln!("MG_INFER calls={} app={} lambda={} pi={} let={} proj={} cache_hit={} cache_miss={} beta_fused={} app_generic={}",
        MG_INFER_CALLS.load(Ordering::Relaxed),
        MG_INFER_APP.load(Ordering::Relaxed),
        MG_INFER_LAMBDA.load(Ordering::Relaxed),
        MG_INFER_PI.load(Ordering::Relaxed),
        MG_INFER_LET.load(Ordering::Relaxed),
        MG_INFER_PROJ.load(Ordering::Relaxed),
        MG_TYPE_CACHE_HIT.load(Ordering::Relaxed),
        MG_TYPE_CACHE_MISS.load(Ordering::Relaxed),
        MG_BETA_FUSED.load(Ordering::Relaxed),
        MG_APP_GENERIC.load(Ordering::Relaxed));
}
'''
          assert anchor in s
          s=s.replace(anchor,anchor+probe,1)

          sig='''    pub(crate) fn infer_value(\n        &mut self,\n        flag: InferFlag,\n        depth: u32,\n        env: E<'t>,\n        ctx: C<'t>,\n        e: ExprPtr<'t>,\n    ) -> V<'t> {\n'''
          body='''        MG_INFER_CALLS.fetch_add(1, Ordering::Relaxed);\n        match self.ctx.read_expr(e) {\n            App { .. } => { MG_INFER_APP.fetch_add(1, Ordering::Relaxed); }\n            Lambda { .. } => { MG_INFER_LAMBDA.fetch_add(1, Ordering::Relaxed); }\n            Pi { .. } => { MG_INFER_PI.fetch_add(1, Ordering::Relaxed); }\n            Let { .. } => { MG_INFER_LET.fetch_add(1, Ordering::Relaxed); }\n            Proj { .. } => { MG_INFER_PROJ.fetch_add(1, Ordering::Relaxed); }\n            _ => {}\n        }\n'''
          assert sig in s
          s=s.replace(sig,sig+body,1)

          old='''        if let Some(cached) = self.tc_cache.type_cache.get(&key).copied() {\n            if flag == InferOnly || cached.checked_under == scope {\n                return cached.result;\n            }\n        }\n\n        let r = match self.ctx.read_expr(e) {'''
          new='''        if let Some(cached) = self.tc_cache.type_cache.get(&key).copied() {\n            if flag == InferOnly || cached.checked_under == scope {\n                MG_TYPE_CACHE_HIT.fetch_add(1, Ordering::Relaxed);\n                return cached.result;\n            }\n        }\n        MG_TYPE_CACHE_MISS.fetch_add(1, Ordering::Relaxed);\n\n        let r = match self.ctx.read_expr(e) {'''
          assert old in s
          s=s.replace(old,new,1)

          old='''            if let Lambda { binder_type, body, .. } = self.ctx.read_expr(fun) {\n                let dom = self.arg_value(depth, env, binder_type);'''
          new='''            if let Lambda { binder_type, body, .. } = self.ctx.read_expr(fun) {\n                MG_BETA_FUSED.fetch_add(1, Ordering::Relaxed);\n                let dom = self.arg_value(depth, env, binder_type);'''
          assert old in s
          s=s.replace(old,new,1)

          old='''        let (fun, mut args) = self.ctx.unfold_apps_stack(self.arena, e);'''
          new='''        MG_APP_GENERIC.fetch_add(1, Ordering::Relaxed);\n        let (fun, mut args) = self.ctx.unfold_apps_stack(self.arena, e);'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # Emit counters after each successful checker process.
          p=Path('/tmp/v2/src/main.rs')
          s=p.read_text()
          old='''    // Pretty print as necessary\n    let pp_errs = export_file.pp_selected_declars(pp_destination.as_mut());'''
          new='''    sokonanoda::eval::report_massive_gain_eval_census();\n    sokonanoda::infer::report_massive_gain_infer_census();\n    // Pretty print as necessary\n    let pp_errs = export_file.pp_selected_declars(pp_destination.as_mut());'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY

          cd /tmp/v2
          cargo test --release --locked
          RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked
          cp target/release/sokonanoda /tmp/v2-census
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF

      - name: Build real-world Arena workloads
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena
          cd /tmp/arena
          for t in init std mathlib; do
            nix develop -c ./lka.py build-test "$t"
          done

      - name: Run semantic census
        env:
          MATHGRAPH_MASSIVE_CENSUS: "1"
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/census.txt
          for t in init std mathlib; do
            echo "MG_TEST $t" | tee -a /tmp/census.txt
            /usr/bin/time -v /tmp/v2-census /tmp/checker.json < "_build/tests/$t.ndjson" >/tmp/$t.out 2>/tmp/$t.err
            grep '^MG_' /tmp/$t.err | tee -a /tmp/census.txt
          done

      - name: Decide highest-upside structural target
        run: |
          python3 - <<'PY' | tee /tmp/decision.txt
          import re
          from pathlib import Path
          lines=Path('/tmp/census.txt').read_text().splitlines()
          rows={}; cur=None
          for line in lines:
              if line.startswith('MG_TEST '):
                  cur=line.split()[1]; rows[cur]={}
              elif line.startswith('MG_') and cur:
                  for k,v in re.findall(r'(\w+)=(\d+)', line): rows[cur][k]=int(v)
          for t,r in rows.items():
              kc=r.get('key_env_calls',0); proj=r.get('key_env_project',0); cold=r.get('prune_cold',0)
              inf=r.get('calls',0); hit=r.get('cache_hit',0); miss=r.get('cache_miss',0)
              app=r.get('app',0); fused=r.get('beta_fused',0); generic=r.get('app_generic',0)
              print(f'{t}: key_env={kc:,} project={proj:,} cold={cold:,} cold/key_env={(cold/kc if kc else 0):.3%}; infer={inf:,} cache_hit={hit:,} cache_miss={miss:,} hit_rate={(hit/(hit+miss) if hit+miss else 0):.3%}; apps={app:,} fused={fused:,} generic={generic:,} fused/app={(fused/app if app else 0):.3%}; force_all={r.get("force_all",0):,}; recursor_iota={r.get("recursor_iota",0):,}')
          m=rows.get('mathlib') or rows.get('std') or rows.get('init') or {}
          kc=m.get('key_env_calls',0); cold=m.get('prune_cold',0); inf=m.get('calls',0); hit=m.get('cache_hit',0); miss=m.get('cache_miss',0); force=m.get('force_all',0); rec=m.get('recursor_iota',0)
          # This is a routing rule, not a performance claim: choose the most ubiquitous removable mechanism.
          candidates=[]
          candidates.append(('CANONICAL_ENV_IDENTITY', kc + 8*cold))
          candidates.append(('INFER_CACHE_POLICY', miss*4 + hit))
          candidates.append(('FORCE_WHNF_PIPELINE', force))
          candidates.append(('COMPILED_RECURSOR_PLANS', rec*8))
          candidates.sort(key=lambda x:x[1], reverse=True)
          print('ROUTING_SCORES', candidates)
          print('DECISION='+candidates[0][0])
          print('NOTE=routing scores are event-weighted prioritization only; next separator must measure instructions and preserve semantics')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: massive-gain-semantic-census
          path: |
            /tmp/census.txt
            /tmp/decision.txt
            /tmp/init.err
            /tmp/std.err
            /tmp/mathlib.err
