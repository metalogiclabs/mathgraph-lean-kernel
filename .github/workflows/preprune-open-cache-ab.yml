name: Pre-prune open-cache A/B

on:
  pull_request:
    branches: [mathgraph]
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build Arena workloads
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena-pre
          cd /tmp/arena-pre
          for t in init std mathlib; do nix develop -c ./lka.py build-test "$t"; done

      - name: Build exact V2 arms
        run: |
          set -euxo pipefail
          V2=3d7585c21242f29fdaa48ae9a16e16c6afe42238
          git worktree add /tmp/v2-base "$V2"
          cp -a /tmp/v2-base /tmp/v2-all
          cp -a /tmp/v2-base /tmp/v2-apppi
          python3 scripts/apply_preprune_open_cache.py /tmp/v2-all all
          python3 scripts/apply_preprune_open_cache.py /tmp/v2-apppi apppi
          for arm in base all apppi; do
            cd /tmp/v2-$arm
            cargo test --release --locked
            RUSTFLAGS='-C target-cpu=native' cargo build --release --locked
            cp target/release/sokonanoda /tmp/$arm-checker
            CARGO_TARGET_DIR=/tmp/$arm-cg RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked
            cp /tmp/$arm-cg/release/sokonanoda /tmp/$arm-cg-checker
          done
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Semantic equality
        run: |
          set -euxo pipefail
          cd /tmp/arena-pre
          for t in init std mathlib; do
            f=_build/tests/$t.ndjson
            /tmp/base-checker /tmp/checker.json < "$f" >/tmp/base.out
            for arm in all apppi; do
              /tmp/$arm-checker /tmp/checker.json < "$f" >/tmp/$arm.out
              cmp /tmp/base.out /tmp/$arm.out
            done
          done

      - name: Deterministic instruction counts
        run: |
          set -euxo pipefail
          nix shell nixpkgs#valgrind -c valgrind --version
          printf 'test,arm,Ir\n' >/tmp/callgrind.csv
          cd /tmp/arena-pre
          for t in init std; do
            f=_build/tests/$t.ndjson
            for arm in base all apppi; do
              out=/tmp/cg-$t-$arm.out
              timeout 1500 nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file="$out" /tmp/$arm-cg-checker /tmp/checker.json < "$f" >/dev/null 2>/dev/null
              ir=$(awk '/^summary:/ {print $2}' "$out")
              test -n "$ir"
              printf '%s,%s,%s\n' "$t" "$arm" "$ir" >>/tmp/callgrind.csv
            done
          done

      - name: Paired Mathlib wall
        run: |
          set -euxo pipefail
          printf 'rep,arm,wall\n' >/tmp/mathlib-wall.csv
          cd /tmp/arena-pre
          f=_build/tests/mathlib.ndjson
          for rep in 1 2; do
            if [ "$rep" = 1 ]; then arms='base all apppi'; else arms='apppi all base'; fi
            for arm in $arms; do
              /usr/bin/time -f '%e' -o /tmp/t timeout 1200 /tmp/$arm-checker /tmp/checker.json < "$f" >/dev/null 2>/dev/null
              printf '%s,%s,%s\n' "$rep" "$arm" "$(cat /tmp/t)" >>/tmp/mathlib-wall.csv
            done
          done

      - name: Decide
        run: |
          python3 - <<'PY' | tee /tmp/summary.txt
          import csv, statistics
          rows=list(csv.DictReader(open('/tmp/callgrind.csv')))
          C={(r['test'],r['arm']):int(r['Ir']) for r in rows}
          W=list(csv.DictReader(open('/tmp/mathlib-wall.csv')))
          for arm in ['all','apppi']:
              print('ARM',arm)
              wins=True
              for t in ['init','std']:
                  q=C[(t,arm)]/C[(t,'base')]
                  print(' IR',t,C[(t,'base')],C[(t,arm)],f'{(q-1)*100:+.3f}%')
                  wins &= q < 1.0
              b=statistics.median(float(r['wall']) for r in W if r['arm']=='base')
              x=statistics.median(float(r['wall']) for r in W if r['arm']==arm)
              print(' WALL mathlib',b,x,f'{(x/b-1)*100:+.3f}%')
              wins &= x < b
              gain=1-C[('std',arm)]/C[('std','base')]
              if wins and gain >= .05: verdict='MAJOR_GAIN'
              elif wins and gain >= .01: verdict='PROMISING_GAIN'
              elif wins: verdict='SMALL_GAIN'
              else: verdict='NO_PROMOTION'
              print(' VERDICT',verdict)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preprune-open-cache-ab
          path: |
            /tmp/callgrind.csv
            /tmp/mathlib-wall.csv
            /tmp/summary.txt
