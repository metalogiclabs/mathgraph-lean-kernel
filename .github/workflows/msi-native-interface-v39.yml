name: MSI native interface v39

on:
  push:
    branches: [msi-native-interface-v39]
  workflow_dispatch:

jobs:
  native-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build real Lean corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 2000000 _build/tests/std.ndjson >/tmp/std2m.ndjson
          head -n 3000000 _build/tests/std.ndjson >/tmp/std3m.ndjson
          head -n 1000000 _build/tests/cedar.ndjson >/tmp/cedar1m.ndjson
          cp _build/tests/std.ndjson /tmp/std-full.ndjson
          cp _build/tests/cedar.ndjson /tmp/cedar-full.ndjson
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Materialize native Sort interface and controls
        run: |
          set -euxo pipefail
          cat >/tmp/selection.json <<'EOF'
          {"winner_id":"c0","winner_materializer":"sort","selection_uses_heldout":false}
          EOF
          for mode in local shared ablate; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/v39-$mode
            cp experiments/apply_msi_sort_interface_regenesis_v37.py /tmp/v39-$mode/native_materializer.py
            (cd /tmp/v39-$mode && python3 native_materializer.py $mode)
          done
          git --no-pager diff --no-index /tmp/v39-local/src/infer.rs /tmp/v39-shared/src/infer.rs > /tmp/native-sort-interface.diff || true
          cd arena
          for mode in local shared ablate; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/v39-$mode-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/v39-$mode/Cargo.toml --release --locked"
          done

      - name: Gate A full-corpus semantic transfer
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          for corpus in std-full cedar-full; do
            for mode in local shared ablate; do
              /tmp/v39-$mode-target/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus-$mode.out
            done
            cmp /tmp/$corpus-local.out /tmp/$corpus-shared.out
            cmp /tmp/$corpus-local.out /tmp/$corpus-ablate.out
            echo "${corpus^^}_OUTPUT_EQ=PASS" | tee -a /tmp/result.txt
          done

      - name: Gate B deterministic causal economics
        run: |
          set -euxo pipefail
          nix shell nixpkgs#valgrind -c valgrind --version
          for mode in local shared ablate; do
            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-std2m-$mode /tmp/v39-$mode-target/release/sokonanoda /tmp/checker.json </tmp/std2m.ndjson >/dev/null 2>/tmp/cg-std2m-$mode.err
            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-std3m-$mode /tmp/v39-$mode-target/release/sokonanoda /tmp/checker.json </tmp/std3m.ndjson >/dev/null 2>/tmp/cg-std3m-$mode.err
            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-cedar-$mode /tmp/v39-$mode-target/release/sokonanoda /tmp/checker.json </tmp/cedar1m.ndjson >/dev/null 2>/tmp/cg-cedar-$mode.err
          done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          def s(p):
              m=re.search(r'^summary:\s+(\d+)',open(p).read(),re.M)
              assert m,p
              return int(m.group(1))
          std={m:s('/tmp/cg-std3m-'+m)-s('/tmp/cg-std2m-'+m) for m in ('local','shared','ablate')}
          cedar={m:s('/tmp/cg-cedar-'+m) for m in ('local','shared','ablate')}
          ok=True
          for name,d in [('STD',std),('CEDAR',cedar)]:
              for k,v in d.items(): print(f'V39_{name}_{k.upper()}={v}')
              win=d['shared']<d['local'] and d['shared']<d['ablate']
              print(f'V39_{name}_NATIVE_SHARED_WIN={str(win).upper()}')
              print(f'V39_{name}_SHARED_VS_LOCAL_PCT={100*(d["shared"]-d["local"])/d["local"]:.6f}')
              print(f'V39_{name}_SHARED_VS_ABLATE_PCT={100*(d["shared"]-d["ablate"])/d["ablate"]:.6f}')
              ok &= win
          print('V39_NATIVE_CAUSAL_ECONOMICS='+('PASS' if ok else 'FAIL'))
          if not ok: raise SystemExit(2)
          PY

      - name: Gate D rerun residual discovery above promoted interface
        run: |
          set -euxo pipefail
          cp experiments/apply_msi_post_sort_residual_probe_v39.py /tmp/v39-shared/residual_probe.py
          (cd /tmp/v39-shared && python3 residual_probe.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/v39-residual-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/v39-shared/Cargo.toml --release --locked"
          /tmp/v39-residual-target/release/sokonanoda /tmp/checker.json </tmp/std3m.ndjson >/tmp/v39-residual.out 2>/tmp/v39-residual.err
          grep 'MSI_V39_POST_SORT' /tmp/v39-residual.err | tail -1 | tee /tmp/v39-residual.txt
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          s=open('/tmp/v39-residual.txt').read()
          vals={k:int(v) for k,v in re.findall(r'(app_pi|app_pi_pre|proj_ind|proj_ind_pre)=(\d+)',s)}
          assert vals['app_pi']>0 and vals['proj_ind']>0
          print('V39_POST_PROMOTION_PI_RESIDUAL_PRESENT=PASS')
          print('V39_POST_PROMOTION_INDUCTIVE_RESIDUAL_PRESENT=PASS')
          print('V39_NEXT_INTERFACE_DISCOVERY_FRONTIER=OPEN')
          print('V39_DECISION=NATIVE_INTERFACE_TRANSFER_AND_COMPOUNDING_FRONTIER')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-native-interface-v39
          path: |
            /tmp/result.txt
            /tmp/native-sort-interface.diff
            /tmp/v39-residual.txt
            /tmp/cg-std2m-local
            /tmp/cg-std2m-shared
            /tmp/cg-std2m-ablate
            /tmp/cg-std3m-local
            /tmp/cg-std3m-shared
            /tmp/cg-std3m-ablate
            /tmp/cg-cedar-local
            /tmp/cg-cedar-shared
            /tmp/cg-cedar-ablate
