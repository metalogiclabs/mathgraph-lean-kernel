name: msikernel observation genesis v3

on:
  push:
    branches: [msikernel-observation-genesis-v3]

jobs:
  observation-genesis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build real checker and frozen corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 250000 _build/tests/std.ndjson >/tmp/std.ndjson
          head -n 250000 _build/tests/cedar.ndjson >/tmp/cedar.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/obs
          python3 experiments/apply_observation_trace_v3.py /tmp/obs
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-obs RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/obs/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Generate anonymous observation language from real residuals
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          for corpus in std cedar; do
            /tmp/target-obs/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus-clean.out
            MSI_OBS_TRACE=1 /tmp/target-obs/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus-trace.out 2>/tmp/$corpus.raw
            cmp /tmp/$corpus-clean.out /tmp/$corpus-trace.out
            grep -E '^MSI_(PROD|RES)\|' /tmp/$corpus.raw >/tmp/$corpus.trace
            python3 experiments/induce_observation_basis.py /tmp/$corpus.trace ${corpus^^} | tee -a /tmp/result.txt
            echo "${corpus^^}_TRACE_OUTPUT_EQ=PASS" | tee -a /tmp/result.txt
          done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          t=open('/tmp/result.txt').read()
          def g(label,key):
              m=re.search(rf'^{label}_{key}=(.+)$',t,re.M)
              if not m: raise SystemExit(f'missing {label}_{key}')
              return m.group(1)
          assert g('STD','RESIDUAL_TO_OBSERVATION_BASIS')=='PASS'
          assert g('CEDAR','RESIDUAL_TO_OBSERVATION_BASIS')=='PASS'
          sw=int(g('STD','MIN_BASIS_WIDTH')); cw=int(g('CEDAR','MIN_BASIS_WIDTH'))
          sb=g('STD','MIN_BASES'); cb=g('CEDAR','MIN_BASES')
          print('REAL_RESIDUAL_OBSERVATION_GENESIS=PASS')
          print('CROSS_WORKLOAD_BASIS_WIDTH_MATCH=' + ('PASS' if sw==cw else 'NO'))
          print('CROSS_WORKLOAD_BASIS_IDENTITY_MATCH=' + ('PASS' if sb==cb else 'NO'))
          # Strong gate: same unique minimal generated coordinate on both corpora.
          strong=(g('STD','UNIQUE_MINIMAL')=='PASS' and g('CEDAR','UNIQUE_MINIMAL')=='PASS' and sb==cb)
          print('UNIQUE_TRANSFERRED_MINIMAL_OBSERVATION=' + ('PASS' if strong else 'NO'))
          PY
          cat /tmp/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msikernel-observation-genesis-v3
          path: |
            /tmp/result.txt
            /tmp/std.trace
            /tmp/cedar.trace
