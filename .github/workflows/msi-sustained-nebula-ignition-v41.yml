name: MSI sustained Nebula ignition v41

on:
  push:
    branches: [msi-sustained-nebula-ignition-v41]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sustained-nebula:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Freeze F and developmental law
        run: |
          set -euxo pipefail
          {
            echo "V41_EXPERIMENT_HEAD=$GITHUB_SHA"
            sha256sum               experiments/apply_msi_semantic_rediscovery_frontier_v36.py               experiments/select_blind_kernel_interface_v38.py               experiments/apply_blind_kernel_interface_v38.py               experiments/apply_msi_sort_interface_regenesis_v37.py               experiments/apply_post_g1_residual_probe_v41.py               experiments/select_g2_realizer_v41.py               experiments/apply_recursive_second_interface_v40.py               experiments/apply_post_g2_continuation_probe_v41.py               experiments/select_g3_realizer_v41.py               experiments/apply_g3_realizer_v41.py
          } | tee /tmp/frozen-v41.txt
          cp SUSTAINED_NEBULA_IGNITION_V41.md /tmp/prereg.md

      - name: Build acquisition and sealed corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 2000000 _build/tests/std.ndjson >/tmp/acquire-std2m.ndjson
          head -n 3000000 _build/tests/std.ndjson >/tmp/heldout-std3m.ndjson
          head -n 1000000 _build/tests/cedar.ndjson >/tmp/heldout-cedar1m.ndjson
          test "$(wc -l </tmp/acquire-std2m.ndjson)" -eq 2000000
          test "$(wc -l </tmp/heldout-std3m.ndjson)" -eq 3000000
          test "$(wc -l </tmp/heldout-cedar1m.ndjson)" -eq 1000000
          sha256sum /tmp/acquire-std2m.ndjson /tmp/heldout-std3m.ndjson /tmp/heldout-cedar1m.ndjson | tee /tmp/corpus-hashes.txt
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: G1 blind interface genesis from N0
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/g1-acquire
          (cd /tmp/g1-acquire && python3 "$GITHUB_WORKSPACE/experiments/apply_msi_semantic_rediscovery_frontier_v36.py")
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/g1-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/g1-acquire/Cargo.toml --release --locked"
          /tmp/g1-target/release/sokonanoda /tmp/checker.json </tmp/acquire-std2m.ndjson >/tmp/g1.out 2>/tmp/g1.err
          cd ..
          python3 experiments/select_blind_kernel_interface_v38.py /tmp/g1.err /tmp/g1.json | tee /tmp/g1-selection.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g1.json'))
          assert x['selection_uses_heldout'] is False
          assert x['winner_materializer'] == 'sort', x
          print('V41_G1_REALIZER='+x['winner_id']+':'+x['winner_materializer'])
          print('V41_G1=PASS')
          PY

      - name: Future withholding rho2 before G1
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/pre-g1
          set +e
          (cd /tmp/pre-g1 && python3 "$GITHUB_WORKSPACE/experiments/apply_post_g1_residual_probe_v41.py") >/tmp/pre-g1-probe.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'V41_RHO2_NOT_DERIVABLE_BEFORE_G1' /tmp/pre-g1-probe.out
          echo V41_RHO2_FUTURE_WITHHOLDING=PASS | tee /tmp/result.txt

      - name: G2 pressure arises only after N1 and selects K2
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/g2-probe
          (cd /tmp/g2-probe &&             python3 "$GITHUB_WORKSPACE/experiments/apply_blind_kernel_interface_v38.py" /tmp/g1.json shared &&             python3 "$GITHUB_WORKSPACE/experiments/apply_post_g1_residual_probe_v41.py")
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/g2-probe-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/g2-probe/Cargo.toml --release --locked"
          /tmp/g2-probe-target/release/sokonanoda /tmp/checker.json </tmp/acquire-std2m.ndjson >/tmp/g2.out 2>/tmp/g2.err
          cd ..
          grep 'MSI_V41_G2' /tmp/g2.err | tail -1 | tee /tmp/g2-residual.txt
          python3 experiments/select_g2_realizer_v41.py /tmp/g2.err /tmp/g2.json | tee /tmp/g2-selection.log
          python3 - <<'PY' | tee -a /tmp/result.txt
          import json
          x=json.load(open('/tmp/g2.json'))
          assert x['selection_uses_heldout'] is False
          print('V41_G2_REALIZER='+x['winner_id']+':'+x['winner_materializer'])
          print('V41_G2=PASS')
          PY

      - name: Future withholding rho3 before G2
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/pre-g2
          (cd /tmp/pre-g2 && python3 "$GITHUB_WORKSPACE/experiments/apply_blind_kernel_interface_v38.py" /tmp/g1.json shared)
          set +e
          (cd /tmp/pre-g2 && python3 "$GITHUB_WORKSPACE/experiments/apply_post_g2_continuation_probe_v41.py" /tmp/g2.json) >/tmp/pre-g2-probe.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'V41_RHO3_NOT_DERIVABLE_BEFORE_G2' /tmp/pre-g2-probe.out
          echo V41_RHO3_FUTURE_WITHHOLDING=PASS | tee -a /tmp/result.txt

      - name: Materialize N2 and derive new G3 pressure
        run: |
          set -euxo pipefail
          for d in n2-clean g3-probe; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$d
            (cd /tmp/$d &&               python3 "$GITHUB_WORKSPACE/experiments/apply_blind_kernel_interface_v38.py" /tmp/g1.json shared &&               python3 "$GITHUB_WORKSPACE/experiments/apply_recursive_second_interface_v40.py" /tmp/g2.json shared)
          done
          cmp /tmp/n2-clean/src/infer.rs /tmp/g3-probe/src/infer.rs
          (cd /tmp/g3-probe && python3 "$GITHUB_WORKSPACE/experiments/apply_post_g2_continuation_probe_v41.py" /tmp/g2.json)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/g3-probe-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/g3-probe/Cargo.toml --release --locked"
          /tmp/g3-probe-target/release/sokonanoda /tmp/checker.json </tmp/acquire-std2m.ndjson >/tmp/g3.out 2>/tmp/g3.err
          cd ..
          grep 'MSI_V41_G3' /tmp/g3.err | tail -1 | tee /tmp/g3-residual.txt
          python3 experiments/select_g3_realizer_v41.py /tmp/g3.err /tmp/g2.json /tmp/g3.json | tee /tmp/g3-selection.log
          python3 - <<'PY' | tee -a /tmp/result.txt
          import json
          x=json.load(open('/tmp/g3.json'))
          assert x['selection_uses_heldout'] is False
          assert x['new_direct_opportunities'] > 0
          print('V41_G3_REALIZER='+x['winner_id']+':'+x['winner_materializer'])
          print('V41_G3_NEW_DIRECT_OPPORTUNITIES='+str(x['new_direct_opportunities']))
          print('V41_G3=PASS')
          PY

      - name: Persist warranted lineage and cold restart N2
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          def load(p): return json.load(open(p))
          lineage={
            'schema':'metatron.sustained-nebula.lineage.v41',
            'frozen_head':'${GITHUB_SHA}',
            'g1':load('/tmp/g1.json'),
            'g2':load('/tmp/g2.json'),
            'g3':load('/tmp/g3.json'),
          }
          open('/tmp/lineage-v41.json','w').write(json.dumps(lineage,sort_keys=True,indent=2)+'\n')
          PY
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/restart-n2
          (cd /tmp/restart-n2 &&             python3 "$GITHUB_WORKSPACE/experiments/apply_blind_kernel_interface_v38.py" /tmp/g1.json shared &&             python3 "$GITHUB_WORKSPACE/experiments/apply_recursive_second_interface_v40.py" /tmp/g2.json shared)
          cmp /tmp/n2-clean/src/infer.rs /tmp/restart-n2/src/infer.rs
          echo V41_COLD_RESTART_RECONSTRUCTS_N2=PASS | tee -a /tmp/result.txt

      - name: Causal knockout and semantic-sham controls
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/ko-g1
          set +e
          (cd /tmp/ko-g1 && python3 "$GITHUB_WORKSPACE/experiments/apply_recursive_second_interface_v40.py" /tmp/g2.json shared) >/tmp/ko-g1.out 2>&1
          rc1=$?
          set -e
          test "$rc1" -ne 0
          echo V41_KNOCKOUT_G1_KILLS_G2=PASS | tee -a /tmp/result.txt

          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/sham-g2
          (cd /tmp/sham-g2 &&             python3 "$GITHUB_WORKSPACE/experiments/apply_blind_kernel_interface_v38.py" /tmp/g1.json shared &&             python3 "$GITHUB_WORKSPACE/experiments/apply_recursive_second_interface_v40.py" /tmp/g2.json ablate)
          set +e
          (cd /tmp/sham-g2 && python3 "$GITHUB_WORKSPACE/experiments/apply_post_g2_continuation_probe_v41.py" /tmp/g2.json) >/tmp/sham-g2-probe.out 2>&1
          rc2=$?
          set -e
          test "$rc2" -ne 0
          grep -q 'V41_RHO3_NOT_DERIVABLE_BEFORE_G2' /tmp/sham-g2-probe.out
          echo V41_SEMANTIC_SHAM_G2_KILLS_RHO3=PASS | tee -a /tmp/result.txt

      - name: Build N2 N3 and G3 sham arms
        run: |
          set -euxo pipefail
          for arm in n2 n3 sham; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$arm
            (cd /tmp/$arm &&               python3 "$GITHUB_WORKSPACE/experiments/apply_blind_kernel_interface_v38.py" /tmp/g1.json shared &&               python3 "$GITHUB_WORKSPACE/experiments/apply_recursive_second_interface_v40.py" /tmp/g2.json shared)
          done
          (cd /tmp/n3 && python3 "$GITHUB_WORKSPACE/experiments/apply_g3_realizer_v41.py" /tmp/g3.json shared)
          (cd /tmp/sham && python3 "$GITHUB_WORKSPACE/experiments/apply_g3_realizer_v41.py" /tmp/g3.json sham)
          cd arena
          for arm in n2 n3 sham; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/$arm-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$arm/Cargo.toml --release --locked"
          done

      - name: Verify G3 consequence and semantic equality
        run: |
          set -euxo pipefail
          /tmp/n3-target/release/sokonanoda /tmp/checker.json </tmp/acquire-std2m.ndjson >/tmp/n3-acquire.out 2>/tmp/n3-acquire.err
          /tmp/sham-target/release/sokonanoda /tmp/checker.json </tmp/acquire-std2m.ndjson >/tmp/sham-acquire.out 2>/tmp/sham-acquire.err
          cmp /tmp/n3-acquire.out /tmp/sham-acquire.out
          grep 'MSI_V41_K3' /tmp/n3-acquire.err | tail -1 | tee /tmp/n3-k3.txt
          grep 'MSI_V41_K3' /tmp/sham-acquire.err | tail -1 | tee /tmp/sham-k3.txt
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          def read(path):
              s=open(path).read()
              m=re.search(r'opportunities=(\d+) bypasses=(\d+)',s)
              assert m,path
              return tuple(map(int,m.groups()))
          n3=read('/tmp/n3-k3.txt')
          sham=read('/tmp/sham-k3.txt')
          assert n3[0] > 0
          assert n3[1] == n3[0]
          assert sham[0] == n3[0]
          assert sham[1] == 0
          print('V41_G3_OPPORTUNITIES='+str(n3[0]))
          print('V41_G3_SHARED_BYPASSES='+str(n3[1]))
          print('V41_G3_SHAM_BYPASSES='+str(sham[1]))
          print('V41_G3_SEMANTIC_SHAM_CONTROL=PASS')
          PY

          for corpus in heldout-std3m heldout-cedar1m; do
            for arm in n2 n3 sham; do
              /tmp/$arm-target/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus-$arm.out 2>/tmp/$corpus-$arm.err
            done
            cmp /tmp/$corpus-n2.out /tmp/$corpus-n3.out
            cmp /tmp/$corpus-n2.out /tmp/$corpus-sham.out
            echo "V41_${corpus^^}_SEMANTIC_EQ=PASS" | tee -a /tmp/result.txt
          done

      - name: Final recurrence gate
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee -a /tmp/result.txt
          import json
          g1=json.load(open('/tmp/g1.json'))
          g2=json.load(open('/tmp/g2.json'))
          g3=json.load(open('/tmp/g3.json'))
          assert g1['selection_uses_heldout'] is False
          assert g2['selection_uses_heldout'] is False
          assert g3['selection_uses_heldout'] is False
          assert g3['new_direct_opportunities'] > 0
          print('V41_FROZEN_F=PASS')
          print('V41_FROZEN_DEVELOPMENTAL_LAW=PASS')
          print('V41_NO_POST_T0_SEMANTIC_ADDITIONS=PASS')
          print('V41_THREE_CAUSALLY_DEPENDENT_GENERATIONS=PASS')
          print('V41_RESTART=PASS')
          print('V41_KNOCKOUT=PASS')
          print('V41_SEMANTIC_SHAM=PASS')
          print('SUSTAINED_NEBULA_IGNITION_V41=BOUNDED_POSITIVE')
          PY
          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-sustained-nebula-ignition-v41
          path: |
            /tmp/result.txt
            /tmp/prereg.md
            /tmp/frozen-v41.txt
            /tmp/corpus-hashes.txt
            /tmp/g1.json
            /tmp/g2.json
            /tmp/g3.json
            /tmp/lineage-v41.json
            /tmp/g1-selection.log
            /tmp/g2-selection.log
            /tmp/g3-selection.log
            /tmp/g2-residual.txt
            /tmp/g3-residual.txt
            /tmp/n3-k3.txt
            /tmp/sham-k3.txt
            /tmp/pre-g1-probe.out
            /tmp/pre-g2-probe.out
            /tmp/ko-g1.out
            /tmp/sham-g2-probe.out
