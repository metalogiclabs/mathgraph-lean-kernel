name: Sparse adaptive relevance v103

on:
  push:
    branches:
      - experiment/sparse-adaptive-v103
    paths:
      - 'src/**'
      - 'experiments/run_sparse_adaptive_v103.sh'
      - '.github/workflows/sparse-adaptive-v103.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run sparse adaptive qualification
        run: bash experiments/run_sparse_adaptive_v103.sh
      - name: Preserve v103 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparse-adaptive-v103
          path: |
            /tmp/sparse-adaptive-v103/results.tsv
            /tmp/sparse-adaptive-v103/out/
            /tmp/sparse-adaptive-v103/perf-probe.csv
          if-no-files-found: warn
