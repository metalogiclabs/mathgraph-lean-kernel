name: MSI force-once v10

on:
  push:
    branches: [msi-force-once-v10]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare Arena corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test tutorial
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
      - name: Prepare baseline and candidate
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          cp -a /tmp/base /tmp/cand
          cp experiments/apply_msi_force_once_v10.py /tmp/cand/patch.py
          (cd /tmp/cand && python3 patch.py)
      - name: Build arms
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          CARGO_TARGET_DIR=/tmp/base-target RUSTFLAGS='-C target-cpu=x86-64 -C debuginfo=1' cargo build --manifest-path /tmp/base/Cargo.toml --release --locked
          CARGO_TARGET_DIR=/tmp/cand-target RUSTFLAGS='-C target-cpu=x86-64 -C debuginfo=1' cargo build --manifest-path /tmp/cand/Cargo.toml --release --locked
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Tutorial semantic equivalence
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json
          bins={'base':'/tmp/base-target/release/sokonanoda','cand':'/tmp/cand-target/release/sokonanoda'}
          files=sorted(pathlib.Path('_build/tests/tutorial').rglob('*.ndjson'))
          mism=[]
          for p in files:
              data=p.read_bytes(); rc={k:subprocess.run([b,'/tmp/checker.json'],input=data,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode for k,b in bins.items()}
              if len(set(rc.values())) != 1: mism.append((str(p),rc))
          print(json.dumps({'tutorial_cases':len(files),'mismatch_count':len(mism),'mismatches':mism[:50]},indent=2))
          if mism: raise SystemExit(1)
          PY
      - name: Large corpus acceptance gate
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          python3 - <<'PY'
          import subprocess,json
          bins={'base':'/tmp/base-target/release/sokonanoda','cand':'/tmp/cand-target/release/sokonanoda'}
          corpora={'std':'_build/tests/std.ndjson','cedar':'_build/tests/cedar.ndjson'}
          out={}; bad=[]
          for corpus,path in corpora.items():
              out[corpus]={}
              for label,b in bins.items():
                  with open(path,'rb') as f: r=subprocess.run([b,'/tmp/checker.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=1200)
                  out[corpus][label]=r.returncode
                  if r.returncode != 0: bad.append((corpus,label,r.returncode,r.stderr.decode('utf8','replace')[-1500:]))
          print(json.dumps(out,indent=2))
          if bad:
              print(bad); raise SystemExit(1)
          PY
      - name: Install Valgrind
        run: nix profile add nixpkgs#valgrind
      - name: Measure Std and Cedar
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          measure() { label="$1"; bin="$2"; input="$3"; timeout 3000 valgrind --tool=callgrind --callgrind-out-file="/tmp/${label}.cg" "$bin" /tmp/checker.json < "$input" >/tmp/${label}.out 2>/tmp/${label}.err; awk '/summary:/ {print $2}' "/tmp/${label}.cg" | tail -1; }
          BS=$(measure base-std /tmp/base-target/release/sokonanoda _build/tests/std.ndjson)
          CS=$(measure cand-std /tmp/cand-target/release/sokonanoda _build/tests/std.ndjson)
          BC=$(measure base-cedar /tmp/base-target/release/sokonanoda _build/tests/cedar.ndjson)
          CC=$(measure cand-cedar /tmp/cand-target/release/sokonanoda _build/tests/cedar.ndjson)
          python3 - "$BS" "$CS" "$BC" "$CC" <<'PY' | tee /tmp/result.txt
          import sys,json
          bs,cs,bc,cc=map(int,sys.argv[1:])
          out={'std':{'baseline':bs,'candidate':cs,'ratio':cs/bs,'delta_pct':100*(cs/bs-1)},'cedar':{'baseline':bc,'candidate':cc,'ratio':cc/bc,'delta_pct':100*(cc/bc-1)}}
          print(json.dumps(out,indent=2))
          if cs/bs <= .97 and cc/bc <= .97: print('DECISION=RETAIN_COMPILED_FORCE_FACT')
          elif cs/bs < 1 and cc/bc < 1: print('DECISION=POSITIVE_SMALL_COMPILED_FORCE_FACT')
          else: print('DECISION=KILL_FORCE_ONCE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-force-once-v10
          path: /tmp/result.txt
          if-no-files-found: warn
