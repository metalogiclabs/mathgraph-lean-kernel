name: msikernel access path grammar genesis v20

on:
  push:
    branches: [msikernel-access-path-grammar-genesis-v20]
  workflow_dispatch:

jobs:
  access-path-grammar-genesis-v20:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build dependency-complete discovery and prospective prefixes
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          for c in std cedar; do
            head -n 400000 _build/tests/$c.ndjson >/tmp/$c.train.ndjson
            head -n 600000 _build/tests/$c.ndjson >/tmp/$c.test.ndjson
            test "$(wc -l </tmp/$c.train.ndjson)" -eq 400000
            test "$(wc -l </tmp/$c.test.ndjson)" -eq 600000
          done
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
          cp ACCESS_PATH_GRAMMAR_GENESIS_V20.md /tmp/prereg.md

      - name: Collect selector-generator observations
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/probe
          python3 experiments/access_path_grammar_runtime_v20.py /tmp/probe probe | tee /tmp/runtime-probe.txt
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-probe RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/probe/Cargo.toml --release --locked"
          for c in std cedar; do /tmp/target-probe/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.probe.out 2>/tmp/$c.probe.log; done
          cd ..
          python3 - <<'PY'
          import re,csv
          hdr=['corpus','event_id','safe','p0','p1','p2','p3','empty','closed','canonical']; counts={0:0,1:0}; n=0
          with open('/tmp/v20_observations.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(hdr)
              for corpus in ('std','cedar'):
                  event=0
                  for line in open(f'/tmp/{corpus}.probe.log',errors='replace'):
                      m=re.search(r'APPGEN_V20 safe=([01]) p0=(\d+) p1=(\d+) p2=(\d+) p3=(\d+) spine_empty=([01]) closed=([01]) canonical=([01])',line)
                      if not m: continue
                      vals=list(map(int,m.groups())); w.writerow([corpus,event,*vals]); event+=1; n+=1; counts[vals[0]]+=1
          print(f'V20_PROBE_EVENTS={n} SAFE={counts[1]} UNSAFE={counts[0]}'); assert counts[1] and counts[0]
          PY

      - name: Grow path grammar and synthesize guard
        run: |
          set -euxo pipefail
          python3 experiments/access_path_grammar_genesis_v20.py /tmp/v20_observations.csv | tee /tmp/learn.txt
          grep -q 'V20_INITIAL_PATH_GRAMMAR_INSUFFICIENT=PASS' /tmp/learn.txt
          grep -q 'V20_UNIQUE_BEST_SELECTOR_EXTENSION_BEHAVIOURAL_CLASS=PASS' /tmp/learn.txt
          grep -q 'V20_EXACT_SELECTOR_PRODUCTION_ABLATION=PASS' /tmp/learn.txt
          grep -q 'V20_SEMANTIC_VARIANT_NAMES_EXPOSED_TO_LEARNER=NO' /tmp/runtime-probe.txt
          echo "FROZEN_V20_EXTENSION=$(cat /tmp/v20_extension.txt)" | tee /tmp/result.txt
          echo "FROZEN_V20_PATH=$(cat /tmp/v20_path.txt)" | tee -a /tmp/result.txt
          echo "FROZEN_V20_EXPR=$(cat /tmp/v20_expr.txt)" | tee -a /tmp/result.txt
          echo "FROZEN_V20_PREDICATE=$(cat /tmp/v20_predicate.txt)" | tee -a /tmp/result.txt
          cat /tmp/learn.txt >>/tmp/result.txt
          echo V20_NO_SEMANTIC_NAME_LEAKAGE=PASS | tee -a /tmp/result.txt

      - name: Compile reference, learned guard, broadening ablation
        run: |
          set -euxo pipefail
          for mode in g3 guard broad; do git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$mode; done
          EXPR="$(cat /tmp/v20_expr.txt)"; PRED="$(cat /tmp/v20_predicate.txt)"; BROAD="$(cat /tmp/v20_broad_predicate.txt)"
          python3 experiments/access_path_grammar_runtime_v20.py /tmp/g3 g3
          python3 experiments/access_path_grammar_runtime_v20.py /tmp/guard guard "$EXPR" "$PRED"
          python3 experiments/access_path_grammar_runtime_v20.py /tmp/broad broad "$EXPR" "$BROAD"
          cd arena
          for mode in g3 guard broad; do nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-$mode RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$mode/Cargo.toml --release --locked"; done

      - name: Exact discovery semantics and broadening ablation
        run: |
          set -euxo pipefail
          for c in std cedar; do
            /tmp/target-g3/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.g3.train.out
            /tmp/target-guard/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.guard.train.out
            cmp /tmp/$c.g3.train.out /tmp/$c.guard.train.out
            echo "${c^^}_V20_DISCOVERY_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
          done
          set +e
          /tmp/target-broad/release/sokonanoda /tmp/checker.json </tmp/std.train.ndjson >/tmp/std.broad.out 2>/tmp/std.broad.err; rs=$?
          /tmp/target-broad/release/sokonanoda /tmp/checker.json </tmp/cedar.train.ndjson >/tmp/cedar.broad.out 2>/tmp/cedar.broad.err; rc=$?
          set -e
          bad=0; if [ "$rs" -ne 0 ] || ! cmp -s /tmp/std.g3.train.out /tmp/std.broad.out; then bad=1; fi; if [ "$rc" -ne 0 ] || ! cmp -s /tmp/cedar.g3.train.out /tmp/cedar.broad.out; then bad=1; fi
          test "$bad" -eq 1
          echo V20_EXACT_GENERATED_BROADENING_ABLATION=PASS | tee -a /tmp/result.txt

      - name: Prospective transfer on untouched rows 400001 through 600000
        run: |
          set -euxo pipefail
          for c in std cedar; do
            /tmp/target-g3/release/sokonanoda /tmp/checker.json </tmp/$c.test.ndjson >/tmp/$c.g3.test.out
            /tmp/target-guard/release/sokonanoda /tmp/checker.json </tmp/$c.test.ndjson >/tmp/$c.guard.test.out
            cmp /tmp/$c.g3.test.out /tmp/$c.guard.test.out
            echo "${c^^}_V20_HELDOUT_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
          done
          echo V20_HELDOUT_ROWS=400001..600000 | tee -a /tmp/result.txt
          echo ACCESS_PATH_GRAMMAR_GENESIS_V20=BOUNDED_POSITIVE | tee -a /tmp/result.txt
          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msikernel-access-path-grammar-genesis-v20
          path: |
            /tmp/result.txt
            /tmp/prereg.md
            /tmp/learn.txt
            /tmp/runtime-probe.txt
            /tmp/v20_observations.csv
            /tmp/*broad.err
