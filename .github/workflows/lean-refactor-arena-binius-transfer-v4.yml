name: Lean Refactor Arena Binius source transfer v4
on:
  workflow_dispatch:
  push:
    branches: ['competition/lra-binius-source-transfer-v4']
    paths:
      - '.github/workflows/lean-refactor-arena-binius-transfer-v4.yml'
      - 'competitions/lean_refactor_arena/native_closure_discovery.py'
      - 'competitions/lean_refactor_arena/experiments/source_binius_transfer_v4.jsonl'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PUBLIC_REPO_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      BANK: competitions/lean_refactor_arena/experiments/source_binius_transfer_v4.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Lean context
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_REPO_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_REPO_SHA"
          mkdir -p /tmp/source-discovery
          (
            cd /tmp/lean-refactor/competition/projects/v4.31
            lake update
            lake exe cache get || echo CACHE_FALLBACK
            lake build ArkLib.ProofSystem.Binius.BinaryBasefold.Prelude
          ) > /tmp/source-discovery/targeted-build.log 2>&1
      - name: Measure every candidate and baseline with public harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-discovery
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          bank=os.environ['BANK'];out=pathlib.Path('/tmp/source-discovery/results.jsonl')
          with out.open('w') as f:
            for row in map(json.loads,pathlib.Path(bank).read_text().splitlines()):
              subprocess.run(['python3','competitions/lean_refactor_arena/public_harness_bridge.py',
                '--competition','/tmp/lean-refactor/competition','--project','v4.31','--name',row['name'],
                '--candidate',bank,'--label',row['label']],check=True)
              p=subprocess.run(['python3','arena.py','check','--name',row['name'],'--timeout','1800'],
                cwd='/tmp/lean-refactor/competition',text=True,capture_output=True)
              pathlib.Path('/tmp/source-discovery/'+row['label']+'_'+str(len(row['name']))+'.log').write_text(p.stdout+'\n'+p.stderr)
              result=json.loads(p.stdout)
              result.update(name=row['name'],candidate_label=row['label'],proof_sha256=__import__('hashlib').sha256(row['proof'].encode()).hexdigest(),operator=row['operator'],measurement_scope='primary_only',public_harness_sha=os.environ['PUBLIC_REPO_SHA'])
              f.write(json.dumps(result,ensure_ascii=False)+'\n');f.flush()
              if not result.get('compiled'):
                import re,sys
                sys.path.insert(0,'competitions/lean_refactor_arena')
                from native_diagnostic import capture
                slug=re.sub(r'[^A-Za-z0-9]+','_',row['name']).strip('_')
                diagnostic=capture(['lake','env','lean','Arena/'+slug+'.lean'],
                  '/tmp/lean-refactor/competition/projects/v4.31')
                pathlib.Path('/tmp/source-discovery/'+row['label']+'.lean.log').write_text(json.dumps(diagnostic,ensure_ascii=False))
              print(json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-binius-source-transfer-v4
          path: /tmp/source-discovery/
