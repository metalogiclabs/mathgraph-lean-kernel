name: MDA blind residual localization v4a

on:
  push:
    branches:
      - mda/blind-residual-localization-v4a
    paths:
      - 'mda/BLIND_RESIDUAL_LOCALIZATION_V4A.md'
      - 'experiments/run_mda_blind_residual_localization_v4a.sh'
      - '.github/workflows/mda-blind-residual-localization-v4a.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MDA_TEST_DIR: /tmp/mda-workload-ground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mda-workload-ground-v3
          path: /tmp/mda-workload-ground
          run-id: 34807040127
          github-token: ${{ github.token }}
      - name: Verify frozen encounter artifact
        run: |
          set -euo pipefail
          cd /tmp/mda-workload-ground
          sha256sum -c SHA256SUMS
          test "$(cat ARENA_SHA)" = "ac1c13762de41b594fa24b90ede8cfd97ac6a765"
      - name: Run blind residual localization
        run: bash experiments/run_mda_blind_residual_localization_v4a.sh
      - name: Upload localization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-blind-residual-localization-v4a
          path: /tmp/mda-v4a/evidence/
          if-no-files-found: error
