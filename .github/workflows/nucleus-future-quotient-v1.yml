name: Nucleus Future-Quotient V1 Qualification

on:
  push:
    branches:
      - nucleus-future-quotient-v1
    paths:
      - src/env.rs
      - src/eval.rs
      - src/flash.rs
      - src/relevance.rs
      - .github/workflows/nucleus-future-quotient-v1.yml
  workflow_dispatch:

concurrency:
  group: nucleus-future-quotient-v1
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Audit future-authority boundary
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "enum FutureAuthority" src/env.rs
          grep -q "Declar::Axiom { .. } | Declar::Theorem { .. } | Declar::Opaque { .. } => FutureAuthority::Opaque" src/env.rs
          grep -q "get_reducible_value" src/env.rs
          ! grep -q "get_declar_val" src/env.rs
          ! grep -q "THEOREM_AUTHORITY_NODES" src/eval.rs
          ! grep -q "THEOREM_AUTHORITY_NODES" src/flash.rs
          ! grep -R -q "get_declar_val" src
          echo FUTURE_AUTHORITY_BOUNDARY_AUDIT=PASS | tee /tmp/authority-audit.txt

      - name: Build V0 semantic source, exact base, and V1 candidate
        shell: bash
        run: |
          set -euxo pipefail
          BASE=78c7502bac8a5ba000057b3f083bc0595ac65750
          V0=a9a614f51742de111c9f3c913855e70ff5501a81
          CAND="$GITHUB_SHA"
          git worktree add --detach /tmp/base "$BASE"
          git worktree add --detach /tmp/v0 "$V0"
          git worktree add --detach /tmp/candidate "$CAND"
          for arm in base v0 candidate; do
            (cd /tmp/$arm && RUSTFLAGS='-C target-cpu=native' cargo build --release --locked)
            cp /tmp/$arm/target/release/sokonanoda /tmp/$arm.bin
          done
          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":2,"print_success_message":false}
          EOF
          sha256sum /tmp/base.bin /tmp/v0.bin /tmp/candidate.bin | tee /tmp/binaries.sha256
          printf 'base_source|%s\nv0_semantic_source|%s\ncandidate_source|%s\narena_source|%s\nthreads|2\narchitecture|future authority is the live environment boundary\n' \
            "$BASE" "$V0" "$CAND" "95496f5376b089dfd5889d88c73e390a9d98653d" | tee /tmp/provenance.txt

      - name: Build current official Arena corpus
        shell: bash
        timeout-minutes: 90
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 95496f5376b089dfd5889d88c73e390a9d98653d
          cd /tmp/arena
          : >/tmp/official-tests.txt
          while IFS= read -r y; do
            t=${y#tests/}
            t=${t%.yaml}
            nix develop -c ./lka.py build-test "$t" >/dev/null
            outcome=$(awk '/^outcome:/ {print $2; exit}' "$y")
            test -n "$outcome"
            f="_build/tests/$t.ndjson"
            test -s "$f"
            printf '%s|%s|%s\n' "$t" "$outcome" "$f" >>/tmp/official-tests.txt
          done < <(find tests -type f -name '*.yaml' | sort)
          count=$(wc -l </tmp/official-tests.txt)
          printf 'official_exports|%s\n' "$count" | tee /tmp/corpus.txt
          test -s _build/tests/mathlib.ndjson

      - name: V1 versus V0 semantic delta census
        shell: bash
        timeout-minutes: 55
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/v1-v0-matches.txt
          : >/tmp/v1-v0-deltas.txt
          while IFS='|' read -r t outcome f; do
            set +e
            /tmp/v0.bin /tmp/config.json <"$f" >/tmp/v0.out 2>/tmp/v0.err
            v0rc=$?
            /tmp/candidate.bin /tmp/config.json <"$f" >/tmp/candidate.out 2>/tmp/candidate.err
            candrc=$?
            set -e
            if [ "$v0rc" -eq "$candrc" ] && cmp -s /tmp/v0.out /tmp/candidate.out; then
              printf 'MATCH|%s|%s|%s\n' "$candrc" "$outcome" "$t" >>/tmp/v1-v0-matches.txt
            else
              printf 'DELTA|%s|v0=%s|v1=%s|%s\n' "$t" "$v0rc" "$candrc" "$outcome" | tee -a /tmp/v1-v0-deltas.txt
            fi
          done </tmp/official-tests.txt
          deltas=$(grep -c '^DELTA' /tmp/v1-v0-deltas.txt || true)
          matches=$(grep -c '^MATCH' /tmp/v1-v0-matches.txt || true)
          printf 'matches|%s\ndeltas|%s\n' "$matches" "$deltas" | tee /tmp/v1-v0-census.txt
          echo NUCLEUS_FUTURE_QUOTIENT_V1_V0_DELTA_CENSUS=PASS

      - name: Fixed-outcome correctness versus exact complete base
        shell: bash
        timeout-minutes: 55
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/base-matches.txt
          : >/tmp/allowed-deltas.txt
          : >/tmp/hard-mismatches.txt
          while IFS='|' read -r t outcome f; do
            set +e
            /tmp/base.bin /tmp/config.json <"$f" >/tmp/base.out 2>/tmp/base.err
            b=$?
            /tmp/candidate.bin /tmp/config.json <"$f" >/tmp/candidate.out 2>/tmp/candidate.err
            cand=$?
            set -e
            if [ "$b" -eq "$cand" ] && cmp -s /tmp/base.out /tmp/candidate.out; then
              printf 'MATCH|%s|%s|%s\n' "$cand" "$outcome" "$t" >>/tmp/base-matches.txt
            elif [ "$outcome" = "either" ]; then
              printf 'ALLOWED_DELTA|%s|base=%s|candidate=%s|%s\n' "$t" "$b" "$cand" "$outcome" | tee -a /tmp/allowed-deltas.txt
            else
              printf 'HARD_MISMATCH|%s|base=%s|candidate=%s|%s\n' "$t" "$b" "$cand" "$outcome" | tee -a /tmp/hard-mismatches.txt
            fi
          done </tmp/official-tests.txt
          hard=$(grep -c '^HARD_MISMATCH' /tmp/hard-mismatches.txt || true)
          allowed=$(grep -c '^ALLOWED_DELTA' /tmp/allowed-deltas.txt || true)
          matches=$(grep -c '^MATCH' /tmp/base-matches.txt || true)
          printf 'matches|%s\nallowed_deltas|%s\nhard_mismatches|%s\n' "$matches" "$allowed" "$hard" | tee /tmp/base-parity.txt
          test "$hard" -eq 0
          echo NUCLEUS_FUTURE_QUOTIENT_V1_ARENA_CORRECTNESS=PASS

      - name: Same-machine Mathlib cost duel
        shell: bash
        timeout-minutes: 45
        run: |
          set -euxo pipefail
          cd /tmp/arena
          f=_build/tests/mathlib.ndjson
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/tmp/perf-sysctl.txt 2>&1 || true
          run_one () {
            arm=$1
            rep=$2
            perf_file="/tmp/${arm}-${rep}.perf"
            time_file="/tmp/${arm}-${rep}.time"
            set +e
            perf stat -j -o "$perf_file" -e instructions:u -- \
              /usr/bin/time -f 'real_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M' -o "$time_file" \
              "/tmp/${arm}.bin" /tmp/config.json <"$f" >/tmp/${arm}-${rep}.out 2>/tmp/${arm}-${rep}.err
            rc=$?
            set -e
            test "$rc" -eq 0
          }
          run_one base 1
          run_one candidate 1
          run_one candidate 2
          run_one base 2
          python3 - <<'PY' | tee /tmp/mathlib-duel.json
          import json, statistics
          from pathlib import Path
          def read(arm, rep):
              instructions = 0
              p = Path(f"/tmp/{arm}-{rep}.perf")
              if p.exists():
                  for line in p.read_text(errors="replace").splitlines():
                      try: d = json.loads(line)
                      except Exception: continue
                      if str(d.get("event", "")).split(":")[0] == "instructions":
                          try: instructions = int(float(str(d.get("counter-value", "0")).replace(",", "")))
                          except Exception: pass
              t = {}
              for line in Path(f"/tmp/{arm}-{rep}.time").read_text().splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1); t[k] = float(v)
              return {"instructions": instructions, **t}
          data = {a: [read(a, 1), read(a, 2)] for a in ("base", "candidate")}
          for a in ("base", "candidate"):
              data[a + "_median_wall"] = statistics.median(x["real_seconds"] for x in data[a])
              nz = [x["instructions"] for x in data[a] if x["instructions"] > 0]
              data[a + "_median_instructions"] = statistics.median(nz) if nz else 0
          bi=data["base_median_instructions"]; ci=data["candidate_median_instructions"]
          data["candidate_over_base_instructions"]=(ci/bi) if bi and ci else None
          data["candidate_over_base_wall"]=data["candidate_median_wall"]/data["base_median_wall"]
          print(json.dumps(data,indent=2,sort_keys=True))
          PY

      - name: Summarize
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee /tmp/summary.txt
          import json
          from pathlib import Path
          v=dict(line.split("|",1) for line in Path("/tmp/v1-v0-census.txt").read_text().splitlines())
          b=dict(line.split("|",1) for line in Path("/tmp/base-parity.txt").read_text().splitlines())
          d=json.loads(Path("/tmp/mathlib-duel.json").read_text())
          print("NUCLEUS_FUTURE_QUOTIENT_V1=QUALIFIED")
          print(f"v1_v0_matches={v['matches']} v1_v0_deltas={v['deltas']}")
          print(f"base_matches={b['matches']} allowed_deltas={b['allowed_deltas']} hard_mismatches={b['hard_mismatches']}")
          print(f"mathlib_candidate_over_base_wall={d['candidate_over_base_wall']:.6f}")
          r=d["candidate_over_base_instructions"]
          print("mathlib_candidate_over_base_instructions=UNAVAILABLE" if r is None else f"mathlib_candidate_over_base_instructions={r:.6f}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-future-quotient-v1
          path: |
            /tmp/authority-audit.txt
            /tmp/provenance.txt
            /tmp/binaries.sha256
            /tmp/corpus.txt
            /tmp/official-tests.txt
            /tmp/v1-v0-matches.txt
            /tmp/v1-v0-deltas.txt
            /tmp/v1-v0-census.txt
            /tmp/base-matches.txt
            /tmp/allowed-deltas.txt
            /tmp/hard-mismatches.txt
            /tmp/base-parity.txt
            /tmp/mathlib-duel.json
            /tmp/summary.txt
            /tmp/perf-sysctl.txt
            /tmp/base-1.perf
            /tmp/base-2.perf
            /tmp/candidate-1.perf
            /tmp/candidate-2.perf
            /tmp/base-1.time
            /tmp/base-2.time
            /tmp/candidate-1.time
            /tmp/candidate-2.time
          if-no-files-found: warn
