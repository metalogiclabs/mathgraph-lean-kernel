name: Canonical env capacity separator

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/canonical-env-capacity.trigger'
      - '.github/workflows/canonical-env-capacity-separator.yml'
  workflow_dispatch:

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Create exact Arena config
        run: |
          cat >/tmp/checker.json <<'EOF'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4,
            "print_success_message": false
          }
          EOF

      - name: Build exact scored V2 cache-capacity arms with Arena PGO
        run: |
          set -euxo pipefail
          V2=3d7585c21242f29fdaa48ae9a16e16c6afe42238
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena
          cd /tmp/arena
          nix develop -c ./lka.py build-test init-prelude
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test mathlib
          PROFDATA=$(nix develop -c bash -lc 'command -v llvm-profdata')
          test -x "$PROFDATA"
          cd "$GITHUB_WORKSPACE"
          for spec in base:10 dm16k:14 dm64k:16 dm256k:18; do
            arm=${spec%%:*}; bits=${spec##*:}
            git worktree add "/tmp/$arm" "$V2"
            if [ "$arm" != base ]; then
              python3 - "$arm" "$bits" <<'PY'
          from pathlib import Path
          import sys
          arm,bits=sys.argv[1],int(sys.argv[2])
          p=Path('/tmp')/arm/'src/util.rs'
          s=p.read_text()
          old='pub(crate) const PRUNE_DM_LEN: usize = 1 << 10;\npub(crate) const PRUNE_DM_SHIFT: u32 = 64 - 10;'
          new=f'pub(crate) const PRUNE_DM_LEN: usize = 1 << {bits};\npub(crate) const PRUNE_DM_SHIFT: u32 = 64 - {bits};'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
            fi
            cd "/tmp/$arm"
            cargo test --release --locked
            rm -rf pgo target
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release --locked
            target/release/sokonanoda /tmp/checker.json < /tmp/arena/_build/tests/init-prelude.ndjson >/dev/null
            "$PROFDATA" merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
            cp target/release/sokonanoda "/tmp/$arm-checker"
          done
        env:
          RUST_BACKTRACE: '1'

      - name: Acceptance smoke on real workloads
        run: |
          set -euxo pipefail
          for t in std mathlib; do
            for arm in base dm16k dm64k dm256k; do
              timeout 600 "/tmp/$arm-checker" /tmp/checker.json < "/tmp/arena/_build/tests/$t.ndjson" >/tmp/${arm}-${t}.out 2>/tmp/${arm}-${t}.err
            done
          done

      - name: Hosted-runner wall A/B
        run: |
          set -euxo pipefail
          printf 'test,arm,rep,seconds\n' >/tmp/timings.csv
          for t in std mathlib; do
            file="/tmp/arena/_build/tests/$t.ndjson"
            for rep in 1 2 3; do
              case "$rep" in
                1) arms='base dm16k dm64k dm256k' ;;
                2) arms='dm256k dm64k dm16k base' ;;
                3) arms='dm16k base dm256k dm64k' ;;
              esac
              for arm in $arms; do
                /usr/bin/time -f '%e' -o /tmp/t timeout 600 "/tmp/$arm-checker" /tmp/checker.json < "$file" >/dev/null 2>/tmp/${t}-${arm}-${rep}.err
                printf '%s,%s,%s,%s\n' "$t" "$arm" "$rep" "$(cat /tmp/t)" >>/tmp/timings.csv
              done
            done
          done

      - name: Decide capacity versus structural miss
        run: |
          python3 - <<'PY' | tee /tmp/summary.txt
          import csv, statistics
          rows=list(csv.DictReader(open('/tmp/timings.csv')))
          def vals(t,a): return [float(r['seconds']) for r in rows if r['test']==t and r['arm']==a]
          def med(t,a): return statistics.median(vals(t,a))
          arms=['base','dm16k','dm64k','dm256k']
          for t in ['std','mathlib']:
              b=med(t,'base')
              print(t,'base',b,'samples=',vals(t,'base'))
              for a in arms[1:]:
                  x=med(t,a); q=x/b
                  print(t,a,x,f'ratio={q:.6f}',f'delta={(q-1)*100:+.3f}%','samples=',vals(t,a))
          best=min(arms,key=lambda a: med('mathlib',a))
          q=med('mathlib',best)/med('mathlib','base')
          # Wall time on hosted runners is noisier than PMU instructions. Only call a
          # capacity effect when the Mathlib median is large enough to dominate that noise.
          if best!='base' and q <= .90:
              d='CAPACITY_COLLISION_PHASE_CHANGE__PROMOTE_TO_ARENA_PMU'
          elif best!='base' and q <= .95:
              d='CAPACITY_MATTERS__VERIFY_ON_ARENA_PMU_OR_SELF_HOSTED_PERF'
          else:
              d='CAPACITY_FLAT__COLD_MISSES_ARE_STRUCTURAL__CARRY_CANONICAL_ENV_IDENTITY_FORWARD'
          print('BEST='+best)
          print('BEST_MATHLIB_RATIO=',f'{q:.6f}')
          print('DECISION='+d)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-env-capacity-separator
          path: |
            /tmp/timings.csv
            /tmp/summary.txt
            /tmp/*-mathlib.err
            /tmp/*-std.err
