name: V2 freeze Arena-native validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/v2-freeze.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Install Callgrind
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y valgrind >/dev/null

      - name: Materialize frozen V2 source revision
        run: |
          set -euxo pipefail
          V1=1e209dad266d59b4d43cdea189876bc6ea551339
          git worktree add /tmp/v2 "$V1"
          python3 scripts/apply_extra_rec_soundness.py /tmp/v2
          python3 scripts/apply_infer_beta_fusion.py /tmp/v2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v2/src/eval.rs')
          s=p.read_text()
          old_lam='''            Expr::Lambda { binder_name, binder_style, binder_type, body, .. } =>\n                {\n                let ce = self.key_env(env, e);\n                value::mk_lam(self.arena, binder_name, binder_style, binder_type, Closure::mk_eval(ce, body))\n            }'''
          new_lam='''            Expr::Lambda { binder_name, binder_style, binder_type, body, .. } =>\n                value::mk_lam(self.arena, binder_name, binder_style, binder_type, Closure::mk_eval(env, body)),'''
          old_pi='''                {\n                    let ce = self.key_env(env, e);\n                    value::mk_pi(self.arena, binder_name, binder_style, dom, Closure::mk_eval(ce, body))\n                }'''
          new_pi='''                value::mk_pi(self.arena, binder_name, binder_style, dom, Closure::mk_eval(env, body))'''
          assert old_lam in s and old_pi in s
          p.write_text(s.replace(old_lam,new_lam,1).replace(old_pi,new_pi,1))
          PY
          cd /tmp/v2
          cargo test --release --locked
          git config user.name 'Metalogic Labs'
          git config user.email 'actions@users.noreply.github.com'
          git add src/inductive.rs src/infer.rs src/eval.rs
          git commit -m 'V2: soundness repair and fused beta evaluation paths'
          echo "V2_SHA=$(git rev-parse HEAD)" | tee /tmp/v2-sha.txt >> "$GITHUB_ENV"
          git push --force origin HEAD:refs/heads/v2-arena-candidate

      - name: Fetch current Arena and build discriminator corpus
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena
          cd /tmp/arena
          git rev-parse HEAD | tee /tmp/arena-sha.txt
          for t in init-prelude perf/beta-ladder perf/app-lam perf/let-ladder perf/grind-ring-5; do
            nix develop -c ./lka.py build-test "$t"
          done

      - name: Build exact V1 and frozen V2 with current Arena PGO recipe
        run: |
          set -euxo pipefail
          V1=1e209dad266d59b4d43cdea189876bc6ea551339
          git worktree add /tmp/base "$V1"
          for arm in base v2; do
            cat >/tmp/$arm/config.json <<'EOF'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          EOF
            rm -rf /tmp/$arm/pgo
            mkdir -p /tmp/$arm/pgo
            cd /tmp/arena
            nix develop -c bash -lc "cd /tmp/$arm && RUSTFLAGS='-C target-cpu=native -Cprofile-generate=/tmp/$arm/pgo' cargo build --release"
            /tmp/$arm/target/release/sokonanoda /tmp/$arm/config.json < /tmp/arena/_build/tests/init-prelude.ndjson >/dev/null
            nix develop -c bash -lc "llvm-profdata merge -o /tmp/$arm/pgo/merged.profdata /tmp/$arm/pgo"
            nix develop -c bash -lc "cd /tmp/$arm && RUSTFLAGS='-C target-cpu=native -Cprofile-use=/tmp/$arm/pgo/merged.profdata' cargo build --release"
          done

      - name: Semantic equality and PGO Callgrind A/B
        run: |
          set -euxo pipefail
          : >/tmp/results.tsv
          cd /tmp/arena
          for t in perf/beta-ladder perf/app-lam perf/let-ladder perf/grind-ring-5; do
            f="_build/tests/${t}.ndjson"
            slug="${t#perf/}"
            /tmp/base/target/release/sokonanoda /tmp/base/config.json < "$f" >/tmp/base-$slug.out 2>/tmp/base-$slug.err
            /tmp/v2/target/release/sokonanoda /tmp/v2/config.json < "$f" >/tmp/v2-$slug.out 2>/tmp/v2-$slug.err
            cmp /tmp/base-$slug.out /tmp/v2-$slug.out
            for arm in base v2; do
              timeout 900 valgrind --tool=callgrind --callgrind-out-file=/tmp/$arm-$slug.cg /tmp/$arm/target/release/sokonanoda /tmp/$arm/config.json < "$f" >/dev/null 2>/tmp/$arm-$slug.cg.err
              ir=$(awk '/^summary:/ {print $2}' /tmp/$arm-$slug.cg)
              test -n "$ir"
              printf '%s\t%s\t%s\n' "$slug" "$arm" "$ir" | tee -a /tmp/results.tsv
            done
          done

      - name: Frozen promotion decision
        run: |
          python3 - <<'PY' | tee /tmp/decision.txt
          from pathlib import Path
          rows={}
          for line in Path('/tmp/results.tsv').read_text().splitlines():
              test,arm,ir=line.split('\t')
              rows.setdefault(test,{})[arm]=int(ir)
          d={}
          for test,v in rows.items():
              q=(v['v2']-v['base'])/v['base']
              d[test]=q
              print(f'{test}: base={v["base"]} v2={v["v2"]} delta={q:+.4%}')
          beta=d['beta-ladder']
          controls=max(d['app-lam'],d['let-ladder'],d['grind-ring-5'])
          if beta <= -0.20 and controls <= 0.01:
              verdict='V2_ARENA_NATIVE_PASS__READY_FOR_DRAFT_SUBMISSION'
          else:
              verdict='V2_ARENA_NATIVE_HOLD__INVESTIGATE'
          print('DECISION='+verdict)
          print('V2_SHA='+Path('/tmp/v2-sha.txt').read_text().strip().split('=',1)[1])
          print('ARENA_SHA='+Path('/tmp/arena-sha.txt').read_text().strip())
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-freeze-arena-native
          path: |
            /tmp/results.tsv
            /tmp/decision.txt
            /tmp/v2-sha.txt
            /tmp/arena-sha.txt
            /tmp/*.cg.err
