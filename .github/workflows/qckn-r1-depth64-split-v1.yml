name: QCKN R1 depth64 split v1

on:
  push:
    branches:
      - qckn-r1-depth64-split-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run depth split test
        run: cargo test --locked qckn_depth_split_tests -- --nocapture
