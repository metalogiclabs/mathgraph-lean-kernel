name: MSI non-thunk fast-path transfer v24
on:
  push:
    branches: [msi-nonthunk-transfer-v24]
  workflow_dispatch:

jobs:
  corpus-transfer:
    strategy:
      fail-fast: false
      matrix:
        corpus: [std, cedar, mathlib]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Install Valgrind
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Prepare corpus and both checkers
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test ${{ matrix.corpus }}
          test -s _build/tests/${{ matrix.corpus }}.ndjson
          wc -l _build/tests/${{ matrix.corpus }}.ndjson | tee /tmp/corpus-info.txt
          du -h _build/tests/${{ matrix.corpus }}.ndjson | tee -a /tmp/corpus-info.txt
          head -n 1000000 _build/tests/${{ matrix.corpus }}.ndjson > /tmp/prefix.ndjson
          cd ..

          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          cp -a /tmp/base /tmp/cand
          cp experiments/apply_msi_nonthunk_transfer_v24.py /tmp/cand/patch.py
          (cd /tmp/cand && python3 patch.py)

          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/base-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/base/Cargo.toml --release --locked"
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/cand-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/cand/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Full native A/B and prefix Callgrind
        shell: bash
        run: |
          set -euxo pipefail
          corpus='${{ matrix.corpus }}'
          input="arena/_build/tests/${corpus}.ndjson"
          : >/tmp/result.txt
          cat /tmp/corpus-info.txt >>/tmp/result.txt

          for i in 1 2 3; do
            /usr/bin/time -f "BASE_FULL_${i}=%e RSS=%M" /tmp/base-target/release/sokonanoda /tmp/checker.json < "$input" > /tmp/base-${i}.out 2>>/tmp/result.txt
            /usr/bin/time -f "CAND_FULL_${i}=%e RSS=%M" /tmp/cand-target/release/sokonanoda /tmp/checker.json < "$input" > /tmp/cand-${i}.out 2>>/tmp/result.txt
            cmp /tmp/base-${i}.out /tmp/cand-${i}.out
          done

          valgrind --tool=callgrind --callgrind-out-file=/tmp/base.cg /tmp/base-target/release/sokonanoda /tmp/checker.json < /tmp/prefix.ndjson >/tmp/base-cg.out 2>/tmp/base-cg.err
          valgrind --tool=callgrind --callgrind-out-file=/tmp/cand.cg /tmp/cand-target/release/sokonanoda /tmp/checker.json < /tmp/prefix.ndjson >/tmp/cand-cg.out 2>/tmp/cand-cg.err
          cmp /tmp/base-cg.out /tmp/cand-cg.out
          grep 'Collected' /tmp/base-cg.err | tail -1 | sed 's/^/BASE_/' | tee -a /tmp/result.txt
          grep 'Collected' /tmp/cand-cg.err | tail -1 | sed 's/^/CAND_/' | tee -a /tmp/result.txt

          python3 - <<'PY' | tee -a /tmp/result.txt
          import re, statistics
          s=open('/tmp/result.txt').read()
          b=[float(x) for x in re.findall(r'BASE_FULL_\d+=([0-9.]+)',s)]
          c=[float(x) for x in re.findall(r'CAND_FULL_\d+=([0-9.]+)',s)]
          nums=[int(x.replace(',','')) for x in re.findall(r'Collected\s*:\s*([0-9,]+)',s)]
          bm=statistics.mean(b); cm=statistics.mean(c)
          print(f'BASE_FULL_MEAN={bm:.6f}')
          print(f'CAND_FULL_MEAN={cm:.6f}')
          print(f'FULL_NATIVE_DELTA_PCT={100*(cm-bm)/bm:.6f}')
          assert len(nums)>=2
          bi,ci=nums[-2],nums[-1]
          print(f'BASE_PREFIX_INSTR={bi}')
          print(f'CAND_PREFIX_INSTR={ci}')
          print(f'PREFIX_INSTR_DELTA_PCT={100*(ci-bi)/bi:.6f}')
          print('TRANSFER=' + ('POSITIVE' if ci < bi else 'NEGATIVE'))
          PY
          cat /tmp/result.txt
      - name: Upload corpus result
        uses: actions/upload-artifact@v4
        with:
          name: msi-nonthunk-transfer-v24-${{ matrix.corpus }}
          path: |
            /tmp/result.txt
            /tmp/base-cg.err
            /tmp/cand-cg.err

  tutorial-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build tutorial and checkers
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test tutorial
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          cp -a /tmp/base /tmp/cand
          cp experiments/apply_msi_nonthunk_transfer_v24.py /tmp/cand/patch.py
          (cd /tmp/cand && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/base-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/base/Cargo.toml --release --locked"
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/cand-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/cand/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Exact tutorial differential
        shell: bash
        run: |
          set -uo pipefail
          : >/tmp/tutorial-result.txt
          total=0
          mismatches=0
          while IFS= read -r f; do
            total=$((total+1))
            /tmp/base-target/release/sokonanoda /tmp/checker.json < "$f" >/tmp/b.out 2>/tmp/b.err
            brc=$?
            /tmp/cand-target/release/sokonanoda /tmp/checker.json < "$f" >/tmp/c.out 2>/tmp/c.err
            crc=$?
            if [ "$brc" -ne "$crc" ] || ! cmp -s /tmp/b.out /tmp/c.out; then
              echo "MISMATCH file=$f base_rc=$brc cand_rc=$crc" | tee -a /tmp/tutorial-result.txt
              mismatches=$((mismatches+1))
            fi
          done < <(find arena/_build/tests -path '*tutorial*' -name '*.ndjson' -type f | sort)
          echo "TUTORIAL_TOTAL=$total" | tee -a /tmp/tutorial-result.txt
          echo "TUTORIAL_MISMATCHES=$mismatches" | tee -a /tmp/tutorial-result.txt
          test "$total" -ge 100
          test "$mismatches" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: msi-nonthunk-transfer-v24-tutorial
          path: /tmp/tutorial-result.txt
