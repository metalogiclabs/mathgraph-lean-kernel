name: msikernel measurement action genesis v25
on:
  push:
    branches: [msikernel-measurement-action-genesis-v25]
  workflow_dispatch:
jobs:
  measurement-action-genesis-v25:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build dependency-complete discovery and prospective prefixes
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          for c in std cedar; do
            head -n 400000 _build/tests/$c.ndjson >/tmp/$c.train.ndjson
            head -n 600000 _build/tests/$c.ndjson >/tmp/$c.test.ndjson
            test "$(wc -l </tmp/$c.train.ndjson)" -eq 400000
            test "$(wc -l </tmp/$c.test.ndjson)" -eq 600000
          done
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
          cp MEASUREMENT_ACTION_GENESIS_V25.md /tmp/prereg.md
      - name: Collect anonymous intervention outcomes
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/probe
          python3 experiments/measurement_action_runtime_v25.py /tmp/probe probe | tee /tmp/runtime-probe.txt
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-probe RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/probe/Cargo.toml --release --locked"
          for c in std cedar; do /tmp/target-probe/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.probe.out 2>/tmp/$c.probe.log; done
          cd ..
          python3 - <<'PY'
          import re,csv
          hdr=['corpus','event_id','safe','p0','p1','p2','p3','empty','closed','canonical'];counts={0:0,1:0};n=0
          with open('/tmp/v25_observations.csv','w',newline='') as f:
            w=csv.writer(f);w.writerow(hdr)
            for corpus in ('std','cedar'):
              event=0
              for line in open(f'/tmp/{corpus}.probe.log',errors='replace'):
                m=re.search(r'APPGEN_V25 safe=([01]) p0=(\d+) q0=(\d+) q1=(\d+) p3=(\d+) spine_empty=([01]) closed=([01]) canonical=([01])',line)
                if not m:continue
                vals=list(map(int,m.groups()));w.writerow([corpus,event,*vals]);event+=1;n+=1;counts[vals[0]]+=1
          print(f'V25_PROBE_EVENTS={n} SAFE={counts[1]} UNSAFE={counts[0]}');assert counts[1] and counts[0]
          PY
      - name: Synthesize measurement action and guard
        run: |
          set -euxo pipefail
          python3 experiments/measurement_action_genesis_v25.py /tmp/v25_observations.csv | tee /tmp/learn.txt
          grep -q 'V25_INITIAL_MEASUREMENT_LANGUAGE_INSUFFICIENT=PASS' /tmp/learn.txt
          grep -q 'V25_UNIQUE_BEST_MEASUREMENT_ACTION_BEHAVIOURAL_CLASS=PASS' /tmp/learn.txt
          grep -q 'V25_EXACT_MEASUREMENT_ACTION_ABLATION=PASS' /tmp/learn.txt
          grep -q 'V25_NO_PASSIVE_TRAVERSAL_OR_DECOMPOSITION_LANGUAGE_EXPOSED=PASS' /tmp/learn.txt
          grep -q 'V25_PASSIVE_TOUCH_SENSE_MICROMACHINE_EXPOSED=NO' /tmp/runtime-probe.txt
          grep -q 'V25_NAMED_TRAVERSAL_PRIMITIVES_EXPOSED=NO' /tmp/runtime-probe.txt
          grep -q 'V25_COMBINED_DECOMPOSE_OPERATOR_EXPOSED=NO' /tmp/runtime-probe.txt
          grep -q 'V25_CELL_SEQUENCE_EXPOSED=NO' /tmp/runtime-probe.txt
          grep -q 'V25_SLOT_FAMILY_EXPOSED=NO' /tmp/runtime-probe.txt
          grep -q 'V25_SEMANTIC_NAMES_EXPOSED=NO' /tmp/runtime-probe.txt
          echo "FROZEN_V25_ACTION=$(cat /tmp/v25_action.txt)" | tee /tmp/result.txt
          echo "FROZEN_V25_SOURCE=$(cat /tmp/v25_source.txt)" | tee -a /tmp/result.txt
          echo "FROZEN_V25_EXPR=$(cat /tmp/v25_expr.txt)" | tee -a /tmp/result.txt
          echo "FROZEN_V25_PREDICATE=$(cat /tmp/v25_predicate.txt)" | tee -a /tmp/result.txt
          cat /tmp/learn.txt >>/tmp/result.txt
      - name: Compile reference learned guard and broadening ablation
        run: |
          set -euxo pipefail
          for mode in g3 guard broad; do git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$mode; done
          EXPR="$(cat /tmp/v25_expr.txt)";PRED="$(cat /tmp/v25_predicate.txt)";BROAD="$(cat /tmp/v25_broad_predicate.txt)"
          python3 experiments/measurement_action_runtime_v25.py /tmp/g3 g3
          python3 experiments/measurement_action_runtime_v25.py /tmp/guard guard "$EXPR" "$PRED"
          python3 experiments/measurement_action_runtime_v25.py /tmp/broad broad "$EXPR" "$BROAD"
          cd arena
          for mode in g3 guard broad; do nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-$mode RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$mode/Cargo.toml --release --locked"; done
      - name: Exact discovery semantics and broadening ablation
        run: |
          set -euxo pipefail
          for c in std cedar; do
            /tmp/target-g3/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.g3.train.out
            /tmp/target-guard/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.guard.train.out
            cmp /tmp/$c.g3.train.out /tmp/$c.guard.train.out
            echo "${c^^}_V25_DISCOVERY_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
          done
          set +e
          /tmp/target-broad/release/sokonanoda /tmp/checker.json </tmp/std.train.ndjson >/tmp/std.broad.out 2>/tmp/std.broad.err;rs=$?
          /tmp/target-broad/release/sokonanoda /tmp/checker.json </tmp/cedar.train.ndjson >/tmp/cedar.broad.out 2>/tmp/cedar.broad.err;rc=$?
          set -e
          bad=0
          if [ "$rs" -ne 0 ] || ! cmp -s /tmp/std.g3.train.out /tmp/std.broad.out; then bad=1; fi
          if [ "$rc" -ne 0 ] || ! cmp -s /tmp/cedar.g3.train.out /tmp/cedar.broad.out; then bad=1; fi
          test "$bad" -eq 1
          echo V25_EXACT_GENERATED_BROADENING_ABLATION=PASS | tee -a /tmp/result.txt
      - name: Prospective transfer on untouched rows 400001 through 600000
        run: |
          set -euxo pipefail
          for c in std cedar; do
            /tmp/target-g3/release/sokonanoda /tmp/checker.json </tmp/$c.test.ndjson >/tmp/$c.g3.test.out
            /tmp/target-guard/release/sokonanoda /tmp/checker.json </tmp/$c.test.ndjson >/tmp/$c.guard.test.out
            cmp /tmp/$c.g3.test.out /tmp/$c.guard.test.out
            echo "${c^^}_V25_HELDOUT_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
          done
          echo V25_HELDOUT_ROWS=400001..600000 | tee -a /tmp/result.txt
          echo MEASUREMENT_ACTION_GENESIS_V25=BOUNDED_POSITIVE | tee -a /tmp/result.txt
          cat /tmp/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msikernel-measurement-action-genesis-v25
          path: |
            /tmp/result.txt
            /tmp/prereg.md
            /tmp/learn.txt
            /tmp/runtime-probe.txt
            /tmp/v25_observations.csv
            /tmp/*broad.err
