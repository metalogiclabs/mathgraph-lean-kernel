name: V6 producer-consumer env fusion jump

on:
  push:
    branches: [experiment/v6-producer-consumer-env-fusion]
    paths:
      - '.github/workflows/v6-producer-consumer-env-fusion.yml'
      - '.github/scripts/v6_env_fusion_patch.py'
      - '.github/scripts/v6_env_fusion_decide.py'
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Build exact V2 causal arms
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          V2=3d7585c21242f29fdaa48ae9a16e16c6afe42238
          for arm in base ablate fusion; do
            git worktree add "/tmp/v6-$arm" "$V2"
            if [ "$arm" != base ]; then
              python3 "$ROOT/.github/scripts/v6_env_fusion_patch.py" "/tmp/v6-$arm" "$arm"
            fi
            cd "/tmp/v6-$arm"
            cargo test --locked
            CARGO_TARGET_DIR="/tmp/v6-$arm-target" RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked
            cp "/tmp/v6-$arm-target/release/sokonanoda" "/tmp/v6-$arm-bin"
          done
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' > /tmp/checker.json
      - name: Build Arena workloads
        run: |
          set -euxo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena /tmp/v6-arena
          cd /tmp/v6-arena
          git checkout f0fe3b379dbce91537417b529140d0ca250f271c
          for T in perf/app-lam perf/beta-ladder perf/let-ladder perf/grind-ring-5 std; do
            nix develop -c ./lka.py build-test "$T"
          done
      - name: Exact semantic equality gate
        run: |
          set -euxo pipefail
          cd /tmp/v6-arena
          for T in app-lam beta-ladder let-ladder grind-ring-5 std; do
            if [ "$T" = std ]; then F="_build/tests/std.ndjson"; else F="_build/tests/perf/$T.ndjson"; fi
            /tmp/v6-base-bin /tmp/checker.json < "$F" > "/tmp/v6-base-$T.out" 2> "/tmp/v6-base-$T.err"
            for arm in ablate fusion; do
              "/tmp/v6-$arm-bin" /tmp/checker.json < "$F" > "/tmp/v6-$arm-$T.out" 2> "/tmp/v6-$arm-$T.err"
              cmp "/tmp/v6-base-$T.out" "/tmp/v6-$arm-$T.out"
            done
          done
      - name: Deterministic Callgrind jump separator
        run: |
          set -euxo pipefail
          cd /tmp/v6-arena
          printf 'test,arm,instructions\n' > /tmp/v6-callgrind.csv
          nix shell github:NixOS/nixpkgs/0ad6f47ea4fe188f4bc8f0380f93ae8523337c6c#valgrind -c bash -lc '
            set -euo pipefail
            for T in app-lam beta-ladder let-ladder grind-ring-5 std; do
              if [ "$T" = std ]; then F="_build/tests/std.ndjson"; else F="_build/tests/perf/$T.ndjson"; fi
              for arm in base ablate fusion; do
                cf="/tmp/v6-$T-$arm.cg"
                valgrind --tool=callgrind --callgrind-out-file="$cf" "/tmp/v6-$arm-bin" /tmp/checker.json < "$F" >/dev/null 2>"/tmp/v6-$T-$arm.vg"
                ir=$(awk "/^summary:/ {print \$2; exit}" "$cf")
                test -n "$ir"
                printf "%s,%s,%s\n" "$T" "$arm" "$ir" >> /tmp/v6-callgrind.csv
              done
            done
          '
          python3 "$GITHUB_WORKSPACE/.github/scripts/v6_env_fusion_decide.py" | tee /tmp/v6-decision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v6-producer-consumer-env-fusion
          path: |
            /tmp/v6-callgrind.csv
            /tmp/v6-decision.txt
            /tmp/v6-*.cg
            /tmp/v6-*.vg
            /tmp/v6-*.err
