name: key_env residual proposal portfolio v16

on:
  push:
    branches: [experiment/key-env-proposal-portfolio-v16]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_key_env_proposal_portfolio_v16.sh'
      - 'experiments/key_env_proposal_portfolio_v16.json'
      - 'experiments/key-env-proposal-portfolio-v16.trigger'
  workflow_dispatch:

jobs:
  proposal_portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute subset-conditioned proposal portfolio
        shell: bash
        run: bash experiments/run_key_env_proposal_portfolio_v16.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: key-env-proposal-portfolio-v16
          path: |
            /tmp/v16-census.json
            /tmp/v16-generation.json
            /tmp/v16-decision.txt
