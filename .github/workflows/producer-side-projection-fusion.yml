name: Pi plus v18 compound Cedar v19

on:
  push:
    branches: [experiment/pi-v18-compound-cedar-v19]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_pi_v18_compound_cedar_v19.sh'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute v19 compound Cedar gate
        shell: bash
        run: bash experiments/run_pi_v18_compound_cedar_v19.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-v18-compound-cedar-v19
          path: |
            /tmp/v19-semantic.txt
            /tmp/v19-callgrind.csv
            /tmp/v19-decision.txt
            /tmp/v19-generation.json
            /tmp/v19-*.err
