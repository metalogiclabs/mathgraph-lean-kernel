name: Arena Mathlib wall-time incumbent v28

on:
  push:
    branches: [experiment/arena-walltime-incumbent-v28]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_arena_walltime_incumbent_v28.sh'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute v28 Arena Mathlib wall-time tournament
        shell: bash
        run: bash experiments/run_arena_walltime_incumbent_v28.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-walltime-incumbent-v28
          path: |
            /tmp/v28-provenance.txt
            /tmp/v28-semantic.txt
            /tmp/v28-decision.txt
            /tmp/v28-base-*.time
            /tmp/v28-inc-*.time
            /tmp/v28-base-*.err
            /tmp/v28-inc-*.err
