name: Sparse open eval demand key v25

on:
  push:
    branches: [experiment/sparse-open-eval-demand-key-v25]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_sparse_open_eval_demand_key_v25.sh'
      - 'experiments/apply_sparse_open_eval_demand_key_v25.py'
      - 'experiments/run_post_compound_self_cost_atlas_v21.sh'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute v25 sparse open eval demand key tournament
        shell: bash
        run: bash experiments/run_sparse_open_eval_demand_key_v25.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparse-open-eval-demand-key-v25
          path: |
            /tmp/v25-semantic.txt
            /tmp/v25-decision.txt
            /tmp/v25-self.txt
            /tmp/v25.vg
            /tmp/v25.err
            /tmp/v21-self-hotspots.txt
