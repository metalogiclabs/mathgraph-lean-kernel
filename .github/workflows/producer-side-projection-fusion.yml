name: dominant recursor prefix causal separator v15

on:
  push:
    branches: [experiment/recursor-prefix-causal-v15]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_recursor_prefix_causal_v15.sh'
      - 'experiments/recursor-prefix-causal-v15.trigger'
  workflow_dispatch:

jobs:
  prefix_causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute dominant recursor prefix causal separator
        shell: bash
        run: bash experiments/run_recursor_prefix_causal_v15.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recursor-prefix-causal-v15
          path: |
            /tmp/v15-census.json
            /tmp/v15-residual.json
            /tmp/v15-decision.txt
            /tmp/v15-prefix-cost.txt
            /tmp/v15-callgrind.txt
# v15 corrected reporter path trigger
