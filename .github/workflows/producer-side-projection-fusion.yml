name: Framed two-slot prune v24

on:
  push:
    branches: [experiment/framed-two-slot-prune-v24]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_framed_two_slot_prune_v24.sh'
      - 'experiments/apply_framed_two_slot_prune_v24.py'
      - 'experiments/run_post_compound_self_cost_atlas_v21.sh'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute v24 framed two-slot materialized prune tournament
        shell: bash
        run: bash experiments/run_framed_two_slot_prune_v24.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framed-two-slot-prune-v24
          path: |
            /tmp/v24-semantic.txt
            /tmp/v24-decision.txt
            /tmp/v24-self.txt
            /tmp/v24.vg
            /tmp/v24.err
            /tmp/v21-self-hotspots.txt
