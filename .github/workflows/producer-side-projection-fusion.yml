name: recursor fire phase cost separator v14

on:
  push:
    branches: [experiment/recursor-fire-phase-cost-v14]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_recursor_fire_phase_cost_v14.sh'
  workflow_dispatch:

jobs:
  phase_cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute recursor fire phase cost separator
        shell: bash
        run: bash experiments/run_recursor_fire_phase_cost_v14.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recursor-fire-phase-cost-v14
          path: |
            /tmp/v14-phase-cost.json
            /tmp/v14-residual.json
            /tmp/v14-decision.txt
            /tmp/v14-callgrind.txt
