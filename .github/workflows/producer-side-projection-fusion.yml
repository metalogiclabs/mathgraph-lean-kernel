name: Post-compound self-cost atlas v21

on:
  push:
    branches: [experiment/post-compound-self-cost-atlas-v21]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_post_compound_self_cost_atlas_v21.sh'
  workflow_dispatch:

jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute v21 exclusive self-cost atlas
        shell: bash
        run: bash experiments/run_post_compound_self_cost_atlas_v21.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-compound-self-cost-atlas-v21
          path: |
            /tmp/v21-semantic.txt
            /tmp/v21-self-hotspots.txt
            /tmp/v21-decision.txt
            /tmp/v21-compound.vg
