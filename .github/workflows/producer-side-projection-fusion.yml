name: Lazy framed subprojection v23

on:
  push:
    branches: [experiment/lazy-framed-subprojection-v23]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_lazy_framed_subprojection_v23.sh'
      - 'experiments/apply_lazy_framed_subprojection_v23.py'
      - 'experiments/run_post_compound_self_cost_atlas_v21.sh'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute v23 lazy subprojection tournament
        shell: bash
        run: bash experiments/run_lazy_framed_subprojection_v23.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazy-framed-subprojection-v23
          path: |
            /tmp/v23-semantic.txt
            /tmp/v23-decision.txt
            /tmp/v23-self.txt
            /tmp/v23.vg
            /tmp/v23.err
            /tmp/v21-self-hotspots.txt
