name: var-terminal prefix bypass v17

on:
  push:
    branches: [experiment/var-terminal-prefix-bypass-v17]
    paths:
      - '.github/workflows/producer-side-projection-fusion.yml'
      - 'experiments/run_var_terminal_prefix_bypass_v17.sh'
      - 'experiments/var-terminal-prefix-bypass-v17.trigger'
  workflow_dispatch:

jobs:
  challenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute v17 exact semantic and Callgrind challenger
        shell: bash
        run: bash experiments/run_var_terminal_prefix_bypass_v17.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: var-terminal-prefix-bypass-v17
          path: |
            /tmp/v17-semantic.txt
            /tmp/v17-callgrind.csv
            /tmp/v17-decision.txt
            /tmp/v17-generation.json
            /tmp/v17-*.err
