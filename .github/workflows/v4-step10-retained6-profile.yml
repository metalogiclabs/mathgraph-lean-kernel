name: V4 Step10 Retained6 Profile

on:
  push:
    branches: [mathgraph-v4-bvdecide-residual]
    paths: ['.github/workflows/v4-step10-retained6-profile.yml']
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build Arena corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test init-prelude
          nix develop -c ./lka.py build-test std
      - name: Materialize retained6
        run: |
          set -euxo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/retained6
          git -C /tmp/retained6 checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/5a1485ae13a0623ca8b7001aee9e0e155381daad/experiments/apply_v4_retained6.py -o /tmp/apply.py
          python3 /tmp/apply.py /tmp/retained6
          cd /tmp/retained6
          echo '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' > config.json
      - name: Build retained6 with identical PGO
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/arena"
          cd /tmp/retained6
          RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-generate=$PWD/pgo" cargo build --release --locked
          target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
          nix shell nixpkgs#llvm -c llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
          rm -rf target
          RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
      - name: Profile Std retained6
        run: |
          set -euxo pipefail
          cd arena
          nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/retained6.callgrind /tmp/retained6/target/release/sokonanoda /tmp/retained6/config.json < _build/tests/std.ndjson >/dev/null
          nix shell nixpkgs#valgrind -c callgrind_annotate --inclusive=yes --threshold=0.05 /tmp/retained6.callgrind > /tmp/annotate.txt
          grep '^summary:' /tmp/retained6.callgrind | tee /tmp/summary.txt
          echo '===== TOP PROFILE ====='
          head -n 180 /tmp/annotate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v4-step10-retained6-profile
          path: |
            /tmp/retained6.callgrind
            /tmp/annotate.txt
            /tmp/summary.txt
