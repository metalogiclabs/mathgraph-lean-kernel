name: Bounded sparse relevance v105

on:
  push:
    branches:
      - experiment/bounded-sparse-v105
    paths:
      - 'scripts/apply_bounded_sparse_v105.py'
      - 'experiments/run_bounded_sparse_v105.sh'
      - '.github/workflows/bounded-sparse-v105.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run bounded sparse qualification
        run: bash experiments/run_bounded_sparse_v105.sh
      - name: Preserve v105 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-sparse-v105
          path: |
            /tmp/bounded-sparse-v105/results.tsv
            /tmp/bounded-sparse-v105/out/
            /tmp/bounded-sparse-v105/perf-probe.csv
          if-no-files-found: warn
