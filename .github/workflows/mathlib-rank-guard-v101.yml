name: Mathlib rank guard v101\non:\n  workflow_dispatch:\n  push:\n    paths:\n      - 'experiments/run_mathlib_rank_guard_v101.sh'\n      - '.github/workflows/mathlib-rank-guard-v101.yml'\npermissions:\n  contents: read\njobs:\n  rank-guard:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 180\n    steps:\n      - uses: actions/checkout@v4\n      - uses: cachix/install-nix-action@v31\n      - name: Compare baseline and dulce-de-leche on mathlib\n        run: bash experiments/run_mathlib_rank_guard_v101.sh\n      - name: Preserve rank evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: mathlib-rank-guard-v101\n          path: /tmp/v101-mathlib/out/\n          if-no-files-found: warn\n