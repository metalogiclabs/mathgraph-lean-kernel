name: MSI Kernel Support Conditioned V15

on:
  push:
    branches: [msikernel-support-conditioned-v15]
    paths:
      - 'experiments/support_conditioned_v15.py'
      - '.github/workflows/msikernel-support-conditioned-v15.yml'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build frozen corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 100000 _build/tests/std.ndjson >/tmp/std.ndjson
          head -n 100000 _build/tests/cedar.ndjson >/tmp/cedar.ndjson
          cd ..
          echo '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' >/tmp/checker.json
      - name: Generate states
        run: |
          set -euxo pipefail
          for state in pre post; do
            for support in 0 1 2; do
              git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base-$state-$support
              python3 experiments/support_conditioned_v15.py /tmp/base-$state-$support --state $state --support $support | tee /tmp/base-$state-$support.genesis
              for target in 0 1; do
                git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$state-$support-$target
                python3 experiments/support_conditioned_v15.py /tmp/$state-$support-$target --state $state --support $support --target $target | tee /tmp/$state-$support-$target.genesis
              done
            done
          done
      - name: Build all
        run: |
          set -euxo pipefail
          cd arena; : >/tmp/build.txt
          for state in pre post; do for support in 0 1 2; do
            nix develop -c bash -c "CARGO_TARGET_DIR=/tmp/t-base-$state-$support RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/base-$state-$support/Cargo.toml --release --locked"
            for target in 0 1; do
              if nix develop -c bash -c "CARGO_TARGET_DIR=/tmp/t-$state-$support-$target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$state-$support-$target/Cargo.toml --release --locked"; then echo ${state}_${support}_${target}_BUILD=PASS | tee -a /tmp/build.txt; else echo ${state}_${support}_${target}_BUILD=FAIL | tee -a /tmp/build.txt; fi
            done
          done; done
      - name: Exact semantics
        run: |
          set -euxo pipefail
          : >/tmp/sem.txt
          for state in pre post; do for support in 0 1 2; do
            for corpus in std cedar; do /tmp/t-base-$state-$support/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.base.$state.$support.out; done
            for target in 0 1; do
              grep -q ${state}_${support}_${target}_BUILD=PASS /tmp/build.txt || continue
              ok=1
              for corpus in std cedar; do /tmp/t-$state-$support-$target/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.$state.$support.$target.out || ok=0; cmp /tmp/$corpus.base.$state.$support.out /tmp/$corpus.$state.$support.$target.out || ok=0; done
              if [ $ok = 1 ]; then echo ${state}_${support}_${target}_SEM=PASS | tee -a /tmp/sem.txt; else echo ${state}_${support}_${target}_SEM=FAIL | tee -a /tmp/sem.txt; fi
            done
          done; done
      - name: Marginal causal verifier
        run: |
          set -euxo pipefail
          measure(){ local bin=$1 corpus=$2 tag=$3; nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$tag "$bin" /tmp/checker.json </tmp/$corpus.ndjson >/dev/null 2>/tmp/$tag.err; sed -n 's/^summary:[[:space:]]*//p' /tmp/cg-$tag; }
          : >/tmp/result.txt
          for state in pre post; do for support in 0 1 2; do
            bs=$(measure /tmp/t-base-$state-$support/release/sokonanoda std b-$state-$support-s); bc=$(measure /tmp/t-base-$state-$support/release/sokonanoda cedar b-$state-$support-c)
            for target in 0 1; do
              grep -q ${state}_${support}_${target}_SEM=PASS /tmp/sem.txt || continue
              s=$(measure /tmp/t-$state-$support-$target/release/sokonanoda std x-$state-$support-$target-s); c=$(measure /tmp/t-$state-$support-$target/release/sokonanoda cedar x-$state-$support-$target-c)
              ds=$((s-bs)); dc=$((c-bc)); verdict=VETO; if [ $ds -lt 0 ] && [ $dc -lt 0 ]; then verdict=PASS; fi
              echo ${state}_${support}_${target}_STD_DELTA=$ds CEDAR_DELTA=$dc VERDICT=$verdict | tee -a /tmp/result.txt
            done
          done; done
          flips=0; best=none
          for support in 0 1 2; do for target in 0 1; do
            pre=$(grep ^pre_${support}_${target}_STD_DELTA= /tmp/result.txt || true); post=$(grep ^post_${support}_${target}_STD_DELTA= /tmp/result.txt || true)
            if echo "$pre" | grep -q VERDICT=VETO && echo "$post" | grep -q VERDICT=PASS; then flips=$((flips+1)); best=${support}_${target}; echo CAUSAL_FLIP=$best | tee -a /tmp/result.txt; fi
          done; done
          echo RESIDUAL_SOURCE=V14_state_dependent_portal_closure | tee -a /tmp/result.txt
          echo SUPPORTS=ensure,app,ensure_app | tee -a /tmp/result.txt
          echo TARGETS=prior_field,final_field | tee -a /tmp/result.txt
          echo CORPUS_ID_VISIBLE_TO_PATCH=0 | tee -a /tmp/result.txt
          echo SUPPORT_CONDITIONED_CAUSAL_FLIPS=$flips | tee -a /tmp/result.txt
          echo BEST_SUPPORT_TARGET=$best | tee -a /tmp/result.txt
          test $flips -gt 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msikernel-support-conditioned-v15
          path: |
            /tmp/result.txt
            /tmp/build.txt
            /tmp/sem.txt
            /tmp/*.genesis
