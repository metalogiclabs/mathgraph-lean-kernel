name: Arena omitted 18 either-outcome corner source-pinned acceptance
on:
  push:
    branches: [arena-soko-corner-qualification-v1]
    paths:
      - 'experiments/arena_soko_corner_either_v1.py'
      - '.github/workflows/arena-soko-corner-qualification-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-soko-corner-qualification-v1
  cancel-in-progress: true
jobs:
  large-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze and build exact source patch pair; no official submission
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda /tmp/soko-corner-source
          git -C /tmp/soko-corner-source checkout --detach 7645b1e1fcacfe410c99141f1234381d995b325d
          for arm in baseline sparse compound; do
            git -C /tmp/soko-corner-source worktree add --detach "/tmp/soko-corner-$arm-src" 7645b1e1fcacfe410c99141f1234381d995b325d
            if [ "$arm" != baseline ]; then
              python3 experiments/arena_soko_sparse_patch_v1.py "/tmp/soko-corner-$arm-src"
            fi
            if [ "$arm" = compound ]; then
              python3 experiments/arena_soko_growth_patch_v1.py "/tmp/soko-corner-$arm-src"
            fi
            CARGO_TARGET_DIR="/tmp/soko-corner-$arm-target" RUSTFLAGS="-C target-cpu=native" \
              cargo build --release --locked --manifest-path "/tmp/soko-corner-$arm-src/Cargo.toml"
            cp "/tmp/soko-corner-$arm-target/release/sokonanoda" "/tmp/soko-corner-$arm.bin"
          done
          mkdir -p /tmp/soko-corner-evidence
          sha256sum /tmp/soko-corner-{sparse,compound}.bin | tee /tmp/soko-corner-evidence/binaries.sha256
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/soko-corner-arena
          git -C /tmp/soko-corner-arena checkout --detach b83254de5146ef34147ab82a48edbe1856b0edcc
      - name: Independently reproduce and check 18 exact either-outcome corner exports
        run: |
          set -euo pipefail
          for name in corner-cases/alg-conv-trans-acc-left corner-cases/alg-conv-trans-acc-right corner-cases/alg-conv-trans-acc corner-cases/alg-conv-trans-quot-left-def corner-cases/alg-conv-trans-quot-left corner-cases/alg-conv-trans-quot-right corner-cases/alg-conv-trans-quot corner-cases/eta-ctor corner-cases/eta-rule-k corner-cases/imax-right-successor corner-cases/let-value-type-mismatch corner-cases/positivity-whnf corner-cases/nested-nonuniform-param corner-cases/proj-maybe-prop-past corner-cases/proj-maybe-prop corner-cases/proof-param-swap corner-cases/subject-reduction-redex corner-cases/subject-reduction-reduct; do
            echo "ARENA_LARGE_BUILD=$name"
            (cd /tmp/soko-corner-arena && nix develop -c ./lka.py build-test "$name")
            python3 experiments/arena_soko_corner_either_v1.py /tmp/soko-corner-arena/_build/tests /tmp/soko-corner-evidence --single "$name"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-corner-either-qualification-${{ github.sha }}
          path: /tmp/soko-corner-evidence/
          if-no-files-found: warn
