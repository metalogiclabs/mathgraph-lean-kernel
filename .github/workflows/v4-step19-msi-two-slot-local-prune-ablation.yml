name: V4 Step19 MSI two-slot local prune ablation

on:
  workflow_dispatch:
  push:
    branches: [mathgraph-v4-bvdecide-residual]
    paths: ['.github/workflows/v4-step19-msi-two-slot-local-prune-ablation.yml']

jobs:
  ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build Arena tests
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test init-prelude
          nix develop -c ./lka.py build-test std
      - name: Materialize retained7 baseline and two-slot candidate
        run: |
          set -euxo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          git -C /tmp/base checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          cp -a /tmp/base /tmp/cand
          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/5a1485ae13a0623ca8b7001aee9e0e155381daad/experiments/apply_v4_retained6.py -o /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for root in ['/tmp/base','/tmp/cand']:
              subprocess.run(['python3','/tmp/apply.py',root],check=True)
              p=Path(root)/'src/eval.rs'; s=p.read_text()
              s,n=re.subn(r'(WHNF_ADMIT_THRESHOLD\s*:\s*u8\s*=\s*)2',r'\g<1>1',s)
              assert n==1
              p.write_text(s)

          # Candidate: retain exactly one additional observed (mask -> pruned env)
          # on Cons nodes. This is the minimal residual-relative memory expansion:
          # no full-frame promotion and no larger global direct-map.
          vp=Path('/tmp/cand/src/value.rs'); s=vp.read_text()
          old="""        prune: Cell<(u64, Option<E<'a>>)>,\n    },\n    Framed {"""
          new="""        prune: Cell<(u64, Option<E<'a>>)>,\n        prune2: Cell<(u64, Option<E<'a>>)>,\n    },\n    Framed {"""
          assert old in s
          s=s.replace(old,new,1)
          old2="""        prune: Cell::new((0, None)),\n    })"""
          new2="""        prune: Cell::new((0, None)),\n        prune2: Cell::new((0, None)),\n    })"""
          assert old2 in s
          vp.write_text(s.replace(old2,new2,1))

          ep=Path('/tmp/cand/src/eval.rs'); s=ep.read_text()
          old="""            value::Env::Cons { prune, .. } => {\n                let (m, r) = prune.get();\n                if m == mask {\n                    if let Some(r) = r {\n                        return r;\n                    }\n                }\n            }"""
          new="""            value::Env::Cons { prune, prune2, .. } => {\n                let (m, r) = prune.get();\n                if m == mask {\n                    if let Some(r) = r { return r; }\n                }\n                let (m2, r2) = prune2.get();\n                if m2 == mask {\n                    if let Some(r2) = r2 { return r2; }\n                }\n            }"""
          assert old in s
          s=s.replace(old,new,1)
          old3="""        match e {\n            value::Env::Cons { prune, .. } | value::Env::Framed { prune, .. } => prune.set((mask, Some(r))),\n            value::Env::Nil { .. } => {}\n        }"""
          new3="""        match e {\n            value::Env::Cons { prune, prune2, .. } => {\n                let (m, old) = prune.get();\n                if old.is_none() || m == mask {\n                    prune.set((mask, Some(r)));\n                } else {\n                    prune2.set((mask, Some(r)));\n                }\n            }\n            value::Env::Framed { prune, .. } => prune.set((mask, Some(r))),\n            value::Env::Nil { .. } => {}\n        }"""
          assert old3 in s
          ep.write_text(s.replace(old3,new3,1))
          PY
          for k in base cand; do
            echo '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' > /tmp/$k/config.json
          done
          git -C /tmp/cand diff -- src > /tmp/candidate.diff
      - name: PGO build both
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/arena"
          for k in base cand; do
            d=/tmp/$k; cd "$d"
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-generate=$PWD/pgo" cargo build --release --locked
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            nix shell nixpkgs#llvm -c llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            rm -rf target
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
          done
      - name: Deterministic Std Callgrind
        run: |
          set -euxo pipefail
          cd arena
          for k in base cand; do
            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/${k}.callgrind /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null
            grep '^summary:' /tmp/${k}.callgrind | awk '{print $2}' > /tmp/${k}.ir
          done
          python3 - <<'PY' | tee /tmp/result.txt
          b=int(open('/tmp/base.ir').read()); c=int(open('/tmp/cand.ir').read())
          print(f'BASE_IR={b}')
          print(f'CAND_IR={c}')
          print(f'DELTA={c-b}')
          print(f'DELTA_PCT={(c/b-1)*100:.6f}')
          print('V4_MSI_TWO_SLOT_LOCAL_PRUNE=' + ('PASS' if c < b else 'FAIL'))
          PY
      - name: Wall sanity
        run: |
          set -euxo pipefail
          cd arena
          : > /tmp/wall.tsv
          for i in 1 2 3; do
            for k in base cand; do
              /usr/bin/time -f "$k\t%e" -o /tmp/one.time /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null
              cat /tmp/one.time >> /tmp/wall.tsv
            done
          done
          cat /tmp/wall.tsv | tee -a /tmp/result.txt
          python3 - <<'PY' | tee -a /tmp/result.txt
          import statistics
          d={'base':[],'cand':[]}
          for line in open('/tmp/wall.tsv'):
              k,v=line.split(); d[k].append(float(v))
          b=statistics.median(d['base']); c=statistics.median(d['cand'])
          print(f'BASE_WALL_MEDIAN={b}')
          print(f'CAND_WALL_MEDIAN={c}')
          print(f'WALL_DELTA_PCT={(c/b-1)*100:.6f}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v4-step19-msi-two-slot-local-prune
          path: |
            /tmp/result.txt
            /tmp/candidate.diff
            /tmp/*.callgrind
            /tmp/*.ir
