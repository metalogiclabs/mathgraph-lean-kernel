name: Arena typed incremental pruning with independent shadow gate
on:
  push:
    branches: [arena-soko-prune-delta-compose-v1]
    paths:
      - 'experiments/arena_soko_prune_delta_compose_patch_v1.py'
      - 'experiments/arena_soko_prune_delta_compose_duel_v1.py'
      - '.github/workflows/arena-soko-prune-delta-compose-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-soko-prune-delta-compose-v1
  cancel-in-progress: true
jobs:
  protected-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned guest instruction meter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Build baseline, delta and independent original-cold shadow binaries
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda /tmp/soko-prune-delta-base
          git -C /tmp/soko-prune-delta-base checkout --detach 7645b1e1fcacfe410c99141f1234381d995b325d
          git -C /tmp/soko-prune-delta-base worktree add --detach /tmp/soko-prune-delta-candidate-src 7645b1e1fcacfe410c99141f1234381d995b325d
          git -C /tmp/soko-prune-delta-base worktree add --detach /tmp/soko-prune-delta-shadow-src 7645b1e1fcacfe410c99141f1234381d995b325d
          mkdir -p /tmp/prune-delta-evidence
          for arm in baseline candidate shadow; do
            if [ "$arm" = baseline ]; then src=/tmp/soko-prune-delta-base; else src="/tmp/soko-prune-delta-$arm-src"; fi
            python3 experiments/arena_soko_sparse_patch_v1.py "$src"
            python3 experiments/arena_soko_growth_patch_v1.py "$src"
            python3 experiments/arena_soko_env_extend_singleprobe_patch_v1.py "$src"
            if [ "$arm" = candidate ]; then
              python3 experiments/arena_soko_prune_delta_compose_patch_v1.py "$src"
            elif [ "$arm" = shadow ]; then
              python3 experiments/arena_soko_prune_delta_compose_patch_v1.py "$src" --shadow
            fi
            git -C "$src" diff --check
            CARGO_TARGET_DIR="/tmp/soko-prune-delta-target-$arm" RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked --manifest-path "$src/Cargo.toml"
            cp "/tmp/soko-prune-delta-target-$arm/release/sokonanoda" "/tmp/soko-prune-delta-$arm.bin"
          done
          CARGO_TARGET_DIR=/tmp/soko-prune-delta-target-candidate RUSTFLAGS='-C target-cpu=x86-64' cargo test --release --locked --manifest-path /tmp/soko-prune-delta-candidate-src/Cargo.toml
          git -C /tmp/soko-prune-delta-base diff -- src/checker/cache.rs src/checker/eval/environment.rs src/checker/ptrmap.rs > /tmp/prune-delta-evidence/baseline.patch
          git -C /tmp/soko-prune-delta-candidate-src diff -- src/checker/cache.rs src/checker/eval/environment.rs src/checker/ptrmap.rs > /tmp/prune-delta-evidence/candidate.patch
          git -C /tmp/soko-prune-delta-shadow-src diff -- src/checker/eval/environment.rs > /tmp/prune-delta-evidence/shadow.patch
          sha256sum /tmp/soko-prune-delta-{baseline,candidate,shadow}.bin | tee /tmp/prune-delta-evidence/binaries.sha256
      - name: Freeze exact good/bad source fixtures from official Arena
        run: |
          set -euo pipefail
          mkdir -p /tmp/prune-delta-zip /tmp/prune-delta-tests
          gh api 'repos/leanprover/lean-kernel-arena/actions/artifacts/11505862349/zip' > /tmp/prune-delta-export.zip
          unzip -q /tmp/prune-delta-export.zip -d /tmp/prune-delta-zip
          tar --no-same-owner -xzf /tmp/prune-delta-zip/lean-arena-tests.tar.gz -C /tmp/prune-delta-tests
      - name: Require all 196 source, delta and independent shadow verdicts, then five guest Ir pairs
        run: |
          set -euo pipefail
          python3 experiments/arena_soko_prune_delta_compose_duel_v1.py /tmp/prune-delta-tests /tmp/prune-delta-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-prune-delta-and-shadow-${{ github.sha }}
          path: /tmp/prune-delta-evidence/
          if-no-files-found: warn
