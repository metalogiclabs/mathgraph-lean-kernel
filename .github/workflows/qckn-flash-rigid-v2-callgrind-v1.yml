name: Flash rigid V2 calibrated Callgrind gate

on:
  push:
    branches:
      - qckn-flash-rigid-v2-callgrind-v1
  workflow_dispatch:

concurrency:
  group: qckn-flash-rigid-v2-callgrind-v1
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build exact Arena exports
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 510fbfead6f02bed1a0179d01729a6ddf5bfd06d
          cd /tmp/arena
          nix develop -c ./lka.py build-test init-prelude >/dev/null
          nix develop -c ./lka.py build-test mathlib >/dev/null
          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF

      - name: Materialize frozen champion and rigid V2 candidate
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add /tmp/candidate "$GITHUB_SHA"
          git worktree add /tmp/champion 28bc6a91d68ee547ee94fca395f58e8f100879ea

      - name: Build both under deterministic PGO regime
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_PROFDATA=$(nix shell nixpkgs#llvmPackages_21.llvm -c sh -c 'command -v llvm-profdata')
          FLAGS='-C target-cpu=x86-64 -C target-feature=-avx,-avx2,-avx512f,-fma'
          for arm in champion candidate; do
            rm -rf /tmp/$arm/target /tmp/$arm/pgo
            mkdir -p /tmp/$arm/pgo
            (
              cd /tmp/$arm
              RUSTFLAGS="$FLAGS -Cprofile-generate=/tmp/$arm/pgo" cargo build --release --locked
              target/release/sokonanoda /tmp/config.json </tmp/arena/_build/tests/init-prelude.ndjson >/dev/null
              "$LLVM_PROFDATA" merge -o /tmp/$arm/pgo/merged.profdata /tmp/$arm/pgo
              test -s /tmp/$arm/pgo/merged.profdata
              rm -rf target
              RUSTFLAGS="$FLAGS -Cprofile-use=/tmp/$arm/pgo/merged.profdata" cargo build --release --locked
              cp target/release/sokonanoda /tmp/$arm.bin
            )
          done
          sha256sum /tmp/champion.bin /tmp/candidate.bin | tee /tmp/binaries.sha256

      - name: Verify Mathlib status parity
        shell: bash
        run: |
          set -euxo pipefail
          f=/tmp/arena/_build/tests/mathlib.ndjson
          : >/tmp/parity.tsv
          for arm in champion candidate; do
            set +e
            /tmp/$arm.bin /tmp/config.json <"$f" >/tmp/$arm.out 2>/tmp/$arm.err
            rc=$?
            set -e
            printf '%s\t%s\n' "$arm" "$rc" | tee -a /tmp/parity.tsv
          done
          test "$(cut -f2 /tmp/parity.tsv | sort -u | wc -l)" -eq 1

      - name: Deterministic Mathlib Callgrind rank proxy
        shell: bash
        run: |
          set -euxo pipefail
          VALGRIND=$(nix shell nixpkgs#valgrind -c sh -c 'command -v valgrind')
          f=/tmp/arena/_build/tests/mathlib.ndjson
          : >/tmp/callgrind.tsv
          for arm in champion candidate; do
            out=/tmp/$arm.callgrind
            set +e
            timeout 7200s "$VALGRIND" --tool=callgrind --quiet --collect-jumps=no \
              --callgrind-out-file="$out" \
              /tmp/$arm.bin /tmp/config.json <"$f" >/tmp/$arm.cg.out 2>/tmp/$arm.cg.err
            rc=$?
            set -e
            test "$rc" -eq 0
            ir=$(awk '/^summary:/ {print $2; exit}' "$out")
            test -n "$ir"
            printf '%s\t%s\n' "$arm" "$ir" | tee -a /tmp/callgrind.tsv
          done

          python3 - <<'PY' | tee /tmp/scorecard.txt
          vals={}
          for line in open('/tmp/callgrind.tsv'):
              a,n=line.rstrip().split('\t'); vals[a]=int(n)
          base=vals['champion']; cand=vals['candidate']
          print(f'CHAMPION_CALLGRIND_IR={base}')
          print(f'CANDIDATE_CALLGRIND_IR={cand}')
          print(f'RIGID_V2_CALLGRIND_SPEEDUP={base/cand:.9f}')
          print(f'RIGID_V2_CALLGRIND_DELTA_PERCENT={(cand/base-1)*100:.4f}')
          if cand < base:
              print('FLASH_RIGID_V2_CALLGRIND_RANK_PASS')
          else:
              print('FLASH_RIGID_V2_CALLGRIND_RANK_REJECT')
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-flash-rigid-v2-callgrind-v1
          path: |
            /tmp/parity.tsv
            /tmp/callgrind.tsv
            /tmp/scorecard.txt
            /tmp/binaries.sha256
          if-no-files-found: warn
