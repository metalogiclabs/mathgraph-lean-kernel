name: MSI application-check transfer v32

on:
  push:
    branches: [msi-app-check-transfer-v32]
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          set_as_trusted_user: true
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Prepare full Std and exact variants
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          head -n 2000000 _build/tests/std.ndjson >/tmp/std-2m.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          cp -a /tmp/base /tmp/app_sort
          cp experiments/apply_msi_app_check_interface_v31.py /tmp/app_sort/patch.py
          (cd /tmp/app_sort && python3 patch.py app_sort)
          cd arena
          for mode in base app_sort; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/${mode}-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/${mode}/Cargo.toml --release --locked"
          done
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Full Std correctness, native transfer, deterministic scale
        shell: bash
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          for i in 1 2 3 4 5; do
            /usr/bin/time -f "BASE_STD_NATIVE_${i}=%e RSS=%M" /tmp/base-target/release/sokonanoda /tmp/checker.json <arena/_build/tests/std.ndjson >/tmp/base-${i}.out 2>>/tmp/result.txt
            /usr/bin/time -f "APP_STD_NATIVE_${i}=%e RSS=%M" /tmp/app_sort-target/release/sokonanoda /tmp/checker.json <arena/_build/tests/std.ndjson >/tmp/app-${i}.out 2>>/tmp/result.txt
            cmp /tmp/base-${i}.out /tmp/app-${i}.out
          done
          for mode in base app_sort; do
            valgrind --tool=callgrind --callgrind-out-file=/tmp/${mode}.cg /tmp/${mode}-target/release/sokonanoda /tmp/checker.json </tmp/std-2m.ndjson >/tmp/${mode}-cg.out 2>/tmp/${mode}-cg.err
          done
          cmp /tmp/base-cg.out /tmp/app_sort-cg.out
          grep 'Collected' /tmp/base-cg.err | tail -1 | sed 's/^/BASE_/' | tee -a /tmp/result.txt
          grep 'Collected' /tmp/app_sort-cg.err | tail -1 | sed 's/^/APP_/' | tee -a /tmp/result.txt
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re, statistics
          s=open('/tmp/result.txt').read()
          b=[float(x) for x in re.findall(r'BASE_STD_NATIVE_\d+=([0-9.]+)',s)]
          a=[float(x) for x in re.findall(r'APP_STD_NATIVE_\d+=([0-9.]+)',s)]
          bi=int(re.search(r'BASE_.*Collected\s*:\s*([0-9,]+)',s).group(1).replace(',',''))
          ai=int(re.search(r'APP_.*Collected\s*:\s*([0-9,]+)',s).group(1).replace(',',''))
          bm=statistics.mean(b); am=statistics.mean(a)
          print(f'BASE_STD_NATIVE_MEAN={bm:.6f}')
          print(f'APP_STD_NATIVE_MEAN={am:.6f}')
          print(f'APP_STD_NATIVE_DELTA_PCT={100*(am-bm)/bm:.6f}')
          print(f'BASE_2M_INSTR={bi}')
          print(f'APP_2M_INSTR={ai}')
          print(f'APP_2M_INSTR_DELTA_PCT={100*(ai-bi)/bi:.6f}')
          print('DECISION=' + ('STD_TRANSFER_POSITIVE' if ai < bi else 'STD_TRANSFER_NEGATIVE'))
          PY
          cat /tmp/result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: msi-app-check-transfer-v32
          path: |
            /tmp/result.txt
            /tmp/base-cg.err
            /tmp/app_sort-cg.err
