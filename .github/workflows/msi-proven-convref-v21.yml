name: MSI proven conversion-ref v21

on:
  push:
    branches: [msi-proven-convref-v21]

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Prepare Std prefix and both checkers
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          head -n 1000000 _build/tests/std.ndjson > /tmp/std-prefix.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          cp -a /tmp/base /tmp/cand
          cp experiments/apply_msi_proven_convref_v21.py /tmp/cand/patch.py
          (cd /tmp/cand && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/base-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/base/Cargo.toml --release --locked"
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/cand-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/cand/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Native A/B and deterministic Callgrind
        run: |
          set -euxo pipefail
          : > /tmp/result.txt
          for i in 1 2 3 4 5; do
            /usr/bin/time -f "BASE_NATIVE_${i}=%e RSS=%M" /tmp/base-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/base-${i}.out 2>>/tmp/result.txt
            /usr/bin/time -f "CAND_NATIVE_${i}=%e RSS=%M" /tmp/cand-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/cand-${i}.out 2>>/tmp/result.txt
            cmp /tmp/base-${i}.out /tmp/cand-${i}.out
          done
          valgrind --tool=callgrind --callgrind-out-file=/tmp/base.cg /tmp/base-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/base-cg.out 2>/tmp/base-cg.err
          valgrind --tool=callgrind --callgrind-out-file=/tmp/cand.cg /tmp/cand-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/cand-cg.out 2>/tmp/cand-cg.err
          cmp /tmp/base-cg.out /tmp/cand-cg.out
          grep 'Collected' /tmp/base-cg.err | tail -1 | sed 's/^/BASE_/' | tee -a /tmp/result.txt
          grep 'Collected' /tmp/cand-cg.err | tail -1 | sed 's/^/CAND_/' | tee -a /tmp/result.txt
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re, statistics
          s=open('/tmp/result.txt').read()
          b=[float(x) for x in re.findall(r'BASE_NATIVE_\d+=([0-9.]+)',s)]
          c=[float(x) for x in re.findall(r'CAND_NATIVE_\d+=([0-9.]+)',s)]
          nums=[int(x.replace(',','')) for x in re.findall(r'Collected\s*:\s*([0-9,]+)',s)]
          print(f'BASE_NATIVE_MEAN={statistics.mean(b):.6f}')
          print(f'CAND_NATIVE_MEAN={statistics.mean(c):.6f}')
          print(f'NATIVE_DELTA_PCT={100*(statistics.mean(c)-statistics.mean(b))/statistics.mean(b):.6f}')
          if len(nums)>=2:
              print(f'BASE_INSTR={nums[-2]}')
              print(f'CAND_INSTR={nums[-1]}')
              print(f'INSTR_DELTA_PCT={100*(nums[-1]-nums[-2])/nums[-2]:.6f}')
          PY
          cat /tmp/result.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-proven-convref-v21
          path: |
            /tmp/result.txt
            /tmp/base-cg.err
            /tmp/cand-cg.err
