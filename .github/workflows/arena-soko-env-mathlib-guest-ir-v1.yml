name: Full Mathlib exact PGO compound versus env_extend vacancy reuse
on:
  push:
    branches: [arena-soko-env-extend-mathlib-v1]
    paths:
      - 'experiments/arena_soko_env_mathlib_guest_ir_v1.py'
      - 'experiments/arena_soko_env_extend_singleprobe_patch_v1.py'
      - '.github/workflows/arena-soko-env-mathlib-guest-ir-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-soko-env-extend-mathlib-v1
  cancel-in-progress: true
jobs:
  full-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install deterministic guest instruction meter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Pin exact Lean Arena and two checker source trees
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/ir-arena
          git -C /tmp/ir-arena checkout --detach b83254de5146ef34147ab82a48edbe1856b0edcc
          git clone -q https://github.com/intgrah/sokonanoda /tmp/ir-compound-source
          git -C /tmp/ir-compound-source checkout --detach 7645b1e1fcacfe410c99141f1234381d995b325d
          git -C /tmp/ir-compound-source worktree add --detach /tmp/ir-compound-env-source 7645b1e1fcacfe410c99141f1234381d995b325d
          for SRC in /tmp/ir-compound-source /tmp/ir-compound-env-source; do
            python3 experiments/arena_soko_sparse_patch_v1.py "$SRC"
            python3 experiments/arena_soko_growth_patch_v1.py "$SRC"
          done
          python3 experiments/arena_soko_env_extend_singleprobe_patch_v1.py /tmp/ir-compound-env-source
          for SRC in /tmp/ir-compound-source /tmp/ir-compound-env-source; do git -C "$SRC" diff --check; done
      - name: Build exact original complete Mathlib and PGO training input
        run: |
          set -euo pipefail
          cd /tmp/ir-arena
          nix develop -c ./lka.py build-test mathlib
          mkdir -p /tmp/ir-tar /tmp/ir-training /tmp/ir-evidence
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/11505862349/zip" >/tmp/ir-tests.zip
          unzip -q /tmp/ir-tests.zip -d /tmp/ir-tar
          tar --no-same-owner -xzf /tmp/ir-tar/lean-arena-tests.tar.gz -C /tmp/ir-training
          test -s /tmp/ir-training/good/init-prelude.ndjson
      - name: Build both binaries with identical portable ISA and official PGO training
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | awk '/^host:/ {print $2}')
          LLVM_PROFDATA="$(rustc --print sysroot)/lib/rustlib/$HOST/bin/llvm-profdata"
          test -x "$LLVM_PROFDATA"
          for arm in compound compound_env; do
            if [ "$arm" = compound ]; then SRC=/tmp/ir-compound-source; else SRC=/tmp/ir-compound-env-source; fi
            mkdir -p "/tmp/ir-prof-$arm"
            CARGO_TARGET_DIR="/tmp/ir-target-$arm" RUSTFLAGS="-C target-cpu=x86-64 -Cprofile-generate=/tmp/ir-prof-$arm" \
              cargo build --release --locked --manifest-path "$SRC/Cargo.toml"
            "/tmp/ir-target-$arm/release/sokonanoda" --stdin --nat-extension --string-extension \
              --axiom-allow-all --threads 4 </tmp/ir-training/good/init-prelude.ndjson >/dev/null
            "$LLVM_PROFDATA" merge -o "/tmp/ir-prof-$arm/merged.profdata" "/tmp/ir-prof-$arm"
            CARGO_TARGET_DIR="/tmp/ir-target-$arm" RUSTFLAGS="-C target-cpu=x86-64 -Cprofile-use=/tmp/ir-prof-$arm/merged.profdata" \
              cargo build --release --locked --manifest-path "$SRC/Cargo.toml"
            cp "/tmp/ir-target-$arm/release/sokonanoda" "/tmp/ir-mathlib-$arm"
          done
          sha256sum /tmp/ir-mathlib-{compound,compound_env} | tee /tmp/ir-evidence/binaries.sha256
      - name: Check native-PGO full Mathlib acceptance, wall and peak RSS for both arms
        run: |
          set -euo pipefail
          for arm in compound compound_env; do
            /usr/bin/time -f "NATIVE_${arm} WALL_SECONDS=%e PEAK_RSS_KB=%M" -o "/tmp/ir-evidence/native-${arm}.txt" \
              "/tmp/ir-mathlib-$arm" --stdin --nat-extension --string-extension --axiom-allow-all --threads 4 \
              </tmp/ir-arena/_build/tests/mathlib.ndjson >/dev/null
            cat "/tmp/ir-evidence/native-$arm.txt"
          done
      - name: Measure and compare complete Mathlib Callgrind guest instructions
        run: |
          set -euo pipefail
          python3 experiments/arena_soko_env_mathlib_guest_ir_v1.py /tmp/ir-arena/_build/tests/mathlib.ndjson /tmp/ir-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-mathlib-env-guest-ir-${{ github.sha }}
          path: /tmp/ir-evidence/
          if-no-files-found: warn
