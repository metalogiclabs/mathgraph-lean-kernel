name: msikernel applicability genesis v12

on:
  push:
    branches: [msikernel-applicability-genesis-v12]
  workflow_dispatch:

jobs:
  applicability-v12:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build dependency-complete discovery and held-out prefixes
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          for c in std cedar; do
            head -n 400000 _build/tests/$c.ndjson >/tmp/$c.train.ndjson
            head -n 600000 _build/tests/$c.ndjson >/tmp/$c.test.ndjson
          done
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Probe discovery prefixes and learn minimal applicability rule
        run: |
          set -euxo pipefail
          for mode in probe g3 guard broad; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$mode
          done
          python3 experiments/applicability_genesis_v12.py /tmp/probe probe
          python3 experiments/applicability_genesis_v12.py /tmp/g3 guard ''
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-probe RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/probe/Cargo.toml --release --locked"
          for c in std cedar; do
            /tmp/target-probe/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.probe.out 2>/tmp/$c.probe.log
          done
          cd ..
          python3 - <<'PY' | tee /tmp/learn.txt
          import re, collections
          tags=['bvar','axiom','ctor','recursor','quotconst','inductive']
          counts={t:[0,0] for t in tags}
          for c in ('std','cedar'):
              for line in open(f'/tmp/{c}.probe.log', errors='replace'):
                  m=re.search(r'APPGEN_V12 pre=(\w+) unchanged=(\d)', line)
                  if not m or m.group(1) not in counts: continue
                  t=m.group(1); u=int(m.group(2)); counts[t][0]+=1; counts[t][1]+=u
          for t,(n,u) in counts.items(): print(f'TAG_{t.upper()} total={n} unchanged={u} changed={n-u}')
          seen=[t for t in tags if counts[t][0]]
          allowed=[t for t in seen if counts[t][1]==counts[t][0]]
          rejected=[t for t in seen if counts[t][1]<counts[t][0]]
          assert allowed, 'no accepted rigid-head tag observed'
          assert rejected, 'no rejected rigid-head tag observed; learner underidentified'
          broad=max(rejected, key=lambda t: counts[t][0]-counts[t][1])
          open('/tmp/allowed.txt','w').write(','.join(allowed))
          open('/tmp/broadtag.txt','w').write(broad)
          print('LEARNED_ALLOWED='+','.join(allowed))
          print('LEARNED_REJECTED='+','.join(rejected))
          print('ABLATION_BROAD_TAG='+broad)
          print('V12_ACCEPT_REJECT_SPLIT=PASS')
          print('V12_ZERO_CHANGED_LEARNED_RULE=PASS')
          PY
          ALLOWED="$(cat /tmp/allowed.txt)"
          BROAD="$(cat /tmp/broadtag.txt)"
          python3 experiments/applicability_genesis_v12.py /tmp/guard guard "$ALLOWED"
          python3 experiments/applicability_genesis_v12.py /tmp/broad broaden "$ALLOWED,$BROAD"
          cat APPLICABILITY_GENESIS_V12.md >/tmp/prereg.md
          cat /tmp/learn.txt >/tmp/result.txt

      - name: Build learned guard and exact broadened-rule ablation
        run: |
          set -euxo pipefail
          cd arena
          for mode in g3 guard broad; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-$mode RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$mode/Cargo.toml --release --locked"
          done
          # G3 is the semantic reference on discovery prefixes.
          for c in std cedar; do
            /tmp/target-g3/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.g3.train.out
          done
          set +e
          /tmp/target-broad/release/sokonanoda /tmp/checker.json </tmp/std.train.ndjson >/tmp/std.broad.out 2>/tmp/std.broad.err; rs=$?
          /tmp/target-broad/release/sokonanoda /tmp/checker.json </tmp/cedar.train.ndjson >/tmp/cedar.broad.out 2>/tmp/cedar.broad.err; rc=$?
          set -e
          bad=0
          if [ "$rs" -ne 0 ] || ! cmp -s /tmp/std.g3.train.out /tmp/std.broad.out; then bad=1; fi
          if [ "$rc" -ne 0 ] || ! cmp -s /tmp/cedar.g3.train.out /tmp/cedar.broad.out; then bad=1; fi
          test "$bad" -eq 1
          echo V12_EXACT_BROADENING_ABLATION=PASS | tee -a /tmp/result.txt

      - name: Prospective transfer to untouched rows 400001 through 600000
        run: |
          set -euxo pipefail
          for c in std cedar; do
            for b in train test; do
              /tmp/target-g3/release/sokonanoda /tmp/checker.json </tmp/$c.$b.ndjson >/tmp/$c.$b.g3.out
              /tmp/target-guard/release/sokonanoda /tmp/checker.json </tmp/$c.$b.ndjson >/tmp/$c.$b.guard.out
              cmp /tmp/$c.$b.g3.out /tmp/$c.$b.guard.out
            done
            echo "${c^^}_V12_HELDOUT_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
          done
          echo V12_HELDOUT_ROWS=400001..600000 | tee -a /tmp/result.txt
          echo APPLICABILITY_GENESIS_V12=BOUNDED_POSITIVE | tee -a /tmp/result.txt

      - name: Report held-out economic effect without gating applicability claim
        run: |
          set -euxo pipefail
          for c in std cedar; do
            for m in g3 guard; do
              for b in train test; do
                nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$c-$m-$b /tmp/target-$m/release/sokonanoda /tmp/checker.json </tmp/$c.$b.ndjson >/tmp/$c.$m.$b.cg.out 2>/tmp/$c.$m.$b.cg.err
              done
            done
          done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          def I(c,m,b):
              s=open(f'/tmp/cg-{c}-{m}-{b}').read(); return int(re.search(r'^summary:\s+(\d+)',s,re.M).group(1))
          for c in ('std','cedar'):
              base=I(c,'g3','test')-I(c,'g3','train')
              guard=I(c,'guard','test')-I(c,'guard','train')
              print(f'{c.upper()}_V12_G3_WINDOW_INSTR={base}')
              print(f'{c.upper()}_V12_GUARD_WINDOW_INSTR={guard}')
              print(f'{c.upper()}_V12_GUARD_DELTA={guard-base}')
          PY
          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msikernel-applicability-genesis-v12
          path: |
            /tmp/result.txt
            /tmp/prereg.md
            /tmp/learn.txt
            /tmp/*broad.err
