name: Lean Refactor Arena V16 SKI four-version admission
on:
  workflow_dispatch:
  push:
    branches: ['competition/lra-ski-mirrored-join-v16']
    paths:
      - '.github/workflows/lean-refactor-arena-ski-mirrored-v16-all-versions.yml'
      - 'competitions/lean_refactor_arena/experiments/ski_mirrored_critical_v16.jsonl'

permissions:
  contents: read

concurrency:
  group: lra-ski-v16-all-versions
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      PUBLIC_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      SOURCE_HEAD: f8ecf9882ef963722c950f3ff9ceaf72c3c84509
      SOURCE_RUN: '38000243153'
      TARGET: Cslib.SKI.parallelReduction_diamond
      BANK: competitions/lean_refactor_arena/experiments/ski_mirrored_critical_v16.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Bind all-version challenger to exact successful primary source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ski-v16-admission
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/metalogiclabs/mathgraph-lean-kernel/actions/runs/38000243153 \
            -o /tmp/ski-v16-admission/primary-run.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('competitions/lean_refactor_arena')
          rows=lambda p:[json.loads(s) for s in p.read_text().splitlines() if s.strip()]
          run=json.load(open('/tmp/ski-v16-admission/primary-run.json'))
          assert run['head_sha']==os.environ['SOURCE_HEAD']
          assert run['id']==int(os.environ['SOURCE_RUN'])
          assert run['status']=='completed' and run['conclusion']=='success'
          bank=rows(pathlib.Path(os.environ['BANK']))
          portfolio=rows(root/'portfolio/warmup_portfolio_v1.jsonl')
          assert len(bank)==8 and len({x['label'] for x in bank})==8 and len(portfolio)==15
          source=next(x for x in portfolio if x['name']==os.environ['TARGET'])
          control=next(x for x in bank if x['label']=='ski_v16_exact_278_control')
          winner=next(x for x in bank if x['label']=='ski_v16_mirrored_010')
          assert source['label']=='public_informed_derivation_278'
          assert source['proof']==control['proof']
          assert all(x['name']==os.environ['TARGET'] for x in bank)
          original_head=control['proof'].split(' := by\n',1)[0]+' := by\n'
          assert winner['proof'].startswith(original_head) and winner['proof']!=control['proof']
          assert not any(k in winner['proof'] for k in
            ['sorry','sorryAx','admit','native_decide','run_elab','unsafe','axiom '])
          manifest={
            'schema':'mathgraph.lra.ski-v16-frozen-all-version-source.v1',
            'primary_source_run':run['id'],'primary_source_head':run['head_sha'],
            'candidate_label':winner['label'],
            'control_sha256':hashlib.sha256(control['proof'].encode()).hexdigest(),
            'winner_sha256':hashlib.sha256(winner['proof'].encode()).hexdigest(),
            'statement_exact':True,'source_exact':True,
            'portfolio_mutated':False,'official_submission':False
          }
          pathlib.Path('/tmp/ski-v16-admission/source.json').write_text(
            json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Build exactly required Cslib target modules under four pinned Lean versions
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_SHA"
          for version in v4.33 v4.32 v4.31 v4.30; do
            echo "SKI_TARGET_VERSION=$version"
            (
              cd "/tmp/lean-refactor/competition/projects/$version"
              lake update > "/tmp/ski-v16-admission/$version-update.log" 2>&1
              lake exe cache get > "/tmp/ski-v16-admission/$version-cache.log" 2>&1 || true
              lake build Cslib.Languages.CombinatoryLogic.Confluence \
                > "/tmp/ski-v16-admission/$version-module.log" 2>&1
            ) || {
              tail -n 110 "/tmp/ski-v16-admission/$version-module.log" || true
              exit 1
            }
          done
          echo QUALIFIED_ALL_FOUR_REQUIRED_CSLIB_TARGET_IMPORT_CLOSURES

      - name: Recheck exact control and winner on every required Lean version
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          for label in ski_v16_exact_278_control ski_v16_mirrored_010; do
            echo "SKI_V16_ALL_VERSION_CANDIDATE=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.33 \
              --name "$TARGET" --candidate "$BANK" --label "$label"
            (
              cd /tmp/lean-refactor/competition
              python3 arena.py check --name "$TARGET" --all-versions --timeout 1800
            ) > "/tmp/ski-v16-admission/$label.json"
          done

      - name: Seal exact four-version proof and marginal objective
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/ski-v16-admission')
          versions={'v4.33.0-rc2','v4.32.0','v4.31.0','v4.30.0'}
          def read(label):
            r=json.loads((root/(label+'.json')).read_text())
            compat=r.get('compat') or {}
            pv=r.get('per_version') or []
            assert r.get('compiled') is True and r.get('statement_ok') is True
            assert r.get('eligible') is True and r.get('survival_pct')==100.0
            assert not r.get('forbidden') and not r.get('extra_toplevel_decls') and not r.get('untested')
            assert r.get('all_versions') is not False
            assert set(compat)==versions and all(compat[v] is True for v in versions)
            assert len(pv)==4 and {v.get('version') for v in pv}==versions
            assert all(v.get('tested') is True and v.get('ok') is True for v in pv)
            return r
          control=read('ski_v16_exact_278_control')
          winner=read('ski_v16_mirrored_010')
          assert (int(control['length']),int(control['heartbeats']))==(278,501)
          assert (int(winner['length']),int(winner['heartbeats']))==(261,543)
          assert float(winner['objective_sum_pct'])>float(control['objective_sum_pct'])
          out={
            'schema':'mathgraph.lra.ski-v16-strict-all-version-admission.v1',
            'status':'WARRANTED_ALL_FOUR_VERSIONS__PACKET_NOT_YET_RECLOSED',
            'source':json.loads((root/'source.json').read_text()),
            'control':{'tokens':control['length'],'heartbeats':control['heartbeats'],
                       'objective':control['objective_sum_pct']},
            'winner':{'label':'ski_v16_mirrored_010','tokens':winner['length'],
                      'heartbeats':winner['heartbeats'],'objective':winner['objective_sum_pct']},
            'objective_gain':round(float(winner['objective_sum_pct'])-float(control['objective_sum_pct']),4),
            'protected_versions':sorted(versions),'official_submission':False,
            'next_gate':'Freeze exact 14 unchanged retained proofs and reclose 15-row packet before merging'
          }
          (root/'qualification.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-ski-v16-four-version-proof
          path: /tmp/ski-v16-admission
