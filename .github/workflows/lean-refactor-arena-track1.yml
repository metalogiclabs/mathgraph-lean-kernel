name: Lean Refactor Arena Track 1

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'competitions/lean_refactor_arena/**'
      - '.github/workflows/lean-refactor-arena-track1.yml'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LEAN_TOOLCHAIN: leanprover/lean4:v4.24.0
    steps:
      - uses: actions/checkout@v4

      - name: Install organizer-matching Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$LEAN_TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Validate organizer JSONL schema
        shell: bash
        run: |
          set -euo pipefail
          python3 competitions/lean_refactor_arena/official_jsonl.py \
            competitions/lean_refactor_arena/fixtures/official_smoke.jsonl \
            --summary-out /tmp/official-schema-summary.json

      - name: Prove submission-shaped zero-change control
        shell: bash
        run: |
          set -euo pipefail
          python3 competitions/lean_refactor_arena/submission.py baseline \
            --input competitions/lean_refactor_arena/fixtures/official_smoke.jsonl \
            --output /tmp/zero-change-submission.jsonl
          python3 competitions/lean_refactor_arena/submission.py validate \
            --input competitions/lean_refactor_arena/fixtures/official_smoke.jsonl \
            --output /tmp/zero-change-submission.jsonl \
            --require-control-identity

      - name: Run fail-closed evaluator smoke gate
        shell: bash
        run: |
          set -euo pipefail
          python3 competitions/lean_refactor_arena/runner.py \
            --lean "$HOME/.elan/bin/lean" \
            --manifest competitions/lean_refactor_arena/fixtures/smoke/manifest.json \
            --out /tmp/lean-refactor-smoke.json

      - name: Assert fixed candidate is a verified contraction
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open('/tmp/lean-refactor-smoke.json'))
          c = p['cases'][0]
          assert p['all_valid']
          assert c['candidate']['tokens_proxy'] < c['reference']['tokens_proxy']
          print('VERIFIED_LEAN_REFACTOR_ARENA_SMOKE_CONTRACTION')
          PY

      - name: Prove Track 1 budget gate fails closed
        shell: bash
        run: |
          set -euo pipefail
          LEDGER=/tmp/track1-ledger.jsonl
          python3 competitions/lean_refactor_arena/budget_ledger.py \
            --ledger "$LEDGER" --problem smoke --usd 1.25 \
            --model test-model --purpose first-proposal
          python3 competitions/lean_refactor_arena/budget_ledger.py \
            --ledger "$LEDGER" --problem smoke --usd 1.50 \
            --model test-model --purpose second-proposal
          if python3 competitions/lean_refactor_arena/budget_ledger.py \
            --ledger "$LEDGER" --problem smoke --usd 0.26 \
            --model test-model --purpose forbidden-overrun; then
            echo "budget gate incorrectly admitted spend above USD 3.00"
            exit 1
          fi
          echo VERIFIED_TRACK1_HARD_BUDGET_REFUSAL

      - name: Prove parallel workers cannot race past the cap
        shell: bash
        run: |
          set -euo pipefail
          LEDGER=/tmp/track1-concurrent.jsonl
          set +e
          pids=""
          for i in 1 2 3 4; do
            python3 competitions/lean_refactor_arena/budget_ledger.py \
              --ledger "$LEDGER" --problem concurrent-smoke --usd 1.00 \
              --model test-model --purpose "parallel-$i" \
              >"/tmp/parallel-$i.log" 2>&1 &
            pids="$pids $!"
          done
          failures=0
          successes=0
          for pid in $pids; do
            wait "$pid"
            rc=$?
            if [ "$rc" -eq 0 ]; then successes=$((successes+1)); else failures=$((failures+1)); fi
          done
          set -e
          python3 - <<'PY'
          import json
          from decimal import Decimal
          rows=[json.loads(x) for x in open('/tmp/track1-concurrent.jsonl') if x.strip()]
          total=sum((Decimal(r['usd']) for r in rows), Decimal('0'))
          assert len(rows) == 3, rows
          assert total == Decimal('3.00'), total
          assert rows[-1]['cumulative_usd'] == '3.00', rows[-1]
          print('VERIFIED_ATOMIC_PARALLEL_TRACK1_BUDGET')
          PY
          test "$successes" -eq 3
          test "$failures" -eq 1

      - name: Discover contraction by deletion only
        shell: bash
        run: |
          set -euo pipefail
          python3 competitions/lean_refactor_arena/ddmin.py \
            --lean "$HOME/.elan/bin/lean" \
            --input competitions/lean_refactor_arena/fixtures/smoke/reference.lean \
            --output /tmp/ddmin-candidate.lean \
            --trace /tmp/ddmin-trace.json \
            --max-checks 250
          python3 - <<'PY'
          import json
          p = json.load(open('/tmp/ddmin-trace.json'))
          assert p['final_proof_tokens'] < p['initial_proof_tokens'], p
          assert any(x['accepted'] for x in p['trace']), p
          print('VERIFIED_CONSEQUENCE_GUIDED_DELETION_GAIN')
          print(p['final_proof'])
          PY

      - name: Replay discovered proof on prior Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.23.0
          "$HOME/.elan/bin/elan" run leanprover/lean4:v4.23.0 lean /tmp/ddmin-candidate.lean
          "$HOME/.elan/bin/elan" run leanprover/lean4:v4.24.0 lean /tmp/ddmin-candidate.lean
          echo VERIFIED_ZERO_SHOT_CORE_TOOLCHAIN_TRANSFER_4_23_4_24

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-refactor-arena-track1-smoke
          path: |
            /tmp/lean-refactor-smoke.json
            /tmp/official-schema-summary.json
            /tmp/zero-change-submission.jsonl
            /tmp/track1-ledger.jsonl
            /tmp/ddmin-candidate.lean
            /tmp/ddmin-trace.json
