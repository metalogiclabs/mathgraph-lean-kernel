name: Arena source-pinned PtrMap shrink hysteresis decision
on:
  push:
    branches: [arena-soko-ptrmap-hysteresis-v1]
    paths:
      - 'experiments/arena_soko_ptrmap_hysteresis_patch_v1.py'
      - 'experiments/arena_soko_ptrmap_hysteresis_duel_v1.py'
      - '.github/workflows/arena-soko-ptrmap-hysteresis-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-soko-ptrmap-hysteresis-v1
  cancel-in-progress: true
jobs:
  protected-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install independent deterministic guest-instruction meter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Pin upstream, build both exact parent binaries and test candidate cache meaning
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda /tmp/soko-hysteresis-base
          git -C /tmp/soko-hysteresis-base checkout --detach 7645b1e1fcacfe410c99141f1234381d995b325d
          git -C /tmp/soko-hysteresis-base worktree add --detach /tmp/soko-hysteresis-candidate 7645b1e1fcacfe410c99141f1234381d995b325d
          mkdir -p /tmp/hysteresis-evidence
          for arm in baseline candidate; do
            if [ "$arm" = baseline ]; then src=/tmp/soko-hysteresis-base; else src=/tmp/soko-hysteresis-candidate; fi
            python3 experiments/arena_soko_sparse_patch_v1.py "$src"
            python3 experiments/arena_soko_growth_patch_v1.py "$src"
            if [ "$arm" = candidate ]; then
              python3 experiments/arena_soko_ptrmap_hysteresis_patch_v1.py "$src"
            fi
            git -C "$src" diff --check
            CARGO_TARGET_DIR="/tmp/soko-hysteresis-target-$arm" RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked --manifest-path "$src/Cargo.toml"
            cp "/tmp/soko-hysteresis-target-$arm/release/sokonanoda" "/tmp/soko-hysteresis-$arm.bin"
          done
          CARGO_TARGET_DIR=/tmp/soko-hysteresis-target-candidate RUSTFLAGS='-C target-cpu=x86-64' cargo test --release --locked --manifest-path /tmp/soko-hysteresis-candidate/Cargo.toml
          git -C /tmp/soko-hysteresis-base diff -- src/checker/cache.rs src/checker/eval/environment.rs src/checker/ptrmap.rs > /tmp/hysteresis-evidence/parent.patch
          git -C /tmp/soko-hysteresis-candidate diff -- src/checker/cache.rs src/checker/eval/environment.rs src/checker/ptrmap.rs > /tmp/hysteresis-evidence/candidate.patch
          sha256sum /tmp/soko-hysteresis-{baseline,candidate}.bin | tee /tmp/hysteresis-evidence/binaries.sha256
      - name: Freeze exact 196 valid and invalid official Arena inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/hysteresis-zip /tmp/hysteresis-tests
          gh api 'repos/leanprover/lean-kernel-arena/actions/artifacts/11505862349/zip' > /tmp/hysteresis-export.zip
          unzip -q /tmp/hysteresis-export.zip -d /tmp/hysteresis-zip
          tar --no-same-owner -xzf /tmp/hysteresis-zip/lean-arena-tests.tar.gz -C /tmp/hysteresis-tests
      - name: Exact 196 verdicts, five guest-Ir pairs and memory cost
        run: |
          set -euo pipefail
          python3 experiments/arena_soko_ptrmap_hysteresis_duel_v1.py /tmp/hysteresis-tests /tmp/hysteresis-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soko-ptrmap-hysteresis-${{ github.sha }}
          path: /tmp/hysteresis-evidence/
          if-no-files-found: warn
