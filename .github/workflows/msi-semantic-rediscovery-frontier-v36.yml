name: MSI semantic rediscovery frontier v36

on:
  push:
    branches: [msi-semantic-rediscovery-frontier-v36]

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build Std and Cedar corpora + instrumented checker
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 2000000 _build/tests/std.ndjson >/tmp/std-2m.ndjson
          head -n 2000000 _build/tests/cedar.ndjson >/tmp/cedar-2m.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/v36
          cp experiments/apply_msi_semantic_rediscovery_frontier_v36.py /tmp/v36/patch.py
          (cd /tmp/v36 && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/v36-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/v36/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Census semantic rediscovery frontier
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          /tmp/v36-target/release/sokonanoda /tmp/checker.json </tmp/std-2m.ndjson >/tmp/std.out 2>/tmp/std.err
          /tmp/v36-target/release/sokonanoda /tmp/checker.json </tmp/cedar-2m.ndjson >/tmp/cedar.out 2>/tmp/cedar.err
          grep 'MSI_V36' /tmp/std.err | tail -1 | sed 's/^/STD /' | tee -a /tmp/result.txt || true
          grep 'MSI_V36' /tmp/cedar.err | tail -1 | sed 's/^/CEDAR /' | tee -a /tmp/result.txt || true
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          s=open('/tmp/result.txt').read()
          pat=r'(STD|CEDAR) MSI_V36 total=(\d+) sort_ensure=(\d+) sort_ensure_pre=(\d+) app_pi=(\d+) app_pi_pre=(\d+) app_sort_pair=(\d+) let_sort_pair=(\d+) proj_ind=(\d+) proj_ind_pre=(\d+)'
          for m in re.finditer(pat,s):
              name,total,se,sep,ap,app,asp,lsp,pi,pip=m.groups()
              vals=list(map(int,(total,se,sep,ap,app,asp,lsp,pi,pip)))
              total,se,sep,ap,app,asp,lsp,pi,pip=vals
              def pct(a,b): return 0 if b==0 else 100*a/b
              print(f'{name}_SORT_ENSURE_PRE_PCT={pct(sep,se):.6f}')
              print(f'{name}_APP_PI_PRE_PCT={pct(app,ap):.6f}')
              print(f'{name}_PROJ_IND_PRE_PCT={pct(pip,pi):.6f}')
              fanout_sort=(1 if se else 0)+(1 if asp else 0)+(1 if lsp else 0)
              fanout_pi=(1 if ap else 0)
              fanout_ind=(1 if pi else 0)
              print(f'{name}_SORT_CONSUMER_FANOUT={fanout_sort}')
              print(f'{name}_PI_CONSUMER_FANOUT={fanout_pi}')
              print(f'{name}_IND_CONSUMER_FANOUT={fanout_ind}')
              winner=max([('SORT',se+asp+lsp,fanout_sort),('PI',ap,fanout_pi),('IND',pi,fanout_ind)], key=lambda x:(x[2],x[1]))
              print(f'{name}_FRONTIER_WINNER={winner[0]} events={winner[1]} fanout={winner[2]}')
          if 'MSI_V36' not in s:
              print('DECISION=INSUFFICIENT_TRACE')
          PY
          cat /tmp/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msi-semantic-rediscovery-frontier-v36
          path: |
            /tmp/result.txt
            /tmp/std.err
            /tmp/cedar.err
