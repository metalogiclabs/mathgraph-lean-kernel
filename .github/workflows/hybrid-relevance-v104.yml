name: Hybrid relevance frontier v104

on:
  push:
    branches:
      - experiment/hybrid-relevance-v104
    paths:
      - 'src/**'
      - 'experiments/run_hybrid_relevance_v104.sh'
      - '.github/workflows/hybrid-relevance-v104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run hybrid relevance qualification
        run: bash experiments/run_hybrid_relevance_v104.sh
      - name: Preserve v104 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-relevance-v104
          path: |
            /tmp/hybrid-relevance-v104/results.tsv
            /tmp/hybrid-relevance-v104/out/
            /tmp/hybrid-relevance-v104/perf-probe.csv
          if-no-files-found: warn
