name: MSI native interface v39 Gate D repair

on:
  push:
    branches: [msi-native-interface-v39]
    paths:
      - experiments/apply_post_sort_residual_probe_v39.py
      - .github/workflows/msi-native-interface-v39-gate-d-repair.yml
  workflow_dispatch:

jobs:
  post-sort-residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build deciding Std corpus
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          head -n 3000000 _build/tests/std.ndjson >/tmp/std3m.ndjson
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Materialize native Sort and post-Sort probe
        run: |
          set -euxo pipefail
          for arm in shared probe; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/v39-$arm
            cp experiments/apply_msi_sort_interface_regenesis_v37.py /tmp/v39-$arm/native_sort.py
            (cd /tmp/v39-$arm && python3 native_sort.py shared)
          done
          cp experiments/apply_post_sort_residual_probe_v39.py /tmp/v39-probe/post_sort_probe.py
          (cd /tmp/v39-probe && python3 post_sort_probe.py)
          cd arena
          for arm in shared probe; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/v39-$arm-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/v39-$arm/Cargo.toml --release --locked"
          done

      - name: Gate D native post-Sort residual frontier
        run: |
          set -euxo pipefail
          /tmp/v39-shared-target/release/sokonanoda /tmp/checker.json </tmp/std3m.ndjson >/tmp/shared.out 2>/tmp/shared.err
          /tmp/v39-probe-target/release/sokonanoda /tmp/checker.json </tmp/std3m.ndjson >/tmp/probe.out 2>/tmp/probe.err
          cmp /tmp/shared.out /tmp/probe.out
          grep 'MSI_V39_POST' /tmp/probe.err | tail -1 | tee /tmp/v39-post-sort-residual.txt
          python3 - <<'PY' | tee /tmp/v39-gate-d-result.txt
          import re
          s=open('/tmp/v39-post-sort-residual.txt').read()
          vals={k:int(v) for k,v in re.findall(r'(app_pi|app_pi_pre|proj_ind|proj_ind_pre)=(\d+)',s)}
          for k in ('app_pi','app_pi_pre','proj_ind','proj_ind_pre'):
              assert k in vals, (k,s)
          pi_gap=vals['app_pi']-vals['app_pi_pre']
          ind_gap=vals['proj_ind']-vals['proj_ind_pre']
          assert pi_gap >= 0 and ind_gap >= 0
          print(f"V39_POST_SORT_APP_PI={vals['app_pi']}")
          print(f"V39_POST_SORT_APP_PI_PRE={vals['app_pi_pre']}")
          print(f"V39_POST_SORT_APP_PI_REDISCOVERY_GAP={pi_gap}")
          print(f"V39_POST_SORT_PROJ_IND={vals['proj_ind']}")
          print(f"V39_POST_SORT_PROJ_IND_PRE={vals['proj_ind_pre']}")
          print(f"V39_POST_SORT_PROJ_IND_REDISCOVERY_GAP={ind_gap}")
          print('V39_POST_SORT_PI_FRONTIER=' + ('OPEN' if pi_gap > 0 else 'CLOSED'))
          print('V39_POST_SORT_INDUCTIVE_FRONTIER=' + ('OPEN' if ind_gap > 0 else 'CLOSED'))
          any_open = pi_gap > 0 or ind_gap > 0
          print('V39_POST_SORT_RESIDUAL_FRONTIER=' + ('OPEN' if any_open else 'CLOSED'))
          print('V39_DECISION=NATIVE_INTERFACE_TRANSFER_WITH_' + ('OPEN_RESIDUAL_FRONTIER' if any_open else 'NO_MEASURED_PI_OR_INDUCTIVE_RESIDUAL'))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-native-interface-v39-gate-d-repair
          path: |
            /tmp/v39-post-sort-residual.txt
            /tmp/v39-gate-d-result.txt
