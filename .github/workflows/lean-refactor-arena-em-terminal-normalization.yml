name: Lean Refactor Arena EM terminal normalization

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lean-refactor-arena-track1'
    paths:
      - 'competitions/lean_refactor_arena/experiments/em_terminal_normalization_v1.jsonl'
      - '.github/workflows/lean-refactor-arena-em-terminal-normalization.yml'

concurrency:
  group: lra-em-terminal-normalization
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      PUBLIC_REPO_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      TARGET_NAME: Electromagnetism.ElectromagneticPotential.time_deriv_time_deriv_electricField_of_isExtrema
      CANDIDATES: competitions/lean_refactor_arena/experiments/em_terminal_normalization_v1.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Physlib v4.32
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_REPO_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_REPO_SHA"
          (cd /tmp/lean-refactor/competition && ./build-all.sh v4.32)
      - name: Compare exact proof variants under public Arena
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/em-normalization-scores.jsonl
          for label in em_retained_567_control em_terminal_ring_nf em_terminal_ring1 em_terminal_nlinarith em_terminal_simp_ring em_terminal_ring_nf_simp em_hdiv_ring_nf em_hdiv_ring1 em_hcross_simp em_terminal_ring_only em_terminal_field_simp_only; do
            echo "CHECK=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.32 \
              --name "$TARGET_NAME" --candidate "$CANDIDATES" --label "$label"
            (cd /tmp/lean-refactor/competition && python3 arena.py check --name "$TARGET_NAME") \
              > /tmp/em-normalization-one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' /tmp/em-normalization-one.json \
              >> /tmp/em-normalization-scores.jsonl
          done
      - name: Report admissible gains and exact failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(s) for s in pathlib.Path('/tmp/em-normalization-scores.jsonl').read_text().splitlines() if s.strip()]
          assert len(rows)==11,len(rows)
          valid=lambda r:bool(r.get('compiled') and r.get('statement_ok') and r.get('eligible') and
            float(r.get('survival_pct') or 0)==100 and not r.get('forbidden') and not r.get('extra_toplevel_decls'))
          control=next(r for r in rows if r['candidate_label']=='em_retained_567_control')
          assert valid(control),'EM_CONTROL_FAILED'
          qualified=[r for r in rows if valid(r) and r['candidate_label']!='em_retained_567_control']
          baseline=float(control['objective_sum_pct'])
          improvements=[r for r in qualified if float(r.get('objective_sum_pct') or 0)>max(baseline,120.75)]
          best=max(improvements,key=lambda r:float(r['objective_sum_pct']),default=None)
          out={'schema':'mathgraph.lra.em.terminal-normalization.v1',
            'status':'WARRANTED_PRIMARY_GAIN' if best else 'NO_VERIFIED_GAIN',
            'control':{'tokens':control['length'],'heartbeats':control['heartbeats'],
              'objective':control['objective_sum_pct']},
            'verified_candidates':[{'label':r['candidate_label'],'tokens':r.get('length'),
              'heartbeats':r.get('heartbeats'),'objective':r.get('objective_sum_pct')} for r in qualified],
            'best':None if best is None else {'label':best['candidate_label'],
              'tokens':best['length'],'heartbeats':best['heartbeats'],'objective':best['objective_sum_pct']},
            'failures':[{'label':r['candidate_label'],'errors':(r.get('per_version') or [{}])[0].get('errors')} for r in rows if not valid(r)],
            'boundary':'Pinned v4.32 Physlib only, no official leaderboard claim.'}
          pathlib.Path('/tmp/em-normalization-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-em-terminal-normalization
          path: |
            /tmp/em-normalization-scores.jsonl
            /tmp/em-normalization-summary.json
