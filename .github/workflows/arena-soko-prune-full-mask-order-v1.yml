name: Full Mathlib verified mask-containment and pruning quotient census
on:
  push:
    branches: [arena-soko-prune-full-mask-order-v1]
    paths:
      - 'experiments/arena_soko_prune_full_mask_order_v1.py'
      - '.github/workflows/arena-soko-prune-full-mask-order-v1.yml'
      - 'experiments/arena_soko_prune_causal_census_patch_v1.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-soko-prune-full-mask-order-v1
  cancel-in-progress: true
jobs:
  exact-mathlib-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin Arena and checker source with diagnostic-only counters
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/prune-full-arena
          git -C /tmp/prune-full-arena checkout --detach b83254de5146ef34147ab82a48edbe1856b0edcc
          git clone -q https://github.com/intgrah/sokonanoda /tmp/prune-full-source
          git -C /tmp/prune-full-source checkout --detach 7645b1e1fcacfe410c99141f1234381d995b325d
          python3 experiments/arena_soko_sparse_patch_v1.py /tmp/prune-full-source
          python3 experiments/arena_soko_growth_patch_v1.py /tmp/prune-full-source
          python3 experiments/arena_soko_env_extend_singleprobe_patch_v1.py /tmp/prune-full-source
          python3 experiments/arena_soko_prune_causal_census_patch_v1.py /tmp/prune-full-source
          git -C /tmp/prune-full-source diff --check
          mkdir -p /tmp/prune-full-evidence
          git -C /tmp/prune-full-source diff -- src/checker/cache.rs src/checker/eval/environment.rs src/checker/ptrmap.rs > /tmp/prune-full-evidence/source-diagnostic.patch
          CARGO_TARGET_DIR=/tmp/prune-full-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked --manifest-path /tmp/prune-full-source/Cargo.toml
          cp /tmp/prune-full-target/release/sokonanoda /tmp/prune-full-diagnostic.bin
          sha256sum /tmp/prune-full-diagnostic.bin | tee /tmp/prune-full-evidence/binary.sha256
      - name: Rebuild original Arena Mathlib export with exact authority
        run: |
          set -euo pipefail
          cd /tmp/prune-full-arena
          nix develop -c ./lka.py build-test mathlib
      - name: Check every declaration and tally semantic pruning branches and traversal shapes
        run: |
          set -euo pipefail
          python3 experiments/arena_soko_prune_full_mask_order_v1.py /tmp/prune-full-arena/_build/tests/mathlib.ndjson /tmp/prune-full-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-Mathlib-prune-mask-order-${{ github.sha }}
          path: /tmp/prune-full-evidence/
          if-no-files-found: warn
