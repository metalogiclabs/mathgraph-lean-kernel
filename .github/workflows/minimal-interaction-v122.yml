name: Minimal interaction boundary v122

on:
  push:
    branches:
      - experiment/minimal-interaction-v122
    paths:
      - '.github/workflows/minimal-interaction-v122.yml'
      - 'experiments/run_interaction_v121_one.sh'
      - 'scripts/apply_causal_contraction_v120.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  interaction:
    strategy:
      fail-fast: false
      matrix:
        mask: [0, 5, 6, 9, 10, 17, 20, 65, 68, 80, 7, 11, 13, 14, 21, 69, 81, 84, 15, 85]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V121_MASK: ${{ matrix.mask }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run minimal interaction cell
        run: bash experiments/run_interaction_v121_one.sh
      - name: Preserve V122 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v122-mask-${{ matrix.mask }}
          path: /tmp/interaction-v121-${{ matrix.mask }}/report/
          if-no-files-found: warn
