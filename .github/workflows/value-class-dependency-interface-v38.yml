name: Value class dependency interface v38

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/run_value_class_dependency_interface_v38.sh'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute v38 value-class dependency-interface census
        shell: bash
        run: bash experiments/run_value_class_dependency_interface_v38.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: value-class-dependency-interface-v38
          path: |
            /tmp/v38-census.txt
            /tmp/v38-decision.txt
            /tmp/v38-base.err
            /tmp/v38-census.err
