name: Con-leche memory probe v99

on:
  push:
    paths:
      - 'experiments/run_conleche_memory_probe_v99.sh'
      - '.github/workflows/conleche-memory-probe-v99.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Probe con-leche memory by thread count
        run: bash experiments/run_conleche_memory_probe_v99.sh
      - name: Preserve memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conleche-memory-v99
          path: |
            /tmp/v99-memory/memory.json
            /tmp/v99-memory/out/
          if-no-files-found: warn
