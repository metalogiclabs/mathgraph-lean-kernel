name: Differential NDJSON disagreement census

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/infer-projection-fusion.yml'
      - 'experiments/diff-census/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate the two orphan-recursor boundary variants
        run: |
          set -euo pipefail
          mkdir -p /tmp/seeds
          cp experiments/diff-census/*.ndjson /tmp/seeds/
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=Path('/tmp/seeds/03-control.ndjson')
          rows=[json.loads(x) for x in src.read_text().splitlines()]
          for label, allv in [('03-case', []), ('03-decoy', [1])]:
              out=[]
              for row in rows:
                  if 'inductive' in row:
                      r={"all":allv,"isUnsafe":False,"k":False,"levelParams":[],"name":7,
                         "numIndices":0,"numMinors":0,"numMotives":0,"numParams":0,"rules":[],"type":2}
                      row['inductive']['recs'].append(r)
                  if 'axiom' in row and row['axiom'].get('name') == 7:
                      continue
                  out.append(row)
              Path(f'/tmp/seeds/{label}.ndjson').write_text('\n'.join(json.dumps(x,separators=(',',':')) for x in out)+'\n')
          PY
          sha256sum /tmp/seeds/*

      - name: Build pinned nanoda and frozen MathGraph
        run: |
          set -euo pipefail
          git clone https://github.com/robsimmons/nanoda_lib.git /tmp/nanoda
          git -C /tmp/nanoda checkout --detach 6ae1f0cd962f081f6c423454c5da729d841236a7
          cargo build --release --locked --manifest-path /tmp/nanoda/Cargo.toml
          git worktree add /tmp/mathgraph 3d7585c21242f29fdaa48ae9a16e16c6afe42238
          cargo build --release --locked --manifest-path /tmp/mathgraph/Cargo.toml
          cp /tmp/nanoda/target/release/nanoda_bin /tmp/nanoda-bin
          cp /tmp/mathgraph/target/release/sokonanoda /tmp/mathgraph-bin

      - name: Run outcome-vector census
        run: |
          set -u
          printf 'policy\tseed\tnanoda\tmathgraph\n' > /tmp/census.tsv
          classify() {
            rc="$1"; err="$2"
            if [ "$rc" -eq 0 ]; then echo accept
            elif grep -qiE 'panicked at|thread .* panicked|Option::unwrap|assertion failed' "$err"; then echo panic
            else echo reject
            fi
          }
          run_nanoda() {
            seed="$1"; policy="$2"; err="$3"
            if [ "$policy" = permissive ]; then extra='"unsafe_permit_all_axioms":true,"unpermitted_axiom_hard_error":false';
            else extra='"unpermitted_axiom_hard_error":true,"permitted_axioms":[]'; fi
            cfg=$(mktemp)
            printf '{"export_file_path":"%s",%s,"nat_extension":true,"string_extension":true,"print_success_message":false,"print_axioms":false,"pp_to_stdout":false}\n' "$seed" "$extra" > "$cfg"
            /tmp/nanoda-bin "$cfg" >/dev/null 2>"$err"; rc=$?
            rm -f "$cfg"; classify "$rc" "$err"
          }
          run_mathgraph() {
            seed="$1"; policy="$2"; err="$3"
            if [ "$policy" = permissive ]; then extra='"unsafe_permit_all_axioms":true,"unpermitted_axiom_hard_error":false';
            else extra='"unpermitted_axiom_hard_error":true,"permitted_axioms":[]'; fi
            cfg=$(mktemp)
            printf '{"use_stdin":true,%s,"nat_extension":true,"string_extension":true,"num_threads":1,"print_success_message":false}\n' "$extra" > "$cfg"
            /tmp/mathgraph-bin "$cfg" < "$seed" >/dev/null 2>"$err"; rc=$?
            rm -f "$cfg"; classify "$rc" "$err"
          }
          for policy in permissive strict; do
            for seed in /tmp/seeds/*.ndjson; do
              name=$(basename "$seed" .ndjson)
              nerr=/tmp/nanoda-${policy}-${name}.err
              merr=/tmp/mathgraph-${policy}-${name}.err
              n=$(run_nanoda "$seed" "$policy" "$nerr")
              m=$(run_mathgraph "$seed" "$policy" "$merr")
              printf '%s\t%s\t%s\t%s\n' "$policy" "$name" "$n" "$m" | tee -a /tmp/census.tsv
              echo "--- nanoda $policy $name ---"; tail -n 4 "$nerr" || true
              echo "--- mathgraph $policy $name ---"; tail -n 4 "$merr" || true
            done
          done
          echo '=== DISAGREEMENT CLASSES ==='
          python3 - <<'PY'
          import csv, collections
          rows=list(csv.DictReader(open('/tmp/census.tsv'), delimiter='\t'))
          classes=collections.defaultdict(list)
          for r in rows: classes[(r['nanoda'],r['mathgraph'])].append((r['policy'],r['seed']))
          for vec,members in sorted(classes.items()): print(f'{vec[0]} / {vec[1]}: {len(members)} -> {members}')
          print(f'distinct_vectors={len(classes)}')
          PY
          echo '=== CENSUS TSV ==='
          cat /tmp/census.tsv
