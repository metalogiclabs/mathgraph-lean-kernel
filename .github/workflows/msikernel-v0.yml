name: msikernel v0

on:
  push:
    branches: [msikernel-v0]

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build corpora and checkers
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 1000000 _build/tests/std.ndjson >/tmp/std-1m.ndjson
          head -n 1000000 _build/tests/cedar.ndjson >/tmp/cedar-1m.ndjson
          cd ..

          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/msi-base

          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/msi-base-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/msi-base/Cargo.toml --release --locked"
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/msikernel-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path $GITHUB_WORKSPACE/Cargo.toml --release --locked"
          nix develop -c bash -euxo pipefail -c "cargo test --manifest-path $GITHUB_WORKSPACE/Cargo.toml --locked"

          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Correctness and deterministic work gate
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          nix shell nixpkgs#valgrind -c valgrind --version

          for corpus in std cedar; do
            /tmp/msi-base-target/release/sokonanoda /tmp/checker.json </tmp/$corpus-1m.ndjson >/tmp/$corpus-base.out
            /tmp/msikernel-target/release/sokonanoda /tmp/checker.json </tmp/$corpus-1m.ndjson >/tmp/$corpus-msi.out
            cmp /tmp/$corpus-base.out /tmp/$corpus-msi.out
            echo "${corpus^^}_OUTPUT_EQ=PASS" | tee -a /tmp/result.txt

            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$corpus-base /tmp/msi-base-target/release/sokonanoda /tmp/checker.json </tmp/$corpus-1m.ndjson >/tmp/$corpus-base-cg.out 2>/tmp/$corpus-base-cg.err
            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$corpus-msi /tmp/msikernel-target/release/sokonanoda /tmp/checker.json </tmp/$corpus-1m.ndjson >/tmp/$corpus-msi-cg.out 2>/tmp/$corpus-msi-cg.err
            cmp /tmp/$corpus-base.out /tmp/$corpus-base-cg.out
            cmp /tmp/$corpus-base.out /tmp/$corpus-msi-cg.out

            python3 - "$corpus" <<'PY' | tee -a /tmp/result.txt
          import re, sys
          c=sys.argv[1]
          def read(mode):
              s=open(f'/tmp/cg-{c}-{mode}').read()
              m=re.search(r'^summary:\s+(\d+)',s,re.M)
              if not m: raise SystemExit(f'no callgrind summary {c} {mode}')
              return int(m.group(1))
          b=read('base'); m=read('msi')
          u=c.upper()
          print(f'{u}_BASE_INSTR={b}')
          print(f'{u}_MSI_INSTR={m}')
          print(f'{u}_MSI_DELTA_PCT={100*(m-b)/b:.6f}')
          print(f'{u}_DECISION=' + ('MSIKERNEL_WORK_REDUCED' if m < b else 'MSIKERNEL_WORK_NOT_REDUCED'))
          PY
          done

          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: msikernel-v0-results
          path: /tmp/result.txt
