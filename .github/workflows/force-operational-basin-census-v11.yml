name: force_all operational basin census v11

on:
  push:
    branches: [experiment/force-operational-basin-census-v11]
    paths:
      - '.github/workflows/force-operational-basin-census-v11.yml'
      - 'experiments/force-operational-basin-census-v11.trigger'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31

      - name: Freeze kernel and install operational census
        shell: bash
        run: |
          set -euxo pipefail
          BASE=2de1895a52d21ad266b77002defe3e6bc69bbcfd
          git worktree add /tmp/v11 "$BASE"
          cd /tmp/v11
          cargo test --locked
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/eval.rs'); s=p.read_text()
          s=s.replace('use std::cell::OnceCell;','use std::cell::OnceCell;\nuse std::sync::atomic::{AtomicU64, Ordering};')
          anchor="pub(crate) type SpineArgs<'t> = smallvec::SmallVec<[V<'t>; 8]>;"
          inject=r'''pub(crate) type SpineArgs<'t> = smallvec::SmallVec<[V<'t>; 8]>;

static FC_CALLS: AtomicU64 = AtomicU64::new(0);
static FC_CACHE: AtomicU64 = AtomicU64::new(0);
static FC_CACHE_SAME: AtomicU64 = AtomicU64::new(0);
static FC_TERMINAL: AtomicU64 = AtomicU64::new(0);
static FC_TERMINAL_SAME: AtomicU64 = AtomicU64::new(0);
static FC_THUNK: AtomicU64 = AtomicU64::new(0);
static FC_THUNK_SAME: AtomicU64 = AtomicU64::new(0);
static FC_UNFOLD: AtomicU64 = AtomicU64::new(0);
static FC_UNFOLD_SAME: AtomicU64 = AtomicU64::new(0);
static FC_IOTA: AtomicU64 = AtomicU64::new(0);
static FC_IOTA_SAME: AtomicU64 = AtomicU64::new(0);
static FC_THUNK_FORCE: AtomicU64 = AtomicU64::new(0);
static FC_UNFOLD_TRY: AtomicU64 = AtomicU64::new(0);
static FC_UNFOLD_REDUCED: AtomicU64 = AtomicU64::new(0);
static FC_IOTA_REDUCED: AtomicU64 = AtomicU64::new(0);
static FC_IOTA_DESCEND: AtomicU64 = AtomicU64::new(0);
static FC_FIRE_SUCCESS: AtomicU64 = AtomicU64::new(0);
static FC_FIRE_STUCK: AtomicU64 = AtomicU64::new(0);
static FC_ZERO_STEP: AtomicU64 = AtomicU64::new(0);

pub fn force_census_report() {
    let g=|x:&AtomicU64| x.load(Ordering::Relaxed);
    eprintln!("FORCE_CENSUS calls={} cache={} cache_same={} terminal={} terminal_same={} thunk={} thunk_same={} unfold={} unfold_same={} iota={} iota_same={} thunk_force={} unfold_try={} unfold_reduced={} iota_reduced={} iota_descend={} fire_success={} fire_stuck={} zero_step={}",
      g(&FC_CALLS),g(&FC_CACHE),g(&FC_CACHE_SAME),g(&FC_TERMINAL),g(&FC_TERMINAL_SAME),g(&FC_THUNK),g(&FC_THUNK_SAME),g(&FC_UNFOLD),g(&FC_UNFOLD_SAME),g(&FC_IOTA),g(&FC_IOTA_SAME),g(&FC_THUNK_FORCE),g(&FC_UNFOLD_TRY),g(&FC_UNFOLD_REDUCED),g(&FC_IOTA_REDUCED),g(&FC_IOTA_DESCEND),g(&FC_FIRE_SUCCESS),g(&FC_FIRE_STUCK),g(&FC_ZERO_STEP));
}'''
          assert anchor in s; s=s.replace(anchor,inject,1)
          old="""    pub(crate) fn force_all(&mut self, depth: u32, v: V<'t>) -> V<'t> {\n        if let Some(r) = self.store_lookup(depth, v) {\n            return r;\n        }\n        let mut cur = v;"""
          new="""    pub(crate) fn force_all(&mut self, depth: u32, v: V<'t>) -> V<'t> {\n        FC_CALLS.fetch_add(1, Ordering::Relaxed);\n        if let Some(r) = self.store_lookup(depth, v) {\n            FC_CACHE.fetch_add(1, Ordering::Relaxed);\n            if std::ptr::eq(r, v) { FC_CACHE_SAME.fetch_add(1, Ordering::Relaxed); }\n            return r;\n        }\n        let basin = match v {\n            Value::Thunk { .. } => { FC_THUNK.fetch_add(1, Ordering::Relaxed); 1u8 },\n            Value::Unfold { .. } => { FC_UNFOLD.fetch_add(1, Ordering::Relaxed); 2u8 },\n            Value::Rigid { head: RigidHead::Recursor(..) | RigidHead::QuotConst(..), .. } => { FC_IOTA.fetch_add(1, Ordering::Relaxed); 3u8 },\n            _ => { FC_TERMINAL.fetch_add(1, Ordering::Relaxed); 0u8 },\n        };\n        let mut cur = v;"""
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('Value::Thunk { .. } => cur = self.force_thunk(depth, cur),','Value::Thunk { .. } => { FC_THUNK_FORCE.fetch_add(1, Ordering::Relaxed); cur = self.force_thunk(depth, cur) },',1)
          s=s.replace('Value::Unfold { .. } => {\n                        let next = self.unfold_value(depth, cur);','Value::Unfold { .. } => {\n                        FC_UNFOLD_TRY.fetch_add(1, Ordering::Relaxed);\n                        let next = self.unfold_value(depth, cur);',1)
          s=s.replace('steps += 1;\n                        cur = next;','steps += 1;\n                        FC_UNFOLD_REDUCED.fetch_add(1, Ordering::Relaxed);\n                        cur = next;',1)
          s=s.replace('ForceStep::Reduced(next) => {\n                    steps += 1;','ForceStep::Reduced(next) => {\n                    FC_IOTA_REDUCED.fetch_add(1, Ordering::Relaxed);\n                    steps += 1;',1)
          s=s.replace('ForceStep::Descend(major) => {\n                    waiting.push(cur);','ForceStep::Descend(major) => {\n                    FC_IOTA_DESCEND.fetch_add(1, Ordering::Relaxed);\n                    waiting.push(cur);',1)
          s=s.replace('Some(res) => {\n                                self.tc_cache.iota_cache.insert(key, res);','Some(res) => {\n                                FC_FIRE_SUCCESS.fetch_add(1, Ordering::Relaxed);\n                                self.tc_cache.iota_cache.insert(key, res);',1)
          s=s.replace('None => {\n                                self.tc_cache.iota_stuck.insert(key);','None => {\n                                FC_FIRE_STUCK.fetch_add(1, Ordering::Relaxed);\n                                self.tc_cache.iota_stuck.insert(key);',1)
          oldend='''        self.note_whnf(depth, v, result, steps);\n        result'''
          newend='''        if steps == 0 { FC_ZERO_STEP.fetch_add(1, Ordering::Relaxed); }\n        if std::ptr::eq(result, v) {\n            match basin {\n                0 => { FC_TERMINAL_SAME.fetch_add(1, Ordering::Relaxed); },\n                1 => { FC_THUNK_SAME.fetch_add(1, Ordering::Relaxed); },\n                2 => { FC_UNFOLD_SAME.fetch_add(1, Ordering::Relaxed); },\n                3 => { FC_IOTA_SAME.fetch_add(1, Ordering::Relaxed); },\n                _ => {}\n            }\n        }\n        self.note_whnf(depth, v, result, steps);\n        result'''
          assert oldend in s; s=s.replace(oldend,newend,1)
          p.write_text(s)

          p=Path('src/main.rs'); s=p.read_text()
          anchor='''    match out {\n        Ok(Some(msg)) => println!("{}", msg),'''
          repl='''    sokonanoda::eval::force_census_report();\n    match out {\n        Ok(Some(msg)) => println!("{}", msg),'''
          assert anchor in s; p.write_text(s.replace(anchor,repl,1))
          PY
          CARGO_TARGET_DIR=/tmp/v11-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked
          cp /tmp/v11-target/release/sokonanoda /tmp/v11-census-bin
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' >/tmp/v11-checker.json

      - name: Build frozen Arena workloads
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena /tmp/v11-arena
          cd /tmp/v11-arena
          git checkout f0fe3b379dbce91537417b529140d0ca250f271c
          for T in perf/app-lam perf/beta-ladder perf/let-ladder perf/grind-ring-5; do nix develop -c ./lka.py build-test "$T"; done

      - name: Run operational census and verify semantics
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/v11
          git checkout -- src/eval.rs src/main.rs
          CARGO_TARGET_DIR=/tmp/v11-base-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked
          cp /tmp/v11-base-target/release/sokonanoda /tmp/v11-base-bin
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,re
          arena=Path('/tmp/v11-arena'); tests=['app-lam','beta-ladder','let-ladder','grind-ring-5']; rows=[]
          for t in tests:
              f=arena/f'_build/tests/perf/{t}.ndjson'
              with f.open('rb') as i:
                  b=subprocess.run(['/tmp/v11-base-bin','/tmp/v11-checker.json'],stdin=i,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              with f.open('rb') as i:
                  c=subprocess.run(['/tmp/v11-census-bin','/tmp/v11-checker.json'],stdin=i,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              assert b.stdout==c.stdout, f'semantic stdout mismatch {t}'
              line=next(x for x in c.stderr.decode().splitlines() if x.startswith('FORCE_CENSUS '))
              d={k:int(v) for k,v in re.findall(r'(\w+)=(\d+)',line)}; d['test']=t; rows.append(d)
              print(t,line)
          Path('/tmp/v11-census.json').write_text(json.dumps(rows,indent=2))
          print('SEMANTIC_REPLAY=EXACT')
          PY

      - name: Derive basin ranking and next-generation grammar
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/v11-decision.txt
          from pathlib import Path
          import json,csv
          rs=json.loads(Path('/tmp/v11-census.json').read_text())
          keys=['cache','terminal','thunk','unfold','iota']
          agg={k:0 for k in keys}; same={k:0 for k in keys}
          for r in rs:
              for k in keys: agg[k]+=r.get(k,0); same[k]+=r.get(k+'_same',0)
          total=sum(agg.values())
          rows=[]
          for k in keys:
              n=agg[k]; sr=(same[k]/n if n else 0.0)
              unresolved = k in ('thunk','unfold','iota')
              # Priority is deliberately evidence-only: mass times consequence degeneracy.
              # Prefix cost is measured in the next separator experiment, not invented here.
              score=n*sr if unresolved else 0.0
              rows.append({'basin':k,'calls':n,'share':n/total if total else 0,'same':same[k],'same_rate':sr,'unresolved':unresolved,'priority':score})
          rows.sort(key=lambda x:x['priority'],reverse=True)
          with open('/tmp/v11-ranking.csv','w',newline='') as f:w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          print('TOTAL_CLASSIFIED',total)
          for x in rows: print(f"BASIN {x['basin']} calls={x['calls']} share={x['share']:.4%} same_rate={x['same_rate']:.4%} priority={x['priority']:.1f}")
          active=[x for x in rows if x['unresolved'] and x['calls']]
          winner=active[0]['basin'] if active else 'none'
          actions={k:sum(r.get(k,0) for r in rs) for k in ['thunk_force','unfold_try','unfold_reduced','iota_reduced','iota_descend','fire_success','fire_stuck','zero_step']}
          print('ACTIONS',json.dumps(actions,sort_keys=True))
          grammar={
            'thunk':['deferred-evaluation predicate','environment-demand predicate','expression-loose-bvar predicate','force-thunk memo/identity separator'],
            'unfold':['unfold-hint predicate','stuck-vs-reducing unfold predicate','continuation/depth predicate','head-demand predicate'],
            'iota':['pending-spine-action predicate','major-shape predicate','stuck-vs-fire predicate','descend-demand predicate'],
            'none':['force_all caller/demand grammar']
          }[winner]
          out={'residual':'constructor-membership plateau','selected_unresolved_basin':winner,'ranking':rows,'actions':actions,'next_candidate_grammar':grammar,'rule':'measure prefix-cost separators next; do not infer speedup from census alone'}
          Path('/tmp/v11-residual.json').write_text(json.dumps(out,indent=2))
          print('SELECTED_UNRESOLVED_BASIN='+winner)
          print('NEXT_GRAMMAR='+','.join(grammar))
          print('DECISION=MEASURE_PREFIX_COST_SEPARATOR_FOR_SELECTED_BASIN')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: force-operational-basin-census-v11
          path: |
            /tmp/v11-census.json
            /tmp/v11-ranking.csv
            /tmp/v11-residual.json
            /tmp/v11-decision.txt
