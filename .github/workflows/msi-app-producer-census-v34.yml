name: MSI app producer census v34

on:
  push:
    branches: [msi-app-producer-census-v34]
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          set_as_trusted_user: true
      - name: Prepare workloads and instrumented checker
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 2000000 _build/tests/std.ndjson >/tmp/std-2m.ndjson
          head -n 2000000 _build/tests/cedar.ndjson >/tmp/cedar-2m.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/v34
          cp experiments/apply_msi_app_producer_census_v34.py /tmp/v34/patch.py
          (cd /tmp/v34 && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/v34-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/v34/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Measure producer recoverability
        shell: bash
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          /tmp/v34-target/release/sokonanoda /tmp/checker.json </tmp/std-2m.ndjson >/tmp/std.out 2>/tmp/std.err
          /tmp/v34-target/release/sokonanoda /tmp/checker.json </tmp/cedar-2m.ndjson >/tmp/cedar.out 2>/tmp/cedar.err
          grep 'MSI_V34' /tmp/std.err | tail -1 | sed 's/^/STD /' | tee -a /tmp/result.txt || true
          grep 'MSI_V34' /tmp/cedar.err | tail -1 | sed 's/^/CEDAR /' | tee -a /tmp/result.txt || true
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          s=open('/tmp/result.txt').read()
          for name in ('STD','CEDAR'):
              m=re.search(rf'{name} MSI_V34 total=(\d+) arg_sort=(\d+) arg_var=(\d+) arg_const=(\d+) arg_app=(\d+) arg_other=(\d+)',s)
              if not m:
                  print(f'{name}_DECISION=INSUFFICIENT_EQ_SORT_HITS')
                  continue
              total,*xs=map(int,m.groups())
              sort,var,const,app,other=xs
              print(f'{name}_ARG_SORT_SHARE_PCT={100*sort/total:.6f}')
              print(f'{name}_DIRECT_ATOMIC_SHARE_PCT={100*(sort+var+const)/total:.6f}')
              print(f'{name}_DECISION=' + ('PRODUCER_STATIC_DOMINANT' if (sort+var+const)/total >= .95 else 'PRODUCER_STATIC_NOT_DOMINANT'))
          PY
          cat /tmp/result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: msi-app-producer-census-v34
          path: |
            /tmp/result.txt
            /tmp/std.err
            /tmp/cedar.err
