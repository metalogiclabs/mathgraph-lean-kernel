name: Checker phylogeny conversion census

on:
  pull_request:
    paths:
      - 'scripts/run_conversion_choice_census.sh'
      - '.github/workflows/checker-phylogeny-conversion-census.yml'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Run exact-V2 conversion choice census
        run: bash scripts/run_conversion_choice_census.sh
      - name: Upload census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checker-phylogeny-conversion-census
          path: |
            conv-census.txt
            conv-decision.txt
          if-no-files-found: warn
