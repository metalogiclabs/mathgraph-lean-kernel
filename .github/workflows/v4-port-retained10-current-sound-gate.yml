name: V4 port retained10 to repaired MathGraph baseline

on:
  workflow_dispatch:
  push:
    branches: [mathgraph-v4-bvdecide-residual]
    paths: ['.github/workflows/v4-port-retained10-current-sound-gate.yml']

jobs:
  port-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Clone exact current official Arena
        run: |
          set -euxo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena rev-parse HEAD | tee /tmp/arena-rev.txt

      - name: Materialize repaired baseline and retained10 port
        run: |
          set -euxo pipefail
          REPAIRED=04dda5073af0b32977fb1abf145a684711808d3b
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/repaired
          git -C /tmp/repaired checkout "$REPAIRED"
          cp -a /tmp/repaired /tmp/retained10

          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/5a1485ae13a0623ca8b7001aee9e0e155381daad/experiments/apply_v4_retained6.py -o /tmp/apply.py
          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/9930bd398cf576f61a3d625e72c2c1490deb59fd/experiments/apply_v4_step21_prune_retention.py -o /tmp/retention.py
          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/10d9de63a59e2c0e5c667f2445aefd0c77e69370/experiments/apply_v4_step24_eval_open_cache_fusion.py -o /tmp/fuse.py
          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/bfc66ac6a3ceb07f8b45bd0ebbd3684ca5d69892/experiments/apply_v4_step26_app_fun_smallvec.py -o /tmp/step26.py

          python3 /tmp/apply.py /tmp/retained10
          grep -q 'WHNF_ADMIT_THRESHOLD: u8 = 2' /tmp/retained10/src/eval.rs
          sed -i 's/WHNF_ADMIT_THRESHOLD: u8 = 2/WHNF_ADMIT_THRESHOLD: u8 = 1/' /tmp/retained10/src/eval.rs
          python3 /tmp/retention.py /tmp/retained10 nocold
          python3 /tmp/fuse.py /tmp/retained10
          python3 /tmp/step26.py /tmp/retained10

          git -C /tmp/repaired branch -f repaired-local HEAD
          git -C /tmp/retained10 add src
          git -C /tmp/retained10 -c user.name=arena -c user.email=arena@example.invalid commit -m 'Port retained10 onto repaired baseline'
          git -C /tmp/retained10 branch -f retained10-port-local HEAD
          git -C /tmp/repaired rev-parse HEAD | tee /tmp/repaired-rev.txt
          git -C /tmp/retained10 rev-parse HEAD | tee /tmp/retained10-rev.txt
          git -C /tmp/retained10 diff "$REPAIRED"..HEAD -- src > /tmp/retained10-port.diff

      - name: Register runner-local checkers
        run: |
          set -euxo pipefail
          BASE_REV=$(cat /tmp/repaired-rev.txt)
          CAND_REV=$(cat /tmp/retained10-rev.txt)
          cat > /tmp/checker-template.yaml <<'EOF'
          description: runner-local V4 qualification checker
          url: __URL__
          ref: __REF__
          rev: __REV__
          build: |
            cat > config.json <<__END__
            {
              "use_stdin": true,
              "nat_extension": true,
              "string_extension": true,
              "unpermitted_axiom_hard_error": false,
              "unsafe_permit_all_axioms": true,
              "num_threads": 4
            }
            __END__
            ROOT=$(cd ../../../.. && pwd)
            "$ROOT/lka.py" build-test init-prelude
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release --locked
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
          run: |
            target/release/sokonanoda config.json < "$IN" || exit 1
          EOF
          sed -e 's|__URL__|file:///tmp/repaired|' -e 's|__REF__|repaired-local|' -e "s|__REV__|$BASE_REV|" /tmp/checker-template.yaml > arena/checkers/mathgraph-repaired-private.yaml
          sed -e 's|__URL__|file:///tmp/retained10|' -e 's|__REF__|retained10-port-local|' -e "s|__REV__|$CAND_REV|" /tmp/checker-template.yaml > arena/checkers/mathgraph-retained10-port-private.yaml

      - name: Build all official tests
        run: |
          set -euxo pipefail
          cd arena
          nix develop -c ./lka.py build-test

      - name: Build both checkers with official harness
        run: |
          set -euxo pipefail
          cd arena
          nix develop -c ./lka.py build-checker mathgraph-repaired-private
          nix develop -c ./lka.py build-checker mathgraph-retained10-port-private

      - name: Run repaired baseline on all official tests
        id: base
        continue-on-error: true
        run: |
          set -euxo pipefail
          cd arena
          nix develop -c ./lka.py run mathgraph-repaired-private 2>&1 | tee /tmp/repaired-run.log

      - name: Run retained10 port on all official tests
        id: cand
        continue-on-error: true
        run: |
          set -euxo pipefail
          cd arena
          nix develop -c ./lka.py run mathgraph-retained10-port-private 2>&1 | tee /tmp/retained10-run.log

      - name: Summarize gate
        if: always()
        run: |
          set -euxo pipefail
          {
            echo "ARENA_REV=$(cat /tmp/arena-rev.txt)"
            echo "REPAIRED_REV=$(cat /tmp/repaired-rev.txt)"
            echo "RETAINED10_PORT_REV=$(cat /tmp/retained10-rev.txt)"
            echo "BASE_OUTCOME=${{ steps.base.outcome }}"
            echo "CAND_OUTCOME=${{ steps.cand.outcome }}"
          } | tee /tmp/summary.txt
          echo '--- BASE TAIL ---' | tee -a /tmp/summary.txt
          tail -n 120 /tmp/repaired-run.log 2>/dev/null | tee -a /tmp/summary.txt || true
          echo '--- CAND TAIL ---' | tee -a /tmp/summary.txt
          tail -n 120 /tmp/retained10-run.log 2>/dev/null | tee -a /tmp/summary.txt || true
          test "${{ steps.base.outcome }}" = success
          test "${{ steps.cand.outcome }}" = success

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-retained10-current-sound-port-gate
          path: |
            /tmp/summary.txt
            /tmp/arena-rev.txt
            /tmp/repaired-rev.txt
            /tmp/retained10-rev.txt
            /tmp/retained10-port.diff
            /tmp/repaired-run.log
            /tmp/retained10-run.log
            arena/_out
