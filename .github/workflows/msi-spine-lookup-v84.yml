name: MSI spine lookup v84
on:
  push:
    branches:
      - experiment/msi-spine-lookup-v84
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run frozen spine lookup tournament
        run: bash experiments/run_msi_spine_lookup_v84.sh
      - name: Upload v84 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-spine-lookup-v84
          path: |
            /tmp/v84/summary.txt
            /tmp/v84/attachment.csv
            /tmp/v84/timings.csv
            /tmp/v84/binaries.csv
            /tmp/v84/out
            /tmp/v84/candidate/src/eval.rs
            /tmp/v84/control/src/eval.rs
          if-no-files-found: warn
