name: Authenticated sparse acceptance receipt qualification
on:
  push:
    branches: [research/incremental-sparse-acceptance-20261017]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  sparse-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Build exact pinned tools and run receipt falsifiers
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash experiments/incremental/setup.sh
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          cargo +1.95.0 test --release --locked --lib
          cargo +1.95.0 test --release --locked --bin index-session
          python3 experiments/incremental/test_sparse_index_wire.py -v
          python3 experiments/incremental/test_sparse_acceptance.py -v
          python3 experiments/incremental/test_delta_reuse.py
          python3 experiments/incremental/test_source_delta_authority.py
          python3 -m py_compile experiments/incremental/benchmark_sparse_acceptance.py
      - name: Construct exact pinned original and expanded genuine Lean Std exports
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          bash experiments/incremental/build_delta_producer.sh artifacts/delta-build
          python3 experiments/incremental/build_workloads.py --out artifacts/workloads
          python3 experiments/incremental/build_delta_workloads.py \
            --workloads artifacts/workloads --out artifacts/expanded \
            --producer artifacts/delta-build/delta-producer
      - name: Preserve previous full receipt qualification and negative controls
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          python3 experiments/incremental/engine.py --init-key "$RUNNER_TEMP/legacy-original.key"
          python3 experiments/incremental/engine.py --init-key "$RUNNER_TEMP/legacy-expanded.key"
          python3 experiments/incremental/qualify_delta.py \
            --workloads artifacts/workloads --producer artifacts/delta-build/delta-producer \
            --checker target/release/check-selected --indexer target/release/export-index \
            --index-session target/release/index-session --full-checker target/release/sokonanoda \
            --authority-key "$RUNNER_TEMP/legacy-original.key" --out artifacts/legacy-original --repetitions 5
          python3 experiments/incremental/qualify_delta.py \
            --workloads artifacts/expanded --producer artifacts/delta-build/delta-producer \
            --checker target/release/check-selected --indexer target/release/export-index \
            --index-session target/release/index-session --full-checker target/release/sokonanoda \
            --authority-key "$RUNNER_TEMP/legacy-expanded.key" --out artifacts/legacy-expanded --repetitions 5
      - name: Independent HMAC sparse vs full signed receipt replay and paired economics
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          python3 experiments/incremental/engine.py --init-key "$RUNNER_TEMP/sparse-receipt-issuer.key"
          python3 experiments/incremental/benchmark_sparse_acceptance.py \
            --original-workloads artifacts/workloads --expanded-workloads artifacts/expanded \
            --producer artifacts/delta-build/delta-producer \
            --checker target/release/check-selected --indexer target/release/export-index \
            --index-session target/release/index-session --full-checker target/release/sokonanoda \
            --authority-key "$RUNNER_TEMP/sparse-receipt-issuer.key" \
            --out artifacts/sparse-acceptance-ab --repetitions 5
      - name: Require complete exact-source independent oracle evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          for name, required in [('legacy-original',243), ('legacy-expanded',226)]:
              r=json.loads((Path('artifacts')/name/'summary.json').read_bytes())
              assert r.get('run_completed') and r.get('correctness_passed')
              assert r.get('qualification_status')=='PASS'
              assert len(r['gates'])>=required
              assert all(g['passed'] is True for g in r['gates'] if g['required'])
          r=json.loads(Path('artifacts/sparse-acceptance-ab/summary.json').read_bytes())
          assert r['source_sha']==os.environ['GITHUB_SHA']
          assert r['complete'] and r['correctness_passed']
          for profile in ('original','expanded'):
              assert r['profiles'][profile]['cold_sparse_replay']['passed']
              for variant in ('early-definition','unrelated-definition'):
                  x=r['profiles'][profile][variant]
                  assert x['complete'] and len(x['pairs'])==5
                  assert x['performance']['paired_count']==5
                  assert all(p['arms']['sparse_receipt']['issuer_verified'] and
                             p['arms']['full_receipt']['issuer_verified'] for p in x['pairs'])
          print('Exact signed receipt and replay qualification PASS')
          PY
      - name: Publish portable success or negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sparse-acceptance-qualification
          path: |
            artifacts/legacy-original/summary.json
            artifacts/legacy-original/summary.md
            artifacts/legacy-expanded/summary.json
            artifacts/legacy-expanded/summary.md
            artifacts/sparse-acceptance-ab/summary.json
            artifacts/sparse-acceptance-ab/summary.md
          if-no-files-found: warn
          retention-days: 30
