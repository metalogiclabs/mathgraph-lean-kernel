name: Arena representative PGO v54

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/run_arena_representative_pgo_v54.sh'
      - '.github/workflows/arena-representative-pgo-v54.yml'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          set_as_trusted_user: true
      - name: Put llvm-profdata on PATH
        run: |
          LLVM_OUT=$(nix build 'github:NixOS/nixpkgs/nixos-26.05#llvmPackages_21.llvm' --no-link --print-out-paths)
          echo "$LLVM_OUT/bin" >> "$GITHUB_PATH"
      - name: Run v54 representative PGO held-out Mathlib gate
        run: bash experiments/run_arena_representative_pgo_v54.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-representative-pgo-v54
          path: |
            /tmp/v54-decision.txt
            /tmp/v54-*.time
            /tmp/v54-*.err
