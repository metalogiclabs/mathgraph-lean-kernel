name: QCKN Mathlib leader cost atlas v1

on:
  push:
    branches:
      - qckn-mathlib-leader-cost-atlas-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-mathlib-cost-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run full Mathlib leader cost atlas
        run: bash experiments/run_qckn_mathlib_leader_cost_atlas_v1.sh
      - name: Upload leader cost atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qckn-mathlib-leader-cost-atlas-v1
          path: /tmp/qckn-mathlib-leader-cost-atlas-v1/evidence
          if-no-files-found: warn
