name: QCKN Flash app conversion shape census V1

on:
  push:
    branches:
      - qckn-flash-app-conv-shape-census-v1
    paths:
      - scripts/apply_qckn_app_conv_shape_census_v1.py
      - .github/workflows/qckn-flash-app-conv-shape-census-v1.yml
  workflow_dispatch:

concurrency:
  group: qckn-flash-app-conv-shape-census-v1
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Materialize instrumented frozen RC1
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE=a342c74f6eb913c25c6dae4138158023d1b9aa6a
          git worktree add --detach /tmp/census "$SOURCE"
          cd /tmp/census
          python3 "$GITHUB_WORKSPACE/scripts/apply_qckn_app_conv_shape_census_v1.py"
          printf 'source\t%s\nobjective\tapp_conversion_shape_census\nsemantic_change\tnone\n' "$SOURCE" >/tmp/provenance.tsv

      - name: Build Mathlib corpus only
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 510fbfead6f02bed1a0179d01729a6ddf5bfd06d
          cd /tmp/arena
          nix develop -c ./lka.py build-test mathlib >/dev/null
          test -f _build/tests/mathlib.ndjson
          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Build instrumented checker
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/census
          cargo build --release --locked
          cp target/release/sokonanoda /tmp/census.bin

      - name: Run one Mathlib shape census
        shell: bash
        run: |
          set -euxo pipefail
          f=/tmp/arena/_build/tests/mathlib.ndjson
          QCKN_APP_CONV_SHAPE_CENSUS=1 /usr/bin/time -f 'WALL_S=%e\nUSER_S=%U\nSYS_S=%S\nRSS_KB=%M' \
            -o /tmp/time.txt \
            /tmp/census.bin /tmp/config.json <"$f" >/tmp/stdout.txt 2>/tmp/stderr.txt
          grep 'QCKN_APP_CONV_SHAPE ' /tmp/stderr.txt | tail -1 | tee /tmp/census-line.txt
          cat /tmp/time.txt

      - name: Summarize shape opportunity
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee /tmp/census-summary.txt
          import re
          line=open('/tmp/census-line.txt').read().strip()
          vals={k:int(v) for k,v in re.findall(r'([a-z0-9_]+)=(\d+)', line)}
          total=vals['total']
          repeat=vals['repeat']
          print(f'TOTAL={total}')
          print(f'REPEAT={repeat}')
          print(f'REPEAT_PCT={100*repeat/total:.4f}')
          print(f'EXISTING_POS_HIT={vals.get("existing_pos_hit",0)}')
          print(f'EXISTING_POS_HIT_PCT={100*vals.get("existing_pos_hit",0)/total:.4f}')
          names=['ptr','rigid0','rigid12','rigid34','rigid58','rigid916','rigid17p',
                 'rigid_diff','unfold_unfold','unfold_rigid','pi_pi','lam_lam','sort_sort','other']
          rows=[]
          for n in names:
              a=vals.get(n,0); r=vals.get(n+'_r',0)
              rows.append((r,a,n))
          for r,a,n in sorted(rows, reverse=True):
              print(f'{n.upper()}={a}')
              print(f'{n.upper()}_PCT={100*a/total if total else 0:.4f}')
              print(f'{n.upper()}_REPEAT={r}')
              print(f'{n.upper()}_REPEAT_PCT_OF_CLASS={100*r/a if a else 0:.4f}')
              print(f'{n.upper()}_REPEAT_PCT_OF_ALL={100*r/total if total else 0:.4f}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-flash-app-conv-shape-census-v1
          path: |
            /tmp/provenance.tsv
            /tmp/census-line.txt
            /tmp/census-summary.txt
            /tmp/time.txt
          if-no-files-found: warn
