name: Nucleus Live Fast Tournament V1

on:
  push:
    branches:
      - nucleus-lambda-pi-zipper-v7
    paths:
      - src/infer.rs
      - .github/workflows/nucleus-live-fast-tournament-v1.yml
  workflow_dispatch:

concurrency:
  group: nucleus-live-fast-tournament-v1
  cancel-in-progress: true

env:
  ARENA_SHA: 95496f5376b089dfd5889d88c73e390a9d98653d
  V6_SHA: 3dfd4937a61531b83ad60f9c6b2abb3fc57cd5df
  ZIPPER_SHA: c9109a525f85bb314616abd99249e73333a6f70b

jobs:
  corpus:
    name: Build shared fast corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Build Mathlib and corner cases once
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$ARENA_SHA"
          cd /tmp/arena
          nix develop -c ./lka.py build-test mathlib
          mkdir -p /tmp/corpus/corner-cases
          cp _build/tests/mathlib.ndjson /tmp/corpus/mathlib.ndjson
          : >/tmp/corpus/corners.tsv
          while IFS= read -r y; do
            t=${y#tests/}
            t=${t%.yaml}
            nix develop -c ./lka.py build-test "$t" >/dev/null
            outcome=$(awk '/^outcome:/ {print $2; exit}' "$y")
            f="_build/tests/$t.ndjson"
            cp "$f" "/tmp/corpus/$t.ndjson"
            printf '%s\t%s\t%s\n' "$t" "$outcome" "$t.ndjson" >>/tmp/corpus/corners.tsv
          done < <(find tests/corner-cases -type f -name '*.yaml' | sort)
          sha256sum /tmp/corpus/mathlib.ndjson > /tmp/corpus/mathlib.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-fast-corpus
          path: /tmp/corpus

  variant:
    name: ${{ matrix.name }}
    needs: [corpus]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: v6-t1, ref: 3dfd4937a61531b83ad60f9c6b2abb3fc57cd5df, threads: 1, whnf: 2}
          - {name: v6-t2, ref: 3dfd4937a61531b83ad60f9c6b2abb3fc57cd5df, threads: 2, whnf: 2}
          - {name: v6-t4, ref: 3dfd4937a61531b83ad60f9c6b2abb3fc57cd5df, threads: 4, whnf: 2}
          - {name: zipper-t1, ref: c9109a525f85bb314616abd99249e73333a6f70b, threads: 1, whnf: 2}
          - {name: zipper-t2, ref: c9109a525f85bb314616abd99249e73333a6f70b, threads: 2, whnf: 2}
          - {name: zipper-t4, ref: c9109a525f85bb314616abd99249e73333a6f70b, threads: 4, whnf: 2}
          - {name: whnf0-t2, ref: 3dfd4937a61531b83ad60f9c6b2abb3fc57cd5df, threads: 2, whnf: 0}
          - {name: whnf1-t2, ref: 3dfd4937a61531b83ad60f9c6b2abb3fc57cd5df, threads: 2, whnf: 1}
          - {name: whnf3-t2, ref: 3dfd4937a61531b83ad60f9c6b2abb3fc57cd5df, threads: 2, whnf: 3}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: nucleus-fast-corpus
          path: /tmp/corpus
      - name: Prepare exact arm
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/src "${{ matrix.ref }}"
          if [ "${{ matrix.whnf }}" != "2" ]; then
            sed -i "s/const WHNF_ADMIT_THRESHOLD: u8 = 2;/const WHNF_ADMIT_THRESHOLD: u8 = ${{ matrix.whnf }};/" /tmp/src/src/eval.rs
            grep -q "const WHNF_ADMIT_THRESHOLD: u8 = ${{ matrix.whnf }};" /tmp/src/src/eval.rs
          fi
          cd /tmp/src
          RUSTFLAGS='-C target-cpu=native' cargo build --release --locked
          cp target/release/sokonanoda /tmp/candidate.bin
          stat -c '%s' /tmp/candidate.bin > /tmp/binary.bytes
          cat >/tmp/config.json <<EOF
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":${{ matrix.threads }},"print_success_message":false}
          EOF

      - name: Corner-case separator
        shell: bash
        run: |
          set -euxo pipefail
          wrong=0
          decline=0
          total=0
          while IFS=$'\t' read -r test outcome rel; do
            total=$((total+1))
            set +e
            /tmp/candidate.bin /tmp/config.json <"/tmp/corpus/$rel" >/tmp/out 2>/tmp/err
            rc=$?
            set -e
            case "$outcome:$rc" in
              accept:0|reject:1|either:0|either:1) ;;
              *:2) decline=$((decline+1)) ;;
              *) wrong=$((wrong+1)) ;;
            esac
          done </tmp/corpus/corners.tsv
          printf 'total=%s\nwrong=%s\ndecline=%s\n' "$total" "$wrong" "$decline" | tee /tmp/correctness.txt
          test "$wrong" -eq 0
          test "$decline" -eq 0

      - name: Mathlib fast metric
        shell: bash
        run: |
          set -euxo pipefail
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/tmp/perf-sysctl.txt 2>&1 || true
          run_one () {
            rep=$1
            set +e
            perf stat -j -o "/tmp/rep${rep}.perf" -e instructions:u -e task-clock --               /usr/bin/time -f 'real_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M'               -o "/tmp/rep${rep}.time"               /tmp/candidate.bin /tmp/config.json </tmp/corpus/mathlib.ndjson               >/tmp/rep${rep}.out 2>/tmp/rep${rep}.err
            rc=$?
            set -e
            echo "$rc" >"/tmp/rep${rep}.rc"
            test "$rc" -eq 0
          }
          run_one 1
          run_one 2
          python3 - <<'PY' | tee /tmp/result.json
          import json, statistics
          from pathlib import Path
          def one(rep):
              ins=0; task=0.0; t={}
              for line in Path(f"/tmp/rep{rep}.perf").read_text(errors="replace").splitlines():
                  try: d=json.loads(line)
                  except Exception: continue
                  ev=str(d.get("event","")).split(":")[0]
                  try: val=float(str(d.get("counter-value","0")).replace(",",""))
                  except Exception: val=0.0
                  if ev=="instructions": ins=int(val)
                  elif ev=="task-clock": task=val
              for line in Path(f"/tmp/rep{rep}.time").read_text().splitlines():
                  if "=" in line:
                      k,v=line.split("=",1); t[k]=float(v)
              return {"instructions":ins,"task_ms":task,**t}
          runs=[one(1),one(2)]
          def med(k):
              xs=[r.get(k,0) for r in runs if r.get(k,0)>0]
              return statistics.median(xs) if xs else 0
          ins=med("instructions")
          cpu=med("task_ms")/1000 if med("task_ms") else med("user_seconds")+med("sys_seconds")
          corr=dict(line.split("=",1) for line in Path("/tmp/correctness.txt").read_text().splitlines())
          out={
            "name":"${{ matrix.name }}",
            "ref":"${{ matrix.ref }}",
            "threads":${{ matrix.threads }},
            "whnf_threshold":${{ matrix.whnf }},
            "corner_total":int(corr["total"]),
            "corner_wrong":int(corr["wrong"]),
            "corner_decline":int(corr["decline"]),
            "instructions":int(ins),
            "pmu_available":bool(ins),
            "arena_virtual_cpu_seconds":ins/6_000_000_000 if ins else cpu,
            "wall_seconds":med("real_seconds"),
            "cpu_seconds":cpu,
            "max_rss_kb":med("max_rss_kb"),
            "binary_bytes":int(Path("/tmp/binary.bytes").read_text()),
            "runs":runs,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-${{ matrix.name }}
          path: |
            /tmp/result.json
            /tmp/correctness.txt
            /tmp/rep1.perf
            /tmp/rep2.perf
            /tmp/rep1.time
            /tmp/rep2.time

  rank:
    name: Rank live variants
    needs: [variant]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fast-*
          path: /tmp/results
      - name: Rank survivors
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee /tmp/summary.txt
          import json
          from pathlib import Path
          rows=[]
          for p in Path("/tmp/results").rglob("result.json"):
              r=json.loads(p.read_text())
              if r["corner_wrong"]==0 and r["corner_decline"]==0:
                  rows.append(r)
          exact=bool(rows) and all(r["pmu_available"] for r in rows)
          key=(lambda r:(r["instructions"],r["wall_seconds"],r["max_rss_kb"])) if exact else (lambda r:(r["wall_seconds"],r["cpu_seconds"],r["max_rss_kb"]))
          rows.sort(key=key)
          print("NUCLEUS_LIVE_FAST_TOURNAMENT_V1="+("PMU" if exact else "WALL_FALLBACK"))
          for i,r in enumerate(rows,1):
              print(f'{i}. {r["name"]} instr={r["instructions"]} wall={r["wall_seconds"]:.3f}s cpu={r["cpu_seconds"]:.3f}s rss={r["max_rss_kb"]:.0f}KB bytes={r["binary_bytes"]}')
          Path("/tmp/ranking.json").write_text(json.dumps({"mode":"PMU" if exact else "WALL_FALLBACK","ranking":rows},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-live-fast-tournament-v1
          path: |
            /tmp/summary.txt
            /tmp/ranking.json
