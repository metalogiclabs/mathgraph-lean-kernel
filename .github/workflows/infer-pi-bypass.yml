name: Infer Pi-demand bypass

on:
  pull_request:
    paths:
      - 'experiments/infer-pi-bypass.trigger'

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Build baseline, inner-fast, and caller-bypass arms
        shell: bash
        run: |
          set -euxo pipefail
          V1=1e209dad266d59b4d43cdea189876bc6ea551339
          git worktree add /tmp/base "$V1"
          cp -a /tmp/base /tmp/pifast
          cp -a /tmp/base /tmp/bypass
          cp -a /tmp/base /tmp/combo
          python3 scripts/apply_force_pi_fastpath.py /tmp/pifast
          python3 scripts/apply_infer_pi_bypass.py /tmp/bypass
          python3 scripts/apply_force_pi_fastpath.py /tmp/combo
          python3 scripts/apply_infer_pi_bypass.py /tmp/combo
          for arm in base pifast bypass combo; do
            (cd /tmp/$arm && RUSTFLAGS='-C target-cpu=native' cargo build --release --locked)
            cp /tmp/$arm/target/release/sokonanoda /tmp/$arm-bin
          done
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Build beta exports
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena
          cd /tmp/arena
          cp tests/perf/beta-ladder.lean tests/perf/beta-ladder-8000.lean
          sed -i 's/let n := 2000/let n := 8000/' tests/perf/beta-ladder-8000.lean
          printf 'description: beta ladder N=8000\nleanfile: tests/perf/beta-ladder-8000.lean\nexport-decls: ["beta_ladder"]\noutcome: accept\ncompare-perf: true\n' > tests/perf/beta-ladder-8000.yaml
          nix develop -c ./lka.py build-test perf/beta-ladder
          nix develop -c ./lka.py build-test perf/beta-ladder-8000
      - name: Semantic equality
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          for f in _build/tests/perf/beta-ladder.ndjson _build/tests/perf/beta-ladder-8000.ndjson; do
            /tmp/base-bin /tmp/checker.json < "$f" >/tmp/base.out 2>/dev/null
            for arm in pifast bypass combo; do
              /tmp/$arm-bin /tmp/checker.json < "$f" >/tmp/$arm.out 2>/dev/null
              cmp /tmp/base.out /tmp/$arm.out
            done
          done
      - name: Five-run wall separator
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/wall.txt
          for spec in 'beta2000 _build/tests/perf/beta-ladder.ndjson' 'beta8000 _build/tests/perf/beta-ladder-8000.ndjson'; do
            set -- $spec; label=$1; f=$2
            for arm in base pifast bypass combo; do
              for r in 1 2 3 4 5; do
                /usr/bin/time -f '%e' -o /tmp/t /tmp/$arm-bin /tmp/checker.json < "$f" >/dev/null 2>/dev/null
                echo "$label $arm $(cat /tmp/t)" | tee -a /tmp/wall.txt
              done
            done
          done
      - name: Callgrind beta2000 all arms
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          nix shell nixpkgs#valgrind -c bash -lc '
            for arm in base pifast bypass combo; do
              valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$arm.out /tmp/$arm-bin /tmp/checker.json < _build/tests/perf/beta-ladder.ndjson >/dev/null 2>/tmp/cg-$arm.err
              grep "^summary:" /tmp/cg-$arm.out | sed "s/^/$arm /"
            done' | tee /tmp/callgrind.txt
      - name: Decision summary
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/decision.txt
          from pathlib import Path
          from statistics import median
          rows={}
          for line in Path('/tmp/wall.txt').read_text().splitlines():
              t,a,x=line.split(); rows.setdefault((t,a),[]).append(float(x))
          for t in ('beta2000','beta8000'):
              b=median(rows[(t,'base')])
              print(t,'base',b)
              for a in ('pifast','bypass','combo'):
                  x=median(rows[(t,a)])
                  print(t,a,x,'delta_pct',round((x/b-1)*100,2),'speedup_x',round(b/x,4))
          print(Path('/tmp/callgrind.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: infer-pi-bypass
          path: |
            /tmp/wall.txt
            /tmp/callgrind.txt
            /tmp/decision.txt
