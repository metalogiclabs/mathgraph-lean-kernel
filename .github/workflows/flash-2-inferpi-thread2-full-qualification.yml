name: Flash 2 Infer-Pi plus thread2 full qualification

on:
  push:
    branches:
      - flash-2-inferpi-thread2-candidate-v1
    paths:
      - src/flash.rs
      - src/infer.rs
      - .github/workflows/flash-2-inferpi-thread2-full-qualification.yml
  workflow_dispatch:

concurrency:
  group: flash-2-inferpi-thread2-full-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build materialized candidate and frozen RC1
        shell: bash
        run: |
          set -euxo pipefail
          CAND="$GITHUB_SHA"
          BASE=a342c74f6eb913c25c6dae4138158023d1b9aa6a
          git worktree add --detach /tmp/candidate "$CAND"
          git worktree add --detach /tmp/base "$BASE"
          for arm in candidate base; do
            (cd /tmp/$arm && RUSTFLAGS='-C target-cpu=x86-64-v3' cargo build --release --locked)
            cp /tmp/$arm/target/release/sokonanoda /tmp/$arm.bin
          done
          cat >/tmp/base.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF
          cat >/tmp/candidate.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":2,"print_success_message":false}
          EOF
          sha256sum /tmp/candidate.bin /tmp/base.bin | tee /tmp/binaries.sha256
          printf 'base_source\t%s\ncandidate_source\t%s\nbase_threads\t4\ncandidate_threads\t2\n' "$BASE" "$CAND" >/tmp/provenance.tsv

      - name: Build full pinned Arena corpus
        shell: bash
        timeout-minutes: 90
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 510fbfead6f02bed1a0179d01729a6ddf5bfd06d
          cd /tmp/arena
          while IFS= read -r y; do
            t=${y#tests/}
            t=${t%.yaml}
            nix develop -c ./lka.py build-test "$t" >/dev/null
          done < <(find tests -type f -name '*.yaml' | sort)
          find _build/tests -type f -name '*.ndjson' | sort >/tmp/exports.txt
          test "$(wc -l </tmp/exports.txt)" -eq 409

      - name: Full 409 exact semantic parity
        shell: bash
        timeout-minutes: 45
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/matches.tsv
          : >/tmp/mismatches.tsv
          while IFS= read -r f; do
            set +e
            /tmp/base.bin /tmp/base.json <"$f" >/tmp/b.out 2>/tmp/b.err; b=$?
            /tmp/candidate.bin /tmp/candidate.json <"$f" >/tmp/c.out 2>/tmp/c.err; c=$?
            set -e
            if [ "$b" -ne "$c" ] || ! cmp -s /tmp/b.out /tmp/c.out; then
              printf 'MISMATCH\t%s\tbase=%s\tcandidate=%s\n' "$f" "$b" "$c" | tee -a /tmp/mismatches.tsv
            else
              printf 'MATCH\t%s\t%s\n' "$c" "$f" >>/tmp/matches.tsv
            fi
          done </tmp/exports.txt
          n=$(grep -c '^MISMATCH' /tmp/mismatches.tsv || true)
          echo "exports=409 semantic_mismatches=$n" | tee /tmp/summary.txt
          test "$n" -eq 0
          echo FLASH_2_INFER_PI_THREAD2_409_PARITY_PASS | tee -a /tmp/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-2-inferpi-thread2-full-qualification
          path: |
            /tmp/provenance.tsv
            /tmp/binaries.sha256
            /tmp/exports.txt
            /tmp/matches.tsv
            /tmp/mismatches.tsv
            /tmp/summary.txt
          if-no-files-found: warn
