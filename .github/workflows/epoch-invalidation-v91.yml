name: Epoch invalidation v91
on:
  push:
    branches: [experiment/epoch-invalidation-v91]
    paths: ['.github/workflows/epoch-invalidation-v91.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify pinned Arena toolchain and harness
        run: |
          set -euo pipefail
          mkdir -p /tmp/v91/out
          test "$(git hash-object experiments/measure_prune_dm_v88.py)" = a4a57512904e728cd13736930f4d7fb01ff36e13
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/v91/arena
          git -C /tmp/v91/arena checkout -q 91f376e4baacf2df0c478e7173bccb2a6adac5c5
          cd /tmp/v91/arena
          nix develop -c sh -c 'rustc --version; cargo --version'
          nix shell 'github:NixOS/nixpkgs/0ad6f47ea4fe188f4bc8f0380f93ae8523337c6c#llvmPackages_21.llvm' -c llvm-profdata --version
      - name: Verify exact source transform and Rust semantics
        run: |
          set -euo pipefail
          cd /tmp/v91/arena
          nix develop -c bash "$GITHUB_WORKSPACE/experiments/run_epoch_v91.sh" preflight
      - name: Full-corpus exact replay and fresh-PGO wall time
        run: |
          set -euo pipefail
          cd /tmp/v91/arena
          nix develop -c bash "$GITHUB_WORKSPACE/experiments/run_epoch_v91.sh" benchmark |& tee /tmp/v91/out/summary.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epoch-invalidation-v91
          path: /tmp/v91/out/
          if-no-files-found: warn
