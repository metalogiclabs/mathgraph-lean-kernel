name: Lean Refactor Arena Typing structural all-version admission

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lean-refactor-arena-track1'
    paths:
      - 'competitions/lean_refactor_arena/experiments/typing_four_residual_structural_v1.jsonl'
      - '.github/workflows/lean-refactor-arena-typing-four-residual-admission.yml'

concurrency:
  group: lra-typing-four-residual-admission
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      PUBLIC_REPO_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      TARGET_NAME: Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress
      CANDIDATES: competitions/lean_refactor_arena/experiments/typing_four_residual_structural_v1.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Build required Typing theorem module across exactly three Lean versions
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_REPO_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_REPO_SHA"
          for project in v4.33 v4.32 v4.31; do
            echo "TYPING_REQUIRED_VERSION=$project"
            cd "/tmp/lean-refactor/competition/projects/$project"
            lake update
            lake exe cache get || echo "TYPING_CACHE_FALLBACK=$project"
            lake build Cslib.Languages.LambdaCalculus.LocallyNameless.Fsub.Safety
          done
          echo VERIFIED_ALL_THREE_REQUIRED_TYPING_MODULES
      - name: Replay strict all-version verifier for incumbent and three surviving variants
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/typing-four-all-versions.jsonl
          for label in typing_retained_338_control typing_movable_tli_grind typing_movable_tli_grind_only_small typing_movable_tli_solve_or_grind; do
            echo "CHECK_ALL_REQUIRED=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.33 \
              --name "$TARGET_NAME" --candidate "$CANDIDATES" --label "$label"
            (cd /tmp/lean-refactor/competition && \
              python3 arena.py check --name "$TARGET_NAME" --all-versions --timeout 1800) \
              > /tmp/typing-all-version-one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' \
              /tmp/typing-all-version-one.json >> /tmp/typing-four-all-versions.jsonl
          done
      - name: Enforce full-version admission and choose only verified gain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(s) for s in Path('/tmp/typing-four-all-versions.jsonl').read_text().splitlines() if s.strip()]
          assert len(rows)==4 and len({r['candidate_label'] for r in rows})==4
          versions={'v4.33.0-rc2','v4.32.0','v4.31.0'}
          def valid(r):
              compat=r.get('compat') or {}
              pv=r.get('per_version') or []
              return (
                r.get('compiled') is True and r.get('statement_ok') is True and
                r.get('eligible') is True and not r.get('forbidden') and
                not r.get('extra_toplevel_decls') and not r.get('untested') and
                float(r.get('survival_pct') or 0)==100.0 and
                set(compat)==versions and all(compat[v] is True for v in versions) and
                len(pv)==3 and {x.get('version') for x in pv}==versions and
                all(x.get('tested') is True and x.get('ok') is True for x in pv))
          incumbent=next(r for r in rows if r['candidate_label']=='typing_retained_338_control')
          assert valid(incumbent),'RETAINED_TYPING_338_NO_LONGER_VERIFIED'
          qualified=[r for r in rows if valid(r) and r is not incumbent]
          better=[r for r in qualified if float(r.get('objective_sum_pct') or 0)>float(incumbent['objective_sum_pct'])]
          winner=max(better,key=lambda r:float(r['objective_sum_pct']),default=None)
          out={'schema':'mathgraph.lra.typing.four-residual-full-admission.v1',
            'status':'WARRANTED_ALL_THREE_VERSION_OBJECTIVE_GAIN' if winner else 'NO_ALL_VERSION_OBJECTIVE_GAIN',
            'pin':'7f3a401470d04f70013d293db4253b088ec8a0ae',
            'incumbent':{'tokens':incumbent['length'],'heartbeats':incumbent['heartbeats'],
               'objective':incumbent['objective_sum_pct']},
            'qualified':[{'label':r['candidate_label'],'tokens':r['length'],
               'heartbeats':r['heartbeats'],'objective':r['objective_sum_pct']} for r in qualified],
            'gain':[{'label':r['candidate_label'],'tokens':r['length'],
               'heartbeats':r['heartbeats'],'objective':r['objective_sum_pct']} for r in better],
            'best':None if winner is None else winner['candidate_label'],
            'not_qualified':[{'label':r['candidate_label'],'compat':r.get('compat'),
               'errors':r.get('per_version')} for r in rows if not valid(r)],
            'authority':'All three benchmark toolchains, exact frozen public project, no forbidden constructs, no official submission performed.'}
          Path('/tmp/typing-four-all-version-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-typing-four-residual-all-versions
          path: |
            /tmp/typing-four-all-versions.jsonl
            /tmp/typing-four-all-version-summary.json
