name: QCKN Flash event emitter v1

on:
  push:
    branches: [qckn-flash-event-emitter-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify authoritative source runs
        run: |
          test "$(gh api repos/metalogiclabs/mathgraph-lean-kernel/actions/runs/35380841937 --jq .conclusion)" = success
          test "$(gh api repos/metalogiclabs/mathgraph-lean-kernel/actions/runs/35380563756 --jq .conclusion)" = success
      - name: Run emitter tests
        working-directory: experiments
        run: python3 -m unittest test_emit_qckn_flash_event -v
      - name: Emit canonical Flash event
        run: |
          mkdir -p /tmp/qckn-flash-event
          python3 experiments/emit_qckn_flash_event.py --commit "$GITHUB_SHA" --out /tmp/qckn-flash-event
      - uses: actions/upload-artifact@v4
        with:
          name: lean-qckn-flash-event-v1
          path: /tmp/qckn-flash-event/
          if-no-files-found: error
