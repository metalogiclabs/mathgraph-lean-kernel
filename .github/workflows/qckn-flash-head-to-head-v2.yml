name: Flash exact-PGO head-to-head vs sokonanoda

on:
  push:
    branches:
      - qckn-flash-head-to-head-v2
  workflow_dispatch:

concurrency:
  group: qckn-flash-head-to-head-v2
  cancel-in-progress: true

jobs:
  exact-arena-duel:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Build exact Arena exports
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 510fbfead6f02bed1a0179d01729a6ddf5bfd06d
          cd /tmp/arena
          nix develop -c ./lka.py build-test init-prelude >/dev/null
          nix develop -c ./lka.py build-test mathlib >/dev/null
          for t in cedar cslib init std; do
            nix develop -c ./lka.py build-test "$t" >/dev/null
          done
          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF

      - name: Build both checkers with exact native PGO regime
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add /tmp/current "$GITHUB_SHA"
          git worktree add /tmp/leader 28c03d0103e004610e4d47a4828965efb2b70af9

          LLVM_PROFDATA=$(nix shell nixpkgs#llvmPackages_21.llvm -c sh -c 'command -v llvm-profdata')
          for arm in current leader; do
            rm -rf /tmp/$arm/target /tmp/$arm/pgo
            mkdir -p /tmp/$arm/pgo

            (
              cd /tmp/$arm
              RUSTFLAGS="-C target-cpu=native -Cprofile-generate=/tmp/$arm/pgo" cargo build --release --locked
              target/release/sokonanoda /tmp/config.json </tmp/arena/_build/tests/init-prelude.ndjson >/dev/null
              "$LLVM_PROFDATA" merge -o /tmp/$arm/pgo/merged.profdata /tmp/$arm/pgo
              test -s /tmp/$arm/pgo/merged.profdata
              rm -rf target
              RUSTFLAGS="-C target-cpu=native -Cprofile-use=/tmp/$arm/pgo/merged.profdata" cargo build --release --locked
              cp target/release/sokonanoda /tmp/$arm.bin
            )
          done

          sha256sum /tmp/current.bin /tmp/leader.bin | tee /tmp/binaries.sha256

      - name: Verify status parity on real-world panel
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/parity.tsv
          for t in mathlib cedar cslib init std; do
            f="_build/tests/$t.ndjson"
            set +e
            /tmp/current.bin /tmp/config.json <"$f" >/tmp/c.out 2>/tmp/c.err; c=$?
            /tmp/leader.bin /tmp/config.json <"$f" >/tmp/l.out 2>/tmp/l.err; l=$?
            set -e
            test "$c" -eq "$l"
            printf 'STATUS_MATCH\t%s\t%s\n' "$c" "$t" | tee -a /tmp/parity.tsv
          done

      - name: Five-replay exact Mathlib duel
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          f="_build/tests/mathlib.ndjson"
          : >/tmp/mathlib.tsv

          for rep in 1 2 3 4 5; do
            if [ $((rep%2)) -eq 1 ]; then order="leader current"; else order="current leader"; fi
            for arm in $order; do
              /usr/bin/time -f '%e\t%U\t%M' -o /tmp/time                 /tmp/$arm.bin /tmp/config.json <"$f" >/dev/null 2>/dev/null
              read -r wall user rss </tmp/time
              printf '%s\t%s\t%s\t%s\t%s\n' "$arm" "$rep" "$wall" "$user" "$rss" | tee -a /tmp/mathlib.tsv
            done
          done

          python3 - <<'PY' | tee /tmp/scorecard.txt
          from collections import defaultdict
          from statistics import median
          rows=defaultdict(list)
          for line in open('/tmp/mathlib.tsv'):
              arm,rep,wall,user,rss=line.rstrip().split('\t')
              rows[arm].append((float(wall),float(user),int(rss)))

          for arm in ('leader','current'):
              print(arm+'_runs='+repr([x[0] for x in rows[arm]]))

          lm=median(x[0] for x in rows['leader'])
          cm=median(x[0] for x in rows['current'])
          lu=median(x[1] for x in rows['leader'])
          cu=median(x[1] for x in rows['current'])
          lr=median(x[2] for x in rows['leader'])
          cr=median(x[2] for x in rows['current'])

          print(f'LEADER_MEDIAN_S={lm:.6f}')
          print(f'CURRENT_MEDIAN_S={cm:.6f}')
          print(f'LEADER_USER_S={lu:.6f}')
          print(f'CURRENT_USER_S={cu:.6f}')
          print(f'CURRENT_VS_LEADER_SPEEDUP={lm/cm:.6f}')
          print(f'CURRENT_GAP_PERCENT={(cm/lm-1)*100:.4f}')
          print(f'LEADER_RSS_KB={int(lr)}')
          print(f'CURRENT_RSS_KB={int(cr)}')
          if cm < lm:
              print('FLASH_CURRENT_AHEAD_OF_SOKONANODA_EXACT_PGO')
          else:
              print('FLASH_CURRENT_BEHIND_SOKONANODA_EXACT_PGO')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-flash-head-to-head-v2
          path: |
            /tmp/parity.tsv
            /tmp/mathlib.tsv
            /tmp/scorecard.txt
            /tmp/binaries.sha256
          if-no-files-found: warn
