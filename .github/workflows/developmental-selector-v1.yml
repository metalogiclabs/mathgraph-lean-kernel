name: Developmental selector v1 - frozen continuation
on:
  push:
    branches: [experiment/developmental-selector-v1]
    paths:
      - 'experiments/developmental_selector_v1/**'
      - '.github/workflows/developmental-selector-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Test frozen policy and actual-source repair
        run: |
          set -euo pipefail
          mkdir -p /tmp/developmental-selector-v1 /tmp/v88/out
          python3 -m unittest discover -s experiments/developmental_selector_v1 -p test_selector.py -v |& tee /tmp/developmental-selector-v1/tests.log
          python3 experiments/developmental_selector_v1/run.py /tmp/developmental-selector-v1/selection.json | tee /tmp/developmental-selector-v1/selection.log
      - name: Execute only the selected, source-guarded harness repair
        run: |
          set -euo pipefail
          python3 experiments/developmental_selector_v1/repair_v88.py experiments/measure_prune_dm_v88.py --check
          python3 experiments/developmental_selector_v1/repair_v88.py experiments/measure_prune_dm_v88.py
          python3 -m py_compile experiments/measure_prune_dm_v88.py
          git diff --check
          git diff -- experiments/measure_prune_dm_v88.py > /tmp/developmental-selector-v1/harness.patch
          git diff -- src/ > /tmp/developmental-selector-v1/production.patch
          test ! -s /tmp/developmental-selector-v1/production.patch
      - uses: cachix/install-nix-action@v31
      - name: Verify pinned Arena toolchain
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/v88/arena
          git -C /tmp/v88/arena checkout -q 91f376e4baacf2df0c478e7173bccb2a6adac5c5
          cd /tmp/v88/arena
          nix develop -c sh -c 'rustc --version; cargo --version'
          nix shell 'github:NixOS/nixpkgs/0ad6f47ea4fe188f4bc8f0380f93ae8523337c6c#llvmPackages_21.llvm' -c llvm-profdata --version
      - name: Compile and test the frozen-source candidate
        run: |
          set -euo pipefail
          cd /tmp/v88/arena
          nix develop -c bash "$GITHUB_WORKSPACE/experiments/run_prune_dm_v88.sh" preflight
      - name: Full-corpus replay and fresh-PGO wall time
        run: |
          set -euo pipefail
          cd /tmp/v88/arena
          nix develop -c bash "$GITHUB_WORKSPACE/experiments/run_prune_dm_v88.sh" benchmark |& tee /tmp/v88/out/summary.txt
      - name: Preserve all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developmental-selector-v1
          path: |
            /tmp/developmental-selector-v1/
            /tmp/v88/out/
          if-no-files-found: warn
