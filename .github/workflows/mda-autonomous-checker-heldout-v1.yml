name: MDA autonomous checker heldout v1

on:
  push:
    branches:
      - candidate/autonomous-cache-admission-v1
    paths:
      - 'mda/generated/autonomous_cache_admission_v1/HELDOUT_AUTHORIZED'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Run frozen held-out comparison and exact ablation control
        run: bash experiments/run_mda_autonomous_checker_heldout_v1.sh
      - name: Preserve held-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-autonomous-checker-heldout-v1
          path: /tmp/mda-auto-heldout-v1/evidence/
          if-no-files-found: warn
