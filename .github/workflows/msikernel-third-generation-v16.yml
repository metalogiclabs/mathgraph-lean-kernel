name: MSI Kernel Third Generation V16

on:
  push:
    branches: [msikernel-third-generation-v16]
    paths:
      - 'experiments/third_generation_v16.py'
      - '.github/workflows/msikernel-third-generation-v16.yml'
  workflow_dispatch:

jobs:
  third-generation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build frozen corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 100000 _build/tests/std.ndjson >/tmp/std.ndjson
          head -n 100000 _build/tests/cedar.ndjson >/tmp/cedar.ndjson
          cd ..
          echo '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' >/tmp/checker.json
      - name: Generate parent and ablation states
        run: |
          set -euxo pipefail
          python3 experiments/third_generation_v16.py . --state parent --list | tee /tmp/candidates.txt
          n=$(sed -n 's/^GENERATED_CANDIDATES=//p' /tmp/candidates.txt)
          echo VARIANT_COUNT=$n >> "$GITHUB_ENV"
          for state in ablate parent; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base-$state
            python3 experiments/third_generation_v16.py /tmp/base-$state --state $state
            for i in $(seq 0 $((n-1))); do
              git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$state-$i
              python3 experiments/third_generation_v16.py /tmp/$state-$i --state $state --variant $i | tee /tmp/$state-$i.genesis
            done
          done
      - name: Build all variants
        run: |
          set -euxo pipefail
          cd arena; : >/tmp/build.txt
          for state in ablate parent; do
            nix develop -c bash -c "CARGO_TARGET_DIR=/tmp/t-base-$state RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/base-$state/Cargo.toml --release --locked"
            for i in $(seq 0 $((VARIANT_COUNT-1))); do
              if nix develop -c bash -c "CARGO_TARGET_DIR=/tmp/t-$state-$i RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$state-$i/Cargo.toml --release --locked"; then echo ${state}_${i}_BUILD=PASS | tee -a /tmp/build.txt; else echo ${state}_${i}_BUILD=FAIL | tee -a /tmp/build.txt; fi
            done
          done
      - name: Exact semantic gate
        run: |
          set -euxo pipefail
          : >/tmp/sem.txt
          for state in ablate parent; do
            for corpus in std cedar; do /tmp/t-base-$state/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.base.$state.out; done
            for i in $(seq 0 $((VARIANT_COUNT-1))); do
              grep -q ${state}_${i}_BUILD=PASS /tmp/build.txt || continue
              ok=1
              for corpus in std cedar; do /tmp/t-$state-$i/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.$state.$i.out || ok=0; cmp /tmp/$corpus.base.$state.out /tmp/$corpus.$state.$i.out || ok=0; done
              if [ $ok = 1 ]; then echo ${state}_${i}_SEM=PASS | tee -a /tmp/sem.txt; else echo ${state}_${i}_SEM=FAIL | tee -a /tmp/sem.txt; fi
            done
          done
      - name: Third-generation causal verifier
        run: |
          set -euxo pipefail
          measure(){ local bin=$1 corpus=$2 tag=$3; nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$tag "$bin" /tmp/checker.json </tmp/$corpus.ndjson >/dev/null 2>/tmp/$tag.err; sed -n 's/^summary:[[:space:]]*//p' /tmp/cg-$tag; }
          : >/tmp/result.txt
          for state in ablate parent; do
            bs=$(measure /tmp/t-base-$state/release/sokonanoda std b-$state-s); bc=$(measure /tmp/t-base-$state/release/sokonanoda cedar b-$state-c)
            echo BASE_${state}_STD=$bs BASE_${state}_CEDAR=$bc | tee -a /tmp/result.txt
            for i in $(seq 0 $((VARIANT_COUNT-1))); do
              grep -q ${state}_${i}_SEM=PASS /tmp/sem.txt || continue
              s=$(measure /tmp/t-$state-$i/release/sokonanoda std x-$state-$i-s); c=$(measure /tmp/t-$state-$i/release/sokonanoda cedar x-$state-$i-c)
              ds=$((s-bs)); dc=$((c-bc)); verdict=VETO; if [ $ds -lt 0 ] && [ $dc -lt 0 ]; then verdict=PASS; fi
              echo ${state}_${i}_STD_DELTA=$ds CEDAR_DELTA=$dc VERDICT=$verdict | tee -a /tmp/result.txt
            done
          done
          unlocks=0; best=-1
          for i in $(seq 0 $((VARIANT_COUNT-1))); do
            a=$(grep ^ablate_${i}_STD_DELTA= /tmp/result.txt || true); p=$(grep ^parent_${i}_STD_DELTA= /tmp/result.txt || true)
            if echo "$a" | grep -q VERDICT=VETO && echo "$p" | grep -q VERDICT=PASS; then unlocks=$((unlocks+1)); best=$i; echo THIRD_GENERATION_UNLOCK=$i | tee -a /tmp/result.txt; fi
          done
          echo RESIDUAL_SOURCE=V15_remaining_force_all_constructor_demands | tee -a /tmp/result.txt
          echo V15_PARENT=V11+ensure+app+prior_field | tee -a /tmp/result.txt
          echo CAUSAL_ABLATION=remove_prior_field_only | tee -a /tmp/result.txt
          echo CORPUS_ID_VISIBLE_TO_PATCH=0 | tee -a /tmp/result.txt
          echo THIRD_GENERATION_UNLOCKS=$unlocks | tee -a /tmp/result.txt
          echo BEST_THIRD_GENERATION=$best | tee -a /tmp/result.txt
          cat /tmp/candidates.txt >>/tmp/result.txt
          test $unlocks -gt 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msikernel-third-generation-v16
          path: |
            /tmp/result.txt
            /tmp/build.txt
            /tmp/sem.txt
            /tmp/candidates.txt
            /tmp/*.genesis
