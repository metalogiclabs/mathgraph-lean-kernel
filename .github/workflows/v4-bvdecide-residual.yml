name: V4 BVDecide Residual Tournament
on:
  push:
    branches: [mathgraph-v4-bvdecide-residual-20260830]
    paths: ['scripts/apply_v4_compounded.py','.github/workflows/v4-bvdecide-residual.yml']
  workflow_dispatch:
jobs:
  residual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build Std export and isolate target theorem
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          f=_build/tests/std.ndjson
          grep -n -m1 'blastDivSubtractShift_q' "$f" | tee /tmp/target-hit.txt
          L=$(cut -d: -f1 /tmp/target-hit.txt)
          test "$L" -gt 1
          head -n $((L-1)) "$f" > /tmp/before.ndjson
          head -n "$L" "$f" > /tmp/through.ndjson
          echo TARGET_LINE=$L | tee /tmp/results.txt
          wc -l /tmp/before.ndjson /tmp/through.ndjson | tee -a /tmp/results.txt
      - name: Materialize baseline and candidate states
        run: |
          set -euxo pipefail
          for s in base ensure app param prior all; do
            git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$s
            git -C /tmp/$s checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          done
          python3 scripts/apply_v4_compounded.py /tmp/ensure/src/infer.rs --only ensure_sort_direct_sort
          python3 scripts/apply_v4_compounded.py /tmp/app/src/infer.rs --only app_direct_pi
          python3 scripts/apply_v4_compounded.py /tmp/param/src/infer.rs --only param_telescope_direct_pi_fallback
          python3 scripts/apply_v4_compounded.py /tmp/prior/src/infer.rs --only prior_field_direct_pi
          python3 scripts/apply_v4_compounded.py /tmp/all/src/infer.rs
          for s in base ensure app param prior all; do (cd /tmp/$s && cargo build --release --locked); done
          cat >/tmp/serial.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
          cat >/tmp/par.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF
      - name: Target theorem marginal tournament
        run: |
          set -euxo pipefail
          for s in base ensure app param prior all; do
            for rep in 1 2 3; do
              /usr/bin/time -f '%e' -o /tmp/${s}-before-${rep}.t /tmp/$s/target/release/sokonanoda /tmp/serial.json < /tmp/before.ndjson >/dev/null
              /usr/bin/time -f '%e' -o /tmp/${s}-through-${rep}.t /tmp/$s/target/release/sokonanoda /tmp/serial.json < /tmp/through.ndjson >/dev/null
            done
          done
          python3 - <<'PY' | tee -a /tmp/results.txt
          from pathlib import Path
          import statistics
          states='base ensure app param prior all'.split()
          vals={}
          for s in states:
            b=statistics.median(float(Path(f'/tmp/{s}-before-{i}.t').read_text()) for i in (1,2,3))
            t=statistics.median(float(Path(f'/tmp/{s}-through-{i}.t').read_text()) for i in (1,2,3))
            m=t-b; vals[s]=m
            print(f'{s}_BEFORE={b:.6f} THROUGH={t:.6f} TARGET_MARGINAL={m:.6f}')
          b=vals['base']
          for s in states[1:]:
            print(f'{s}_TARGET_VS_BASE_PPM={int(1_000_000*(vals[s]-b)/b) if b else 0}')
          print('BEST_TARGET_STATE='+min(states,key=lambda s: vals[s]))
          PY
      - name: Full Std transfer tournament
        run: |
          set -euxo pipefail
          f=arena/_build/tests/std.ndjson
          for s in base ensure app param prior all; do
            for rep in 1 2 3; do
              /usr/bin/time -f '%e' -o /tmp/${s}-std-${rep}.t /tmp/$s/target/release/sokonanoda /tmp/par.json < "$f" >/dev/null
            done
          done
          python3 - <<'PY' | tee -a /tmp/results.txt
          from pathlib import Path
          import statistics
          states='base ensure app param prior all'.split(); v={}
          for s in states:
            x=statistics.median(float(Path(f'/tmp/{s}-std-{i}.t').read_text()) for i in (1,2,3)); v[s]=x; print(f'{s}_STD_MEDIAN={x:.6f}')
          for s in states[1:]: print(f'{s}_STD_VS_BASE_PPM={int(1_000_000*(v[s]-v["base"])/v["base"])}')
          print('BEST_STD_STATE='+min(states,key=v.get))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-bvdecide-residual
          path: |
            /tmp/results.txt
            /tmp/target-hit.txt
            /tmp/*.t
