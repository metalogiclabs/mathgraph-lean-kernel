name: msikernel long horizon genesis v6

on:
  push:
    branches: [msikernel-long-horizon-genesis-v6]
  workflow_dispatch:

jobs:
  long-horizon:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build frozen Std and unseen Cedar corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 100000 _build/tests/std.ndjson >/tmp/std.ndjson
          head -n 100000 _build/tests/cedar.ndjson >/tmp/cedar.ndjson
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Generate five causally chained candidate stages
        run: |
          set -euxo pipefail
          for mode in cold g1 g2 g3 g4 g5; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$mode
          done
          python3 experiments/long_horizon_genesis_v6.py /tmp/g1 1 - | tee /tmp/g1.genesis
          python3 experiments/long_horizon_genesis_v6.py /tmp/g2 2 /tmp/g1/.msi-stage1-promotion.json | tee /tmp/g2.genesis
          python3 experiments/long_horizon_genesis_v6.py /tmp/g3 3 /tmp/g2/.msi-stage2-promotion.json | tee /tmp/g3.genesis
          python3 experiments/long_horizon_genesis_v6.py /tmp/g4 4 /tmp/g3/.msi-stage3-promotion.json | tee /tmp/g4.genesis
          python3 experiments/long_horizon_genesis_v6.py /tmp/g5 5 /tmp/g4/.msi-stage4-promotion.json | tee /tmp/g5.genesis

          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/ablate2
          if python3 experiments/long_horizon_genesis_v6.py /tmp/ablate2 2 - >/tmp/ablate2.log 2>&1; then exit 1; fi
          grep -q 'STAGE2_ANCESTOR_PROMOTION_REQUIRED' /tmp/ablate2.log
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/ablate5
          if python3 experiments/long_horizon_genesis_v6.py /tmp/ablate5 5 /tmp/g2/.msi-stage2-promotion.json >/tmp/ablate5.log 2>&1; then exit 1; fi
          grep -q 'STAGE5_ANCESTOR_PROMOTION_REQUIRED' /tmp/ablate5.log
          echo LONG_HORIZON_ANCESTOR_ABLATIONS=PASS | tee /tmp/result.txt

      - name: Build and verify exact behaviour
        run: |
          set -euxo pipefail
          cd arena
          for mode in cold g1 g2 g3 g4 g5; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-$mode RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$mode/Cargo.toml --release --locked"
          done
          for corpus in std cedar; do
            for mode in cold g1 g2 g3 g4 g5; do
              /tmp/target-$mode/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.$mode.out
              cmp /tmp/$corpus.cold.out /tmp/$corpus.$mode.out
            done
            echo "${corpus^^}_ALL_SIX_REGIMES_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
          done

      - name: Deterministic long-horizon economic ratchet
        run: |
          set -euxo pipefail
          for corpus in std cedar; do
            for mode in cold g1 g2 g3 g4 g5; do
              nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$corpus-$mode /tmp/target-$mode/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.$mode.cg.out 2>/tmp/$corpus.$mode.cg.err
              cmp /tmp/$corpus.cold.out /tmp/$corpus.$mode.cg.out
            done
          done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          modes=['cold','g1','g2','g3','g4','g5']
          def instr(c,m):
              t=open(f'/tmp/cg-{c}-{m}').read(); return int(re.search(r'^summary:\s+(\d+)',t,re.M).group(1))
          vals={(c,m):instr(c,m) for c in ('std','cedar') for m in modes}
          for c in ('std','cedar'):
              for m in modes: print(f'{c.upper()}_{m.upper()}_INSTR={vals[c,m]}')
              for m in modes[1:]: print(f'{c.upper()}_{m.upper()}_DELTA_VS_COLD_PCT={100*(vals[c,m]-vals[c,"cold"])/vals[c,"cold"]:.6f}')
          assert vals['std','g1'] < vals['std','cold'] and vals['cedar','g1'] < vals['cedar','cold']
          assert vals['std','g2'] < vals['std','g1'] and vals['cedar','g2'] < vals['cedar','g1']
          print('GEN1_PROMOTE=PASS'); print('GEN2_PROMOTE=PASS')
          prefix=2
          for i in range(3,6):
              prev='g'+str(i-1); cur='g'+str(i)
              sem=True
              econ=vals['std',cur] < vals['std',prev] and vals['cedar',cur] < vals['cedar',prev]
              if econ and prefix==i-1:
                  prefix=i; print(f'GEN{i}_PROMOTE=PASS')
              else:
                  print(f'GEN{i}_ECONOMIC_VETO=PASS')
          print(f'LONGEST_ECONOMICALLY_ADMISSIBLE_PREFIX={prefix}')
          print('LONG_HORIZON_SEMANTIC_PRESERVATION=PASS')
          print('LONG_HORIZON_TRANSFER_TO_CEDAR=PASS')
          print('LONG_HORIZON_RECURSIVE_GENESIS_V6=DECIDED')
          PY
          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: msikernel-long-horizon-genesis-v6
          path: |
            /tmp/result.txt
            /tmp/g1.genesis
            /tmp/g2.genesis
            /tmp/g3.genesis
            /tmp/g4.genesis
            /tmp/g5.genesis
            /tmp/ablate2.log
            /tmp/ablate5.log
