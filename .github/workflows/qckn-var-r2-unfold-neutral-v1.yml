name: QCKN Var R2 unfold neutral v1

on:
  push:
    branches:
      - qckn-var-r2-unfold-neutral-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run ordinary-unfold neutral test
        run: cargo test --locked qckn_r2_unfold_neutral_tests -- --nocapture
