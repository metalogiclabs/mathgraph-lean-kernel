name: Flash open memo ablation on exact Mathlib
on:
  push:
    branches: [research/flash-number1-trials-20261126]
    paths:
      - .github/workflows/flash-number1-mathlib-trials.yml
      - experiments/flash-number1-trials-20261126/whole_mathlib.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop-superseded:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Stop the superseded shared-target Mathlib diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import os, urllib.request, urllib.error
          old=45691028748
          assert str(old)!=os.environ['GITHUB_RUN_ID']
          req=urllib.request.Request(f'https://api.github.com/repos/metalogiclabs/mathgraph-lean-kernel/actions/runs/{old}/cancel',method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req) as response: print('Superseded diagnostic cancellation:',response.status)
          except urllib.error.HTTPError as error:
              if error.code!=409: raise
              print('Superseded diagnostic already finished.')
          PYCODE
  portable:
    name: Reverify valid 230-case receipt for identical source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify artifact digest, source, binary identity and every prescribed status
        run: |
          set -euo pipefail
          gh api repos/metalogiclabs/mathgraph-lean-kernel/actions/artifacts/15057949600/zip > "$RUNNER_TEMP/portable-qualified.zip"
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          archive=Path(os.environ['RUNNER_TEMP'])/'portable-qualified.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='73f9d0911c797eb22ae7d9126b4bd6dbc48c67bd0b46d1eed25eed3d432aa76e'
          previous='930179e44b770d018e48d70b975bbd0f206bb2ab'
          source=subprocess.check_output(['git','rev-parse',previous+':src'],text=True).strip()
          current=subprocess.check_output(['git','rev-parse','HEAD:src'],text=True).strip()
          assert current==source=='6b5f867d4b371dcf0d7cdfc38d14e4507ba621e1'
          tests={t['name']:t for t in json.loads(Path('experiments/flash-number1-trials-20261126/portable-manifest.json').read_text())['tests']}
          with zipfile.ZipFile(archive) as z:
              assert z.read('commit.txt').decode().strip()==previous
              rows=json.loads(z.read('rows.json'));identity=json.loads(z.read('identity.json'));config=json.loads(z.read('config.json'))
              assert len(rows)==230 and {r['name'] for r in rows}==tests.keys()
              for r in rows:
                  t=tests[r['name']]
                  assert r['input_sha256']==t['sha256']
                  assert r['raw_exit']==r['expected_exit']==(0 if t['outcome']=='accept' else 1)
              assert identity['threads']==2 and identity['official_timeouts'] and not identity['excluded_unknown']
              assert config['num_threads']==2 and config['parse_only'] is False
              assert identity['binaries']['no_open_memo']==z.read('binary.sha256').decode().split()[0]
          print('Reverified 230/230 prescribed portable statuses from run 45691028748 for identical source',source)
          PYCODE
  matched-mathlib:
    needs: portable
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C target-cpu=native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Reconstruct independent arms and require exact source identities
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/mathlib-trial-arms"
          OUT="$RUNNER_TEMP/mathlib-trial-evidence"
          mkdir -p "$ROOT" "$OUT"
          git worktree add --detach "$ROOT/baseline" ca69e6ab8a3c7b795716128372fdaf67c697b68e
          git worktree add --detach "$ROOT/no_open_memo" ca69e6ab8a3c7b795716128372fdaf67c697b68e
          git -C "$ROOT/no_open_memo" apply "$GITHUB_WORKSPACE/experiments/flash-number1-trials-20261126/no-open-memo/implementation.patch"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'mathlib-trial-arms'
          out = Path(os.environ['RUNNER_TEMP']) / 'mathlib-trial-evidence'
          rows = []
          for arm, directory in [('baseline', None), ('no_open_memo', 'no-open-memo')]:
              worktree = root / arm
              subprocess.run(['git','add','src'],cwd=worktree,check=True)
              tree = subprocess.check_output(['git','write-tree'],cwd=worktree,text=True).strip()
              src = subprocess.check_output(['git','rev-parse',tree+':src'],cwd=worktree,text=True).strip()
              if directory:
                  d = json.loads((Path('experiments/flash-number1-trials-20261126')/directory/'decision.json').read_text())
                  assert src == d.get('src_tree', d.get('source_tree')), (arm,src,d)
              else:
                  expected = subprocess.check_output(['git','rev-parse','819d59c34db3fd8f7b790a83f5728f255f75f33e:src'],text=True).strip()
                  assert src == expected
              rows.append({'arm':arm,'src_tree':src,'root_tree':tree})
          (out/'source-identities.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          git rev-parse HEAD > "$OUT/research-commit.txt"
          rustc -Vv > "$OUT/compiler.txt"
          lscpu > "$OUT/cpu.txt"
          printf '%s\n' "$RUSTFLAGS" > "$OUT/build-flags.txt"
          for arm in baseline no_open_memo; do
            ARM_TARGET="$RUNNER_TEMP/isolated-target-$arm"
            cargo test --locked --manifest-path "$ROOT/$arm/Cargo.toml" --target-dir "$ARM_TARGET" 2>&1 | tee "$OUT/$arm-tests.log"
            cargo build --release --locked --manifest-path "$ROOT/$arm/Cargo.toml" --target-dir "$ARM_TARGET" 2>&1 | tee "$OUT/$arm-build.log"
            cp "$ARM_TARGET/release/sokonanoda" "$ROOT/$arm.bin"
            rm -rf "$ARM_TARGET"
          done
          sha256sum "$ROOT/"*.bin > "$OUT/binaries.sha256"
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'mathlib-trial-arms'
          out=Path(os.environ['RUNNER_TEMP'])/'mathlib-trial-evidence'
          rows=[]
          for arm,count in [('baseline',46),('no_open_memo',47)]:
              log=re.sub(r'\x1b\[[0-9;]*m','',(out/(arm+'-tests.log')).read_text())
              counts=[int(x) for x in re.findall(r'test result: ok\. (\d+) passed; 0 failed',log)]
              assert counts and counts[0]==count,(arm,counts,count)
              digest=hashlib.sha256((root/(arm+'.bin')).read_bytes()).hexdigest()
              rows.append({'arm':arm,'library_tests':count,'binary_sha256':digest})
          assert len({r['binary_sha256'] for r in rows})==len(rows),'Executable reuse invalidates comparison'
          (out/'validated-builds.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - uses: actions/cache@v4
        id: mathlib_input
        with:
          path: ${{ runner.temp }}/mathlib-trial-input/mathlib.ndjson
          key: flash-exact-mathlib-f749dfd084fc0727d107c7aaded7d492cebfc0b517cfaa7337d8a7578a6c0dec
      - name: Prepare pinned official export recipe
        if: steps.mathlib_input.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          A="$RUNNER_TEMP/arena-source"
          git init "$A"
          git -C "$A" remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C "$A" fetch --depth 1 origin cb0665b7b0f34d53fa8d62584535c27c86dfa982
          git -C "$A" checkout --detach FETCH_HEAD
          test "$(git -C "$A" rev-parse HEAD)" = cb0665b7b0f34d53fa8d62584535c27c86dfa982
          python3 -m venv "$RUNNER_TEMP/arena-venv"
          "$RUNNER_TEMP/arena-venv/bin/pip" install jinja2 jsonschema markdown pyyaml
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Regenerate exact full Mathlib
        if: steps.mathlib_input.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/arena-source"
          "$RUNNER_TEMP/arena-venv/bin/python" lka.py build-test mathlib 2>&1 | tee "$RUNNER_TEMP/mathlib-trial-evidence/mathlib-export.log"
          cp _build/tests/mathlib.stats.json "$RUNNER_TEMP/mathlib-trial-evidence/exporter-stats.json"
          mkdir -p "$RUNNER_TEMP/mathlib-trial-input"
          mv _build/tests/mathlib.ndjson "$RUNNER_TEMP/mathlib-trial-input/mathlib.ndjson"
      - name: Compare both native arms with alternating order
        run: |
          set -euxo pipefail
          python3 experiments/flash-number1-trials-20261126/whole_mathlib.py \
            --fixture "$RUNNER_TEMP/mathlib-trial-input/mathlib.ndjson" \
            --binaries "$RUNNER_TEMP/mathlib-trial-arms" \
            --out "$RUNNER_TEMP/mathlib-trial-evidence/comparison" \
            --rounds 2 --arms baseline no_open_memo --process-timeout 900 --threads 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-number1-no-open-memo-mathlib
          path: ${{ runner.temp }}/mathlib-trial-evidence/
          if-no-files-found: error
          retention-days: 30
