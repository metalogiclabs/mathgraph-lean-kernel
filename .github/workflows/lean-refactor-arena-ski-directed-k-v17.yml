name: Lean Refactor Arena SKI V17 directed K-witness closure

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lra-ski-directed-k-join-v17'
    paths:
      - 'competitions/lean_refactor_arena/experiments/ski_directed_k_join_v17.jsonl'
      - '.github/workflows/lean-refactor-arena-ski-directed-k-v17.yml'

concurrency:
  group: lra-ski-directed-k-v17
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  primary-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PUBLIC_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      TARGET: Cslib.SKI.parallelReduction_diamond
      BANK: competitions/lean_refactor_arena/experiments/ski_directed_k_join_v17.jsonl
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact retained control and source-exact mirrored critical-pair frontier
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/f8ecf9882ef963722c950f3ff9ceaf72c3c84509/competitions/lean_refactor_arena/experiments/ski_mirrored_critical_v16.jsonl -o /tmp/ski-v17-v16-frozen-bank.jsonl
          curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/metalogiclabs/mathgraph-lean-kernel/actions/runs/38000243153 -o /tmp/ski-v17-primary-run.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('competitions/lean_refactor_arena')
          read=lambda p:[json.loads(t) for t in p.read_text().splitlines() if t.strip()]
          bank=read(pathlib.Path(os.environ['BANK']))
          active=read(root/'portfolio/warmup_portfolio_v1.jsonl')
          name=os.environ['TARGET']
          assert len(active)==15 and len(bank)==10 and len({x['label'] for x in bank})==10
          orig=next(x['proof'] for x in active if x['name']==name)
          assert bank[0]['label']=='ski_v17_exact_278_control'
          assert bank[0]['proof']==orig
          assert bank[1]['label']=='ski_v17_warranted_primary_261_control'
          previous=read(pathlib.Path('/tmp/ski-v17-v16-frozen-bank.jsonl'))
          preceding=next(x for x in previous if x['label']=='ski_v16_mirrored_010')
          assert bank[1]['proof']==preceding['proof'],'SOURCE_261_FROM_WRONG_VERIFIER_BYTES'
          prior_run=json.load(open('/tmp/ski-v17-primary-run.json'))
          assert prior_run['id']==38000243153 and prior_run['status']=='completed'
          assert prior_run['conclusion']=='success' and prior_run['head_sha']=='f8ecf9882ef963722c950f3ff9ceaf72c3c84509'
          hdr=orig.split(' := by\n',1)[0]+' := by\n'
          assert all(r['name']==name and r['proof'].startswith(hdr) for r in bank)
          assert all('aesop' not in r['proof'] for r in bank[1:])
          assert all(not any(k in r['proof'] for k in
                ['sorry','sorryAx','admit','native_decide','run_elab','axiom ']) for r in bank)
          summary={'schema':'mathgraph.lra.ski.frozen-directed-k.v17',
            'status':'FROZEN_PROPOSALS_UNVERIFIED',
            'source_sha':os.environ['PUBLIC_SHA'],'count':len(bank),
            'incumbent_proof_sha256':hashlib.sha256(orig.encode()).hexdigest(),
            'proof_sha256':[hashlib.sha256(r['proof'].encode()).hexdigest() for r in bank],
            'objective_boundary':'Exact independent primary Lean then four required Lean versions on any winner',
            'official_submission':False,'portfolio_mutated':False}
          pathlib.Path('/tmp/ski-v17-origin.json').write_text(
            json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in summary.items() if k!='proof_sha256'},indent=2))
          PY

      - name: Materialize pinned Cslib SKI target module
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_SHA"
          mkdir -p /tmp/ski-v17-module
          project=/tmp/lean-refactor/competition/projects/v4.33
          cd "$project"
          lake update > /tmp/ski-v17-module/lake-update.log 2>&1 || {
            tail -n 120 /tmp/ski-v17-module/lake-update.log; exit 1;
          }
          lake exe cache get > /tmp/ski-v17-module/cache.log 2>&1 || echo 'CACHE_MISS_FALLBACK'
          lake build Cslib.Languages.CombinatoryLogic.Confluence \
            > /tmp/ski-v17-module/target.log 2>&1 || {
            tail -n 150 /tmp/ski-v17-module/target.log; exit 1;
          }
          echo 'VERIFIED_PINNED_SKIMODULE_IMPORT_CLOSURE'

      - name: Score 10 source-exact directed K-witness proof representations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/ski-v17-labels.txt
          import json,os
          labels=[json.loads(t)['label'] for t in open(os.environ['BANK']) if t.strip()]
          assert len(labels)==10 and len(set(labels))==10
          for label in labels: print(label)
          PY
          : > /tmp/ski-v17-scores.jsonl
          while IFS= read -r label; do
            echo "SKI_V17_CANDIDATE=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.33 \
              --name "$TARGET" --candidate "$BANK" --label "$label"
            (cd /tmp/lean-refactor/competition && \
              python3 arena.py check --name "$TARGET" --timeout 1200) > /tmp/ski-v17-one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' \
              /tmp/ski-v17-one.json >> /tmp/ski-v17-scores.jsonl
          done < /tmp/ski-v17-labels.txt

      - name: Classify compiler failures, cost and exact primary frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          bank=[json.loads(x) for x in pathlib.Path(os.environ['BANK']).read_text().splitlines() if x.strip()]
          rows=[json.loads(x) for x in pathlib.Path('/tmp/ski-v17-scores.jsonl').read_text().splitlines() if x.strip()]
          assert len(bank)==len(rows)==10
          assert len({r['candidate_label'] for r in rows})==10
          def valid(r):
              pv=r.get('per_version') or []
              return (r.get('compiled') is True and r.get('statement_ok') is True and
                r.get('eligible') is True and not r.get('forbidden') and
                not r.get('extra_toplevel_decls') and not r.get('untested') and
                r.get('compat')=={'v4.33.0-rc2':True} and
                len(pv)==1 and pv[0].get('tested') is True and pv[0].get('ok') is True)
          control=next(r for r in rows if r['candidate_label']=='ski_v17_warranted_primary_261_control')
          base=next(r for r in rows if r['candidate_label']=='ski_v17_exact_278_control')
          assert valid(base),'SKI_V10_278_CONTROL_REGRESSED'
          assert valid(control),'SKI_V16_261_PRIMARY_CONTROL_REGRESSED'
          assert (int(base['length']),int(base['heartbeats']))==(278,501)
          assert (int(control['length']),int(control['heartbeats']))==(261,543)
          qualified=[r for r in rows if valid(r)]
          improved=[r for r in qualified if r is not control and
                float(r['objective_sum_pct'])>float(control['objective_sum_pct'])]
          improved.sort(key=lambda r:(-float(r['objective_sum_pct']),int(r['length']),int(r['heartbeats'])))
          best=improved[0] if improved else None
          out={'schema':'mathgraph.lra.ski.directed-k.v17',
             'status':'CANDIDATE_PRIMARY_GAIN_REQUIRES_4_VERSIONS' if best else 'REJECTED_BOUNDED_NO_PRIMARY_GAIN',
             'source_sha':os.environ['PUBLIC_SHA'],
             'incumbent':{'tokens':control['length'],'heartbeats':control['heartbeats'],
                 'objective':control['objective_sum_pct']},
             'compiled':len(qualified),'failed':len(rows)-len(qualified),
             'qualified':[{'label':r['candidate_label'],'length':r['length'],
                 'heartbeats':r['heartbeats'],'objective':r['objective_sum_pct']}
                 for r in qualified],
             'rejections':[{'label':r['candidate_label'],
                  'errors':(r.get('per_version') or [{}])[0].get('errors',[])}
                  for r in rows if not valid(r)],
             'best':None if best is None else
               {'label':best['candidate_label'],'length':best['length'],
                'heartbeats':best['heartbeats'],'objective':best['objective_sum_pct']},
             'portfolio_mutated':False,'officially_submitted':False,
             'promotion':'Requires independently pinned v4.33, v4.32, v4.31, v4.30 all-version check, proof-byte tie, exact 15-packet reclosure'}
          pathlib.Path('/tmp/ski-v17-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          if best:
              x=next(x for x in bank if x['label']==best['candidate_label'])
              pathlib.Path('/tmp/ski-v17-winner.jsonl').write_text(json.dumps(x,ensure_ascii=False)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-ski-v17-directed-k
          path: |
            /tmp/ski-v17-origin.json
            /tmp/ski-v17-scores.jsonl
            /tmp/ski-v17-summary.json
            /tmp/ski-v17-winner.jsonl
            /tmp/ski-v17-module
