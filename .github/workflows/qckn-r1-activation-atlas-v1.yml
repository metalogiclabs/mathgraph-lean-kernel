name: QCKN R1 activation atlas v1

on:
  push:
    branches:
      - qckn-r1-activation-atlas-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run selector partition tests
        run: cargo test --locked r1_activation_bucket_tests -- --nocapture
