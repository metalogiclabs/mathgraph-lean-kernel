name: QCKN R1 activation atlas v1

on:
  push:
    branches:
      - qckn-r1-activation-atlas-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run selector partition tests
        run: cargo test --locked r1_activation_bucket_tests -- --nocapture

  activation-atlas:
    needs: unit-red-green
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run QCKN R1 activation atlas
        run: bash experiments/run_qckn_r1_activation_atlas_v1.sh
      - name: Upload QCKN R1 atlas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qckn-r1-activation-atlas-v1
          path: /tmp/qckn-r1-activation-atlas-v1/evidence
          if-no-files-found: warn
