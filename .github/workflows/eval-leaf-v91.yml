name: Evaluation leaf fast path v91
on:
  push:
    branches: [experiment/eval-leaf-fastpath-v91]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONOPTIMIZE: '0'
      V91_ROOT: /tmp/v91
      V89_ROOT: /tmp/v91
    steps:
      - uses: actions/checkout@v4
      - name: Verify source patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B experiments/eval_leaf_v91.py --self-test
          python3 -m py_compile experiments/eval_leaf_v91.py
          git diff --exit-code -- src/
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Paired native release benchmark and complete unit tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/v91/out
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/v91/toolchain-arena
          git -C /tmp/v91/toolchain-arena checkout -q 91f376e4baacf2df0c478e7173bccb2a6adac5c5
          test "$(git -C /tmp/v91/toolchain-arena rev-parse HEAD)" = 91f376e4baacf2df0c478e7173bccb2a6adac5c5
          cd /tmp/v91/toolchain-arena
          nix develop -c python3 -B "$GITHUB_WORKSPACE/experiments/eval_leaf_v91.py" |& tee /tmp/v91/out/ci.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-leaf-v91
          path: /tmp/v91/out/
          if-no-files-found: warn
