name: force_all operational basin census v11

on:
  push:
    branches: [experiment/force-operational-basin-census-v11]
    paths:
      - '.github/workflows/verified-law-tournament-v10.yml'
      - 'experiments/force-operational-basin-census-v11.trigger'
      - 'experiments/run_force_operational_basin_census_v11.sh'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute residual-driven operational basin census
        shell: bash
        run: bash experiments/run_force_operational_basin_census_v11.sh
      - uses: actions/upload-artifact@v4
        with:
          name: force-operational-basin-census-v11
          path: |
            /tmp/v11-census.json
            /tmp/v11-ranking.csv
            /tmp/v11-residual.json
            /tmp/v11-decision.txt
