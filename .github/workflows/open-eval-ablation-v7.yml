name: open-eval ablation v7

on:
  push:
    branches: [open-eval-ablation-v7]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Arena corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test tutorial
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar

      - name: Prepare three arms
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          cp -a /tmp/base /tmp/keep
          cp -a /tmp/base /tmp/bypass
          cp experiments/apply_open_eval_ablation_v7.py /tmp/keep/patch.py
          cp experiments/apply_open_eval_ablation_v7.py /tmp/bypass/patch.py
          (cd /tmp/keep && python3 patch.py keep-key)
          (cd /tmp/bypass && python3 patch.py bypass-key)

      - name: Build arms
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          CARGO_TARGET_DIR=/tmp/base-target RUSTFLAGS='-C target-cpu=x86-64 -C debuginfo=1' cargo build --manifest-path /tmp/base/Cargo.toml --release --locked
          CARGO_TARGET_DIR=/tmp/keep-target RUSTFLAGS='-C target-cpu=x86-64 -C debuginfo=1' cargo build --manifest-path /tmp/keep/Cargo.toml --release --locked
          CARGO_TARGET_DIR=/tmp/bypass-target RUSTFLAGS='-C target-cpu=x86-64 -C debuginfo=1' cargo build --manifest-path /tmp/bypass/Cargo.toml --release --locked
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Tutorial semantic equivalence
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json
          bins={
            'base':'/tmp/base-target/release/sokonanoda',
            'keep':'/tmp/keep-target/release/sokonanoda',
            'bypass':'/tmp/bypass-target/release/sokonanoda',
          }
          files=sorted(pathlib.Path('_build/tests/tutorial').rglob('*.ndjson'))
          mism=[]
          for p in files:
              data=p.read_bytes()
              rc={k:subprocess.run([b,'/tmp/checker.json'],input=data,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode for k,b in bins.items()}
              if len(set(rc.values())) != 1: mism.append((str(p),rc))
          print(json.dumps({'tutorial_cases':len(files),'mismatch_count':len(mism),'mismatches':mism[:50]},indent=2))
          if mism: raise SystemExit(1)
          PY

      - name: Large corpus acceptance gate
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          python3 - <<'PY'
          import subprocess, json
          bins={
            'base':'/tmp/base-target/release/sokonanoda',
            'keep':'/tmp/keep-target/release/sokonanoda',
            'bypass':'/tmp/bypass-target/release/sokonanoda',
          }
          corpora={'std':'_build/tests/std.ndjson','cedar':'_build/tests/cedar.ndjson'}
          out={}; bad=[]
          for corpus,path in corpora.items():
              out[corpus]={}
              for label,b in bins.items():
                  with open(path,'rb') as f:
                      r=subprocess.run([b,'/tmp/checker.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=1200)
                  tail=r.stderr.decode('utf-8','replace')[-1500:]
                  out[corpus][label]={'returncode':r.returncode,'stderr_tail':tail}
                  if r.returncode != 0: bad.append((corpus,label,r.returncode,tail))
          print(json.dumps(out,indent=2))
          if bad:
              print('DECISION=INVALID_SEMANTIC_ARM')
              raise SystemExit(1)
          print('DECISION=ALL_LARGE_CORPORA_ACCEPTED')
          PY

      - name: Install Valgrind
        run: nix profile add nixpkgs#valgrind

      - name: Measure Std and Cedar
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          measure() {
            label="$1"; bin="$2"; input="$3"
            timeout 3000 valgrind --tool=callgrind --callgrind-out-file="/tmp/${label}.cg" "$bin" /tmp/checker.json < "$input" >/tmp/${label}.out 2>/tmp/${label}.err
            awk '/summary:/ {print $2}' "/tmp/${label}.cg" | tail -1
          }
          BS=$(measure base-std /tmp/base-target/release/sokonanoda _build/tests/std.ndjson)
          KS=$(measure keep-std /tmp/keep-target/release/sokonanoda _build/tests/std.ndjson)
          XS=$(measure bypass-std /tmp/bypass-target/release/sokonanoda _build/tests/std.ndjson)
          BC=$(measure base-cedar /tmp/base-target/release/sokonanoda _build/tests/cedar.ndjson)
          KC=$(measure keep-cedar /tmp/keep-target/release/sokonanoda _build/tests/cedar.ndjson)
          XC=$(measure bypass-cedar /tmp/bypass-target/release/sokonanoda _build/tests/cedar.ndjson)
          python3 - "$BS" "$KS" "$XS" "$BC" "$KC" "$XC" <<'PY' | tee /tmp/result.txt
          import sys,json
          bs,ks,xs,bc,kc,xc=map(int,sys.argv[1:])
          def rows(b,k,x):
              return {
                'baseline':b,
                'no_cache_keep_key':{'instructions':k,'ratio':k/b,'delta_pct':100*(k/b-1)},
                'no_cache_bypass_key':{'instructions':x,'ratio':x/b,'delta_pct':100*(x/b-1)},
              }
          out={'std':rows(bs,ks,xs),'cedar':rows(bc,kc,xc)}
          print(json.dumps(out,indent=2))
          if xs/bs <= .90 and xc/bc <= .92:
              print('DECISION=PHASE_CHANGE_BYPASS_OPEN_EVAL')
          elif ks/bs > 1.05 and xs/bs > 1.05:
              print('DECISION=OPEN_EVAL_CACHE_EARNS_COST')
          else:
              print('DECISION=REFINE_OPEN_EVAL_BY_CLASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-eval-ablation-v7
          path: /tmp/result.txt
          if-no-files-found: warn
