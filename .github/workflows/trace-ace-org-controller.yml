name: Trace Ace Org Controller
on:
  push:
    branches: [master]
    paths:
      - '.trace-ace/V154_TRIGGER_MASTER.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trace-ace-org-controller-v154
  cancel-in-progress: true
env:
  SCIENCE_REPO: heathsanchez/mathgraph
  SCIENCE_SHA: 98a7597d458841bdb2d6a5b40684c7da9150e739
  TRANSCRIPT_ID: 1nOjremWhpZ_QKSLvZfGcNkS_C3kMMBUI
  TRANSCRIPT_SIZE: '603547640'
  TRANSCRIPT_SHA: e685b85b04694e130c25b17d09cdd1892fbda5e9fa685e98b2300114b915aa2d
  METADATA_ID: 1EpqoamY0vFI2qE57R6wdqU5HwuoVk3Zz
jobs:
  v154:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout controller marker branch
        uses: actions/checkout@v4
        with:
          ref: trace-ace-controller
          path: controller
      - name: Checkout frozen science
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCIENCE_REPO }}
          ref: ${{ env.SCIENCE_SHA }}
          path: mathgraph
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn gdown
      - name: Record start marker
        working-directory: controller
        run: |
          mkdir -p .trace-ace/results
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path('.trace-ace/results/V154_RUN_START.json').write_text(json.dumps({'run_id':int(os.environ['GITHUB_RUN_ID']),'status':'STARTED','science_repo':os.environ['SCIENCE_REPO'],'science_sha':os.environ['SCIENCE_SHA'],'science_protocol':'V153_RESPONSE_FEEDBACK_BINDING','operational_label':'V154'},indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .trace-ace/results/V154_RUN_START.json
          git commit -m "results: record org V154 start $GITHUB_RUN_ID" || true
          git push origin HEAD:trace-ace-controller || true
      - name: Restore transcript cache
        uses: actions/cache/restore@v4
        with:
          path: data/transcripts.zip
          key: trace-ace-transcripts-v1-${{ env.TRANSCRIPT_SHA }}
          fail-on-cache-miss: true
      - name: Validate transcript archive
        run: |
          set -euo pipefail
          test "$(stat -c%s data/transcripts.zip)" = "$TRANSCRIPT_SIZE"
          echo "$TRANSCRIPT_SHA  data/transcripts.zip" | sha256sum -c -
      - name: Download metadata and extract
        run: |
          mkdir -p data/meta data/transcripts
          gdown "$METADATA_ID" -O data/metadata.zip
          unzip -q data/metadata.zip -d data/meta
          unzip -q data/transcripts.zip -d data/transcripts
          echo "FEATURES=$(find data/meta -type f -name 'train_features*.csv' -print -quit)" >> "$GITHUB_ENV"
          echo "LABELS=$(find data/meta -type f -name 'train_labels*.csv' -print -quit)" >> "$GITHUB_ENV"
          FIRST=$(find data/transcripts -type f -name '*.csv' -print -quit)
          echo "TRANSCRIPTS=$(dirname "$FIRST")" >> "$GITHUB_ENV"
      - name: Verify frozen science
        run: |
          test "$(git -C mathgraph rev-parse HEAD)" = "$SCIENCE_SHA"
          python -m py_compile mathgraph/competitions/trace_the_ace/v153_response_feedback_binding.py
      - name: Run frozen V154 binding discovery
        run: |
          cd mathgraph/competitions/trace_the_ace
          python v153_response_feedback_binding.py --features "../../../$FEATURES" --labels "../../../$LABELS" --transcripts "../../../$TRANSCRIPTS" --out ../../../v154_response_feedback_binding.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v154-response-feedback-binding
          path: v154_response_feedback_binding.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record final marker
        if: always()
        working-directory: controller
        run: |
          git pull --rebase origin trace-ace-controller || true
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('../v154_response_feedback_binding.json')
          out={'run_id':int(os.environ['GITHUB_RUN_ID']),'status':'FINAL','result_exists':p.exists(),'science_sha':os.environ['SCIENCE_SHA'],'operational_label':'V154'}
          if p.exists():
              r=json.loads(p.read_text());out['verdict']=r.get('decision',{}).get('verdict');out['session_gain']=r.get('session_grouped',{}).get('gain_bound_vs_v135');out['objective_gain']=r.get('objective_grouped',{}).get('gain_bound_vs_v135');out['session_vs_shuffle']=r.get('session_grouped',{}).get('gain_bound_vs_shuffle');out['objective_vs_shuffle']=r.get('objective_grouped',{}).get('gain_bound_vs_shuffle')
          pathlib.Path('.trace-ace/results/V154_RUN_FINAL.json').write_text(json.dumps(out,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .trace-ace/results/V154_RUN_FINAL.json
          git commit -m "results: record org V154 final $GITHUB_RUN_ID" || true
          git push origin HEAD:trace-ace-controller || true
