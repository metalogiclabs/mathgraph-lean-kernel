name: Flash minimal consequential empty-context test
on:
  push:
    branches: [research/flash-empty-context-20261021]
    paths:
      - 'experiments/flash_empty_context_20261021.py'
      - 'experiments/flash_empty_context_gate_20261021.py'
      - '.github/workflows/flash-empty-context-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install portable guest-instruction meter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Freeze common source and create exact isolated control
        run: |
          set -euo pipefail
          mkdir -p /tmp/flash-empty-evidence /tmp/flash-empty-zip /tmp/flash-empty-tests
          git clone -q https://github.com/intgrah/sokonanoda /tmp/flash-empty-base-src
          git -C /tmp/flash-empty-base-src checkout --detach 7645b1e1fcacfe410c99141f1234381d995b325d
          git -C /tmp/flash-empty-base-src worktree add --detach /tmp/flash-empty-candidate-src 7645b1e1fcacfe410c99141f1234381d995b325d
          for arm in base candidate; do
            python3 experiments/arena_soko_sparse_patch_v1.py /tmp/flash-empty-$arm-src
            python3 experiments/arena_soko_growth_patch_v1.py /tmp/flash-empty-$arm-src
          done
          python3 experiments/flash_empty_context_20261021.py /tmp/flash-empty-candidate-src
          git -C /tmp/flash-empty-candidate-src diff --check
          git -C /tmp/flash-empty-base-src diff > /tmp/flash-empty-evidence/qualified-common.diff
          git -C /tmp/flash-empty-candidate-src diff > /tmp/flash-empty-evidence/proposed-candidate.diff
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11505862349/zip > /tmp/flash-empty-tests.zip
          unzip -q /tmp/flash-empty-tests.zip -d /tmp/flash-empty-zip
          tar --no-same-owner -xzf /tmp/flash-empty-zip/lean-arena-tests.tar.gz -C /tmp/flash-empty-tests
          test -s /tmp/flash-empty-tests/good/init-prelude.ndjson
      - name: Compile both checker variants and native Rust tests
        run: |
          set -euo pipefail
          for arm in base candidate; do
            CARGO_TARGET_DIR=/tmp/flash-empty-$arm-target RUSTFLAGS='-C target-cpu=x86-64' \
              cargo build --release --locked --manifest-path /tmp/flash-empty-$arm-src/Cargo.toml
          done
          CARGO_TARGET_DIR=/tmp/flash-empty-candidate-target RUSTFLAGS='-C target-cpu=x86-64' \
            cargo test --release --locked --manifest-path /tmp/flash-empty-candidate-src/Cargo.toml \
            > /tmp/flash-empty-evidence/rust-tests.log 2>&1 || { tail -80 /tmp/flash-empty-evidence/rust-tests.log; exit 1; }
          sha256sum /tmp/flash-empty-{base,candidate}-target/release/sokonanoda > /tmp/flash-empty-evidence/binaries.sha256
      - name: Protect verdicts and compare actual whole-process Callgrind
        run: |
          set -euo pipefail
          python3 experiments/flash_empty_context_gate_20261021.py /tmp/flash-empty-tests /tmp/flash-empty-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-empty-context-decision-${{ github.sha }}
          path: /tmp/flash-empty-evidence/
          if-no-files-found: warn
