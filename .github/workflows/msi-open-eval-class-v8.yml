name: MSI open-eval class v8

on:
  push:
    branches: [msi-open-eval-class-v8]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare Arena corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test tutorial
          nix develop -c ./lka.py build-test std
      - name: Prepare arms
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          for arm in app app-proj app-let; do
            cp -a /tmp/base /tmp/$arm
            cp experiments/apply_msi_open_eval_class_v8.py /tmp/$arm/patch.py
            (cd /tmp/$arm && python3 patch.py $arm)
          done
      - name: Build arms
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          for arm in base app app-proj app-let; do
            CARGO_TARGET_DIR=/tmp/${arm}-target RUSTFLAGS='-C target-cpu=x86-64 -C debuginfo=1' cargo build --manifest-path /tmp/${arm}/Cargo.toml --release --locked
          done
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Tutorial semantic equivalence
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json
          arms=['base','app','app-proj','app-let']
          files=sorted(pathlib.Path('_build/tests/tutorial').rglob('*.ndjson'))
          mism=[]
          for p in files:
            data=p.read_bytes(); r={}
            for a in arms:
              r[a]=subprocess.run([f'/tmp/{a}-target/release/sokonanoda','/tmp/checker.json'],input=data,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
            if len(set(r.values()))!=1: mism.append((str(p),r))
          print(json.dumps({'cases':len(files),'mismatch_count':len(mism),'mismatches':mism[:30]},indent=2))
          if mism: raise SystemExit(1)
          PY
      - name: Std acceptance gate
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          python3 - <<'PY'
          import subprocess,json
          out={}; bad=[]
          for a in ['base','app','app-proj','app-let']:
            with open('_build/tests/std.ndjson','rb') as f:
              r=subprocess.run([f'/tmp/{a}-target/release/sokonanoda','/tmp/checker.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=1200)
            out[a]={'returncode':r.returncode,'stderr_tail':r.stderr.decode('utf8','replace')[-1000:]}
            if r.returncode: bad.append(a)
          print(json.dumps(out,indent=2))
          if bad: raise SystemExit(1)
          PY
      - name: Install Valgrind
        run: nix profile add nixpkgs#valgrind
      - name: Measure Std tournament
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          measure(){ a="$1"; timeout 3000 valgrind --tool=callgrind --callgrind-out-file="/tmp/$a.cg" "/tmp/$a-target/release/sokonanoda" /tmp/checker.json < _build/tests/std.ndjson >/tmp/$a.out 2>/tmp/$a.err; awk '/summary:/ {print $2}' "/tmp/$a.cg" | tail -1; }
          B=$(measure base); A=$(measure app); P=$(measure app-proj); L=$(measure app-let)
          python3 - "$B" "$A" "$P" "$L" <<'PY' | tee /tmp/result.txt
          import sys,json
          b,a,p,l=map(int,sys.argv[1:])
          out={'baseline':b}
          for n,v in [('app_only',a),('app_proj',p),('app_let',l)]: out[n]={'instructions':v,'ratio':v/b,'delta_pct':100*(v/b-1)}
          print(json.dumps(out,indent=2))
          winner=min((a,'app_only'),(p,'app_proj'),(l,'app_let'))
          print('WINNER='+winner[1])
          print('DECISION=' + ('PROMOTE_MSI_CLASS_INTERFACE' if winner[0] < b else 'NO_CLASS_GAIN'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-open-eval-class-v8
          path: /tmp/result.txt
          if-no-files-found: warn
