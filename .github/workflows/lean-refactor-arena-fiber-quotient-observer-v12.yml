name: Lean Refactor Arena Binius fiberwise quotient-observer witness experiment
on:
  workflow_dispatch:
  push:
    branches: ['competition/lra-fiber-quotient-observer-v12']
    paths:
      - 'competitions/lean_refactor_arena/experiments/fiber_quotient_observer_v12.jsonl'
      - '.github/workflows/lean-refactor-arena-fiber-quotient-observer-v12.yml'

permissions:
  contents: read

concurrency:
  group: lra-fiber-quotient-observer-v12
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PUBLIC_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      ACTIVE_V14_SHA: 10cb74f2890e5e0cd4eae6a48259fcd6e1d6f667
      TARGET: Binius.BinaryBasefold.fiberwise_dist_lt_imp_dist_lt_unique_decoding_radius
      BANK: competitions/lean_refactor_arena/experiments/fiber_quotient_observer_v12.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Bind eight unique proofs to source-exact active V14 incumbent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lra-fiber-v12
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/$ACTIVE_V14_SHA/competitions/lean_refactor_arena/portfolio/warmup_portfolio_v1.jsonl" \
            -o /tmp/lra-fiber-v12/v14.jsonl
          python3 - <<'PY'
          import json,hashlib,pathlib,os,re
          read=lambda p:[json.loads(s) for s in pathlib.Path(p).read_text().splitlines() if s.strip()]
          port=read('/tmp/lra-fiber-v12/v14.jsonl')
          bank=read(os.environ['BANK'])
          assert len(port)==15 and len({r['name'] for r in port})==15
          assert len(bank)==len({r['label'] for r in bank})==len({r['proof'] for r in bank})==8
          incumbent=next(r for r in port if r['name']==os.environ['TARGET'])
          control=next(r for r in bank if r['label']=='fiber_v12_exact_439_control')
          assert incumbent['label']=='public_informed_local_factor_439'
          assert incumbent['proof']==control['proof']
          header=control['proof'].split(' := by\n',1)[0]+' := by\n'
          forbidden=re.compile(r'\b(?:sorry|sorryAx|admit|axiom|unsafe|native_decide|run_cmd|run_elab)\b')
          assert all(r['name']==os.environ['TARGET'] and r['proof'].startswith(header) and
            not forbidden.search(r['proof']) for r in bank)
          manifest={'schema':'mathgraph.lra.fiberwise.quotient-observer.v12.frozen',
            'state':'CANDIDATE_UNVERIFIED','source':os.environ['PUBLIC_SHA'],
            'retained_source_sha':os.environ['ACTIVE_V14_SHA'],
            'control_proof_sha256':hashlib.sha256(control['proof'].encode()).hexdigest(),
            'variants':{r['label']:hashlib.sha256(r['proof'].encode()).hexdigest() for r in bank},
            'required_versions':['v4.31.0','v4.30.0','v4.29.0','v4.28.0'],
            'retained_portfolio_mutated':False,'external_submission':False}
          pathlib.Path('/tmp/lra-fiber-v12/source.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('VERIFIED_EXACT_FIBER_SOURCE_AND_EIGHT_UNIQUE_PROPOSALS')
          PY
      - name: Build only pinned ArkLib BinaryBasefold proof module
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_SHA"
          (
            cd /tmp/lean-refactor/competition/projects/v4.31
            lake update > /tmp/lra-fiber-v12/lake-update.log 2>&1
            lake exe cache get > /tmp/lra-fiber-v12/lake-cache.log 2>&1 || echo CACHE_MISS_FALLBACK
            lake build ArkLib.ProofSystem.Binius.BinaryBasefold.Prelude \
              > /tmp/lra-fiber-v12/build.log 2>&1
          ) || { tail -n 130 /tmp/lra-fiber-v12/build.log; exit 1; }
          echo VERIFIED_REQUIRED_PINNED_BINARYBASEFOLD_IMPORT_CLOSURE
      - name: Score eight exact finite-fiber counting witness representations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/lra-fiber-v12/labels
          import json,os
          rows=[json.loads(s) for s in open(os.environ['BANK']) if s.strip()]
          assert len(rows)==8
          for r in rows: print(r['label'])
          PY
          : > /tmp/lra-fiber-v12/scores.jsonl
          while IFS= read -r label; do
            echo "FIBER_OBSERVER=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.31 \
              --name "$TARGET" --candidate "$BANK" --label "$label"
            (cd /tmp/lean-refactor/competition && \
              python3 arena.py check --name "$TARGET" --timeout 1500) > /tmp/lra-fiber-v12/one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' \
              /tmp/lra-fiber-v12/one.json >> /tmp/lra-fiber-v12/scores.jsonl
          done < /tmp/lra-fiber-v12/labels
      - name: Retain only strict objective improvements; preserve all negatives and control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          root=pathlib.Path('/tmp/lra-fiber-v12')
          rows=[json.loads(s) for s in (root/'scores.jsonl').read_text().splitlines() if s.strip()]
          bank=[json.loads(s) for s in pathlib.Path(os.environ['BANK']).read_text().splitlines() if s.strip()]
          assert len(rows)==len(bank)==8 and {r['candidate_label'] for r in rows}=={x['label'] for x in bank}
          def valid(r):
            pv=r.get('per_version') or []
            return (r.get('compiled') is True and r.get('statement_ok') is True and
              r.get('eligible') is True and not r.get('forbidden') and
              not r.get('extra_toplevel_decls') and not r.get('untested') and
              r.get('compat')=={'v4.31.0':True} and len(pv)==1 and
              pv[0].get('tested') is True and pv[0].get('ok') is True)
          control=next(r for r in rows if r['candidate_label']=='fiber_v12_exact_439_control')
          assert valid(control)
          assert (int(control['length']),int(control['heartbeats']))==(439,7052)
          assert round(float(control['objective_sum_pct']),2)==129.55
          good=[r for r in rows if valid(r)]
          gains=sorted((r for r in good if r is not control and float(r['objective_sum_pct'])>129.55),
            key=lambda r:(-float(r['objective_sum_pct']),int(r['length']),int(r['heartbeats'])))
          best=gains[0] if gains else None
          out={'schema':'mathgraph.lra.fiberwise.quotient-observer.v12.primary',
            'state':'CANDIDATE_PRIMARY_GAIN_REQUIRES_FOUR_VERSIONS' if best else 'REJECTED_BOUNDED_NO_GAIN',
            'pinned_source':os.environ['PUBLIC_SHA'],'tested':len(rows),'compiled':len(good),
            'control':{'tokens':439,'heartbeats':7052,'objective':129.55},
            'qualified':[{'label':r['candidate_label'],'tokens':r['length'],'heartbeats':r['heartbeats'],
              'objective':r['objective_sum_pct']} for r in good],
            'failures':[{'label':r['candidate_label'],'errors':(r.get('per_version') or [{}])[0].get('errors',[])} for r in rows if not valid(r)],
            'best':None if best is None else
              {'label':best['candidate_label'],'tokens':best['length'],'heartbeats':best['heartbeats'],
               'objective':best['objective_sum_pct'],'proof_sha256':hashlib.sha256(next(x['proof'] for x in bank if x['label']==best['candidate_label']).encode()).hexdigest()},
            'four_version_replay_boundary':['v4.31.0','v4.30.0','v4.29.0','v4.28.0'],
            'portfolio_mutated':False,'official_submission':False}
          (root/'result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          if best:
            winner=next(x for x in bank if x['label']==best['candidate_label'])
            (root/'winner.jsonl').write_text(json.dumps(winner,ensure_ascii=False)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='failures'},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-fiber-quotient-observer-v12
          path: /tmp/lra-fiber-v12
