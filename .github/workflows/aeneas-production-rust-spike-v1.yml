name: Aeneas production Rust spike v1

on:
  push:
    branches:
      - experiment/aeneas-production-rust-spike-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-production-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm frozen ancestry and unchanged production target
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 20a7a9fc4e3cea4f1b4cb8e04aecff4214533c27 HEAD
          git diff --exit-code 20a7a9fc4e3cea4f1b4cb8e04aecff4214533c27 -- src/relevance.rs
          sha256sum src/relevance.rs Cargo.toml Cargo.lock

      - name: Install pinned Aeneas/Charon release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aeneas"
          curl -fL --retry 3 \
            https://github.com/cryspen/aeneas/releases/download/nightly-2026.09.23-183e4f0/aeneas-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/aeneas.tar.gz"
          echo "77888e77f43fc4a1fa4760af184dc99825d600e75eb84921e79263066b51ab10  $RUNNER_TEMP/aeneas.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/aeneas.tar.gz" -C "$RUNNER_TEMP/aeneas"
          chmod +x "$RUNNER_TEMP/aeneas/aeneas" "$RUNNER_TEMP/aeneas/charon" "$RUNNER_TEMP/aeneas/charon-driver"
          "$RUNNER_TEMP/aeneas/aeneas" -version
          "$RUNNER_TEMP/aeneas/charon" --version || "$RUNNER_TEMP/aeneas/charon" --help >/dev/null
          cp "$RUNNER_TEMP/aeneas/rust-toolchain" rust-toolchain
          rustup show

      - name: Extract production crate with Charon and translate with Aeneas
        id: spike
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence

          {
            echo "base=20a7a9fc4e3cea4f1b4cb8e04aecff4214533c27"
            echo "head=$(git rev-parse HEAD)"
            echo "target=src/relevance.rs"
            echo "functions=Sig::arg_is_ignorable,Sig::result_is_not_proof"
            echo "mode=charon-whole-production-library-strict-target-check"
            echo "rust_target_sha256=$(sha256sum src/relevance.rs | awk '{print $1}')"
          } > evidence/manifest.txt

          echo "=== Charon extraction ===" | tee evidence/charon.log
          set +e
          "$RUNNER_TEMP/aeneas/charon" cargo --preset=aeneas \
            --print-llbc --dest evidence -- --lib \
            2>&1 | tee -a evidence/charon.log
          CHARON_STATUS=${PIPESTATUS[0]}
          set -e
          echo "charon_status=${CHARON_STATUS}" | tee -a evidence/manifest.txt

          if [ "${CHARON_STATUS}" -ne 0 ]; then
            echo "CHARON_EXTRACTION_FAILED" | tee evidence/verdict.txt
            exit 11
          fi

          LLBC=$(find evidence -maxdepth 1 -name '*.llbc' -print -quit)
          if [ -z "${LLBC}" ]; then
            echo "LLBC_MISSING_AFTER_CHARON" | tee evidence/verdict.txt
            exit 14
          fi
          echo "llbc=${LLBC}" | tee -a evidence/manifest.txt

          echo "=== Strict target declaration check ==="
          python - "${LLBC}" <<'PY' | tee evidence/target-declarations.txt
import json, sys
path = sys.argv[1]
with open(path, "r", encoding="utf-8") as f:
    data = json.load(f)
t = data.get("translated", data)
targets = {"arg_is_ignorable", "result_is_not_proof"}
found = {}
item_names = t.get("item_names", [])
for entry in item_names:
    key = entry.get("key", {})
    if "Fun" not in key:
        continue
    parts = []
    for p in entry.get("value", []):
        ident = p.get("Ident") if isinstance(p, dict) else None
        if ident:
            parts.append(ident[0])
    for target in targets:
        if target in parts:
            found[target] = key["Fun"]
fun_decls = {d.get("def_id"): d for d in t.get("fun_decls", [])}
print("fun_decl_count=" + str(len(fun_decls)))
for target in sorted(targets):
    if target not in found:
        print(target + "=MISSING")
        continue
    decl = fun_decls.get(found[target], {})
    body = decl.get("body")
    status = "BODY" if body is not None else "OPAQUE"
    print(f"{target}=FUN_ID:{found[target]}:{status}")
missing = targets - set(found)
if missing:
    sys.exit(12)
if any(fun_decls.get(found[x], {}).get("body") is None for x in targets):
    sys.exit(13)
PY
          TARGET_STATUS=${PIPESTATUS[0]}
          if [ "${TARGET_STATUS}" -eq 12 ]; then
            echo "TARGET_NOT_REACHED" | tee evidence/verdict.txt
            exit 12
          elif [ "${TARGET_STATUS}" -eq 13 ]; then
            echo "TARGET_BODY_OPAQUE" | tee evidence/verdict.txt
            exit 16
          elif [ "${TARGET_STATUS}" -ne 0 ]; then
            echo "TARGET_CHECK_FAILED" | tee evidence/verdict.txt
            exit 17
          fi

          echo "=== Aeneas Lean translation ===" | tee evidence/aeneas.log
          pushd evidence >/dev/null
          LLBC_BASE=$(basename "${LLBC}")
          set +e
          "$RUNNER_TEMP/aeneas/aeneas" \
            -backend lean -split-files "${LLBC_BASE}" \
            2>&1 | tee -a aeneas.log
          AENEAS_STATUS=${PIPESTATUS[0]}
          set -e
          popd >/dev/null

          echo "aeneas_status=${AENEAS_STATUS}" | tee -a evidence/manifest.txt
          find evidence -maxdepth 2 -type f -printf '%P\n' | sort > evidence/generated-files.txt

          if [ "${AENEAS_STATUS}" -ne 0 ]; then
            echo "AENEAS_TRANSLATION_FAILED" | tee evidence/verdict.txt
            exit 13
          fi

          if ! find evidence -type f -name '*.lean' -print -quit | grep -q .; then
            echo "AENEAS_NO_LEAN_OUTPUT" | tee evidence/verdict.txt
            exit 15
          fi

          echo "AENEAS_TRANSLATED" | tee evidence/verdict.txt

      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeneas-production-rust-spike-v1
          path: evidence/
          if-no-files-found: warn
