name: Aeneas production Rust spike v1

on:
  push:
    branches:
      - experiment/aeneas-production-rust-spike-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-production-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm frozen ancestry and unchanged production target
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 20a7a9fc4e3cea4f1b4cb8e04aecff4214533c27 HEAD
          git diff --exit-code 20a7a9fc4e3cea4f1b4cb8e04aecff4214533c27 -- src/relevance.rs
          sha256sum src/relevance.rs Cargo.toml Cargo.lock

      - name: Install pinned Aeneas/Charon release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aeneas"
          curl -fL --retry 3 \
            https://github.com/cryspen/aeneas/releases/download/nightly-2026.09.23-183e4f0/aeneas-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/aeneas.tar.gz"
          echo "77888e77f43fc4a1fa4760af184dc99825d600e75eb84921e79263066b51ab10  $RUNNER_TEMP/aeneas.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/aeneas.tar.gz" -C "$RUNNER_TEMP/aeneas"
          chmod +x "$RUNNER_TEMP/aeneas/aeneas" "$RUNNER_TEMP/aeneas/charon" "$RUNNER_TEMP/aeneas/charon-driver"
          "$RUNNER_TEMP/aeneas/aeneas" -version
          "$RUNNER_TEMP/aeneas/charon" --version || "$RUNNER_TEMP/aeneas/charon" --help >/dev/null
          cp "$RUNNER_TEMP/aeneas/rust-toolchain" rust-toolchain
          rustup show

      - name: Extract whole production LLBC, slice target closure, translate with Aeneas
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/full evidence/slice

          {
            echo "base=20a7a9fc4e3cea4f1b4cb8e04aecff4214533c27"
            echo "head=$(git rev-parse HEAD)"
            echo "target=src/relevance.rs"
            echo "functions=Sig::arg_is_ignorable,Sig::result_is_not_proof"
            echo "mode=whole-production-charon-then-dependency-closed-llbc-slice"
            echo "rust_target_sha256=$(sha256sum src/relevance.rs | awk '{print $1}')"
          } > evidence/manifest.txt

          echo "=== Whole unchanged production Rust -> Charon ===" | tee evidence/charon.log
          set +e
          "$RUNNER_TEMP/aeneas/charon" cargo --preset=aeneas \
            --dest evidence/full -- --lib \
            2>&1 | tee -a evidence/charon.log
          CHARON_STATUS=${PIPESTATUS[0]}
          set -e
          echo "charon_status=${CHARON_STATUS}" | tee -a evidence/manifest.txt
          if [ "${CHARON_STATUS}" -ne 0 ]; then
            echo "CHARON_EXTRACTION_FAILED" | tee evidence/verdict.txt
            exit 11
          fi

          FULL_LLBC=$(find evidence/full -maxdepth 1 -name '*.llbc' -print -quit)
          if [ -z "${FULL_LLBC}" ]; then
            echo "LLBC_MISSING_AFTER_CHARON" | tee evidence/verdict.txt
            exit 14
          fi
          sha256sum "${FULL_LLBC}" | tee evidence/full-llbc-sha256.txt
          wc -c "${FULL_LLBC}" | tee evidence/full-llbc-size.txt

          echo "=== Verify target bodies in whole production LLBC ==="
          python experiments/check_aeneas_target_llbc.py "${FULL_LLBC}" \
            | tee evidence/full-target-declarations.txt

          echo "=== Compute dependency-closed LLBC semantic island ==="
          SLICE_LLBC=evidence/slice/sokonanoda-sig.llbc
          python experiments/slice_aeneas_target_llbc.py \
            "${FULL_LLBC}" "${SLICE_LLBC}" evidence/slice-manifest.json \
            | tee evidence/slice.log
          sha256sum "${SLICE_LLBC}" | tee evidence/slice-llbc-sha256.txt
          wc -c "${SLICE_LLBC}" | tee evidence/slice-llbc-size.txt

          echo "=== Verify original target bodies survived slice ==="
          python experiments/check_aeneas_target_llbc.py "${SLICE_LLBC}" \
            | tee evidence/slice-target-declarations.txt

          echo "=== Aeneas Lean translation of sliced production LLBC ===" | tee evidence/aeneas.log
          pushd evidence/slice >/dev/null
          set +e
          "$RUNNER_TEMP/aeneas/aeneas" \
            -backend lean -split-files "$(basename "${SLICE_LLBC}")" \
            2>&1 | tee ../aeneas.log
          AENEAS_STATUS=${PIPESTATUS[0]}
          set -e
          popd >/dev/null

          echo "aeneas_status=${AENEAS_STATUS}" | tee -a evidence/manifest.txt
          find evidence -maxdepth 3 -type f -printf '%P\n' | sort > evidence/generated-files.txt

          if [ "${AENEAS_STATUS}" -ne 0 ]; then
            echo "AENEAS_SLICE_TRANSLATION_FAILED" | tee evidence/verdict.txt
            exit 13
          fi

          grep -R -n -E 'arg_is_ignorable|result_is_not_proof' evidence/slice --include='*.lean' \
            | tee evidence/lean-target-matches.txt || true
          if [ ! -s evidence/lean-target-matches.txt ]; then
            echo "AENEAS_TRANSLATED_TARGET_MISSING" | tee evidence/verdict.txt
            exit 18
          fi

          echo "AENEAS_TRANSLATED_TARGETS" | tee evidence/verdict.txt

      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeneas-production-rust-spike-v1
          path: evidence/
          if-no-files-found: warn
