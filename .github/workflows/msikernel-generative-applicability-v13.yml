name: msikernel generative applicability v13

on:
  push:
    branches: [msikernel-generative-applicability-v13]
  workflow_dispatch:

jobs:
  generative-applicability-v13:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build dependency-complete discovery and prospective prefixes
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          for c in std cedar; do
            head -n 400000 _build/tests/$c.ndjson >/tmp/$c.train.ndjson
            head -n 600000 _build/tests/$c.ndjson >/tmp/$c.test.ndjson
            test "$(wc -l </tmp/$c.train.ndjson)" -eq 400000
            test "$(wc -l </tmp/$c.test.ndjson)" -eq 600000
          done
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
          cp GENERATIVE_APPLICABILITY_V13.md /tmp/prereg.md

      - name: Probe anonymous runtime features on discovery prefixes
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/probe
          python3 experiments/applicability_runtime_v13.py /tmp/probe probe | tee /tmp/runtime-probe.txt
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-probe RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/probe/Cargo.toml --release --locked"
          for c in std cedar; do
            /tmp/target-probe/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.probe.out 2>/tmp/$c.probe.log
          done
          cd ..
          python3 - <<'PY'
          import re,csv
          hdr=['corpus','event_id','safe']+[f'f{i}' for i in range(15)]
          n=0; counts={0:0,1:0}
          with open('/tmp/v13_observations.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(hdr)
              for corpus in ('std','cedar'):
                  event=0
                  for line in open(f'/tmp/{corpus}.probe.log',errors='replace'):
                      m=re.search(r'APPGEN_V13 safe=([01])((?: f\d+=[01]){15})',line)
                      if not m: continue
                      safe=int(m.group(1)); vals=[int(x) for x in re.findall(r'f\d+=([01])',m.group(2))]
                      assert len(vals)==15
                      w.writerow([corpus,event,safe,*vals]); event+=1; n+=1; counts[safe]+=1
          print(f'V13_PROBE_EVENTS={n} SAFE={counts[1]} UNSAFE={counts[0]}')
          assert counts[1] > 0 and counts[0] > 0, 'V13 underidentified: need both safe and unsafe events'
          PY

      - name: Synthesize minimum anonymous applicability predicate
        run: |
          set -euxo pipefail
          python3 experiments/generative_applicability_v13.py /tmp/v13_observations.csv 4 | tee /tmp/learn.txt
          test -s /tmp/v13_predicate.txt
          test -s /tmp/v13_broad_predicate.txt
          grep -q 'V13_UNIQUE_MINIMUM_GENERATED_PREDICATE=PASS' /tmp/learn.txt
          PRED="$(cat /tmp/v13_predicate.txt)"
          BROAD="$(cat /tmp/v13_broad_predicate.txt)"
          echo "FROZEN_V13_PREDICATE=$PRED" | tee /tmp/result.txt
          echo "FROZEN_V13_BROAD_PREDICATE=$BROAD" | tee -a /tmp/result.txt
          cat /tmp/learn.txt >>/tmp/result.txt
          grep -q 'V13_SEMANTIC_VARIANT_NAMES_EXPOSED_TO_LEARNER=NO' /tmp/runtime-probe.txt
          echo V13_NO_SEMANTIC_NAME_LEAKAGE=PASS | tee -a /tmp/result.txt

      - name: Compile reference, learned guard, and generated broadening ablation
        run: |
          set -euxo pipefail
          for mode in g3 guard broad; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$mode
          done
          PRED="$(cat /tmp/v13_predicate.txt)"
          BROAD="$(cat /tmp/v13_broad_predicate.txt)"
          python3 experiments/applicability_runtime_v13.py /tmp/g3 g3
          python3 experiments/applicability_runtime_v13.py /tmp/guard guard "$PRED"
          python3 experiments/applicability_runtime_v13.py /tmp/broad broad "$BROAD"
          cd arena
          for mode in g3 guard broad; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-$mode RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$mode/Cargo.toml --release --locked"
          done

      - name: Exact discovery-boundary semantics and broadening ablation
        run: |
          set -euxo pipefail
          for c in std cedar; do
            /tmp/target-g3/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.g3.train.out
            /tmp/target-guard/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.guard.train.out
            cmp /tmp/$c.g3.train.out /tmp/$c.guard.train.out
            echo "${c^^}_V13_DISCOVERY_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
          done
          set +e
          /tmp/target-broad/release/sokonanoda /tmp/checker.json </tmp/std.train.ndjson >/tmp/std.broad.out 2>/tmp/std.broad.err; rs=$?
          /tmp/target-broad/release/sokonanoda /tmp/checker.json </tmp/cedar.train.ndjson >/tmp/cedar.broad.out 2>/tmp/cedar.broad.err; rc=$?
          set -e
          bad=0
          if [ "$rs" -ne 0 ] || ! cmp -s /tmp/std.g3.train.out /tmp/std.broad.out; then bad=1; fi
          if [ "$rc" -ne 0 ] || ! cmp -s /tmp/cedar.g3.train.out /tmp/cedar.broad.out; then bad=1; fi
          test "$bad" -eq 1
          echo V13_EXACT_GENERATED_BROADENING_ABLATION=PASS | tee -a /tmp/result.txt

      - name: Prospective transfer to untouched rows 400001 through 600000
        run: |
          set -euxo pipefail
          for c in std cedar; do
            /tmp/target-g3/release/sokonanoda /tmp/checker.json </tmp/$c.test.ndjson >/tmp/$c.g3.test.out
            /tmp/target-guard/release/sokonanoda /tmp/checker.json </tmp/$c.test.ndjson >/tmp/$c.guard.test.out
            cmp /tmp/$c.g3.test.out /tmp/$c.guard.test.out
            echo "${c^^}_V13_HELDOUT_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
          done
          echo V13_HELDOUT_ROWS=400001..600000 | tee -a /tmp/result.txt
          echo GENERATIVE_APPLICABILITY_V13=BOUNDED_POSITIVE | tee -a /tmp/result.txt
          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msikernel-generative-applicability-v13
          path: |
            /tmp/result.txt
            /tmp/prereg.md
            /tmp/learn.txt
            /tmp/runtime-probe.txt
            /tmp/v13_predicate.json
            /tmp/v13_observations.csv
            /tmp/*broad.err
