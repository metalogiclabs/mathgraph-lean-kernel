name: V4 Step18 MSI frame promotion tournament

on:
  workflow_dispatch:
  push:
    branches: [mathgraph-v4-bvdecide-residual]
    paths:
      - '.github/workflows/v4-step18-msi-frame-promotion-tournament.yml'

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build Arena tests
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test init-prelude
          nix develop -c ./lka.py build-test std
      - name: Materialize retained7 and MSI variants
        run: |
          set -euxo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          git -C /tmp/base checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          cp -a /tmp/base /tmp/residual
          cp -a /tmp/base /tmp/eager
          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/5a1485ae13a0623ca8b7001aee9e0e155381daad/experiments/apply_v4_retained6.py -o /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          roots=['/tmp/base','/tmp/residual','/tmp/eager']
          for root in roots:
              subprocess.run(['python3','/tmp/apply.py',root],check=True)
              p=Path(root)/'src/eval.rs'; s=p.read_text()
              s,n=re.subn(r'(WHNF_ADMIT_THRESHOLD\s*:\s*u8\s*=\s*)2',r'\g<1>1',s)
              assert n==1,(root,n)
              p.write_text(s)

          def add_full_field(root):
              vp=Path(root)/'src/value.rs'; s=vp.read_text()
              old='''        len: u32,\n        prune: Cell<(u64, Option<E<'a>>)>,\n    },\n    Framed {'''
              new='''        len: u32,\n        prune: Cell<(u64, Option<E<'a>>)>,\n        full: Cell<Option<E<'a>>>,\n    },\n    Framed {'''
              assert old in s
              s=s.replace(old,new,1)
              old2='''        len: parent.len() + 1,\n        prune: Cell::new((0, None)),\n    })'''
              new2='''        len: parent.len() + 1,\n        prune: Cell::new((0, None)),\n        full: Cell::new(None),\n    })'''
              assert old2 in s
              vp.write_text(s.replace(old2,new2,1))

          for root in ['/tmp/residual','/tmp/eager']:
              add_full_field(root)

          # Residual-triggered promotion: only after the same Cons environment has
          # already been successfully pruned under a different mask.
          ep=Path('/tmp/residual/src/eval.rs'); s=ep.read_text()
          old='''            value::Env::Cons { prune, .. } => {\n                let (m, r) = prune.get();\n                if m == mask {\n                    if let Some(r) = r {\n                        return r;\n                    }\n                }\n            }'''
          new='''            value::Env::Cons { prune, full, .. } => {\n                if let Some(f) = full.get() {\n                    return self.prune_env(f, mask);\n                }\n                let (m, r) = prune.get();\n                if m == mask {\n                    if let Some(r) = r {\n                        return r;\n                    }\n                }\n                if m != 0 && m != mask && r.is_some() && e.len() <= 64 {\n                    let full_mask = if e.len() == 64 { u64::MAX } else { (1u64 << e.len()) - 1 };\n                    let full_slot = (((e as *const value::Env<'t> as usize as u64).wrapping_mul(0x9E3779B97F4A7C15)\n                        ^ full_mask.wrapping_mul(0xD6E8FEB86659FD93))\n                        >> crate::util::PRUNE_DM_SHIFT) as usize;\n                    let f = self.prune_env_cold(e, full_mask, full_slot);\n                    full.set(Some(f));\n                    return self.prune_env(f, mask);\n                }\n            }'''
          assert old in s
          ep.write_text(s.replace(old,new,1))

          # Eager control: promote every Cons environment to its full framed equivalent
          # on the first nonzero prune request, regardless of residual reuse evidence.
          ep=Path('/tmp/eager/src/eval.rs'); s=ep.read_text()
          old='''            value::Env::Cons { prune, .. } => {\n                let (m, r) = prune.get();\n                if m == mask {\n                    if let Some(r) = r {\n                        return r;\n                    }\n                }\n            }'''
          new='''            value::Env::Cons { prune, full, .. } => {\n                if let Some(f) = full.get() {\n                    return self.prune_env(f, mask);\n                }\n                let (m, r) = prune.get();\n                if m == mask {\n                    if let Some(r) = r {\n                        return r;\n                    }\n                }\n                if e.len() <= 64 {\n                    let full_mask = if e.len() == 64 { u64::MAX } else { (1u64 << e.len()) - 1 };\n                    let full_slot = (((e as *const value::Env<'t> as usize as u64).wrapping_mul(0x9E3779B97F4A7C15)\n                        ^ full_mask.wrapping_mul(0xD6E8FEB86659FD93))\n                        >> crate::util::PRUNE_DM_SHIFT) as usize;\n                    let f = self.prune_env_cold(e, full_mask, full_slot);\n                    full.set(Some(f));\n                    return self.prune_env(f, mask);\n                }\n            }'''
          assert old in s
          ep.write_text(s.replace(old,new,1))
          PY
          for k in base residual eager; do
            echo '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' > /tmp/$k/config.json
          done
          git -C /tmp/residual diff -- src > /tmp/residual.diff
          git -C /tmp/eager diff -- src > /tmp/eager.diff
      - name: PGO build and semantic smoke
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/arena"
          for k in base residual eager; do
            d=/tmp/$k; cd "$d"
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-generate=$PWD/pgo" cargo build --release --locked
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            nix shell nixpkgs#llvm -c llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            rm -rf target
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
          done
      - name: Deterministic Std Callgrind tournament
        run: |
          set -euxo pipefail
          cd arena
          for k in base residual eager; do
            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/${k}.callgrind /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null
            grep '^summary:' /tmp/${k}.callgrind | awk '{print $2}' > /tmp/${k}.ir
          done
          python3 - <<'PY' | tee /tmp/result.txt
          vals={k:int(open('/tmp/'+k+'.ir').read()) for k in ['base','residual','eager']}
          b=vals['base']
          for k,v in vals.items():
              print(f'{k.upper()}_IR={v}')
              print(f'{k.upper()}_DELTA={v-b}')
              print(f'{k.upper()}_DELTA_PCT={(v/b-1)*100:.6f}')
          best=min(vals,key=vals.get)
          print(f'BEST_VARIANT={best}')
          print(f'BEST_IR={vals[best]}')
          print('V4_MSI_FRAME_PROMOTION=' + ('PASS' if best!='base' else 'FAIL'))
          PY
      - name: Alternating wall tournament
        run: |
          set -euxo pipefail
          cd arena
          : > /tmp/wall.tsv
          for i in 1 2 3; do
            for k in base residual eager; do
              /usr/bin/time -f "$k\t%e" -o /tmp/one.time /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null
              cat /tmp/one.time >> /tmp/wall.tsv
            done
          done
          cat /tmp/wall.tsv | tee -a /tmp/result.txt
          python3 - <<'PY' | tee -a /tmp/result.txt
          import statistics
          d={k:[] for k in ['base','residual','eager']}
          for line in open('/tmp/wall.tsv'):
              k,v=line.split(); d[k].append(float(v))
          b=statistics.median(d['base'])
          for k,vs in d.items():
              m=statistics.median(vs)
              print(f'{k.upper()}_WALL_MEDIAN={m}')
              print(f'{k.upper()}_WALL_DELTA_PCT={(m/b-1)*100:.6f}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v4-step18-msi-frame-promotion-tournament
          path: |
            /tmp/result.txt
            /tmp/*.diff
            /tmp/*.callgrind
            /tmp/*.ir
