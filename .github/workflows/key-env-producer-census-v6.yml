name: key_env producer census v6

on:
  push:
    branches: [prune-env-key-repeat-census-v5]
    paths:
      - 'experiments/apply_key_env_producer_census_v6.py'
      - '.github/workflows/key-env-producer-census-v6.yml'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Arena corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar

      - name: Prepare and build census checker
        shell: nix develop -c bash -euxo pipefail {0}
        working-directory: arena
        run: |
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/candidate
          cp ../experiments/apply_key_env_producer_census_v6.py /tmp/candidate/apply_key_env_producer_census_v6.py
          cd /tmp/candidate
          python3 apply_key_env_producer_census_v6.py
          CARGO_TARGET_DIR=/tmp/census-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Run Std and Cedar producer census
        shell: nix develop -c bash -euxo pipefail {0}
        working-directory: arena
        run: |
          python3 - <<'PY' | tee /tmp/key-env-producer-summary.json
          import json, pathlib, re, subprocess
          corpora={'std':'_build/tests/std.ndjson','cedar':'_build/tests/cedar.ndjson'}
          out={}
          for name,path in corpora.items():
              err=f'/tmp/{name}.err'
              with open(path,'rb') as inp, open(err,'wb') as e:
                  r=subprocess.run(['/tmp/census-target/release/sokonanoda','/tmp/checker.json'],stdin=inp,stdout=subprocess.DEVNULL,stderr=e,timeout=900)
              txt=pathlib.Path(err).read_text(errors='replace')
              m=re.findall(r'KEY_ENV_PRODUCER_CENSUS ([^\n]+)',txt)
              if r.returncode != 0 or not m:
                  print(txt[-3000:])
                  raise SystemExit(f'{name} failed rc={r.returncode} census={bool(m)}')
              vals={k:int(v) for k,v in re.findall(r'(\w+)=(\d+)',m[-1])}
              total=sum(vals.values())
              vals['total']=total
              for k in ('thunk','open_eval','lambda','pi'):
                  vals[k+'_pct']=100*vals[k]/total if total else 0
              out[name]=vals
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: key-env-producer-census-v6
          path: /tmp/key-env-producer-summary.json
          if-no-files-found: error
