name: Prepare V3 short-spine RC

on:
  push:
    branches:
      - v3-short-spine-scheduling
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-short-spine-scheduling
          fetch-depth: 0
      - name: Prepare and verify production diff
        run: bash scripts/prepare_v3_short_spine_rc.sh
