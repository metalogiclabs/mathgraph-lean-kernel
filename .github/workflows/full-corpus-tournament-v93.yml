name: Full-corpus kernel tournament v93
on:
  push:
    branches: [experiment/full-corpus-tournament-v93]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: full-corpus-tournament-v93
  cancel-in-progress: true
jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONOPTIMIZE: '0'
      V93_ROOT: /tmp/v93
      V89_ROOT: /tmp/v93
      V92_ROOT: /tmp/v93
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and tournament rules
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B experiments/rapid_kernel_v92.py --self-test
          python3 -B experiments/rapid_kernel_v92_freeze.py --self-test
          python3 -B experiments/full_corpus_tournament_v93.py --self-test
          python3 -B experiments/stable_tournament_v93.py --self-test
          python3 -m py_compile experiments/full_corpus_tournament_v93.py experiments/rapid_kernel_v92_freeze.py experiments/stable_tournament_v93.py
          git diff --exit-code -- src/
      - name: Restore exact archived corpus
        uses: actions/download-artifact@v4
        with:
          name: full-corpus-tournament-v93-inputs
          repository: metalogiclabs/mathgraph-lean-kernel
          run-id: 34269495716
          github-token: ${{ github.token }}
          path: /tmp/v93/fixtures
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Full-corpus tournament and conditional qualification
        run: |
          set -euo pipefail
          mkdir -p /tmp/v93/out
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/v93/toolchain-arena
          git -C /tmp/v93/toolchain-arena checkout -q 91f376e4baacf2df0c478e7173bccb2a6adac5c5
          test "$(git -C /tmp/v93/toolchain-arena rev-parse HEAD)" = 91f376e4baacf2df0c478e7173bccb2a6adac5c5
          cd /tmp/v93/toolchain-arena
          nix develop -c python3 -B "$GITHUB_WORKSPACE/experiments/stable_tournament_v93.py" |& tee /tmp/v93/out/ci.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-corpus-tournament-v93
          path: /tmp/v93/out/
          if-no-files-found: warn
