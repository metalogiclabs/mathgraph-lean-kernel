name: Arena chunk-size separator v55

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/run_arena_chunk_size_separator_v55.sh'
      - '.github/workflows/arena-chunk-size-separator-v55.yml'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          set_as_trusted_user: true
      - name: Put llvm-profdata on PATH
        run: |
          LLVM_OUT=$(nix build 'github:NixOS/nixpkgs/nixos-26.05#llvmPackages_21.llvm' --no-link --print-out-paths)
          echo "$LLVM_OUT/bin" >> "$GITHUB_PATH"
      - name: Run v55 Arena chunk-size separator
        run: bash experiments/run_arena_chunk_size_separator_v55.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-chunk-size-separator-v55
          path: |
            /tmp/v55-decision.txt
            /tmp/v55-*.time
            /tmp/v55-*.err
