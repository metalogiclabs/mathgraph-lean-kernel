name: Lean Refactor Arena V14 compile Typing grind search to suggestions
on:
  workflow_dispatch:
  push:
    branches: ['competition/lra-typing-grind-decompiler-v14']
    paths:
      - 'competitions/lean_refactor_arena/experiments/typing_grind_proof_compiler_v14.jsonl'
      - '.github/workflows/lean-refactor-arena-typing-grind-compiler-v14.yml'
concurrency:
  group: lra-typing-v14-grind-compiler
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PUBLIC_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      TARGET: Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress
      BANK: competitions/lean_refactor_arena/experiments/typing_grind_proof_compiler_v14.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact V10 source and six bounded diagnostic representations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          root=pathlib.Path('competitions/lean_refactor_arena')
          read=lambda p:[json.loads(s) for s in p.read_text().splitlines() if s.strip()]
          bank=read(pathlib.Path(os.environ['BANK']))
          portfolio=read(root/'portfolio/warmup_portfolio_v1.jsonl')
          original=next(r['proof'] for r in portfolio if r['name']==os.environ['TARGET'])
          assert len(portfolio)==15 and len(bank)==6 and len({r['label'] for r in bank})==6
          assert bank[0]['label']=='typing_v14_exact_308_control'
          assert bank[0]['proof']==original
          assert original.endswith('  all_goals grind\n')
          assert all(r['name']==os.environ['TARGET'] for r in bank)
          header=original.split(' := by\n')[0]+' := by\n'
          assert all(r['proof'].startswith(header) for r in bank)
          assert all(not any(bad in r['proof'] for bad in
                 ['sorry','sorryAx','admit','native_decide','run_elab','axiom ']) for r in bank)
          assert [r['label'] for r in bank[1:]]==[
            'typing_v14_grind_advice','typing_v14_grind_interactive_advice',
            'typing_v14_grind_zero_split','typing_v14_grind_generation_zero',
            'typing_v14_grind_local_only']
          print('FROZEN_TYPING_V14_EXACT_V10_CONTROL',hashlib.sha256(original.encode()).hexdigest())
          PY
      - name: Build pinned Cslib Safety module only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_SHA"
          mkdir -p /tmp/typing-v14
          cd /tmp/lean-refactor/competition/projects/v4.33
          lake update > /tmp/typing-v14/lake-update.log 2>&1 || {
            tail -n 100 /tmp/typing-v14/lake-update.log; exit 1;
          }
          lake exe cache get > /tmp/typing-v14/cache.log 2>&1 || echo CACHE_MISS_SCOPE_FALLBACK
          lake build Cslib.Languages.LambdaCalculus.LocallyNameless.Fsub.Safety \
            > /tmp/typing-v14/module-build.log 2>&1 || {
            tail -n 160 /tmp/typing-v14/module-build.log; exit 1;
          }
          echo QUALIFIED_PINNED_TYPING_V433_MODULE
      - name: Capture grind advice and score bounded primary variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/typing-v14/labels.txt
          import os,json
          for line in open(os.environ['BANK']):
            if line.strip(): print(json.loads(line)['label'])
          PY
          : > /tmp/typing-v14/scores.jsonl
          while IFS= read -r label; do
            echo "TYPING_GRIND_PROBE=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.33 \
              --name "$TARGET" --candidate "$BANK" --label "$label" \
              > "/tmp/typing-v14/$label.inject.json"
            if [[ "$label" == *"advice"* ]]; then
              set +e
              (cd /tmp/lean-refactor/competition/projects/v4.33 && \
                timeout 240 lake env lean \
                Arena/Cslib_LambdaCalculus_LocallyNameless_Fsub_Typing_progress.lean) \
                > "/tmp/typing-v14/$label.lean.log" 2>&1
              code=$?
              set -e
              echo "$code" > "/tmp/typing-v14/$label.lean.exitcode"
            fi
            set +e
            (cd /tmp/lean-refactor/competition && \
              python3 arena.py check --name "$TARGET" --timeout 1200) \
              > "/tmp/typing-v14/$label.scored.json" 2> "/tmp/typing-v14/$label.stderr"
            code=$?
            set -e
            if [[ "$code" -eq 0 ]]; then
              jq -c --arg label "$label" '. + {candidate_label:$label}' \
                "/tmp/typing-v14/$label.scored.json" >> /tmp/typing-v14/scores.jsonl
            else
              python3 - "$label" "$code" <<'PY'
          import json,sys
          print(json.dumps({'candidate_label':sys.argv[1],'name':'Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress',
              'compiled':False,'eligible':False,'check_exit':int(sys.argv[2]),'per_version':[{'errors':['CHECKER_EXIT_NONZERO']}] }))
          PY
            fi
          done < /tmp/typing-v14/labels.txt
      - name: Preserve exact score and script-advice boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib,os
          root=pathlib.Path('/tmp/typing-v14')
          xs=[json.loads(x) for x in (root/'scores.jsonl').read_text().splitlines() if x.strip()]
          assert len(xs)==6 and len({r['candidate_label'] for r in xs})==6
          def valid(r):
              pv=r.get('per_version') or []
              return (r.get('compiled') is True and r.get('statement_ok') is True and
                r.get('eligible') is True and not r.get('forbidden') and not
                r.get('extra_toplevel_decls') and not r.get('untested') and
                r.get('compat')=={'v4.33.0-rc2':True} and
                len(pv)==1 and pv[0].get('tested') is True and pv[0].get('ok') is True)
          control=next(r for r in xs if r['candidate_label']=='typing_v14_exact_308_control')
          assert valid(control),'EXACT_TYPING_INCUMBENT_FAILED_RECHECK'
          candidates=[r for r in xs if valid(r) and r is not control]
          gains=[r for r in candidates if float(r['objective_sum_pct'])>float(control['objective_sum_pct'])]
          best=max(gains,key=lambda r:(float(r['objective_sum_pct']),-int(r['length']),-int(r['heartbeats'])),default=None)
          advice=[]
          for label in ['typing_v14_grind_advice','typing_v14_grind_interactive_advice']:
              fp=root/(label+'.lean.log')
              messages=fp.read_text(errors='replace') if fp.exists() else ''
              ls=messages.splitlines()
              at=[i for i,line in enumerate(ls) if 'Try this:' in line or 'Try these:' in line]
              advice.append({'label':label,'suggestion_count':len(at),'snippets':[
                 '\n'.join(ls[max(0,i-2):min(len(ls),i+15)]) for i in at[:25]],
                 'error_lines':[line for line in ls if 'error:' in line][-10:]})
          out={'schema':'mathgraph.lra.typing.grind-certificate-v14',
             'status':'CANDIDATE_PRIMARY_GAIN__REQUIRES_ALL_THREE_VERSIONS' if best else 'NO_WARRANTED_PRIMARY_GAIN',
             'parent_sha':os.environ['GITHUB_SHA'],'public_pin':os.environ['PUBLIC_SHA'],
             'control':{'tokens':control['length'],'heartbeats':control['heartbeats'],
                        'objective':control['objective_sum_pct']},
             'qualified_primary':[{'label':r['candidate_label'],'tokens':r['length'],
                'heartbeats':r['heartbeats'],'objective':r['objective_sum_pct']} for r in candidates],
             'failed':[{'label':r['candidate_label'],'errors':(r.get('per_version') or [{}])[0].get('errors',[])}
                for r in xs if not valid(r)],
             'advice':advice,'best':best['candidate_label'] if best else None,
             'next_boundary':'Generate explicit proof from advice then fresh all-3-version Lean and exact portfolio packet',
             'portfolio_mutated':False,'official_submission':False}
          (root/'summary.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='advice'},indent=2))
          print('GRIND_SCRIPT_ADVICE_COUNTS=',[(a['label'],a['suggestion_count']) for a in advice])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-typing-grind-certificate-v14
          path: /tmp/typing-v14
