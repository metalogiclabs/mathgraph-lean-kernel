name: Arena exact-source semantic pruning causal census
on:
  push:
    branches: [arena-soko-prune-causal-census-v1]
    paths:
      - 'experiments/arena_soko_prune_causal_census_patch_v1.py'
      - 'experiments/arena_soko_prune_causal_census_probe_v1.py'
      - '.github/workflows/arena-soko-prune-causal-census-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-soko-prune-causal-census-v1
  cancel-in-progress: true
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: \${{ github.token }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin both checker trees and patch the diagnostic clone only
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda /tmp/prune-census-source
          git -C /tmp/prune-census-source checkout --detach 7645b1e1fcacfe410c99141f1234381d995b325d
          git -C /tmp/prune-census-source worktree add --detach /tmp/prune-census-diagnostic 7645b1e1fcacfe410c99141f1234381d995b325d
          mkdir -p /tmp/prune-census-evidence
          for arm in source diagnostic; do
            src="/tmp/prune-census-$arm"
            python3 experiments/arena_soko_sparse_patch_v1.py "$src"
            python3 experiments/arena_soko_growth_patch_v1.py "$src"
            python3 experiments/arena_soko_env_extend_singleprobe_patch_v1.py "$src"
            if [ "$arm" = diagnostic ]; then
              python3 experiments/arena_soko_prune_causal_census_patch_v1.py "$src"
            fi
            git -C "$src" diff --check
            CARGO_TARGET_DIR="/tmp/prune-census-target-$arm" RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked --manifest-path "$src/Cargo.toml"
            cp "/tmp/prune-census-target-$arm/release/sokonanoda" "/tmp/prune-census-$arm.bin"
          done
          CARGO_TARGET_DIR=/tmp/prune-census-target-diagnostic RUSTFLAGS='-C target-cpu=x86-64' cargo test --release --locked --manifest-path /tmp/prune-census-diagnostic/Cargo.toml
          git -C /tmp/prune-census-source diff -- src/checker/cache.rs src/checker/eval/environment.rs src/checker/ptrmap.rs > /tmp/prune-census-evidence/source.patch
          git -C /tmp/prune-census-diagnostic diff -- src/checker/cache.rs src/checker/eval/environment.rs src/checker/ptrmap.rs > /tmp/prune-census-evidence/diagnostic.patch
          sha256sum /tmp/prune-census-{source,diagnostic}.bin | tee /tmp/prune-census-evidence/binaries.sha256
      - name: Freeze the Arena good/bad 196 exported fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/prune-census-zip /tmp/prune-census-tests
          gh api 'repos/leanprover/lean-kernel-arena/actions/artifacts/11505862349/zip' > /tmp/prune-census-export.zip
          unzip -q /tmp/prune-census-export.zip -d /tmp/prune-census-zip
          tar --no-same-owner -xzf /tmp/prune-census-zip/lean-arena-tests.tar.gz -C /tmp/prune-census-tests
      - name: Enforce 196 verdict parity and report five exact source mask distributions
        run: |
          set -euo pipefail
          python3 experiments/arena_soko_prune_causal_census_probe_v1.py /tmp/prune-census-tests /tmp/prune-census-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-prune-causal-census-\${{ github.sha }}
          path: /tmp/prune-census-evidence/
          if-no-files-found: warn
