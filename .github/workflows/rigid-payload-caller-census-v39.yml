name: Rigid payload caller census v39

on:
  pull_request:
    branches: [master]
    paths:
      - 'experiments/run_rigid_payload_caller_census_v39.sh'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31
      - name: Execute v39 rigid payload caller census
        shell: bash
        run: bash experiments/run_rigid_payload_caller_census_v39.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rigid-payload-caller-v39
          path: |
            /tmp/v39-census.txt
            /tmp/v39-decision.txt
            /tmp/v39-*.err
