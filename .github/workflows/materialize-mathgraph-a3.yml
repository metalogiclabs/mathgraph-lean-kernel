name: Materialize MathGraph A3

on:
  push:
    branches: [mathgraph-a3]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph-a3
          fetch-depth: 0

      - name: Apply exact passed A3 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/tc.rs')
          s = p.read_text()
          old = 'const SESSION_BUDGET: usize = 1 << 20;'
          new = 'const SESSION_BUDGET: usize = 2_621_440;'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/eval.rs')
          s = p.read_text()
          old = '''                let Expr::Lambda { body: inner, .. } = self.ctx.read_expr(body) else { break };
                  let pruned = self.key_env(env, body);
                  env = value::env_extend(self.arena, pruned, args[i]);
                  body = inner;
                  i += 1;
          '''
          new = '''                let Expr::Lambda { body: inner, .. } = self.ctx.read_expr(body) else { break };
                  env = value::env_extend(self.arena, env, args[i]);
                  body = inner;
                  i += 1;
          '''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify exact two-file delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/eval.rs src/tc.rs "
          git diff -- src/tc.rs src/eval.rs

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked
          cargo build --release --locked

      - name: Commit A3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tc.rs src/eval.rs
          git commit -m 'Materialize MathGraph A3 optimization'
          git push origin HEAD:mathgraph-a3
