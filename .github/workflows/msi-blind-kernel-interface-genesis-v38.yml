name: MSI blind kernel interface genesis v38

on:
  push:
    branches: [msi-blind-kernel-interface-genesis-v38]
  workflow_dispatch:

jobs:
  genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build independent acquisition and sealed corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          # Acquisition sees only the first 2M Std lines.
          head -n 2000000 _build/tests/std.ndjson >/tmp/acquire-std.ndjson
          # Same-source held-out is disjoint from acquisition. Use sed rather than
          # tail|head so pipefail cannot turn the intentional early close into SIGPIPE.
          sed -n '2000001,3000000p' _build/tests/std.ndjson >/tmp/heldout-std.ndjson
          # Cedar is never exposed before the interface is frozen.
          head -n 1000000 _build/tests/cedar.ndjson >/tmp/heldout-cedar.ndjson
          sha256sum /tmp/acquire-std.ndjson /tmp/heldout-std.ndjson /tmp/heldout-cedar.ndjson | tee /tmp/corpus-hashes.txt
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Acquire producer-consumer residuals only
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/v38-acquire
          cp experiments/apply_msi_semantic_rediscovery_frontier_v36.py /tmp/v38-acquire/patch.py
          (cd /tmp/v38-acquire && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/v38-acquire-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/v38-acquire/Cargo.toml --release --locked"
          /tmp/v38-acquire-target/release/sokonanoda /tmp/checker.json </tmp/acquire-std.ndjson >/tmp/acquire.out 2>/tmp/acquire.err
          grep 'MSI_V36' /tmp/acquire.err | tail -1 | tee /tmp/acquire-trace.txt

      - name: Blindly select interface before opening held-out corpora
        run: |
          set -euxo pipefail
          python3 experiments/select_blind_kernel_interface_v38.py /tmp/acquire.err /tmp/selection.json | tee /tmp/selection.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/selection.json'))
          assert x['selection_uses_heldout'] is False
          assert x['winner_id'] in {'c0','c1','c2'}
          print('FROZEN_WINNER_ID='+x['winner_id'])
          print('FROZEN_MATERIALIZER='+x['winner_materializer'])
          PY

      - name: Materialize local shared and exact-ablation arms from frozen selection
        run: |
          set -euxo pipefail
          for mode in local shared ablate; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/v38-$mode
            (cd /tmp/v38-$mode && python3 "$GITHUB_WORKSPACE/experiments/apply_blind_kernel_interface_v38.py" /tmp/selection.json $mode)
          done
          cd arena
          for mode in local shared ablate; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/v38-$mode-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/v38-$mode/Cargo.toml --release --locked"
          done

      - name: Semantic gate on both sealed continuations
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          cat /tmp/selection.json >>/tmp/result.txt
          echo >>/tmp/result.txt
          for corpus in heldout-std heldout-cedar; do
            for mode in local shared ablate; do
              /tmp/v38-$mode-target/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus-$mode.out
            done
            cmp /tmp/$corpus-local.out /tmp/$corpus-shared.out
            cmp /tmp/$corpus-local.out /tmp/$corpus-ablate.out
            echo "${corpus^^}_OUTPUT_EQ=PASS" | tr '-' '_' | tee -a /tmp/result.txt
          done

      - name: Deterministic held-out consequence economics
        run: |
          set -euxo pipefail
          nix shell nixpkgs#valgrind -c valgrind --version
          for corpus in heldout-std heldout-cedar; do
            for mode in local shared ablate; do
              nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$corpus-$mode /tmp/v38-$mode-target/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus-$mode-cg.out 2>/tmp/$corpus-$mode-cg.err
              cmp /tmp/$corpus-local.out /tmp/$corpus-$mode-cg.out
            done
          done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import json,re
          selection=json.load(open('/tmp/selection.json'))
          all_win=True
          for corpus in ('heldout-std','heldout-cedar'):
              vals={}
              for mode in ('local','shared','ablate'):
                  s=open(f'/tmp/cg-{corpus}-{mode}').read()
                  m=re.search(r'^summary:\s+(\d+)',s,re.M)
                  if not m: raise SystemExit(f'no callgrind summary {corpus} {mode}')
                  vals[mode]=int(m.group(1))
              u=corpus.upper().replace('-','_')
              for k,v in vals.items(): print(f'{u}_{k.upper()}_INSTR={v}')
              print(f'{u}_SHARED_VS_LOCAL_PCT={100*(vals["shared"]-vals["local"])/vals["local"]:.6f}')
              print(f'{u}_SHARED_VS_ABLATE_PCT={100*(vals["shared"]-vals["ablate"])/vals["ablate"]:.6f}')
              win=vals['shared'] < vals['local'] and vals['shared'] < vals['ablate']
              print(f'{u}_SHARED_INTERFACE_WIN={str(win).upper()}')
              all_win &= win
          print('FROZEN_WINNER_ID='+selection['winner_id'])
          print('SELECTION_USED_HELDOUT=FALSE')
          print('EXACT_ABLATION_PRESENT=TRUE')
          print('DECISION=' + ('BLIND_INTERFACE_GENESIS_TRANSFER' if all_win else 'NO_BLIND_INTERFACE_GENESIS_TRANSFER'))
          if not all_win:
              raise SystemExit(2)
          PY
          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-blind-kernel-interface-genesis-v38
          path: |
            /tmp/result.txt
            /tmp/selection.json
            /tmp/selection.log
            /tmp/acquire-trace.txt
            /tmp/corpus-hashes.txt
            /tmp/cg-heldout-std-local
            /tmp/cg-heldout-std-shared
            /tmp/cg-heldout-std-ablate
            /tmp/cg-heldout-cedar-local
            /tmp/cg-heldout-cedar-shared
            /tmp/cg-heldout-cedar-ablate
