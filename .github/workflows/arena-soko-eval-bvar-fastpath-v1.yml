name: Arena source-pinned evaluator Var direct-lookup decision
on:
  push:
    branches: [arena-soko-eval-bvar-fastpath-v1]
    paths:
      - 'experiments/arena_soko_eval_bvar_fastpath_patch_v1.py'
      - 'experiments/arena_soko_eval_bvar_fastpath_duel_v1.py'
      - '.github/workflows/arena-soko-eval-bvar-fastpath-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-soko-eval-bvar-fastpath-v1
  cancel-in-progress: true
jobs:
  protected-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install independent deterministic guest-instruction meter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Pin upstream, build both exact parent binaries and test candidate cache meaning
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda /tmp/soko-eval-bvar-base
          git -C /tmp/soko-eval-bvar-base checkout --detach 7645b1e1fcacfe410c99141f1234381d995b325d
          git -C /tmp/soko-eval-bvar-base worktree add --detach /tmp/soko-eval-bvar-candidate 7645b1e1fcacfe410c99141f1234381d995b325d
          mkdir -p /tmp/eval-bvar-evidence
          for arm in baseline candidate; do
            if [ "$arm" = baseline ]; then src=/tmp/soko-eval-bvar-base; else src=/tmp/soko-eval-bvar-candidate; fi
            python3 experiments/arena_soko_sparse_patch_v1.py "$src"
            python3 experiments/arena_soko_growth_patch_v1.py "$src"
            if [ "$arm" = candidate ]; then
              python3 experiments/arena_soko_eval_bvar_fastpath_patch_v1.py "$src"
            fi
            git -C "$src" diff --check
            CARGO_TARGET_DIR="/tmp/soko-eval-bvar-target-$arm" RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked --manifest-path "$src/Cargo.toml"
            cp "/tmp/soko-eval-bvar-target-$arm/release/sokonanoda" "/tmp/soko-eval-bvar-$arm.bin"
          done
          CARGO_TARGET_DIR=/tmp/soko-eval-bvar-target-candidate RUSTFLAGS='-C target-cpu=x86-64' cargo test --release --locked --manifest-path /tmp/soko-eval-bvar-candidate/Cargo.toml
          git -C /tmp/soko-eval-bvar-base diff -- src/checker/cache.rs src/checker/eval/environment.rs src/checker/ptrmap.rs > /tmp/eval-bvar-evidence/parent.patch
          git -C /tmp/soko-eval-bvar-candidate diff -- src/checker/cache.rs src/checker/eval/environment.rs src/checker/ptrmap.rs > /tmp/eval-bvar-evidence/candidate.patch
          sha256sum /tmp/soko-eval-bvar-{baseline,candidate}.bin | tee /tmp/eval-bvar-evidence/binaries.sha256
      - name: Freeze exact 196 valid and invalid official Arena inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/eval-bvar-zip /tmp/eval-bvar-tests
          gh api 'repos/leanprover/lean-kernel-arena/actions/artifacts/11505862349/zip' > /tmp/eval-bvar-export.zip
          unzip -q /tmp/eval-bvar-export.zip -d /tmp/eval-bvar-zip
          tar --no-same-owner -xzf /tmp/eval-bvar-zip/lean-arena-tests.tar.gz -C /tmp/eval-bvar-tests
      - name: Exact 196 verdicts, five guest-Ir pairs and memory cost
        run: |
          set -euo pipefail
          python3 experiments/arena_soko_eval_bvar_fastpath_duel_v1.py /tmp/eval-bvar-tests /tmp/eval-bvar-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soko-eval-bvar-fastpath-${{ github.sha }}
          path: /tmp/eval-bvar-evidence/
          if-no-files-found: warn
