name: Lean Refactor Arena Typing Pareto crossover

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lean-refactor-arena-track1'
    paths:
      - 'competitions/lean_refactor_arena/experiments/typing_pareto_crossover_v1.jsonl'
      - '.github/workflows/lean-refactor-arena-typing-pareto-crossover.yml'

concurrency:
  group: lra-typing-pareto
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PUBLIC_REPO_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      TARGET_NAME: Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress
      CANDIDATES: competitions/lean_refactor_arena/experiments/typing_pareto_crossover_v1.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned Cslib v4.33
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_REPO_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_REPO_SHA"
          (cd /tmp/lean-refactor/competition && ./build-all.sh v4.33)
      - name: Verify bounded crossovers and controls
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/typing-pareto-scores.jsonl
          for label in typing_public_compact_339 typing_public_fast_398 typing_fast_cross_C typing_fast_cross_L typing_fast_cross_CL typing_fast_cross_I typing_fast_cross_CI typing_fast_cross_LI typing_fast_cross_CLI; do
            echo "CHECK=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.33 \
              --name "$TARGET_NAME" --candidate "$CANDIDATES" --label "$label"
            (cd /tmp/lean-refactor/competition && python3 arena.py check --name "$TARGET_NAME") \
              > /tmp/typing-one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' /tmp/typing-one.json \
              >> /tmp/typing-pareto-scores.jsonl
          done
      - name: Compare verified objective only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(s) for s in pathlib.Path('/tmp/typing-pareto-scores.jsonl').read_text().splitlines() if s.strip()]
          assert len(rows)==9, len(rows)
          good=lambda r:bool(r.get('compiled') and r.get('statement_ok') and r.get('eligible') and
            float(r.get('survival_pct') or 0)==100 and not r.get('forbidden') and not r.get('extra_toplevel_decls'))
          controls=[r for r in rows if r['candidate_label'] in ('typing_public_compact_339','typing_public_fast_398')]
          assert len(controls)==2 and all(good(r) for r in controls), 'EXTERNAL_TYPING_CONTROL_FAILED'
          valid=[r for r in rows if good(r) and r['candidate_label'].startswith('typing_fast_cross_')]
          outperform=[r for r in valid if float(r.get('objective_sum_pct') or 0)>113.26]
          best=max(outperform,key=lambda r:float(r['objective_sum_pct']),default=None)
          out={'schema':'mathgraph.lra.typing.pareto-crossover.v1',
            'status':'WARRANTED_PRIMARY_GAIN' if best else 'REJECTED_BOUNDED_NO_GAIN',
            'original_composed_baseline':113.26,
            'external_controls':[{'label':r['candidate_label'],'objective':r['objective_sum_pct'],
              'length':r['length'],'heartbeats':r['heartbeats']} for r in controls],
            'verified_candidates':[{'label':r['candidate_label'],'objective':r['objective_sum_pct'],
              'length':r['length'],'heartbeats':r['heartbeats']} for r in valid],
            'best':None if best is None else {'label':best['candidate_label'],'objective':best['objective_sum_pct'],
              'length':best['length'],'heartbeats':best['heartbeats']},
            'failed':[{'label':r['candidate_label'],'errors':(r.get('per_version') or [{}])[0].get('errors')} for r in rows if not good(r)],
            'authority':'Pinned public v4.33 primary only; must close all required 3 versions before portfolio promotion.'}
          pathlib.Path('/tmp/typing-pareto-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-typing-pareto-crossover
          path: |
            /tmp/typing-pareto-scores.jsonl
            /tmp/typing-pareto-summary.json
