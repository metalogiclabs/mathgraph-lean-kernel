name: Flash exact-PGO instruction portfolio v1

on:
  push:
    branches:
      - qckn-flash-instruction-portfolio-v1
  workflow_dispatch:

concurrency:
  group: qckn-flash-instruction-portfolio-v1
  cancel-in-progress: true

jobs:
  portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build exact Arena exports
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 510fbfead6f02bed1a0179d01729a6ddf5bfd06d
          cd /tmp/arena
          nix develop -c ./lka.py build-test init-prelude >/dev/null
          nix develop -c ./lka.py build-test mathlib >/dev/null
          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF
          nix develop -c perf --version | tee /tmp/perf-version.txt

      - name: Materialize four policy states
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add /tmp/both "$GITHUB_SHA"
          cp -a /tmp/both /tmp/var_only
          cp -a /tmp/both /tmp/framed_only
          cp -a /tmp/both /tmp/neither

          python3 - <<'PY'
          from pathlib import Path
          states={
            'both':(True,True),
            'var_only':(True,False),
            'framed_only':(False,True),
            'neither':(False,False),
          }
          for name,(var,framed) in states.items():
              p=Path('/tmp')/name/'src/flash.rs'
              s=p.read_text()
              for const,val in [('DIRECT_VAR_EVAL',var),('DIRECT_FRAMED_PRUNE',framed)]:
                  old_true=f'pub(crate) const {const}: bool = true;'
                  old_false=f'pub(crate) const {const}: bool = false;'
                  new=f'pub(crate) const {const}: bool = {"true" if val else "false"};'
                  if old_true in s:
                      s=s.replace(old_true,new,1)
                  elif old_false in s:
                      s=s.replace(old_false,new,1)
                  else:
                      raise SystemExit(f'missing {const} in {name}')
              p.write_text(s)
          PY

      - name: Exact native-PGO build all states
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_PROFDATA=$(nix shell nixpkgs#llvmPackages_21.llvm -c sh -c 'command -v llvm-profdata')
          for arm in both var_only framed_only neither; do
            rm -rf /tmp/$arm/target /tmp/$arm/pgo
            mkdir -p /tmp/$arm/pgo
            (
              cd /tmp/$arm
              RUSTFLAGS="-C target-cpu=native -Cprofile-generate=/tmp/$arm/pgo" cargo build --release --locked
              target/release/sokonanoda /tmp/config.json </tmp/arena/_build/tests/init-prelude.ndjson >/dev/null
              "$LLVM_PROFDATA" merge -o /tmp/$arm/pgo/merged.profdata /tmp/$arm/pgo
              test -s /tmp/$arm/pgo/merged.profdata
              rm -rf target
              RUSTFLAGS="-C target-cpu=native -Cprofile-use=/tmp/$arm/pgo/merged.profdata" cargo build --release --locked
              cp target/release/sokonanoda /tmp/$arm.bin
            )
          done

      - name: Verify Mathlib status parity
        shell: bash
        run: |
          set -euxo pipefail
          f=/tmp/arena/_build/tests/mathlib.ndjson
          : >/tmp/parity.tsv
          for arm in both var_only framed_only neither; do
            set +e
            /tmp/$arm.bin /tmp/config.json <"$f" >/tmp/$arm.out 2>/tmp/$arm.err
            rc=$?
            set -e
            printf '%s\t%s\n' "$arm" "$rc" | tee -a /tmp/parity.tsv
          done
          test "$(cut -f2 /tmp/parity.tsv | sort -u | wc -l)" -eq 1

      - name: Instruction portfolio tournament
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          PERF=$(nix develop -c sh -c 'command -v perf')
          export LC_ALL=C
          f="_build/tests/mathlib.ndjson"
          : >/tmp/instructions.tsv

          for rep in 1 2; do
            if [ "$rep" -eq 1 ]; then
              order="neither var_only framed_only both"
            else
              order="both framed_only var_only neither"
            fi
            for arm in $order; do
              "$PERF" stat -x $'\t' -e instructions -o /tmp/perf.txt --                 /tmp/$arm.bin /tmp/config.json <"$f" >/dev/null 2>/dev/null
              python3 - "$arm" "$rep" /tmp/perf.txt <<'PY' >>/tmp/instructions.tsv
          import sys
          arm,rep,path=sys.argv[1:]
          value=None
          for line in open(path):
              parts=line.rstrip("\n").split("\t")
              if len(parts)>=3 and parts[2].strip().startswith("instructions"):
                  raw=parts[0].strip().replace(",","")
                  if raw and raw not in ("<not counted>","<not supported>"):
                      value=int(float(raw)); break
          if value is None:
              raise SystemExit("instructions counter unavailable")
          print(f"{arm}\t{rep}\t{value}")
          PY
            done
          done

          cat /tmp/instructions.tsv
          python3 - <<'PY' | tee /tmp/scorecard.txt
          from collections import defaultdict
          from statistics import median
          rows=defaultdict(list)
          for line in open('/tmp/instructions.tsv'):
              arm,rep,n=line.rstrip().split('\t')
              rows[arm].append(int(n))
          med={a:median(v) for a,v in rows.items()}
          for a in ('neither','var_only','framed_only','both'):
              print(f'{a}_runs={rows[a]}')
              print(f'{a}_median={int(med[a])}')
          winner=min(med,key=med.get)
          print('INSTRUCTION_PORTFOLIO_WINNER='+winner)
          print(f'WINNER_INSTRUCTIONS={int(med[winner])}')
          print(f'BOTH_VS_NEITHER={(med["neither"]/med["both"]):.6f}')
          print(f'VAR_ONLY_VS_NEITHER={(med["neither"]/med["var_only"]):.6f}')
          print(f'FRAMED_ONLY_VS_NEITHER={(med["neither"]/med["framed_only"]):.6f}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-flash-instruction-portfolio-v1
          path: |
            /tmp/parity.tsv
            /tmp/instructions.tsv
            /tmp/scorecard.txt
            /tmp/perf-version.txt
          if-no-files-found: warn
