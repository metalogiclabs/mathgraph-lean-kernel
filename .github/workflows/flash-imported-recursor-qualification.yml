name: Flash nested-type ablation: source-pinned safety and corpus

on:
  push:
    branches:
      - research/flash-rec-nested-type-ablation-20261116
    paths:
      - src/inductive.rs
      - .github/workflows/flash-imported-recursor-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recursor-forgeries:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Build identical baseline and research candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flash-recursor"
          git rev-parse HEAD | tee "$RUNNER_TEMP/flash-recursor/candidate-commit.txt"
          git cat-file -e 78c7502bac8a5ba000057b3f083bc0595ac65750^{commit}
          git worktree add --detach "$RUNNER_TEMP/flash-published" 78c7502bac8a5ba000057b3f083bc0595ac65750
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/flash-published/Cargo.toml"
          cargo build --release --locked
          sha256sum "$RUNNER_TEMP/flash-published/target/release/sokonanoda" target/release/sokonanoda | tee "$RUNNER_TEMP/flash-recursor/binaries.sha256"
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":2}' > "$RUNNER_TEMP/flash-recursor/config.json"
      - name: Recover original Arena exports and record source hash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            https://arena.lean-lang.org/lean-arena-tests.tar.gz \
            --output "$RUNNER_TEMP/flash-recursor/arena-tests.tar.gz"
          sha256sum "$RUNNER_TEMP/flash-recursor/arena-tests.tar.gz" | tee "$RUNNER_TEMP/flash-recursor/archive.sha256"
          mkdir -p "$RUNNER_TEMP/flash-recursor/fixtures"
          tar --no-same-owner -xzf "$RUNNER_TEMP/flash-recursor/arena-tests.tar.gz" -C "$RUNNER_TEMP/flash-recursor/fixtures"
      - name: Require source-pinned four forged recursors REJECT and authentic controls ACCEPT
        run: |
          python3 - "$RUNNER_TEMP/flash-recursor" "$RUNNER_TEMP/flash-published/target/release/sokonanoda" "$PWD/target/release/sokonanoda" <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          out, before, after = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3])
          root = out / 'fixtures'
          cfg = out / 'config.json'
          pinned = {
              'bad/bugs/rec-rule-proof-irrel.ndjson': 'e144c9d6a65cc1fbd26a0875788306d72e7690eae61d12d2967a3c4ea7c3287c',
              'bad/bugs/rec-rule-proof-irrel-nested.ndjson': '61cff0dc13e0287cd21541543b63fc47aa89bebf14d30f14766b4d74f5c77c8c',
              'bad/bugs/rec-type-proof-irrel.ndjson': 'a366791c3deb8c259c8b5f03d61c5016879c1177756372fbd2302539d7c8e581',
              'bad/bugs/rec-rule-wrong-arg.ndjson': 'cf3b02e4dc0c8a3adcf912f09e81a2e467c7cc667b5c5c545b50ad03760eccc9',
              'good/tutorial/001_basicDef.ndjson': '66160bdc748c91306eddc888fe8a268dd336c385979902022c2902da0680efd5',
              'good/init-prelude.ndjson': 'eac8baf0fd48f5e7ccada755b36823d402a1e980882818995ade19cffe15a2c5',
          }
          report = {'source': 'Arena exports; SHA-256 pinned per fixture', 'baseline': '78c7502bac8a5ba000057b3f083bc0595ac65750', 'cases': [], 'errors': []}
          def run(binary, fixture):
              try:
                  with fixture.open('rb') as f:
                      p = subprocess.run([str(binary), str(cfg)], stdin=f, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=120)
                  return {'exit': p.returncode, 'stderr_tail': p.stderr.decode(errors='replace')[-800:]}
              except subprocess.TimeoutExpired:
                  return {'exit': 'TIMEOUT'}
          for name, sha in pinned.items():
              files = [p for p in root.rglob(name.split('/')[-1]) if str(p).endswith(name)]
              if len(files) != 1:
                  report['errors'].append(f'{name}: expected one fixture, found {len(files)}')
                  continue
              fixture = files[0]
              actual_sha = hashlib.sha256(fixture.read_bytes()).hexdigest()
              if actual_sha != sha:
                  report['errors'].append(f'{name}: SHA-256 drift {actual_sha} != {sha}')
                  continue
              b, a = run(before, fixture), run(after, fixture)
              expected = 0 if name.startswith('good/') else 1
              report['cases'].append({'name': name, 'sha256': sha, 'expected': expected, 'published': b, 'candidate': a})
              print(json.dumps({'name': name, 'expected': expected, 'published': b['exit'], 'candidate': a['exit']}), flush=True)
              if a['exit'] != expected:
                  report['errors'].append(f'{name}: candidate returned {a["exit"]}; required {expected}')
              if expected == 0 and b['exit'] != 0:
                  report['errors'].append(f'{name}: published positive-control result {b["exit"]}; cannot compare')
          report['status'] = 'QUALIFIED_PINNED_RECURSORS' if not report['errors'] else 'FAILED_OR_UNKNOWN'
          (out / 'target-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({'status': report['status'], 'error_count': len(report['errors']), 'errors': report['errors']}), flush=True)
          if report['errors']:
              sys.exit(1)
          PY
      - name: Audit published and candidate Rust tests including missing historical fixtures
        run: |
          # GitHub launches bash with -e; temporarily disable it to collect BOTH
          # preexisting unit-test exits, then restore fail-closed behaviour.
          set +e
          set -uo pipefail
          OUT="$RUNNER_TEMP/flash-recursor"
          cargo test --release --locked --manifest-path "$RUNNER_TEMP/flash-published/Cargo.toml" > "$OUT/published-unit.log" 2>&1
          BASE_RC=$?
          cargo test --release --locked > "$OUT/candidate-unit.log" 2>&1
          CAND_RC=$?
          set -euo pipefail
          python3 - "$OUT" "$BASE_RC" "$CAND_RC" "$RUNNER_TEMP/flash-published" <<'PY'
          import json, pathlib, re, sys
          out, base_rc, cand_rc, base_dir = pathlib.Path(sys.argv[1]), int(sys.argv[2]), int(sys.argv[3]), pathlib.Path(sys.argv[4])
          def failed(path):
              log=path.read_text(errors='replace')
              m=re.search(r'\nfailures:\s*\n([\s\S]+?)\ntest result:', log)
              if not m: return []
              return sorted(set(re.findall(r'^\s+(tests::\S+)\s*$', m.group(1), re.M)))
          a,b=failed(out/'published-unit.log'),failed(out/'candidate-unit.log')
          missing=[p for p in ('RuleDomainMismatch','UnlistedRecursor') if not (base_dir/'test_resources'/p).exists()]
          expected=sorted(['tests::util::reject_rec_rule_with_forged_lambda_domains','tests::util::reject_unlisted_recursor'])
          report={'published_rc':base_rc,'candidate_rc':cand_rc,'published_failed':a,'candidate_failed':b,
                  'missing_published_fixture_dirs':missing,
                  'status':'BASELINE_FIXTURE_GAP_PRESERVED' if a==b==expected and missing==['RuleDomainMismatch','UnlistedRecursor'] else 'UNEXPLAINED_FAILURE'}
          (out/'unit-audit.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report),flush=True)
          if report['status']!='BASELINE_FIXTURE_GAP_PRESERVED': sys.exit(1)
          PY
          cargo test --release --locked -- --skip reject_rec_rule_with_forged_lambda_domains --skip reject_unlisted_recursor
      - name: Require full 212-case exact-verdict parity except two soundness repairs
        run: |
          python3 - "$RUNNER_TEMP/flash-recursor" "$RUNNER_TEMP/flash-published/target/release/sokonanoda" "$PWD/target/release/sokonanoda" <<'PY'
          import collections
          import concurrent.futures
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          out, before, after = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3])
          root = out / 'fixtures'
          config = out / 'config.json'
          archive_sha = hashlib.sha256((out / 'arena-tests.tar.gz').read_bytes()).hexdigest()
          expected_archive = 'f6449acdf8dc5bc7b6c6e690f06daa948598d0bdde7d6cadcbb2286a9bfd49b0'
          expected_repairs = {
              'bad/bugs/rec-rule-proof-irrel.ndjson',
              'bad/bugs/rec-rule-proof-irrel-nested.ndjson',
          }
          fixtures = sorted(root.rglob('*.ndjson'))
          report = {
              'baseline_commit': '78c7502bac8a5ba000057b3f083bc0595ac65750',
              'candidate_commit': (out / 'candidate-commit.txt').read_text().strip(),
              'archive_sha256': archive_sha,
              'expected_archive_sha256': expected_archive,
              'case_count': len(fixtures),
              'cases': [],
              'errors': [],
          }
          def one_run(binary, fixture):
              try:
                  with fixture.open('rb') as stream:
                      p = subprocess.run([str(binary), str(config)], stdin=stream,
                                         stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=150)
                  return p.returncode
              except subprocess.TimeoutExpired:
                  return 'TIMEOUT'

          def one_case(path):
              name = str(path.relative_to(root))
              if not (name.startswith('good/') or name.startswith('bad/')):
                  return {'case': name, 'error': 'unknown fixture category'}
              expected = 0 if name.startswith('good/') else 1
              previous = one_run(before, path)
              candidate = one_run(after, path)
              return {
                  'case': name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'expected': expected, 'published': previous, 'candidate': candidate
              }

          if archive_sha != expected_archive:
              report['errors'].append('Arena archive digest differs from previously qualified 212; compare must be rerun against explicit pinned source')
          if len(fixtures) != 212:
              report['errors'].append('Expected the exact 212-case Arena portable corpus')
          if not report['errors']:
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  report['cases'] = list(pool.map(one_case, fixtures))
              report['cases'].sort(key=lambda row: row['case'])
              differences = [r for r in report['cases'] if r.get('published') != r.get('candidate')]
              actual_repairs = {r['case'] for r in differences}
              cases_by_name = {r['case']: r for r in report['cases']}
              for target in expected_repairs:
                  row = cases_by_name[target]
                  if (row['published'], row['candidate']) != (0, 1):
                      report['errors'].append(f'Required 0->1 repair failed: {target}')
              for row in differences:
                  if row['case'] in expected_repairs:
                      continue
                  if row['expected'] == 1 and (row['published'], row['candidate']) == (0, 1):
                      continue  # other independently expected invalid exports corrected
                  if row['expected'] == 0 and (row['published'], row['candidate']) == ('TIMEOUT', 0):
                      continue  # resource outcome improved, reported but not a soundness proof
                  report['errors'].append(f'Unjustified verdict change: {row["case"]}: {row["published"]}->{row["candidate"]}')
              wrong = lambda key: [r['case'] for r in report['cases'] if r.get(key) in (0,1) and r[key] != r['expected']]
              report['published_wrong_decisive'] = wrong('published')
              report['candidate_wrong_decisive'] = wrong('candidate')
              if set(report['candidate_wrong_decisive']) - set(report['published_wrong_decisive']):
                  report['errors'].append('New incorrect decisive verdicts introduced by candidate')
              report['published_counts'] = dict(collections.Counter(str(r.get('published')) for r in report['cases']))
              report['candidate_counts'] = dict(collections.Counter(str(r.get('candidate')) for r in report['cases']))
              report['differences'] = differences
          report['status'] = 'EXACT_212_PARITY_TWO_REPAIRS' if not report['errors'] else 'FAILED_OR_UNKNOWN'
          (out / 'full-212-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({
              'status': report['status'], 'case_count': len(fixtures),
              'published_counts': report.get('published_counts'),
              'candidate_counts': report.get('candidate_counts'),
              'differences': report.get('differences'),
              'errors': report['errors'],
          }), flush=True)
          if report['errors']:
              sys.exit(1)
          PY
      - name: Retain evidence even if a gate fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-imported-recursor-exact-${{ github.sha }}
          retention-days: 60
          path: |
            ${{ runner.temp }}/flash-recursor/candidate-commit.txt
            ${{ runner.temp }}/flash-recursor/binaries.sha256
            ${{ runner.temp }}/flash-recursor/config.json
            ${{ runner.temp }}/flash-recursor/archive.sha256
            ${{ runner.temp }}/flash-recursor/target-report.json
            ${{ runner.temp }}/flash-recursor/unit-audit.json
            ${{ runner.temp }}/flash-recursor/published-unit.log
            ${{ runner.temp }}/flash-recursor/candidate-unit.log
            ${{ runner.temp }}/flash-recursor/full-212-report.json
