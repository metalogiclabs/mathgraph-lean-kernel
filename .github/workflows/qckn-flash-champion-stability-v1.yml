name: Flash champion stability duel

on:
  push:
    branches:
      - qckn-flash-champion-stability-v1
  workflow_dispatch:

concurrency:
  group: qckn-flash-champion-stability-v1
  cancel-in-progress: true

jobs:
  stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build champion and leader
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add /tmp/champion "$GITHUB_SHA"
          git worktree add /tmp/leader 28c03d0103e004610e4d47a4828965efb2b70af9
          for arm in champion leader; do
            (cd /tmp/$arm && RUSTFLAGS='-C target-cpu=x86-64-v3' cargo build --release --locked)
            cp /tmp/$arm/target/release/sokonanoda /tmp/$arm.bin
          done
          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF

      - name: Build Mathlib
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 510fbfead6f02bed1a0179d01729a6ddf5bfd06d
          cd /tmp/arena
          nix develop -c ./lka.py build-test mathlib >/dev/null

      - name: Warm both binaries
        shell: bash
        run: |
          set -euxo pipefail
          f=/tmp/arena/_build/tests/mathlib.ndjson
          for arm in leader champion; do
            for rep in 1 2; do
              /tmp/$arm.bin /tmp/config.json <"$f" >/dev/null 2>/dev/null
            done
          done

      - name: Nine paired replays
        shell: bash
        run: |
          set -euxo pipefail
          f=/tmp/arena/_build/tests/mathlib.ndjson
          : >/tmp/pairs.tsv
          for rep in 1 2 3 4 5 6 7 8 9; do
            if [ $((rep%2)) -eq 1 ]; then order="leader champion"; else order="champion leader"; fi
            declare -A W U R
            for arm in $order; do
              /usr/bin/time -f '%e\t%U\t%M' -o /tmp/time                 /tmp/$arm.bin /tmp/config.json <"$f" >/dev/null 2>/dev/null
              read -r wall user rss </tmp/time
              W[$arm]=$wall
              U[$arm]=$user
              R[$arm]=$rss
            done
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n'               "$rep" "${W[leader]}" "${W[champion]}" "${U[leader]}" "${U[champion]}" "${R[leader]}" "${R[champion]}"               | tee -a /tmp/pairs.tsv
          done

          python3 - <<'PY' | tee /tmp/stability-scorecard.txt
          import math
          from statistics import median, mean
          rows=[]
          for l in open('/tmp/pairs.tsv'):
              rep,lw,cw,lu,cu,lr,cr=l.rstrip().split('\t')
              rows.append((int(rep),float(lw),float(cw),float(lu),float(cu),int(lr),int(cr)))
          ratios=[lw/cw for _,lw,cw,*_ in rows]
          log_ratios=[math.log(x) for x in ratios]
          lm=median(r[1] for r in rows)
          cm=median(r[2] for r in rows)
          pair_med=median(ratios)
          geo=math.exp(mean(log_ratios))
          wins=sum(1 for x in ratios if x>1)
          print('pairs='+repr([(r[0],r[1],r[2],round(r[1]/r[2],5)) for r in rows]))
          print(f'LEADER_MEDIAN_S={lm:.6f}')
          print(f'CHAMPION_MEDIAN_S={cm:.6f}')
          print(f'PAIRED_MEDIAN_SPEEDUP={pair_med:.6f}')
          print(f'PAIRED_GEOMEAN_SPEEDUP={geo:.6f}')
          print(f'CHAMPION_PAIR_WINS={wins}/9')
          print(f'CHAMPION_MEDIAN_MARGIN_PERCENT={(lm/cm-1)*100:.4f}')
          print(f'PAIRED_MEDIAN_MARGIN_PERCENT={(pair_med-1)*100:.4f}')
          if pair_med > 1.0 and wins >= 5:
              print('FLASH_CHAMPION_STABILITY_AHEAD')
          else:
              print('FLASH_CHAMPION_STABILITY_NOT_ESTABLISHED')
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-flash-champion-stability-v1
          path: |
            /tmp/pairs.tsv
            /tmp/stability-scorecard.txt
          if-no-files-found: warn
