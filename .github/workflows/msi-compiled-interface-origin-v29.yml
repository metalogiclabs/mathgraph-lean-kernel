name: MSI compiled-interface origin v29
on:
  push:
    branches: [msi-compiled-interface-origin-v29]
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Prepare Std prefix and instrumented checker
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          head -n 1000000 _build/tests/std.ndjson >/tmp/std-prefix.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/census
          cp experiments/apply_msi_compiled_interface_origin_v29.py /tmp/census/patch.py
          (cd /tmp/census && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/census-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/census/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Run origin census
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/census-target/release/sokonanoda /tmp/checker.json </tmp/std-prefix.ndjson >/tmp/out.ndjson 2>/tmp/census.log
          grep 'MSI_ORIGIN' /tmp/census.log | tail -20 | tee /tmp/result.txt
          test -s /tmp/result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: msi-compiled-interface-origin-v29
          path: |
            /tmp/result.txt
            /tmp/census.log
