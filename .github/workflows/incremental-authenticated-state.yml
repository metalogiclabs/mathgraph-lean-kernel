              def emit(raw):
                  global handle,part_hash,part_bytes,archive_bytes
                  archive_hash.update(raw);archive_bytes+=len(raw)
                  while raw:
                      if handle is None:
                          if len(parts)>=maximum:raise ValueError(label+' package exceeds bounded part count')
                          path=out/(label+'.tar.xz.part'+str(len(parts)).zfill(2))
                          handle=path.open('wb');part_hash=hashlib.sha256();part_bytes=0
                          parts.append(dict(path=str(path)))
                      chunk,raw=raw[:limit-part_bytes],raw[limit-part_bytes:]
                      handle.write(chunk);part_hash.update(chunk);part_bytes+=len(chunk)
                      if part_bytes==limit:finish_part()
              def finish_part():
                  global handle
                  if handle is None:return
                  handle.flush();os.fsync(handle.fileno());handle.close()
                  parts[-1].update(sha256=part_hash.hexdigest(),bytes=part_bytes);handle=None
              try:
                  for chunk in iter(lambda:process.stdout.read(1<<20),b''):emit(compressor.compress(chunk))
                  emit(compressor.flush());finish_part()
              except BaseException:
                  process.kill();process.wait();raise
              if process.wait()!=0:raise ValueError('tar packaging failed: '+label)
              manifest['archives'][label]=dict(format='tar.xz',sha256=archive_hash.hexdigest(),
                  bytes=archive_bytes,ordered_parts=parts,files=[str(p) for p in selected])
              print(label+': '+str(archive_bytes)+' bytes in '+str(len(parts))+' bounded pieces')
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (out/'REPLAY.txt').write_text(
              'Source: '+source+'\n'
              'Download manifest plus every ordered compact part. Each provider ZIP contains one part.\n'
              'Verify each part bytes/SHA256, concatenate in ordered_parts order, verify archive bytes/SHA256.\n'
              'Extract tar.xz to an empty directory. Verify every extracted file against all_files.\n'
              'The compact package contains all new authenticated state evidence; full parts preserve every raw CI file.\n'
              'Checkout exact source, install pinned tools with experiments/incremental/setup.sh. From the extracted root run the exact-source reader:\n'
              'python3 /runtime/experiments/incremental/replay_authenticated_state.py --benchmark artifacts/authenticated-state --controls artifacts/state-controls-original --controls artifacts/state-controls-expanded --repo /runtime --source '+source+' --rust /runtime/target/release/sokonanoda --indexer /runtime/target/release/export-index --cpp /pinned/lean-4.35.0/bin/leanchecker --paranoid /pinned/lean-4.35.0/bin/leanchecker-paranoid --out /fresh/replay-output\n'
              'Historical HMAC verification is a private-issuer CI boundary; public replay checks authenticated object addresses, witness bindings and actual independent kernels.\n')
          PYARCHIVE
