          compact_dirs=('authenticated-state','authenticated-state-independent','state-parity-original','state-parity-expanded',
                        'state-controls-original','state-controls-expanded')
          old_reports=('original-qualification/summary.json','native-qualification/summary.json',
                       'native-independent-replay/summary.json','native-benchmark/summary.json',
                       'receipt-protected/protected-summary.json','retained-parser-shadow/summary.json',
                       'receipt-comparison/summary.json','receipt-comparison/summary.md',
                       'revision-producer-original/report.json','revision-producer-expanded/report.json',
                       'revision-chain-tests-original/summary.json.gz','revision-chain-tests-expanded/summary.json.gz',
                       'revision-chain-controls-original/summary.json.gz','revision-chain-controls-expanded/summary.json.gz',
