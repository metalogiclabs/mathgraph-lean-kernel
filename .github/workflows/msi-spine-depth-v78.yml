name: MSI spine depth v78
on:
  push:
    branches: [experiment/msi-spine-depth-v78]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run MSI spine depth tournament
        run: bash experiments/run_msi_spine_depth_v78.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-spine-depth-v78
          path: |
            /tmp/v78/timings.csv
            /tmp/v78/summary.txt
            /tmp/v78/out
