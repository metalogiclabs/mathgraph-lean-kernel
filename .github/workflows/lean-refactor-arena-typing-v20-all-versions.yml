name: Lean Refactor Arena Typing V20 exact three-version admission

on:
  workflow_dispatch:
  push:
    branches: ['competition/lra-typing-v20-all-version-admission']
    paths:
      - '.github/workflows/lean-refactor-arena-typing-v20-all-versions.yml'
      - 'competitions/lean_refactor_arena/experiments/typing_consequence_compound_v20.jsonl'

permissions:
  contents: read

concurrency:
  group: lra-typing-v20-all-version-admission
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      PUBLIC_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      PRIMARY_RUN: '38004209274'
      PRIMARY_SHA: 022bacae843b6ef532a550e380247d232d42ff25
      TARGET: Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress
      BANK: competitions/lean_refactor_arena/experiments/typing_consequence_compound_v20.jsonl
    steps:
      - uses: actions/checkout@v4

      - name: Bind control and winner to exact successful V20 primary evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/typing-v20-admission
          curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/metalogiclabs/mathgraph-lean-kernel/actions/runs/$PRIMARY_RUN" \
            -o /tmp/typing-v20-admission/primary-run.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('competitions/lean_refactor_arena')
          rows=lambda p:[json.loads(x) for x in pathlib.Path(p).read_text().splitlines() if x.strip()]
          run=json.loads(pathlib.Path('/tmp/typing-v20-admission/primary-run.json').read_text())
          assert run['id']==int(os.environ['PRIMARY_RUN'])
          assert run['head_sha']==os.environ['PRIMARY_SHA']
          assert run['status']=='completed' and run['conclusion']=='success'
          bank=rows(os.environ['BANK'])
          portfolio=rows(root/'portfolio/warmup_portfolio_v1.jsonl')
          assert len(bank)==len({x['label'] for x in bank})==16
          assert len(portfolio)==15 and len({x['name'] for x in portfolio})==15
          target=os.environ['TARGET']
          control=next(x for x in bank if x['label']=='typing_v20_exact_308_control')
          winner=next(x for x in bank if x['label']=='typing_v20_compound_TCLR')
          incumbent=next(x for x in portfolio if x['name']==target)
          assert incumbent['label']=='warranted_typing_movable_tli_grind_308'
          assert control['name']==winner['name']==target
          assert incumbent['proof']==control['proof']
          prefix=control['proof'].split(' := by\n',1)[0]+' := by\n'
          assert winner['proof'].startswith(prefix) and winner['proof']!=control['proof']
          assert not any(k in winner['proof'] for k in
            ['sorry','sorryAx','admit','native_decide','run_elab','run_cmd','axiom ','unsafe'])
          manifest={'schema':'mathgraph.lra.typing-v20.exact-source-gate.v1',
            'state':'FROZEN_PRIMARY_WINNER_PENDING_REQUIRED_TOOLCHAINS',
            'primary_run':run['id'],'primary_commit':run['head_sha'],
            'target':target,'incumbent_proof_sha256':hashlib.sha256(control['proof'].encode()).hexdigest(),
            'winner_label':winner['label'],
            'winner_proof_sha256':hashlib.sha256(winner['proof'].encode()).hexdigest(),
            'statement_equal':True,'protected_versions':['v4.33.0-rc2','v4.32.0','v4.31.0'],
            'active_portfolio_mutated':False,'official_submission':False}
          pathlib.Path('/tmp/typing-v20-admission/source.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Build exact Typing module for all three required Lean toolchains
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_SHA"
          for version in v4.33 v4.32 v4.31; do
            echo "TYPING_PROTECTED_VERSION=$version"
            (
              cd "/tmp/lean-refactor/competition/projects/$version"
              lake update > "/tmp/typing-v20-admission/$version-update.log" 2>&1
              lake exe cache get > "/tmp/typing-v20-admission/$version-cache.log" 2>&1 || true
              lake build Cslib.Languages.LambdaCalculus.LocallyNameless.Fsub.Safety \
                > "/tmp/typing-v20-admission/$version-module.log" 2>&1
            ) || {
              tail -n 110 "/tmp/typing-v20-admission/$version-module.log" || true
              exit 1
            }
          done
          echo VERIFIED_ALL_THREE_REQUIRED_CSLIB_TYPING_IMPORT_CLOSURES

      - name: Replay exact control and V20 winner on each protected Lean version
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          for label in typing_v20_exact_308_control typing_v20_compound_TCLR; do
            echo "TYPING_V20_EXACT_ALL_VERSIONS=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.33 \
              --name "$TARGET" --candidate "$BANK" --label "$label"
            (
              cd /tmp/lean-refactor/competition
              python3 arena.py check --name "$TARGET" --all-versions --timeout 1800
            ) > "/tmp/typing-v20-admission/$label.json"
          done

      - name: Seal strict three-version winner and reject any cost or statement regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/typing-v20-admission')
          req={'v4.33.0-rc2','v4.32.0','v4.31.0'}
          def read(label):
            r=json.loads((root/(label+'.json')).read_text())
            compat=r.get('compat') or {}
            per=r.get('per_version') or []
            assert r.get('compiled') is True and r.get('statement_ok') is True
            assert r.get('eligible') is True and float(r.get('survival_pct') or 0)==100
            assert not r.get('forbidden') and not r.get('extra_toplevel_decls') and not r.get('untested')
            assert set(compat)==req and all(compat[v] is True for v in req)
            assert len(per)==3 and {p.get('version') for p in per}==req
            assert all(p.get('tested') is True and p.get('ok') is True for p in per)
            return r
          before=read('typing_v20_exact_308_control')
          after=read('typing_v20_compound_TCLR')
          assert (int(before['length']),int(before['heartbeats']))==(308,2697)
          assert (int(after['length']),int(after['heartbeats']))==(297,2832)
          assert round(float(before['objective_sum_pct']),2)==120.03
          assert round(float(after['objective_sum_pct']),2)==122.51
          assert float(after['objective_sum_pct'])>float(before['objective_sum_pct'])
          out={'schema':'mathgraph.lra.typing-v20.strict-all-version-admission.v1',
            'state':'WARRANTED_EXACT_THREE_VERSIONS__NOT_YET_IN_RETAINED_PACKET',
            'source':json.loads((root/'source.json').read_text()),
            'old':{'tokens':before['length'],'heartbeats':before['heartbeats'],'objective':before['objective_sum_pct']},
            'new':{'tokens':after['length'],'heartbeats':after['heartbeats'],'objective':after['objective_sum_pct']},
            'marginal_objective':round(float(after['objective_sum_pct'])-float(before['objective_sum_pct']),2),
            'checked_versions':sorted(req),'official_submission':False,
            'next_gate':'Reclose exact active 15-proof V12 packet preserving 14 other proof strings, then merge'}
          (root/'qualification.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-typing-v20-strict-three-version-admission
          path: /tmp/typing-v20-admission
