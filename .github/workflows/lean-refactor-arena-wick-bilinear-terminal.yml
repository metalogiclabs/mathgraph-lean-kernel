name: Lean Refactor Arena Wick bilinear terminal residual
on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lean-refactor-arena-track1'
    paths:
      - '.github/workflows/lean-refactor-arena-wick-bilinear-terminal.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: lra-wick-bilinear-terminal
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PUBLIC_REPO_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      TARGET_NAME: FieldSpecification.WickAlgebra.ι_timeOrderF_superCommuteF_eq_time
    steps:
      - uses: actions/checkout@v4
      - name: Recover sealed bilinear proof and its control (do not rediscover)
        uses: actions/download-artifact@v4
        with:
          name: lra-wick-bilinear-interface
          run-id: 37895461307
          repository: metalogiclabs/mathgraph-lean-kernel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/wick-bilinear-origin
      - name: Isolate three minimal terminal transport alternatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wick-terminal
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/wick-bilinear-origin')
          candidates=list(root.rglob('candidates.jsonl'))
          assert len(candidates)==1,candidates
          rows=[json.loads(s) for s in candidates[0].read_text().splitlines() if s.strip()]
          assert {r['label'] for r in rows}=={'bilinear','control'}
          by_label={r['label']:r for r in rows}
          digest=lambda s:hashlib.sha256(s.encode('utf-8')).hexdigest()
          assert digest(by_label['control']['proof'])=='1a9e24da00d85378e37e820bdbfcbc92666b62d62ce6b56ef4d5b50bdb5b4ee7'
          source=by_label['bilinear']['proof']
          assert digest(source)=='c1469003ed4448d9bce3f6eba5038c624875f81e8995ee1e24052c2c16cbbe6c'
          ending='  rw [map_mul]\n  exact congrArg (fun f => f a b) h'
          assert source.count(ending)==1
          statement=source.split(' := by\n',1)[0]
          def proof(final):
              result=source.replace(ending,final)
              assert result.split(' := by\n',1)[0]==statement
              return result
          trials=[
            dict(by_label['control'],label='control_606'),
            dict(by_label['bilinear'],label='failed_bilinear_559'),
            dict(by_label['bilinear'],label='no_unsupported_rw',proof=proof(
                '  exact congrArg (fun f => f a b) h')),
            dict(by_label['bilinear'],label='rhs_map_only_simpa',proof=proof(
                '  conv_rhs => rw [map_mul]\n'
                '  simpa only [T, C, LinearMap.comp_apply, LinearMap.compr₂_apply,\n'
                '    LinearMap.flip_apply, mulLinearMap, LinearMap.coe_mk,\n'
                '    AddHom.coe_mk, AlgHom.toLinearMap_apply,\n'
                '    LinearMap.mulLeft_apply, Function.comp_apply] using\n'
                '    congrArg (fun f => f a b) h')),
            dict(by_label['bilinear'],label='rhs_map_only_change',proof=proof(
                '  conv_rhs => rw [map_mul]\n'
                '  change T (a * C * b) = ι C * T (a * b)\n'
                '  exact congrArg (fun f => f a b) h')),
            dict(by_label['bilinear'],label='rhs_map_only_convert',proof=proof(
                '  conv_rhs => rw [map_mul]\n'
                '  convert congrArg (fun f => f a b) h using 1 <;> rfl'))
          ]
          labels=[r['label'] for r in trials]
          assert len(labels)==len(set(labels))
          path=pathlib.Path('/tmp/wick-terminal/candidates.jsonl')
          path.write_text(''.join(json.dumps(r,ensure_ascii=False)+'\n' for r in trials))
          pathlib.Path('/tmp/wick-terminal/source-lineage.json').write_text(json.dumps({
            'status':'CANDIDATE_UNVERIFIED',
            'source_run':37895461307,
            'source_artifact':11600872426,
            'public_pin':'7f3a401470d04f70013d293db4253b088ec8a0ae',
            'original_control_sha':'1a9e24da00d85378e37e820bdbfcbc92666b62d62ce6b56ef4d5b50bdb5b4ee7',
            'rejected_candidate_sha':'c1469003ed4448d9bce3f6eba5038c624875f81e8995ee1e24052c2c16cbbe6c',
            'single_change':'terminal transport only; proof body and generator core preserved',
            'candidates':[{'label':r['label'],'proof_sha256':digest(r['proof'])} for r in trials]
          },indent=2)+'\n')
          print('VERIFIED_EXACT_TERMINAL_ONLY_MUTATIONS_NOT_YET_LEAN_CHECKED')
          PY
      - name: Build pinned Wick single-version environment
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_REPO_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_REPO_SHA"
          (cd /tmp/lean-refactor/competition && ./build-all.sh v4.32)
      - name: Check exact proof variants with organizer-compatible verifier
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/wick-terminal/scores.jsonl
          for label in control_606 failed_bilinear_559 no_unsupported_rw rhs_map_only_simpa rhs_map_only_change rhs_map_only_convert; do
            echo "CHECK=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.32 \
              --name "$TARGET_NAME" \
              --candidate /tmp/wick-terminal/candidates.jsonl --label "$label"
            (cd /tmp/lean-refactor/competition && python3 arena.py check --name "$TARGET_NAME" --all-versions --timeout 180) \
              > /tmp/wick-terminal/one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' /tmp/wick-terminal/one.json \
              >> /tmp/wick-terminal/scores.jsonl
          done
      - name: Classify exact obligations, keep incumbent when unverifiable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          folder=pathlib.Path('/tmp/wick-terminal')
          rows=[json.loads(s) for s in (folder/'scores.jsonl').read_text().splitlines() if s.strip()]
          assert len(rows)==6 and len({r['candidate_label'] for r in rows})==6
          def good(r):
              pv=r.get('per_version') or []
              return (r.get('compiled') is True and r.get('statement_ok') is True
                and r.get('eligible') is True and not r.get('forbidden')
                and not r.get('extra_toplevel_decls') and not r.get('untested')
                and r.get('compat')=={'v4.32.0':True}
                and len(pv)==1 and pv[0].get('version')=='v4.32.0'
                and pv[0].get('ok') is True and pv[0].get('tested') is True)
          control=next(r for r in rows if r['candidate_label']=='control_606')
          assert good(control) and control.get('length')==606,'CONTROL_INVALID'
          proposals=[r for r in rows if r['candidate_label'] not in ('control_606','failed_bilinear_559')]
          valid=[r for r in proposals if good(r)]
          better=[r for r in valid if float(r['objective_sum_pct'])>max(float(control['objective_sum_pct']),118.0)]
          best=max(better,key=lambda r:float(r['objective_sum_pct']),default=None)
          state='WARRANTED_PRIMARY_GAIN' if best else 'REJECTED_BOUNDED_NO_GAIN'
          out={'schema':'mathgraph.lra.wick.bilinear-terminal-transport.v1',
            'state':state,'control':{'length':control['length'],'heartbeats':control['heartbeats'],
             'objective':control['objective_sum_pct']},
            'verified_candidates':[{'label':r['candidate_label'],'length':r['length'],
              'heartbeats':r['heartbeats'],'objective':r['objective_sum_pct']} for r in valid],
            'best':None if best is None else {'label':best['candidate_label'],'length':best['length'],
              'heartbeats':best['heartbeats'],'objective':best['objective_sum_pct']},
            'failed':[{'label':r['candidate_label'],'errors':(r.get('per_version') or [{}])[0].get('errors'),
              'compiled':r.get('compiled')} for r in rows if not good(r)],
            'scope':'One frozen Wick theorem and required v4.32.0. No portfolio or leaderboard promotion.'}
          (folder/'summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-wick-bilinear-terminal
          path: /tmp/wick-terminal
