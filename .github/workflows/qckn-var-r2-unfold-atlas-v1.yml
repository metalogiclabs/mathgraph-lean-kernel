name: QCKN Var R2 ordinary-Unfold atlas v1

on:
  push:
    branches:
      - qckn-var-r2-unfold-atlas-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run R2 ordinary-Unfold atlas unit test
        run: cargo test --locked qckn_r2_unfold_atlas_tests -- --nocapture

  mathlib-ordinary-unfold-census:
    needs: unit-red-green
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run Mathlib ordinary-Unfold census
        run: bash experiments/run_qckn_var_r2_unfold_atlas_v1.sh
      - name: Upload ordinary-Unfold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qckn-var-r2-unfold-atlas-v1
          path: /tmp/qckn-var-r2-unfold-atlas-v1/evidence
          if-no-files-found: warn
