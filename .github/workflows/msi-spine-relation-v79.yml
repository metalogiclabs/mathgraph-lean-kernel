name: MSI spine relation v79
on:
  push:
    branches: [experiment/msi-spine-relation-v79]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run relational reachability audit
        run: bash experiments/run_msi_spine_relation_v79.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-spine-relation-v79
          path: |
            /tmp/v79/summary.txt
            /tmp/v79/*.census
            /tmp/v79/active.txt
          if-no-files-found: warn
