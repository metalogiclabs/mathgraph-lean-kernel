name: apply mutual recursion metadata repair

on:
  push:
    branches:
      - fix-mutual-block-recursive-flag
    paths:
      - .github/workflows/apply-mutual-recursive-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-mutual-block-recursive-flag

      - name: Apply validated mutual-block recursion fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/inductive.rs')
          s = p.read_text()
          old = '''                let is_recursive = {
                      let mut found = false;
                      'outer: for ctor_name in ind.all_ctor_names.iter() {
                          match self.declars.get(ctor_name).unwrap() {
                              Declar::Constructor(ctor_data @ ConstructorData { .. }) => {
                                  let mut ctor_ty = ctor_data.info.ty;
                                  while let Pi { binder_type, body, .. } = ctx.read_expr(ctor_ty) {
                                      if ctx.find_const(binder_type, |n| ind.all_ind_names.iter().any(|nn| n == *nn)) {
                                          found = true;
                                          break 'outer
                                      }
                                      ctor_ty = body;
                                  }
                              }
                              _ => panic!(),
                          }
                      }
                      found
                  };
          '''
          new = '''                let is_recursive = {
                      let mut found = false;
                      'outer: for ind_name in ind.all_ind_names.iter() {
                          let mutual = match self.declars.get(ind_name).unwrap() {
                              Declar::Inductive(mutual) => mutual,
                              _ => panic!(),
                          };
                          for ctor_name in mutual.all_ctor_names.iter() {
                              match self.declars.get(ctor_name).unwrap() {
                                  Declar::Constructor(ctor_data @ ConstructorData { .. }) => {
                                      let mut ctor_ty = ctor_data.info.ty;
                                      while let Pi { binder_type, body, .. } = ctx.read_expr(ctor_ty) {
                                          if ctx.find_const(binder_type, |n| ind.all_ind_names.iter().any(|nn| n == *nn)) {
                                              found = true;
                                              break 'outer
                                          }
                                          ctor_ty = body;
                                      }
                                  }
                                  _ => panic!(),
                              }
                          }
                      }
                      found
                  };
          '''
          if old not in s:
              raise SystemExit('expected is_recursive block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/inductive.rs

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inductive.rs
          git commit -m "fix mutual block recursion metadata check"
          git push origin HEAD:fix-mutual-block-recursive-flag
