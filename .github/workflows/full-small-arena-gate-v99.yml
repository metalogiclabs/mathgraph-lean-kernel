name: Full small Arena gate v99

on:
  push:
    paths:
      - 'experiments/run_full_small_arena_gate_v99.sh'
      - '.github/workflows/full-small-arena-gate-v99.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run one-thread full small Arena gate
        run: bash experiments/run_full_small_arena_gate_v99.sh
      - name: Preserve small-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-small-arena-gate-v99
          path: |
            /tmp/v99-small/small-gate.json
            /tmp/v99-small/input-sha256.txt
            /tmp/v99-small/results.json
          if-no-files-found: warn
