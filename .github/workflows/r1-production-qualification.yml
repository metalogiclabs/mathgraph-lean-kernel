name: R1 production qualification

on:
  push:
    branches:
      - r1-representation-controller-v1
  workflow_dispatch:

jobs:
  focused-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Unit regression gate
        run: cargo test --release --locked

      - name: Build candidate and exact ablation
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add /tmp/r1 "$GITHUB_SHA"
          cp -a /tmp/r1 /tmp/ablated
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ablated/src/representation.rs')
          s = p.read_text()
          old = 'pub(crate) const R1_DIRECT_BETA_FUSION: bool = true;'
          new = 'pub(crate) const R1_DIRECT_BETA_FUSION: bool = false;'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
          for arm in ablated r1; do
            (cd /tmp/$arm && RUSTFLAGS='-C target-cpu=x86-64-v3' cargo build --release --locked)
            cp /tmp/$arm/target/release/sokonanoda /tmp/$arm-bin
          done
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Build current focused Arena exports
        shell: bash
        run: |
          set -euxo pipefail
          ARENA_SHA=a538455e201c1be48a11963cb83058649a36dc0e
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/arena checkout --detach "$ARENA_SHA"
          test "$(git -C /tmp/arena rev-parse HEAD)" = "$ARENA_SHA"
          printf '%s\n' "$ARENA_SHA" >/tmp/arena-sha.txt
          cd /tmp/arena
          tests=(perf/beta-ladder perf/app-lam perf/let-ladder perf/grind-ring-5 init-prelude)
          : >/tmp/built-exports.txt
          for t in "${tests[@]}"; do
            nix develop -c ./lka.py build-test "$t"
            f="_build/tests/$t.ndjson"
            test -f "$f"
            printf '%s\n' "$f" >>/tmp/built-exports.txt
          done

      - name: Exact candidate-vs-ablation parity
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          cat >/tmp/normalize.py <<'PY'
          import re,sys
          s=sys.stdin.read()
          s=re.sub(r"thread '([^']+)' \(\d+\)",r"thread '\1' (<tid>)",s)
          s=re.sub(r"(src/[A-Za-z0-9_./-]+\.rs):\d+:\d+",r"\1:<loc>",s)
          s=re.sub(r"NamePtr\(0x[0-9A-Fa-f]+(?=[,)])","NamePtr(<ptr>",s)
          sys.stdout.write(s)
          PY
          # Regression check for the exact nondeterministic shape exposed by
          # tutorial/bad/135_misnamed_rec_user. Preserve the semantic suffix.
          a=$(printf '%s\n' 'right: {NamePtr(0x5a19edc0140,L)}' | python3 /tmp/normalize.py)
          b=$(printf '%s\n' 'right: {NamePtr(0x5c2159c0140,L)}' | python3 /tmp/normalize.py)
          test "$a" = "$b"
          test "$a" = 'right: {NamePtr(<ptr>,L)}'
          : >/tmp/parity.tsv
          while IFS= read -r f; do
            for arm in ablated r1; do
              set +e
              /tmp/$arm-bin /tmp/checker.json < "$f" >/tmp/$arm.out 2>/tmp/$arm.err
              echo $? >/tmp/$arm.status
              set -e
              python3 /tmp/normalize.py </tmp/$arm.err >/tmp/$arm.err.norm
            done
            a=$(cat /tmp/ablated.status); r=$(cat /tmp/r1.status)
            test "$a" = "$r"
            cmp /tmp/ablated.out /tmp/r1.out
            cmp /tmp/ablated.err.norm /tmp/r1.err.norm
            printf 'MATCH\t%s\t%s\n' "$r" "$f" | tee -a /tmp/parity.tsv
          done </tmp/built-exports.txt

      - name: Five-run causal tournament
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/perf.tsv
          while IFS= read -r f; do
            label=${f#_build/tests/}; label=${label%.ndjson}
            for arm in ablated r1; do
              for rep in 1 2 3 4 5; do
                set +e
                /usr/bin/time -f '%e\t%M' -o /tmp/t /tmp/$arm-bin /tmp/checker.json < "$f" >/dev/null 2>/dev/null
                st=$?
                set -e
                read -r sec rss </tmp/t
                printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$label" "$arm" "$rep" "$st" "$sec" "$rss" | tee -a /tmp/perf.tsv
              done
            done
          done </tmp/built-exports.txt

      - name: Frozen R1 decision
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee /tmp/decision.txt
          from collections import defaultdict
          from statistics import median
          rows=defaultdict(lambda:defaultdict(list))
          for line in open('/tmp/perf.tsv'):
              label,arm,rep,status,sec,rss=line.rstrip().split('\t')
              rows[label][arm].append((float(sec),int(rss),int(status)))
          print('label\tablated_s\tr1_s\tspeedup\tablated_rss\tr1_rss')
          for label in sorted(rows):
              a=rows[label]['ablated']; r=rows[label]['r1']
              am=median(x[0] for x in a); rm=median(x[0] for x in r)
              ar=median(x[1] for x in a); rr=median(x[1] for x in r)
              speed=(am/rm) if rm else float('inf')
              print(f'{label}\t{am:.6f}\t{rm:.6f}\t{speed:.3f}\t{int(ar)}\t{int(rr)}')
          beta=rows['perf/beta-ladder']
          am=median(x[0] for x in beta['ablated']); rm=median(x[0] for x in beta['r1'])
          ar=median(x[1] for x in beta['ablated']); rr=median(x[1] for x in beta['r1'])
          # Accept the phase change if either time or memory improves by >= 2x.
          assert (rm > 0 and am/rm >= 2.0) or (rr > 0 and ar/rr >= 2.0), 'R1 lacks causal beta phase-change gain'
          # Controls must not regress by more than 20% in median wall time; this
          # generous focused gate is followed by the full Arena/Mathlib gate.
          for label in ('perf/app-lam','perf/let-ladder','perf/grind-ring-5','init-prelude'):
              a=rows[label]['ablated']; r=rows[label]['r1']
              am=median(x[0] for x in a); rm=median(x[0] for x in r)
              if am >= 0.05:
                  assert rm <= am*1.20 + 0.01, f'control regression: {label} {am} -> {rm}'
          print('R1_FOCUSED_QUALIFICATION_PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-production-qualification
          path: |
            /tmp/arena-sha.txt
            /tmp/built-exports.txt
            /tmp/parity.tsv
            /tmp/perf.tsv
            /tmp/decision.txt
          if-no-files-found: warn
