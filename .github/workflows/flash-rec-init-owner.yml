name: Flash original Init first-failure owner (read-only diagnostic)
on:
  push:
    branches:
      - research/flash-rec-init-provenance-20261116
    paths:
      - src/inductive.rs
      - .github/workflows/flash-rec-init-owner.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-init-and-forgeries:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Build diagnostic unchanged-semantic patch
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir -p "$RUNNER_TEMP/init-owner"
          git rev-parse HEAD > "$RUNNER_TEMP/init-owner/commit.txt"
          sha256sum target/release/sokonanoda > "$RUNNER_TEMP/init-owner/binary.sha256"
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1}' > "$RUNNER_TEMP/init-owner/config.json"
      - name: Replay source-pinned Init and recursor forgeries with owner traces
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://arena.lean-lang.org/lean-arena-tests.tar.gz -o "$RUNNER_TEMP/init-owner/arena.tar.gz"
          printf '%s  %s\n' f6449acdf8dc5bc7b6c6e690f06daa948598d0bdde7d6cadcbb2286a9bfd49b0 "$RUNNER_TEMP/init-owner/arena.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/init-owner/inputs"
          tar -xzf "$RUNNER_TEMP/init-owner/arena.tar.gz" -C "$RUNNER_TEMP/init-owner/inputs"
          python3 - "$RUNNER_TEMP/init-owner" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          out=pathlib.Path(sys.argv[1]);root=out/'inputs'
          pinned={
            'good/init-prelude.ndjson':'eac8baf0fd48f5e7ccada755b36823d402a1e980882818995ade19cffe15a2c5',
            'bad/bugs/rec-rule-proof-irrel.ndjson':'e144c9d6a65cc1fbd26a0875788306d72e7690eae61d12d2967a3c4ea7c3287c',
            'bad/bugs/rec-rule-proof-irrel-nested.ndjson':'61cff0dc13e0287cd21541543b63fc47aa89bebf14d30f14766b4d74f5c77c8c'
          }
          evidence=[]
          for name,sha in pinned.items():
            path=root/name
            assert path.is_file(),name
            assert hashlib.sha256(path.read_bytes()).hexdigest()==sha,name
            with path.open('rb') as stream:
              p=subprocess.run(['target/release/sokonanoda',str(out/'config.json')],stdin=stream,
                                stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)
            trace=p.stderr.decode(errors='replace')
            row={'case':name,'input_sha256':sha,'exit':p.returncode,'stderr_tail':trace[-3500:],
                 'owner_markers':[line for line in trace.splitlines() if 'FLASH_INIT_FAILURE' in line]}
            evidence.append(row)
            print(json.dumps({'case':name,'exit':p.returncode,'markers':row['owner_markers']}),flush=True)
          (out/'owner-report.json').write_text(json.dumps(evidence,indent=2)+'\n')
          assert evidence[0]['owner_markers'], 'original Init fails but no owner marker: unknown'
          assert evidence[0]['exit']==1, 'diagnostic expected to reproduce the current first failure'
          assert all(x['exit']==1 for x in evidence[1:]),'forged case regression'
          PY
      - name: Preserve owner evidence even if diagnostic fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-init-owner-${{ github.sha }}
          retention-days: 60
          path: |
            ${{ runner.temp }}/init-owner/commit.txt
            ${{ runner.temp }}/init-owner/binary.sha256
            ${{ runner.temp }}/init-owner/owner-report.json
