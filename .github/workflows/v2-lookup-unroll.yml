name: V2 lookup unroll separator

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build exact V1 and one inference-fusion candidate
        run: |
          set -euxo pipefail
          V1=1e209dad266d59b4d43cdea189876bc6ea551339
          git worktree add /tmp/base-src "$V1"
          cp -a /tmp/base-src /tmp/cand-src
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand-src/src/infer.rs')
          s=p.read_text()
          old="        let key = (self.key_env(env, e) as *const value::Env<'t> as usize, e);"
          new="        let key_env = self.key_env(env, e);\n        let key = (key_env as *const value::Env<'t> as usize, e);"
          assert s.count(old) == 1, s.count(old)
          s=s.replace(old,new,1)
          old2="                let clo = Closure::mk_infer(self.key_env(env, e), ctx, body);"
          new2="                let clo = Closure::mk_infer(key_env, ctx, body);"
          assert s.count(old2) == 1, s.count(old2)
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          for arm in base cand; do
            cd /tmp/${arm}-src
            cargo test --locked
            CARGO_TARGET_DIR=/tmp/${arm}-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked
            cp /tmp/${arm}-target/release/sokonanoda /tmp/${arm}-checker
          done
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Build only deciding Arena tests
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena
          cd /tmp/arena
          nix develop -c ./lka.py build-test perf/grind-ring-5
          nix develop -c ./lka.py build-test perf/app-lam

      - name: Semantic equality smoke
        run: |
          set -euxo pipefail
          cd /tmp/arena
          for T in grind-ring-5 app-lam; do
            /tmp/base-checker /tmp/checker.json < _build/tests/perf/$T.ndjson > /tmp/base-$T.out 2>/tmp/base-$T.err
            /tmp/cand-checker /tmp/checker.json < _build/tests/perf/$T.ndjson > /tmp/cand-$T.out 2>/tmp/cand-$T.err
            cmp /tmp/base-$T.out /tmp/cand-$T.out
          done

      - name: Callgrind first separator
        run: |
          set -euxo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y valgrind >/dev/null
          cd /tmp/arena
          printf 'test,arm,Ir\n' >/tmp/callgrind.csv
          for T in grind-ring-5 app-lam; do
            for arm in base cand; do
              out=/tmp/cg-$T-$arm.out
              timeout 900 valgrind --tool=callgrind --callgrind-out-file="$out" /tmp/${arm}-checker /tmp/checker.json < _build/tests/perf/$T.ndjson >/dev/null 2>/tmp/$T-$arm.vg
              ir=$(awk '/^summary:/ {print $2}' "$out")
              test -n "$ir"
              printf '%s,%s,%s\n' "$T" "$arm" "$ir" >>/tmp/callgrind.csv
            done
          done
          python3 - <<'PY' | tee /tmp/summary.txt
          import csv, math
          rows=list(csv.DictReader(open('/tmp/callgrind.csv')))
          C={(r['test'],r['arm']):int(r['Ir']) for r in rows}
          ratios=[]
          for t in ['grind-ring-5','app-lam']:
              b=C[(t,'base')]; c=C[(t,'cand')]
              r=c/b
              ratios.append(r)
              print(t, 'base=',b,'cand=',c,'ratio=',f'{r:.6f}','delta=',f'{(r-1)*100:+.3f}%')
          gm=math.sqrt(ratios[0]*ratios[1])
          print('GEOMEAN=',f'{gm:.6f}',f'{(gm-1)*100:+.3f}%')
          if min(ratios) <= 0.95 and max(ratios) <= 1.01:
              d='PROMOTE__MATERIAL_INFER_PROJECTION_DELETION'
          elif gm <= 0.99 and max(ratios) <= 1.01:
              d='REAL_GAIN__ESCALATE'
          else:
              d='KILL__LOCAL_INFER_PROJECTION_DUPLICATION_NOT_MATERIAL'
          print('DECISION='+d)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-arm-infer-projection-separator
          path: |
            /tmp/callgrind.csv
            /tmp/summary.txt
            /tmp/*.vg
            /tmp/*.err
