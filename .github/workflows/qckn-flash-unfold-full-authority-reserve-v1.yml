name: Flash Unfold full authority reserve

on:
  workflow_dispatch:

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Record source identity and build candidate/reference
        shell: bash
        run: |
          set -euxo pipefail
          printf 'source_sha\t%s\n' "$GITHUB_SHA" >/tmp/provenance.tsv
          printf 'eval_blob\t%s\n' "$(git hash-object src/eval.rs)" >>/tmp/provenance.tsv
          printf 'flash_blob\t%s\n' "$(git hash-object src/flash.rs)" >>/tmp/provenance.tsv

          git worktree add /tmp/candidate "$GITHUB_SHA"
          cp -a /tmp/candidate /tmp/reference
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/reference/src/flash.rs')
          s=p.read_text()
          old='pub(crate) const ORDINARY_UNFOLD_NEUTRAL: bool = true;'
          new='pub(crate) const ORDINARY_UNFOLD_NEUTRAL: bool = false;'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY

          for arm in candidate reference; do
            (cd /tmp/$arm && RUSTFLAGS='-C target-cpu=x86-64-v3' cargo build --release --locked)
            cp /tmp/$arm/target/release/sokonanoda /tmp/$arm.bin
          done

          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF

      - name: Build every current Arena export
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 510fbfead6f02bed1a0179d01729a6ddf5bfd06d
          cd /tmp/arena
          : >/tmp/build-tests.tsv
          while IFS= read -r y; do
            t=${y#tests/}; t=${t%.yaml}
            echo "BUILD $t" | tee -a /tmp/build-tests.tsv
            nix develop -c ./lka.py build-test "$t" >/dev/null
          done < <(find tests -type f -name '*.yaml' | sort)
          find _build/tests -type f -name '*.ndjson' | sort >/tmp/built-exports.txt
          test -s /tmp/built-exports.txt

      - name: Full 409-export semantic authority
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/semantic.tsv
          : >/tmp/mismatches.tsv
          while IFS= read -r f; do
            set +e
            /tmp/reference.bin /tmp/config.json <"$f" >/tmp/r.out 2>/tmp/r.err; r=$?
            /tmp/candidate.bin /tmp/config.json <"$f" >/tmp/c.out 2>/tmp/c.err; c=$?
            set -e
            if [ "$r" -ne "$c" ] || ! cmp -s /tmp/r.out /tmp/c.out; then
              printf 'SEMANTIC_MISMATCH\t%s\treference=%s\tcandidate=%s\n' "$f" "$r" "$c" | tee -a /tmp/mismatches.tsv /tmp/semantic.tsv
            else
              printf 'MATCH\t%s\t%s\n' "$c" "$f" >>/tmp/semantic.tsv
            fi
          done </tmp/built-exports.txt

          exports=$(wc -l </tmp/built-exports.txt)
          mismatches=$(grep -c '^SEMANTIC_MISMATCH' /tmp/mismatches.tsv || true)
          printf 'exports=%s semantic_mismatches=%s\n' "$exports" "$mismatches" | tee /tmp/semantic-summary.txt
          test "$mismatches" -eq 0
          echo FLASH_UNFOLD_FULL_SEMANTIC_AUTHORITY_PASS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-flash-unfold-full-authority-reserve-v1
          path: |
            /tmp/provenance.tsv
            /tmp/build-tests.tsv
            /tmp/built-exports.txt
            /tmp/semantic.tsv
            /tmp/mismatches.tsv
            /tmp/semantic-summary.txt
          if-no-files-found: warn
