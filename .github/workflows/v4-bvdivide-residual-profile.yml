name: V4 BVDivide Std Residual Profile

on:
  push:
    branches: [mathgraph-v4-bvdivide-residual-20260830]
    paths:
      - '.github/workflows/v4-bvdivide-residual-profile.yml'
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build focused Arena export
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cat > arena/tests/v4_bvdivide.lean <<'EOF'
          import Std.Tactic.BVDecide
          #check Std.Tactic.BVDecide.BVExpr.bitblast.blastUdiv.denote_blastDivSubtractShift_q
          EOF
          cat > arena/tests/v4-bvdivide.yaml <<'EOF'
          description: Focused export for the Std BVDecide unsigned-division bitblast theorem.
          leanfile: tests/v4_bvdivide.lean
          export-decls:
            - Std.Tactic.BVDecide.BVExpr.bitblast.blastUdiv.denote_blastDivSubtractShift_q
          outcome: accept
          EOF
          cd arena
          nix develop -c ./lka.py build-test v4-bvdivide
          wc -l _build/tests/v4-bvdivide.ndjson | tee /tmp/profile.txt
          du -h _build/tests/v4-bvdivide.ndjson | tee -a /tmp/profile.txt

      - name: Build live MathGraph baseline with Arena PGO
        run: |
          set -euxo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/live
          cd /tmp/live
          git checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
          ROOT="$GITHUB_WORKSPACE/arena"
          rm -rf pgo target
          RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release --locked
          target/release/sokonanoda /tmp/checker.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
          llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
          rm -rf target
          RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked

      - name: Measure focused residual
        run: |
          set -euxo pipefail
          IN="$GITHUB_WORKSPACE/arena/_build/tests/v4-bvdivide.ndjson"
          BIN=/tmp/live/target/release/sokonanoda
          for rep in 1 2 3 4 5; do
            /usr/bin/time -f '%e %U %S %M' -o /tmp/time-$rep.txt "$BIN" /tmp/checker.json < "$IN" >/dev/null
            echo REP${rep}=$(cat /tmp/time-$rep.txt) | tee -a /tmp/profile.txt
          done
          python3 - <<'PY' | tee -a /tmp/profile.txt
          from pathlib import Path
          xs=[]
          for i in range(1,6):
              wall,user,sys,rss=Path(f'/tmp/time-{i}.txt').read_text().split()
              xs.append(float(wall))
          xs.sort()
          print(f'FOCUSED_WALL_MEDIAN_SECONDS={xs[2]:.6f}')
          PY

      - name: Callgrind focused residual
        run: |
          set -euxo pipefail
          IN="$GITHUB_WORKSPACE/arena/_build/tests/v4-bvdivide.ndjson"
          BIN=/tmp/live/target/release/sokonanoda
          nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/bvdiv.callgrind "$BIN" /tmp/checker.json < "$IN" >/dev/null
          grep '^summary:' /tmp/bvdiv.callgrind | tee -a /tmp/profile.txt
          nix shell nixpkgs#valgrind -c callgrind_annotate --inclusive=yes --threshold=0.5 /tmp/bvdiv.callgrind | head -n 180 | tee /tmp/bvdiv-top.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-bvdivide-residual-profile
          path: |
            /tmp/profile.txt
            /tmp/bvdiv-top.txt
            /tmp/bvdiv.callgrind
            /tmp/time-*.txt
