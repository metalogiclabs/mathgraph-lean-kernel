name: Force Pi basin collapse v8

on:
  push:
    branches: [experiment/force-pi-basin-collapse-v8]
    paths:
      - '.github/workflows/force-pi-basin-collapse-v8.yml'
      - 'experiments/force-pi-basin-collapse-v8.trigger'

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build exact base and Pi-collapse arm
        run: |
          set -euxo pipefail
          BASE=2de1895a52d21ad266b77002defe3e6bc69bbcfd
          git worktree add /tmp/pi-base "$BASE"
          cp -a /tmp/pi-base /tmp/pi-candidate
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pi-candidate/src/eval.rs')
          s=p.read_text()
          old="""    pub(crate) fn force_all(&mut self, depth: u32, v: V<'t>) -> V<'t> {\n        if let Some(r) = self.store_lookup(depth, v) {"""
          new="""    pub(crate) fn force_all(&mut self, depth: u32, v: V<'t>) -> V<'t> {\n        // Pi values are already WHNF. Compile this verifier-known law before\n        // generic force-store lookup or reduction machinery.\n        if matches!(v, Value::Pi { .. }) {\n            return v;\n        }\n        if let Some(r) = self.store_lookup(depth, v) {"""
          assert old in s, 'force_all anchor changed'
          p.write_text(s.replace(old,new,1))
          PY
          for arm in base candidate; do
            (cd /tmp/pi-$arm && cargo test --locked)
            (cd /tmp/pi-$arm && CARGO_TARGET_DIR=/tmp/pi-$arm-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked)
            cp /tmp/pi-$arm-target/release/sokonanoda /tmp/pi-$arm-bin
          done
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' >/tmp/checker.json
      - name: Build frozen Arena workloads
        run: |
          set -euxo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena /tmp/pi-arena
          cd /tmp/pi-arena
          git checkout f0fe3b379dbce91537417b529140d0ca250f271c
          for T in perf/app-lam perf/beta-ladder perf/let-ladder perf/grind-ring-5; do
            nix develop -c ./lka.py build-test "$T"
          done
      - name: Exact semantic gate
        run: |
          set -euxo pipefail
          cd /tmp/pi-arena
          for T in app-lam beta-ladder let-ladder grind-ring-5; do
            F="_build/tests/perf/$T.ndjson"
            /tmp/pi-base-bin /tmp/checker.json < "$F" > "/tmp/pi-base-$T.out" 2> "/tmp/pi-base-$T.err"
            /tmp/pi-candidate-bin /tmp/checker.json < "$F" > "/tmp/pi-candidate-$T.out" 2> "/tmp/pi-candidate-$T.err"
            cmp "/tmp/pi-base-$T.out" "/tmp/pi-candidate-$T.out"
          done
      - name: Deterministic Callgrind separator
        run: |
          set -euxo pipefail
          cd /tmp/pi-arena
          printf 'test,arm,instructions\n' >/tmp/pi-callgrind.csv
          nix shell github:NixOS/nixpkgs/0ad6f47ea4fe188f4bc8f0380f93ae8523337c6c#valgrind -c bash -lc '
            set -euo pipefail
            for T in beta-ladder app-lam; do
              F="_build/tests/perf/$T.ndjson"
              for arm in base candidate; do
                cf="/tmp/pi-$T-$arm.cg"
                valgrind --tool=callgrind --callgrind-out-file="$cf" "/tmp/pi-$arm-bin" /tmp/checker.json < "$F" >/dev/null 2>"/tmp/pi-$T-$arm.vg"
                ir=$(awk "/^summary:/ {print \$2; exit}" "$cf")
                printf "%s,%s,%s\n" "$T" "$arm" "$ir" >>/tmp/pi-callgrind.csv
              done
            done
          '
          python3 - <<'PY' | tee /tmp/pi-decision.txt
          import csv
          rows=list(csv.DictReader(open('/tmp/pi-callgrind.csv')))
          d={(r['test'],r['arm']):int(r['instructions']) for r in rows}
          deltas=[]
          for t in ('beta-ladder','app-lam'):
              b=d[(t,'base')]; c=d[(t,'candidate')]
              delta=(c/b-1)*100
              deltas.append(delta)
              print(f'{t} base={b} candidate={c} delta={delta:+.4f}%')
          if min(deltas) <= -3 and max(deltas) <= 0.2:
              print('DECISION=PROMOTE__BIG_BASIN_COLLAPSE')
          elif min(deltas) <= -1 and max(deltas) <= 0.2:
              print('DECISION=PROMOTE__MATERIAL_BASIN_COLLAPSE')
          else:
              print('DECISION=CURRENT_PIN_RESIDUAL_DIFFERS__REPROFILE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: force-pi-basin-collapse-v8
          path: |
            /tmp/pi-callgrind.csv
            /tmp/pi-decision.txt
            /tmp/pi-*.err
