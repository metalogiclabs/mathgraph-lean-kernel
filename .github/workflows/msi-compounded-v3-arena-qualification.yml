name: MSI Compounded V3 Arena Qualification

on:
  push:
    branches: [mathgraph-msi-compounded-v3]
    paths:
      - 'scripts/apply_msi_compounded_v3.py'
      - '.github/workflows/msi-compounded-v3-arena-qualification.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Clone Arena and frozen checker states
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          git clone --depth 1 --branch mathgraph-msi-compounded-v3 https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/cand
          python3 /tmp/cand/scripts/apply_msi_compounded_v3.py /tmp/cand/src/infer.rs | tee /tmp/genesis.txt
          sha256sum /tmp/base/src/infer.rs /tmp/cand/src/infer.rs | tee /tmp/source-hashes.txt

      - name: Build official PGO training corpus
        run: |
          set -euxo pipefail
          cd arena
          nix develop -c ./lka.py build-test init-prelude

      - name: Build baseline and candidate with Arena PGO recipe
        run: |
          set -euxo pipefail
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF
          ROOT="$GITHUB_WORKSPACE/arena"
          build_pgo() {
            local repo=$1
            cd "$repo"
            rm -rf pgo target
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$repo/pgo" cargo build --release --locked
            target/release/sokonanoda /tmp/checker.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            llvm-profdata merge -o "$repo/pgo/merged.profdata" "$repo/pgo"
            rm -rf target
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=$repo/pgo/merged.profdata" cargo build --release --locked
          }
          cd arena
          nix develop -c bash -c "$(declare -f build_pgo); build_pgo /tmp/base"
          nix develop -c bash -c "$(declare -f build_pgo); build_pgo /tmp/cand"

      - name: Arena-scale instruction tournament
        run: |
          set -euxo pipefail
          cd arena
          : >/tmp/results.txt
          measure() {
            local bin=$1 input=$2 tag=$3
            local pf=/tmp/perf-$tag.txt
            set +e
            perf stat -x ';' -e instructions -o "$pf" -- "$bin" /tmp/checker.json < "$input" >/tmp/out-$tag.txt 2>/tmp/err-$tag.txt
            local rc=$?
            set -e
            echo ${tag}_EXIT=$rc | tee -a /tmp/results.txt
            test $rc -eq 0
            local n
            n=$(awk -F';' '$3 ~ /^instructions/ {gsub(/[[:space:]]/,"",$1); print $1; exit}' "$pf")
            if [ -z "$n" ] || ! [[ "$n" =~ ^[0-9]+$ ]]; then
              echo "PERF_UNAVAILABLE_$tag=1" | tee -a /tmp/results.txt
              return 2
            fi
            echo "$n"
          }
          for test in std cedar cslib mathlib; do
            echo BUILDING_TEST=$test | tee -a /tmp/results.txt
            nix develop -c ./lka.py build-test "$test"
            input="_build/tests/$test.ndjson"
            b=$(measure /tmp/base/target/release/sokonanoda "$input" base-$test)
            c=$(measure /tmp/cand/target/release/sokonanoda "$input" cand-$test)
            d=$((c-b))
            ppm=$((1000000*d/b))
            echo ${test}_BASE_INSTRUCTIONS=$b CAND_INSTRUCTIONS=$c DELTA=$d DELTA_PPM=$ppm | tee -a /tmp/results.txt
          done
          python3 - <<'PY' | tee -a /tmp/results.txt
          import re
          t=open('/tmp/results.txt').read()
          rows=[]
          for name,b,c,d,ppm in re.findall(r'^(std|cedar|cslib|mathlib)_BASE_INSTRUCTIONS=(\d+) CAND_INSTRUCTIONS=(\d+) DELTA=(-?\d+) DELTA_PPM=(-?\d+)',t,re.M):
              rows.append((name,int(b),int(c),int(d),int(ppm)))
          if len(rows)!=4: raise SystemExit('missing instruction rows')
          B=sum(x[1] for x in rows); C=sum(x[2] for x in rows)
          print(f'FOUR_SUITE_BASE={B}')
          print(f'FOUR_SUITE_CAND={C}')
          print(f'FOUR_SUITE_DELTA={C-B}')
          print(f'FOUR_SUITE_DELTA_PPM={1000000*(C-B)//B}')
          print('FOUR_SUITE_ALL_IMPROVE='+('PASS' if all(x[3] < 0 for x in rows) else 'FAIL'))
          PY

      - name: Full Arena semantic and soundness gate
        run: |
          set -euxo pipefail
          cd arena
          # Reuse the Arena's own expected outcomes. This is deliberately separate
          # from the performance proxy: no leaderboard gain is retained without it.
          cp checkers/mathgraph.yaml /tmp/mathgraph-public.yaml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('checkers/mathgraph-msi-compounded-v3.yaml')
          p.write_text('''description: temporary MSI compounded qualification\nurl: https://github.com/metalogiclabs/mathgraph-lean-kernel\nref: mathgraph-msi-compounded-v3\nrev: $GITHUB_SHA\nbuild: |\n  python3 scripts/apply_msi_compounded_v3.py\n  cat > config.json <<__END__\n   {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}\n  __END__\n  ROOT=$(cd ../../../.. && pwd)\n  "$ROOT/lka.py" build-test init-prelude\n  RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release\n  target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null\n  llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"\n  RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release\nrun: |\n  target/release/sokonanoda config.json < "$IN" || exit 1\n'''.replace('$GITHUB_SHA', __import__('os').environ['GITHUB_SHA']))
          PY
          # Build/run the complete Arena suite for the candidate. If this command
          # surface changes upstream, that is a harness failure, not a science veto.
          nix develop -c ./lka.py build-test
          nix develop -c ./lka.py build-checker mathgraph-msi-compounded-v3
          nix develop -c ./lka.py run mathgraph-msi-compounded-v3 | tee /tmp/full-arena.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-compounded-v3-arena-qualification
          path: |
            /tmp/results.txt
            /tmp/genesis.txt
            /tmp/source-hashes.txt
            /tmp/full-arena.txt
            /tmp/perf-*.txt
            /tmp/err-*.txt
