name: MSI Compounded V3 Arena Qualification

on:
  push:
    branches: [mathgraph-msi-compounded-v3]
    paths:
      - 'scripts/apply_msi_compounded_v3.py'
      - '.github/workflows/msi-compounded-v3-arena-qualification.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Clone Arena and frozen checker states
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          git clone --depth 1 --branch mathgraph-msi-compounded-v3 https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/cand
          python3 /tmp/cand/scripts/apply_msi_compounded_v3.py /tmp/cand/src/infer.rs | tee /tmp/genesis.txt
          sha256sum /tmp/base/src/infer.rs /tmp/cand/src/infer.rs | tee /tmp/source-hashes.txt

      - name: Build official PGO training corpus
        run: |
          set -euxo pipefail
          cd arena
          nix develop -c ./lka.py build-test init-prelude

      - name: Build baseline and candidate with Arena PGO recipe
        run: |
          set -euxo pipefail
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF
          export ROOT="$GITHUB_WORKSPACE/arena"
          build_pgo() {
            local repo=$1
            cd "$repo"
            rm -rf pgo target
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$repo/pgo" cargo build --release --locked
            target/release/sokonanoda /tmp/checker.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            llvm-profdata merge -o "$repo/pgo/merged.profdata" "$repo/pgo"
            rm -rf target
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=$repo/pgo/merged.profdata" cargo build --release --locked
          }
          export -f build_pgo
          cd arena
          nix develop -c bash -c 'build_pgo /tmp/base'
          nix develop -c bash -c 'build_pgo /tmp/cand'

      - name: Four-suite PGO wall-time tournament
        run: |
          set -euxo pipefail
          cd arena
          : >/tmp/results.txt
          run_time() {
            local bin=$1 input=$2 tag=$3
            for rep in 1 2 3; do
              /usr/bin/time -f '%e' -o /tmp/time-$tag-$rep.txt "$bin" /tmp/checker.json < "$input" >/tmp/out-$tag-$rep.txt
              t=$(cat /tmp/time-$tag-$rep.txt)
              echo ${tag}_REP${rep}_SECONDS=$t >>/tmp/results.txt
            done
            python3 - "$tag" <<'PY'
          import sys, pathlib
          tag=sys.argv[1]
          xs=[float(pathlib.Path(f'/tmp/time-{tag}-{i}.txt').read_text()) for i in (1,2,3)]
          xs.sort()
          print(f'{xs[1]:.6f}')
          PY
          }
          for test in std cedar cslib mathlib; do
            echo BUILDING_TEST=$test | tee -a /tmp/results.txt
            nix develop -c ./lka.py build-test "$test"
            input="_build/tests/$test.ndjson"
            b=$(run_time /tmp/base/target/release/sokonanoda "$input" base-$test)
            c=$(run_time /tmp/cand/target/release/sokonanoda "$input" cand-$test)
            python3 - "$test" "$b" "$c" <<'PY' | tee -a /tmp/results.txt
          import sys
          name,b,c=sys.argv[1],float(sys.argv[2]),float(sys.argv[3])
          print(f'{name}_BASE_SECONDS={b:.6f} CAND_SECONDS={c:.6f} DELTA_SECONDS={c-b:.6f} DELTA_PPM={int(1_000_000*(c-b)/b)}')
          PY
          done
          python3 - <<'PY' | tee -a /tmp/results.txt
          import re
          t=open('/tmp/results.txt').read(); rows=[]
          for name,b,c,d,ppm in re.findall(r'^(std|cedar|cslib|mathlib)_BASE_SECONDS=([0-9.]+) CAND_SECONDS=([0-9.]+) DELTA_SECONDS=(-?[0-9.]+) DELTA_PPM=(-?\d+)',t,re.M):
              rows.append((name,float(b),float(c),float(d),int(ppm)))
          if len(rows)!=4: raise SystemExit('missing wall rows')
          B=sum(x[1] for x in rows); C=sum(x[2] for x in rows)
          print(f'FOUR_SUITE_BASE_SECONDS={B:.6f}')
          print(f'FOUR_SUITE_CAND_SECONDS={C:.6f}')
          print(f'FOUR_SUITE_DELTA_SECONDS={C-B:.6f}')
          print(f'FOUR_SUITE_DELTA_PPM={int(1_000_000*(C-B)/B)}')
          print('FOUR_SUITE_ALL_WALL_IMPROVE='+('PASS' if all(x[3] < 0 for x in rows) else 'FAIL'))
          PY

      - name: Deterministic Callgrind instruction proxy
        run: |
          set -euxo pipefail
          cd arena
          for test in std cedar cslib mathlib; do
            head -n 100000 "_build/tests/$test.ndjson" > "/tmp/$test-100k.ndjson"
            for who in base cand; do
              bin="/tmp/$who/target/release/sokonanoda"
              nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file="/tmp/cg-$who-$test.out" "$bin" /tmp/checker.json < "/tmp/$test-100k.ndjson" >/dev/null
              n=$(grep '^summary:' "/tmp/cg-$who-$test.out" | awk '{print $2}')
              echo ${test}_${who}_CALLGRIND=$n | tee -a /tmp/results.txt
            done
          done
          python3 - <<'PY' | tee -a /tmp/results.txt
          import re
          t=open('/tmp/results.txt').read(); rows=[]
          for name in ('std','cedar','cslib','mathlib'):
              b=int(re.search(rf'^{name}_base_CALLGRIND=(\d+)',t,re.M).group(1))
              c=int(re.search(rf'^{name}_cand_CALLGRIND=(\d+)',t,re.M).group(1))
              rows.append((name,b,c))
              print(f'{name}_CALLGRIND_DELTA={c-b} DELTA_PPM={1_000_000*(c-b)//b}')
          B=sum(b for _,b,_ in rows); C=sum(c for _,_,c in rows)
          print(f'FOUR_SUITE_CALLGRIND_BASE={B}')
          print(f'FOUR_SUITE_CALLGRIND_CAND={C}')
          print(f'FOUR_SUITE_CALLGRIND_DELTA={C-B}')
          print(f'FOUR_SUITE_CALLGRIND_DELTA_PPM={1_000_000*(C-B)//B}')
          print('FOUR_SUITE_ALL_CALLGRIND_IMPROVE='+('PASS' if all(c<b for _,b,c in rows) else 'FAIL'))
          PY

      - name: Full Arena semantic and soundness gate
        run: |
          set -euxo pipefail
          cd arena
          cat > checkers/mathgraph-msi-compounded-v3.yaml <<EOF
          description: temporary MSI compounded qualification
          url: https://github.com/metalogiclabs/mathgraph-lean-kernel
          ref: mathgraph-msi-compounded-v3
          rev: $GITHUB_SHA
          build: |
            python3 scripts/apply_msi_compounded_v3.py
            cat > config.json <<__END__
             {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
            __END__
            ROOT=\$(cd ../../../.. && pwd)
            "\$ROOT/lka.py" build-test init-prelude
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=\$PWD/pgo" cargo build --release
            target/release/sokonanoda config.json < "\$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            llvm-profdata merge -o "\$PWD/pgo/merged.profdata" "\$PWD/pgo"
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=\$PWD/pgo/merged.profdata" cargo build --release
          run: |
            target/release/sokonanoda config.json < "\$IN" || exit 1
          EOF
          nix develop -c ./lka.py build-test
          nix develop -c ./lka.py build-checker mathgraph-msi-compounded-v3
          mkdir -p /tmp/other-checkers
          find checkers -maxdepth 1 -type f -name '*.yaml' ! -name 'mathgraph-msi-compounded-v3.yaml' -exec mv {} /tmp/other-checkers/ \;
          nix develop -c ./lka.py run | tee /tmp/full-arena.txt
          echo FULL_ARENA_CANDIDATE_ONLY=PASS | tee -a /tmp/results.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-compounded-v3-arena-qualification
          path: |
            /tmp/results.txt
            /tmp/genesis.txt
            /tmp/source-hashes.txt
            /tmp/time-*.txt
            /tmp/cg-*.out
            /tmp/full-arena.txt
