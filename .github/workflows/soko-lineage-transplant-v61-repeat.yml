name: Soko lineage transplant v61 repeat

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  repeat:
    if: github.head_ref == 'experiment/soko-lineage-transplant-v61' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Run v61 focused repeat gate
        run: bash experiments/run_soko_lineage_transplant_v61_repeat.sh
      - name: Upload repeat results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soko-lineage-transplant-v61-repeat
          path: v61-repeat-artifact
