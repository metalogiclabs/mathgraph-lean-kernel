name: msikernel contextual accessibility v9

on:
  push:
    branches: [msikernel-contextual-accessibility-v9]
  workflow_dispatch:

jobs:
  contextual-v9:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build frozen Std and Cedar corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 100000 _build/tests/std.ndjson >/tmp/std.ndjson
          head -n 100000 _build/tests/cedar.ndjson >/tmp/cedar.ndjson
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Instantiate frozen unseen pair family
        run: |
          set -euxo pipefail
          for mode in cold g3 param_prior param_rigid prior_rigid; do
            git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/$mode
          done
          for mode in g3 param_prior param_rigid prior_rigid; do
            python3 experiments/apply_contextual_accessibility_v9.py /tmp/$mode $mode | tee /tmp/$mode.genesis
          done
          cp CONTEXTUAL_ACCESSIBILITY_V9.md /tmp/predictions.md
          echo V9_PREDICTIONS_FROZEN_BEFORE_OUTCOMES=PASS | tee /tmp/result.txt

      - name: Build and exact semantic gate
        run: |
          set -euxo pipefail
          cd arena
          for mode in cold g3 param_prior param_rigid prior_rigid; do
            nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-$mode RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/$mode/Cargo.toml --release --locked"
          done
          for corpus in std cedar; do
            /tmp/target-cold/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.cold.out
            for mode in g3 param_prior param_rigid prior_rigid; do
              /tmp/target-$mode/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.$mode.out
              cmp /tmp/$corpus.cold.out /tmp/$corpus.$mode.out
            done
            echo "${corpus^^}_V9_BYTE_IDENTICAL=PASS" | tee -a /tmp/result.txt
          done

      - name: Reveal pair outcomes and score frozen predictions
        run: |
          set -euxo pipefail
          for corpus in std cedar; do
            for mode in g3 param_prior param_rigid prior_rigid; do
              nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/cg-$corpus-$mode /tmp/target-$mode/release/sokonanoda /tmp/checker.json </tmp/$corpus.ndjson >/tmp/$corpus.$mode.cg.out 2>/tmp/$corpus.$mode.cg.err
              cmp /tmp/$corpus.cold.out /tmp/$corpus.$mode.cg.out
            done
          done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          candidates=['param_prior','param_rigid','prior_rigid']
          predicted={'param_prior':'PROMOTE','param_rigid':'VETO','prior_rigid':'PROMOTE'}
          pred_delta={
            'param_prior':(-271350,-618245),
            'param_rigid':(52858,-238950),
            'prior_rigid':(-375356,-583313),
          }
          def instr(c,m):
              t=open(f'/tmp/cg-{c}-{m}').read()
              return int(re.search(r'^summary:\s+(\d+)',t,re.M).group(1))
          vals={(c,m):instr(c,m) for c in ('std','cedar') for m in ['g3']+candidates}
          print(f'STD_G3_INSTR={vals["std","g3"]}')
          print(f'CEDAR_G3_INSTR={vals["cedar","g3"]}')
          correct=0
          for m in candidates:
              ds=vals['std',m]-vals['std','g3']; dc=vals['cedar',m]-vals['cedar','g3']
              actual='PROMOTE' if ds<0 and dc<0 else 'VETO'
              ok=actual==predicted[m]
              correct += int(ok)
              ps,pc=pred_delta[m]
              print(f'{m.upper()}_PRED_STD_DELTA={ps}')
              print(f'{m.upper()}_PRED_CEDAR_DELTA={pc}')
              print(f'{m.upper()}_STD_DELTA={ds}')
              print(f'{m.upper()}_CEDAR_DELTA={dc}')
              print(f'{m.upper()}_PREDICTED={predicted[m]}')
              print(f'{m.upper()}_ACTUAL={actual}')
              print(f'{m.upper()}_PREDICTION_MATCH={"PASS" if ok else "FAIL"}')
          print(f'V9_PROSPECTIVE_SCORE={correct}/3')
          if correct==3:
              print('CONTEXTUAL_ACCESSIBILITY_V9=PASS')
          else:
              print('CONTEXTUAL_ACCESSIBILITY_V9=FALSIFIED_OR_INCOMPLETE')
              raise SystemExit(1)
          PY
          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msikernel-contextual-accessibility-v9
          path: |
            /tmp/result.txt
            /tmp/predictions.md
            /tmp/*.genesis
