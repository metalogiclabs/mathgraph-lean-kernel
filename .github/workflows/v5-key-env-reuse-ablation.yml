name: V5 key-env representative reuse ablation

'on':
  push:
    branches:
      - experiment/v5-key-env-reuse-ablation
    paths:
      - .github/workflows/v5-key-env-reuse-ablation.yml
      - .github/scripts/v5_key_env_reuse_patch.py
      - .github/scripts/v5_key_env_reuse_decide.py
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Build exact V2 causal arms
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          V2=3d7585c21242f29fdaa48ae9a16e16c6afe42238
          for arm in base ablate reuse; do
            git worktree add "/tmp/v5-$arm" "$V2"
            if [ "$arm" != base ]; then
              python3 "$ROOT/.github/scripts/v5_key_env_reuse_patch.py" "/tmp/v5-$arm" "$arm"
            fi
            cd "/tmp/v5-$arm"
            cargo test --locked
            CARGO_TARGET_DIR="/tmp/v5-$arm-target" RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked
            cp "/tmp/v5-$arm-target/release/sokonanoda" "/tmp/v5-$arm-bin"
          done
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' > /tmp/checker.json

      - name: Build focused and repeated-consumption Arena workloads
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena /tmp/v5-arena
          cd /tmp/v5-arena
          git checkout f0fe3b379dbce91537417b529140d0ca250f271c
          for T in perf/app-lam perf/beta-ladder perf/let-ladder perf/grind-ring-5 std; do
            nix develop -c ./lka.py build-test "$T"
          done

      - name: Exact semantic equality gate
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/v5-arena
          for T in app-lam beta-ladder let-ladder grind-ring-5 std; do
            if [ "$T" = std ]; then F="_build/tests/std.ndjson"; else F="_build/tests/perf/$T.ndjson"; fi
            /tmp/v5-base-bin /tmp/checker.json < "$F" > "/tmp/v5-base-$T.out" 2> "/tmp/v5-base-$T.err"
            for arm in ablate reuse; do
              "/tmp/v5-$arm-bin" /tmp/checker.json < "$F" > "/tmp/v5-$arm-$T.out" 2> "/tmp/v5-$arm-$T.err"
              cmp "/tmp/v5-base-$T.out" "/tmp/v5-$arm-$T.out"
            done
          done

      - name: Deterministic Callgrind causal separator
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/v5-arena
          printf 'test,arm,instructions\n' > /tmp/v5-callgrind.csv
          nix shell github:NixOS/nixpkgs/0ad6f47ea4fe188f4bc8f0380f93ae8523337c6c#valgrind -c bash -lc '
            set -euo pipefail
            for T in app-lam beta-ladder let-ladder grind-ring-5 std; do
              if [ "$T" = std ]; then F="_build/tests/std.ndjson"; else F="_build/tests/perf/$T.ndjson"; fi
              for arm in base ablate reuse; do
                cf="/tmp/v5-$T-$arm.cg"
                valgrind --tool=callgrind --callgrind-out-file="$cf" "/tmp/v5-$arm-bin" /tmp/checker.json < "$F" >/dev/null 2>"/tmp/v5-$T-$arm.vg"
                ir=$(awk "/^summary:/ {print \$2; exit}" "$cf")
                test -n "$ir"
                printf "%s,%s,%s\n" "$T" "$arm" "$ir" >> /tmp/v5-callgrind.csv
              done
            done
          '
          python3 "$GITHUB_WORKSPACE/.github/scripts/v5_key_env_reuse_decide.py" | tee /tmp/v5-decision.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v5-key-env-reuse-ablation
          path: |
            /tmp/v5-callgrind.csv
            /tmp/v5-decision.txt
            /tmp/v5-*.cg
            /tmp/v5-*.vg
            /tmp/v5-*.err
