name: MSI cached semantic hint census v22
on:
  push:
    branches: [msi-cached-semantic-hint-census-v22]
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build Std prefix and instrumented checker
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          head -n 1000000 _build/tests/std.ndjson > /tmp/std-prefix.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/cand
          cp experiments/apply_msi_cached_semantic_hint_census_v22.py /tmp/cand/patch.py
          (cd /tmp/cand && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/v22-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/cand/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Run 3M-unify census
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/v22-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/v22.out 2>/tmp/v22.err
          grep 'MSI_CACHED_HINT' /tmp/v22.err | tail -1 | tee /tmp/result.txt
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re
          s=open('/tmp/result.txt').read()
          m=re.search(r'total=(\d+) sample=(\d+) both=(\d+) eq=(\d+) eq_true=(\d+) neq=(\d+) neq_true=(\d+)',s)
          assert m, s
          total,sample,both,eq,eq_true,neq,neq_true=map(int,m.groups())
          print(f'BOTH_CACHED_RATE_PCT={100*both/sample:.6f}')
          print(f'CACHED_EQ_RATE_OF_SAMPLE_PCT={100*eq/sample:.6f}')
          print(f'CACHED_EQ_RATE_OF_BOTH_PCT={100*eq/both:.6f}' if both else 'CACHED_EQ_RATE_OF_BOTH_PCT=0')
          print(f'CACHED_EQ_TRUE_PRECISION_PCT={100*eq_true/eq:.6f}' if eq else 'CACHED_EQ_TRUE_PRECISION_PCT=0')
          print(f'CACHED_NEQ_TRUE_RATE_PCT={100*neq_true/neq:.6f}' if neq else 'CACHED_NEQ_TRUE_RATE_PCT=0')
          print('DECISION=' + ('TEST_COLLISION_SAFE_FILTER' if eq and eq_true==eq else 'NO_CLEAN_CACHED_HINT'))
          PY
          cat /tmp/result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: msi-cached-semantic-hint-census-v22
          path: |
            /tmp/result.txt
            /tmp/v22.err
