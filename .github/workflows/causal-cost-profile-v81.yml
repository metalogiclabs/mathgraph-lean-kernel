name: Causal cost profile v81
on:
  push:
    branches: [experiment/causal-cost-profile-v81]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install instruction profiler
        run: sudo apt-get update -qq && sudo apt-get install -y valgrind
      - name: Measure uninstrumented cost
        run: bash experiments/run_causal_cost_profile_v81.sh
      - name: Preserve profiles and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-cost-profile-v81
          path: |
            /tmp/v81/summary.txt
            /tmp/v81/cost-profile.json
            /tmp/v81/out/*.annotated.txt
            /tmp/v81/out/*.callgrind*
            /tmp/v81/out/*.profile.err
            /tmp/v81/out/*.reference.err
            /tmp/v81/out/*.prefix.ndjson
          if-no-files-found: warn
