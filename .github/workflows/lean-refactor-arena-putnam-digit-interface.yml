name: Lean Refactor Arena Putnam digit-consequence interface
on:
  workflow_dispatch:
  push:
    branches: ['competition/lra-putnam-digit-interface-v1']
    paths:
      - 'competitions/lean_refactor_arena/experiments/putnam_digit_consequence_v1.jsonl'
      - '.github/workflows/lean-refactor-arena-putnam-digit-interface.yml'
concurrency:
  group: lra-putnam-digit-interface
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PUBLIC_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      NAME: putnam_1995_a3
      BANK: competitions/lean_refactor_arena/experiments/putnam_digit_consequence_v1.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact old proof and 11 bounded witnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          portfolio=[json.loads(x) for x in Path('competitions/lean_refactor_arena/portfolio/warmup_portfolio_v1.jsonl').read_text().splitlines() if x.strip()]
          bank=[json.loads(x) for x in Path('competitions/lean_refactor_arena/experiments/putnam_digit_consequence_v1.jsonl').read_text().splitlines() if x.strip()]
          assert len(portfolio)==15 and len(bank)==12
          assert len({x['label'] for x in bank})==12
          frozen=next(x['proof'] for x in portfolio if x['name']=='putnam_1995_a3')
          assert bank[0]['proof']==frozen and bank[0]['label']=='retained_414_control'
          head=frozen.split(' := by\n',1)[0]+' := by\n'
          assert all(x['name']=='putnam_1995_a3' and x['proof'].startswith(head) and
                     not any(bad in x['proof'] for bad in ['sorry','sorryAx','admit','native_decide','run_elab'])
                     for x in bank)
          print('WARRANTED_EXACT_PUTNAM_DECLARATION_CONTROL_AND_11_CANDIDATES')
          PY
      - name: Build primary pinned v4.27 project
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_SHA"
          (cd /tmp/lean-refactor/competition && ./build-all.sh v4.27)
      - name: Evaluate each consequence representation with the official primary harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/putnam-labels.txt
          import json,os
          for line in open(os.environ['BANK']):
              if line.strip(): print(json.loads(line)['label'])
          PY
          : > /tmp/putnam-scores.jsonl
          while IFS= read -r label; do
            echo "PUTNAM_DIGIT_CANDIDATE=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.27 \
              --name "$NAME" --candidate "$BANK" --label "$label"
            (cd /tmp/lean-refactor/competition && python3 arena.py check --name "$NAME") > /tmp/putnam-one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' /tmp/putnam-one.json >> /tmp/putnam-scores.jsonl
          done < /tmp/putnam-labels.txt
      - name: Admit only verified primary objective gain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          measurements=[json.loads(x) for x in Path('/tmp/putnam-scores.jsonl').read_text().splitlines() if x.strip()]
          bank=[json.loads(x) for x in Path(os.environ['BANK']).read_text().splitlines() if x.strip()]
          assert len(measurements)==len(bank)==12
          assert len({x['candidate_label'] for x in measurements})==12
          def ok(r):
              pv=r.get('per_version') or []
              return (r.get('compiled') is True and r.get('statement_ok') is True and
                r.get('eligible') is True and not r.get('forbidden') and
                not r.get('extra_toplevel_decls') and r.get('survival_pct')==100 and
                (r.get('compat') or {}).get('v4.27.0') is True and
                any(x.get('version')=='v4.27.0' and x.get('tested') is True and x.get('ok') is True for x in pv))
          control=next(r for r in measurements if r['candidate_label']=='retained_414_control')
          assert ok(control),'PINNED_CONTROL_FAILED'
          qualified=[r for r in measurements if ok(r)]
          gains=[r for r in qualified if r['candidate_label']!='retained_414_control'
                 and float(r.get('objective_sum_pct') or -10000)>float(control['objective_sum_pct'])]
          gains.sort(key=lambda r:(-float(r['objective_sum_pct']),int(r['length']),int(r['heartbeats'])))
          best=gains[0] if gains else None
          outcome={'schema':'mathgraph.lra.putnam-digit-interface.v1',
              'status':'PRIMARY_GAIN_PENDING_3_REQUIRED_VERSIONS' if best else 'NO_PRIMARY_GAIN_BOUNDED',
              'control':{'tokens':control['length'],'heartbeats':control['heartbeats'],
                         'objective':control['objective_sum_pct']},
              'qualified':[{'label':x['candidate_label'],'tokens':x['length'],
                'heartbeats':x['heartbeats'],'objective':x['objective_sum_pct']} for x in qualified],
              'rejected':[{'label':x['candidate_label'],'errors':(x.get('per_version') or [{}])[0].get('errors',[])}
                          for x in measurements if not ok(x)],
              'winner':best['candidate_label'] if best else None,
              'changed_portfolio':False,'submitted':False,'source_sha':os.environ['PUBLIC_SHA']}
          Path('/tmp/putnam-summary.json').write_text(json.dumps(outcome,ensure_ascii=False,indent=2)+'\n')
          if best:
              row=next(x for x in bank if x['label']==best['candidate_label'])
              Path('/tmp/putnam-winner.jsonl').write_text(json.dumps(row,ensure_ascii=False)+'\n')
          print(json.dumps(outcome,ensure_ascii=False,indent=2))
          PY
      - name: Recheck winner on all required versions without portfolio mutation
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/putnam-winner.jsonl ]; then
            echo NO_PRIMARY_GAIN__NO_PROMOTION
            exit 0
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          (cd /tmp/lean-refactor/competition && ./build-all.sh v4.26 && ./build-all.sh v4.25)
          python3 competitions/lean_refactor_arena/public_harness_bridge.py \
            --competition /tmp/lean-refactor/competition --project v4.27 \
            --name "$NAME" --candidate /tmp/putnam-winner.jsonl
          (cd /tmp/lean-refactor/competition &&
             python3 arena.py check --name "$NAME" --all-versions --timeout 1800) > /tmp/putnam-all.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/putnam-all.json'))
          pv=x.get('per_version') or []
          req={'v4.25.0','v4.26.0','v4.27.0'}
          assert x.get('compiled') is True and x.get('statement_ok') is True and x.get('eligible') is True
          assert not x.get('forbidden') and not x.get('extra_toplevel_decls') and not x.get('untested')
          assert x.get('all_versions') is not False and set(x.get('compat') or {})==req
          assert all(x['compat'][v] is True for v in req)
          assert len(pv)==3 and {r.get('version') for r in pv}==req
          assert all(r.get('tested') is True and r.get('ok') is True for r in pv)
          assert float(x.get('objective_sum_pct'))>float(json.load(open('/tmp/putnam-summary.json'))['control']['objective'])
          print('WARRANTED_PUTNAM_DIGIT_CONSEQUENCE_ALL_REQUIRED_VERSIONS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-putnam-digit-interface
          path: |
            /tmp/putnam-scores.jsonl
            /tmp/putnam-summary.json
            /tmp/putnam-winner.jsonl
            /tmp/putnam-all.json
