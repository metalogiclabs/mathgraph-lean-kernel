name: MSI semantic dependency census v16
on:
  push:
    branches: [msi-semantic-dependency-census-v16]
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build Std prefix and instrumented checker
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          head -n 1000000 _build/tests/std.ndjson > /tmp/std-prefix.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/cand
          cp experiments/apply_msi_semantic_dependency_census_v16.py /tmp/cand/patch.py
          (cd /tmp/cand && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/cand-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/cand/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Run causal census and derive graph
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -f 'NATIVE=%e RSS=%M' /tmp/cand-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/std.out 2>/tmp/std.err
          grep 'MSI_DEP' /tmp/std.err | tail -1 > /tmp/snapshot.txt
          cat /tmp/snapshot.txt
          python3 - <<'PY' | tee /tmp/result.txt
          import re
          line=open('/tmp/snapshot.txt').read().strip()
          vals={k:int(v) for k,v in re.findall(r'(\w+)=(\d+)', line)}
          total=vals['total']
          edges=[
            ('raw_identity','force_thunk',vals['raw_eq'],'calls already decidable before forcing'),
            ('post_force_identity','conv_cache',vals['post_eq_new'],'additional calls decided only after forcing'),
            ('conv_cache','structural_compare',vals['uf_hit']+vals['neg_hit'],'cache decisions avoiding structural comparison'),
            ('direct_structure','cold_fallback',vals['direct_ok'],'ordinary structural decisions avoiding cold fallback'),
            ('spine_identity','spine_walk',vals['spine_ptr_eq'],'spines already identical before recursive walk'),
            ('argument_identity','recursive_unify',vals['spine_arg_raw_eq'],'application arguments already identical before recursive conversion'),
            ('proof_mask','recursive_unify',vals['spine_proof_skip'],'arguments skipped by relevance/proof metadata'),
          ]
          print(line)
          print('\nMSI_CAUSAL_PRECEDENCE')
          for a,b,n,why in edges:
              pct=100*n/total if total else 0
              print(f'{a} -> {b}: support={n} ({pct:.3f}% of unify calls); {why}')
          print('\nLOCAL_RATIOS')
          post=vals['post_eq']
          print(f'raw_share_of_pointer_exits={100*vals["raw_eq"]/post:.3f}%' if post else 'raw_share_of_pointer_exits=NA')
          sc=vals['spine_call']
          print(f'spine_identity_share={100*vals["spine_ptr_eq"]/sc:.3f}%' if sc else 'spine_identity_share=NA')
          sa=vals['spine_app']
          print(f'arg_identity_share={100*vals["spine_arg_raw_eq"]/sa:.3f}%' if sa else 'arg_identity_share=NA')
          print(f'proof_skip_share={100*vals["spine_proof_skip"]/sa:.3f}%' if sa else 'proof_skip_share=NA')
          sig=vals['sig_call']
          print(f'signature_mask_share={100*vals["sig_mask"]/sig:.3f}%' if sig else 'signature_mask_share=NA')
          nc=vals['no_cache']
          print(f'direct_success_share_of_no_cache={100*vals["direct_ok"]/nc:.3f}%' if nc else 'direct_success_share_of_no_cache=NA')
          print('\nDOT')
          print('digraph kernel_semantic_dependencies {')
          for a,b,n,_ in edges:
              if n:
                  print(f'  {a} -> {b} [label="{n}"];')
          print('}')
          PY
          cat /tmp/std.err | tail -20
      - name: Upload census
        uses: actions/upload-artifact@v4
        with:
          name: msi-semantic-dependency-census-v16
          path: |
            /tmp/result.txt
            /tmp/snapshot.txt
