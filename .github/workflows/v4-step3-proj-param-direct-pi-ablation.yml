name: V4 Step3 Projection Param Direct Pi

on:
  push:
    branches: [mathgraph-v4-bvdecide-residual]
    paths: ['.github/workflows/v4-step3-proj-param-direct-pi-ablation.yml']
  workflow_dispatch:

jobs:
  ablate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build Arena Std corpus
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test init-prelude
          nix develop -c ./lka.py build-test std
      - name: Materialize retained step2 and step3
        run: |
          set -euxo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/step2
          git -C /tmp/step2 checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          cp -a /tmp/step2 /tmp/step3
          python3 - <<'PY'
          from pathlib import Path
          def repl(root, old, new):
              p=Path(root)/'src/infer.rs'; s=p.read_text(); assert old in s; p.write_text(s.replace(old,new,1))
          app_old='''        while let Some(arg) = args.pop() {\n            let fty_f = self.force_all(depth, fty);\n            let (domain, body) = match fty_f {\n                Value::Pi { domain, body, .. } => (*domain, body),\n                _ => panic!("expected a pi type"),\n            };'''
          app_new='''        while let Some(arg) = args.pop() {\n            let (domain, body) = match fty {\n                Value::Pi { domain, body, .. } => (*domain, body),\n                _ => match self.force_all(depth, fty) {\n                    Value::Pi { domain, body, .. } => (*domain, body),\n                    _ => panic!("expected a pi type"),\n                },\n            };'''
          sort_old='''    pub(crate) fn ensure_sort_v(&mut self, depth: u32, v: V<'t>) -> LevelPtr<'t> {\n        match self.force_all(depth, v) {\n            Value::Sort { level , .. } => *level,\n            _ => panic!("expected a sort"),\n        }\n    }'''
          sort_new='''    pub(crate) fn ensure_sort_v(&mut self, depth: u32, v: V<'t>) -> LevelPtr<'t> {\n        match v {\n            Value::Sort { level, .. } => *level,\n            _ => match self.force_all(depth, v) {\n                Value::Sort { level, .. } => *level,\n                _ => panic!("expected a sort"),\n            },\n        }\n    }'''
          for root in ('/tmp/step2','/tmp/step3'):
              repl(root, app_old, app_new); repl(root, sort_old, sort_new)
          old='''        for p in params.iter().take(num_params).copied() {\n            match self.force_all(depth, cur) {\n                Value::Pi { domain, body, .. } => cur = self.apply_closure(depth, body, p, Some(*domain)),\n                _ => panic!("ran out of param telescope in projection"),\n            }\n        }'''
          new='''        for p in params.iter().take(num_params).copied() {\n            match cur {\n                Value::Pi { domain, body, .. } => cur = self.apply_closure(depth, body, p, Some(*domain)),\n                _ => match self.force_all(depth, cur) {\n                    Value::Pi { domain, body, .. } => cur = self.apply_closure(depth, body, p, Some(*domain)),\n                    _ => panic!("ran out of param telescope in projection"),\n                },\n            }\n        }'''
          repl('/tmp/step3', old, new)
          PY
          git -C /tmp/step3 diff -- src/infer.rs | tee /tmp/step3.diff
      - name: Build both identically with PGO
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/arena"
          for d in /tmp/step2 /tmp/step3; do
            cd "$d"
            echo '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' > config.json
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release --locked
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            nix shell nixpkgs#llvm -c llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            rm -rf target
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
          done
      - name: Deterministic Std incremental instructions
        run: |
          set -euxo pipefail
          cd arena
          for k in step2 step3; do
            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/${k}.callgrind /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null
            grep '^summary:' /tmp/${k}.callgrind | awk '{print $2}' > /tmp/${k}.ir
          done
          python3 - <<'PY' | tee /tmp/result.txt
          a=int(open('/tmp/step2.ir').read()); b=int(open('/tmp/step3.ir').read())
          print(f'STEP2_IR={a}'); print(f'STEP3_IR={b}'); print(f'INCREMENTAL_DELTA_IR={b-a}'); print(f'INCREMENTAL_DELTA_PCT={(b/a-1)*100:.6f}'); print('V4_PROJ_PARAM_DIRECT_PI=' + ('PASS' if b<a else 'FAIL'))
          PY
      - name: Std wall sanity interleaved
        run: |
          set -euxo pipefail
          cd arena; : > /tmp/walls.txt
          for i in 1 2 3; do for k in step2 step3; do /usr/bin/time -f "$k $i %e" -o /tmp/one.txt /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null; cat /tmp/one.txt | tee -a /tmp/walls.txt; done; done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import statistics
          d={'step2':[],'step3':[]}
          for k,i,t in map(str.split,open('/tmp/walls.txt')): d[k].append(float(t))
          a=statistics.median(d['step2']); b=statistics.median(d['step3']); print(f'STEP2_WALL_MEDIAN={a:.6f}'); print(f'STEP3_WALL_MEDIAN={b:.6f}'); print(f'WALL_INCREMENTAL_DELTA_PCT={(b/a-1)*100:.6f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-step3-proj-param-direct-pi
          path: |
            /tmp/result.txt
            /tmp/walls.txt
            /tmp/step3.diff
            /tmp/step2.callgrind
            /tmp/step3.callgrind
