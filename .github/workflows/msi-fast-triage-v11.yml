name: MSI fast triage v11

on:
  push:
    branches: [msi-fast-triage-v11]
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Std corpus and checker
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          head -n 1000000 _build/tests/std.ndjson > /tmp/std-prefix.ndjson
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/checker
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/checker-target RUSTFLAGS='-C target-cpu=x86-64 -C debuginfo=1' cargo build --manifest-path /tmp/checker/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Native prefix sanity
        run: |
          set -euxo pipefail
          /usr/bin/time -f 'NATIVE_SECONDS=%e MAX_RSS_KB=%M' /tmp/checker-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/native.out 2>/tmp/native.err
          tail -20 /tmp/native.err || true

      - name: Install Valgrind
        run: nix profile add nixpkgs#valgrind

      - name: Fast Callgrind self-cost profile
        run: |
          set -euxo pipefail
          timeout 1200 valgrind --tool=callgrind --callgrind-out-file=/tmp/triage.cg /tmp/checker-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/cg.out 2>/tmp/cg.err
          callgrind_annotate --inclusive=no --threshold=0.05 /tmp/triage.cg > /tmp/self.txt
          grep '^summary:' /tmp/triage.cg | tail -1 | tee /tmp/summary.txt
          echo '=== RECONSTRUCTION SELF COST ===' | tee /tmp/hot.txt
          grep -E 'prune_env|key_env|force_all|force_thunk|apply_closure|unify|head_spine_sig|spine_probe|simplify|eq_antisymm|infer_value|eval_no_cache|mk_thunk_hc|iota|unfold_value|num_loose_bvars|has_loose_bvar|spine_apps' /tmp/self.txt | head -160 | tee -a /tmp/hot.txt || true
          echo '=== TOP SELF COST ===' | tee -a /tmp/hot.txt
          sed -n '1,160p' /tmp/self.txt | tee -a /tmp/hot.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-fast-triage-v11-self
          path: |
            /tmp/hot.txt
            /tmp/summary.txt
            /tmp/native.err
          if-no-files-found: warn
