name: QCKN eval Var fast v1

on:
  push:
    branches:
      - qckn-eval-var-fast-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run direct Var dispatch test
        run: cargo test --locked qckn_eval_var_fast_tests -- --nocapture

  mathlib-causal-gate:
    needs: unit-red-green
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Run direct Var Mathlib causal gate
        run: bash experiments/run_qckn_eval_var_fast_v1.sh
      - name: Upload direct Var evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qckn-eval-var-fast-v1
          path: /tmp/qckn-eval-var-fast-v1/evidence
          if-no-files-found: warn

  callgrind-candidate:
    needs: unit-red-green
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QCKN_ARM: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Run candidate Callgrind
        run: bash experiments/run_qckn_eval_var_callgrind_v1.sh
      - name: Upload candidate Callgrind evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qckn-eval-var-callgrind-candidate
          path: /tmp/qckn-eval-var-callgrind-candidate/evidence
          if-no-files-found: warn

  callgrind-ablated:
    needs: unit-red-green
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QCKN_ARM: ablated
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Run ablated Callgrind
        run: bash experiments/run_qckn_eval_var_callgrind_v1.sh
      - name: Upload ablated Callgrind evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qckn-eval-var-callgrind-ablated
          path: /tmp/qckn-eval-var-callgrind-ablated/evidence
          if-no-files-found: warn

  full-semantic-parity:
    needs: unit-red-green
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Run full current-Arena semantic parity
        run: bash experiments/run_qckn_eval_var_semantic_v1.sh
      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qckn-eval-var-semantic-v1
          path: /tmp/qckn-eval-var-semantic-v1/evidence
          if-no-files-found: warn
