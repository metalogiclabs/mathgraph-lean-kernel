name: QCKN eval Var fast v1

on:
  push:
    branches:
      - qckn-eval-var-fast-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run direct Var dispatch test
        run: cargo test --locked qckn_eval_var_fast_tests -- --nocapture
