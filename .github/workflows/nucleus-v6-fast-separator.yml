name: Nucleus V6 Fast Semantic Separator

on:
  push:
    branches:
      - nucleus-bidirectional-v6
    paths:
      - .github/workflows/nucleus-v6-fast-separator.yml
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build frozen V5 and V6 semantics
        shell: bash
        run: |
          set -euxo pipefail
          V5=c7477f622f41f34d2735a53dde284d20c0377849
          V6=cdcbec3f08f5964e2e1962769363d42dd53d26bf
          git worktree add --detach /tmp/v5 "$V5"
          git worktree add --detach /tmp/v6 "$V6"
          for arm in v5 v6; do
            (cd /tmp/$arm && RUSTFLAGS='-C target-cpu=native' cargo build --release --locked)
            cp /tmp/$arm/target/release/sokonanoda /tmp/$arm.bin
          done
          cat >/tmp/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Build all current corner cases
        shell: bash
        timeout-minutes: 30
        run: |
          set -euxo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q 95496f5376b089dfd5889d88c73e390a9d98653d
          cd /tmp/arena
          : >/tmp/cases.tsv
          while IFS= read -r y; do
            t=${y#tests/}; t=${t%.yaml}
            nix develop -c ./lka.py build-test "$t" >/dev/null
            outcome=$(awk '/^outcome:/ {print $2; exit}' "$y")
            f="_build/tests/$t.ndjson"
            printf '%s\t%s\t%s\n' "$t" "$outcome" "$f" >>/tmp/cases.tsv
          done < <(find tests/corner-cases -type f -name '*.yaml' | sort)
          test "$(wc -l </tmp/cases.tsv)" -ge 19

      - name: Exact V6/V5 parity and official oracle
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/arena
          : >/tmp/results.tsv
          mismatch=0
          wrong=0
          decline=0
          while IFS=$'\t' read -r t outcome f; do
            set +e
            /tmp/v5.bin /tmp/config.json <"$f" >/tmp/v5.out 2>/tmp/v5.err; a=$?
            /tmp/v6.bin /tmp/config.json <"$f" >/tmp/v6.out 2>/tmp/v6.err; b=$?
            set -e
            parity=match
            if [ "$a" -ne "$b" ] || ! cmp -s /tmp/v5.out /tmp/v6.out; then
              parity=delta; mismatch=$((mismatch+1))
            fi
            oracle=wrong
            case "$outcome:$b" in
              accept:0|reject:1|either:0|either:1) oracle=correct ;;
              *:2) oracle=decline; decline=$((decline+1)) ;;
              *) wrong=$((wrong+1)) ;;
            esac
            printf '%s\t%s\tv5=%s\tv6=%s\t%s\t%s\n' "$t" "$outcome" "$a" "$b" "$parity" "$oracle" | tee -a /tmp/results.tsv
          done </tmp/cases.tsv
          printf 'mismatches=%s wrong=%s decline=%s\n' "$mismatch" "$wrong" "$decline" | tee /tmp/summary.txt
          test "$mismatch" -eq 0
          test "$wrong" -eq 0
          test "$decline" -eq 0
          echo NUCLEUS_V6_FAST_SEPARATOR=PASS | tee -a /tmp/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-v6-fast-separator
          path: |
            /tmp/cases.tsv
            /tmp/results.tsv
            /tmp/summary.txt
          if-no-files-found: warn
