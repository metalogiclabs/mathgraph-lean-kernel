name: MSI digest precision v18
on:
  push:
    branches: [msi-digest-precision-v18]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build Std prefix and probe checker
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          head -n 1000000 _build/tests/std.ndjson > /tmp/std-prefix.ndjson
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/cand
          cp experiments/apply_msi_digest_precision_v18.py /tmp/cand/patch.py
          (cd /tmp/cand && python3 patch.py)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/cand-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/cand/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Run digest precision probe
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -f 'NATIVE=%e RSS=%M' /tmp/cand-target/release/sokonanoda /tmp/checker.json < /tmp/std-prefix.ndjson >/tmp/std.out 2>/tmp/std.err
          grep 'MSI_DIGEST_PREC' /tmp/std.err | tail -1 > /tmp/snapshot.txt
          cat /tmp/snapshot.txt
          python3 - <<'PY' | tee /tmp/result.txt
          import re
          line=open('/tmp/snapshot.txt').read().strip()
          v={k:int(x) for k,x in re.findall(r'(\w+)=(\d+)', line)}
          pct=lambda a,b: 100*a/b if b else 0.0
          print(line)
          print('\nDIGEST_PRECISION')
          print(f'raw_digest_equal_rate={pct(v["raw_digest_eq"],v["raw_sample"]):.3f}%')
          print(f'raw_digest_equal_true_precision={pct(v["raw_digest_eq_true"],v["raw_digest_eq"]):.3f}%')
          print(f'raw_digest_equal_resolved_by_force_identity={pct(v["raw_digest_eq_postptr"],v["raw_digest_eq"]):.3f}%')
          print(f'postforce_digest_equal_rate={pct(v["post_digest_eq"],v["post_sample"]):.3f}%')
          print(f'postforce_digest_equal_true_precision={pct(v["post_digest_eq_true"],v["post_digest_eq"]):.3f}%')
          print(f'postforce_digest_neq_true_rate={pct(v["post_digest_neq_true"],v["post_digest_neq"]):.3f}%')
          if v['post_digest_eq']:
              p=pct(v['post_digest_eq_true'],v['post_digest_eq'])
              print('DECISION=CANONICAL_REF_STRONG' if p>=90 else ('DECISION=CANONICAL_REF_PROMISING' if p>=70 else 'DECISION=DIGEST_NOT_SUFFICIENT'))
          PY
          tail -10 /tmp/std.err
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: msi-digest-precision-v18
          path: |
            /tmp/result.txt
            /tmp/snapshot.txt
