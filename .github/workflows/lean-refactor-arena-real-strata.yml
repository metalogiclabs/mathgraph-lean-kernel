name: Lean Refactor Arena real Strata acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lean-refactor-arena-track1'
    paths:
      - 'competitions/lean_refactor_arena/project_candidate_probe.py'
      - 'competitions/lean_refactor_arena/evidence/strata_extracted_old_expr_deletion_residual_v1.json'
      - 'competitions/lean_refactor_arena/probes/strata_extracted_old_expr_v1.jsonl'
      - '.github/workflows/lean-refactor-arena-real-strata.yml'

concurrency:
  group: lean-refactor-arena-real-strata
  cancel-in-progress: true

jobs:
  strata-extracted-old-expr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STRATA_COMMIT: 451e5f047bafa010d178856db76c00029bfa4d7f
      TARGET_NAME: CallElimCorrect.extractedOldExprInVars
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.26.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Freeze live warm-up payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lra-space
          git clone --depth=1 https://huggingface.co/spaces/delta-lab-ai/lean-refactor-arena /tmp/lra-space
          git -C /tmp/lra-space rev-parse HEAD | tee /tmp/lra-space-head.txt
          sha256sum /tmp/lra-space/benchmark_data_warmup.jsonl | tee /tmp/lra-warmup-sha256.txt
          python3 competitions/lean_refactor_arena/official_jsonl.py \
            /tmp/lra-space/benchmark_data_warmup.jsonl \
            --summary-out /tmp/strata-live-benchmark-summary.json
          python3 competitions/lean_refactor_arena/arena_metrics.py regression \
            --benchmark /tmp/lra-space/benchmark_data_warmup.jsonl

      - name: Checkout exact Strata competition commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/Strata
          git init /tmp/Strata
          git -C /tmp/Strata remote add origin https://github.com/strata-org/Strata.git
          git -C /tmp/Strata fetch --depth=1 origin "$STRATA_COMMIT"
          git -C /tmp/Strata checkout --detach FETCH_HEAD
          test "$(git -C /tmp/Strata rev-parse HEAD)" = "$STRATA_COMMIT"
          test "$(cat /tmp/Strata/lean-toolchain)" = "leanprover/lean4:v4.26.0"
          echo "VERIFIED_EXACT_STRATA_COMPETITION_COMMIT"

      - name: Materialize Strata dependencies
        shell: bash
        working-directory: /tmp/Strata
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lake" update
          "$HOME/.elan/bin/lake" build Strata.Transform.CallElimCorrect

      - name: Verify frozen reference in exact workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 competitions/lean_refactor_arena/submission.py baseline \
            --input /tmp/lra-space/benchmark_data_warmup.jsonl \
            --output /tmp/full-control.jsonl
          python3 competitions/lean_refactor_arena/workspace_verify.py \
            --workspace /tmp/Strata \
            --input /tmp/lra-space/benchmark_data_warmup.jsonl \
            --submission /tmp/full-control.jsonl \
            --out /tmp/strata-reference-verify.json \
            --limit 1 || true
          # The target itself is independently replayed by both acquisition lanes below.

      - name: Reuse certified deletion-only residual
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          evidence=json.load(open('competitions/lean_refactor_arena/evidence/strata_extracted_old_expr_deletion_residual_v1.json'))
          rows=[json.loads(x) for x in open('/tmp/lra-space/benchmark_data_warmup.jsonl') if x.strip()]
          row=next(r for r in rows if r['name']==evidence['target'])
          assert evidence['status']=='WARRANTED_BOUNDED'
          assert evidence['search']['changed'] is False
          assert evidence['search']['verifier_checks_total']==25
          assert row['proof_length']==evidence['benchmark_reference_tokens']==222
          assert row['version_info'][0]=={evidence['lean_version']: evidence['workspace_commit']}
          assert evidence['workspace_commit']=='451e5f047bafa010d178856db76c00029bfa4d7f'
          print('REUSED_CERTIFIED_DELETION_RESIDUAL run=', evidence['authority']['github_actions_run_id'])
          PY

      - name: Apply least lawful expansion - structural consequence probes
        shell: bash
        run: |
          set -euo pipefail
          python3 competitions/lean_refactor_arena/project_candidate_probe.py \
            --benchmark /tmp/lra-space/benchmark_data_warmup.jsonl \
            --name "$TARGET_NAME" \
            --workspace /tmp/Strata \
            --candidates competitions/lean_refactor_arena/probes/strata_extracted_old_expr_v1.jsonl \
            --out-best /tmp/strata-structural-best.jsonl \
            --out-report /tmp/strata-structural-probe-report.json \
            --timeout 120

      - name: Select retained candidate without weakening the reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shutil
          evidence=json.load(open('competitions/lean_refactor_arena/evidence/strata_extracted_old_expr_deletion_residual_v1.json'))
          structural=json.load(open('/tmp/strata-structural-probe-report.json'))
          if structural['strict_token_gain']:
              shutil.copyfile('/tmp/strata-structural-best.jsonl', '/tmp/strata-retained-candidate.jsonl')
              source='structural_consequence'
          else:
              rows=[json.loads(x) for x in open('/tmp/lra-space/benchmark_data_warmup.jsonl') if x.strip()]
              row=next(r for r in rows if r['name']==structural['name'])
              open('/tmp/strata-retained-candidate.jsonl','w').write(
                  json.dumps({'name':row['name'],'proof':row['src']},ensure_ascii=False)+'\\n')
              source='reference_fallback'
          out={
              'schema':'mathgraph.lean-refactor-arena.residual-selection.v1',
              'target':structural['name'],
              'deletion_residual_status':evidence['status'],
              'deletion_residual_run':evidence['authority']['github_actions_run_id'],
              'structural_verified_count':structural['verified_count'],
              'structural_best_label':structural['best_label'],
              'structural_best_tokens':structural['best_tokens'],
              'structural_strict_token_gain':structural['strict_token_gain'],
              'retained_source':source,
          }
          open('/tmp/strata-retention-selection.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Measure retained candidate heartbeats
        shell: bash
        run: |
          set -euo pipefail
          python3 competitions/lean_refactor_arena/project_heartbeat.py \
            --benchmark /tmp/lra-space/benchmark_data_warmup.jsonl \
            --heartbeats /tmp/lra-space/benchmark_heartbeats.jsonl \
            --name "$TARGET_NAME" \
            --workspace /tmp/Strata \
            --candidate /tmp/strata-retained-candidate.jsonl \
            --out /tmp/strata-retained-heartbeats.json \
            --timeout 180

      - name: Build full 15-problem upload with retained Strata candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 competitions/lean_refactor_arena/arena_upload.py build \
            --benchmark /tmp/lra-space/benchmark_data_warmup.jsonl \
            --candidates /tmp/strata-retained-candidate.jsonl \
            --out /tmp/strata-full-upload.jsonl \
            --report /tmp/strata-full-upload-report.json
          python3 competitions/lean_refactor_arena/arena_upload.py validate \
            --benchmark /tmp/lra-space/benchmark_data_warmup.jsonl \
            --upload /tmp/strata-full-upload.jsonl
          python3 - <<'PY'
          import json
          e=json.load(open('competitions/lean_refactor_arena/evidence/strata_extracted_old_expr_deletion_residual_v1.json'))
          s=json.load(open('/tmp/strata-structural-probe-report.json'))
          h=json.load(open('/tmp/strata-retained-heartbeats.json'))
          print('DELETION_RESIDUAL=', e['status'], 'run', e['authority']['github_actions_run_id'])
          print('STRUCTURAL_BEST=', s['best_label'])
          print('STRUCTURAL_TOKENS=', s['reference_tokens'], '->', s['best_tokens'])
          print('STRUCTURAL_LENGTH_REDUCTION_PCT=', s['best_length_reduction_pct'])
          print('RETAINED_HEARTBEATS=', h['reference_heartbeat_published'], '->', h['measured_heartbeat'])
          print('RETAINED_HEARTBEAT_RATIO=', h['ratio_to_published'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-refactor-arena-real-strata
          path: |
            /tmp/lra-space-head.txt
            /tmp/lra-warmup-sha256.txt
            /tmp/strata-live-benchmark-summary.json
            /tmp/strata-reference-verify.json
            competitions/lean_refactor_arena/evidence/strata_extracted_old_expr_deletion_residual_v1.json
            /tmp/strata-structural-best.jsonl
            /tmp/strata-structural-probe-report.json
            /tmp/strata-retention-selection.json
            /tmp/strata-retained-candidate.jsonl
            /tmp/strata-retained-heartbeats.json
            /tmp/strata-full-upload.jsonl
            /tmp/strata-full-upload-report.json
