name: QCKN eval path atlas v1

on:
  push:
    branches:
      - qckn-eval-path-atlas-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run eval atlas unit test
        run: cargo test --locked qckn_eval_atlas_tests -- --nocapture
