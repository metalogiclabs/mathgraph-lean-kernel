name: QCKN eval path atlas v1

on:
  push:
    branches:
      - qckn-eval-path-atlas-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run eval atlas unit test
        run: cargo test --locked qckn_eval_atlas_tests -- --nocapture

  mathlib-eval-census:
    needs: unit-red-green
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run QCKN Mathlib eval path census
        run: bash experiments/run_qckn_eval_path_atlas_v1.sh
      - name: Upload eval path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qckn-eval-path-atlas-v1
          path: /tmp/qckn-eval-path-atlas-v1/evidence
          if-no-files-found: warn
