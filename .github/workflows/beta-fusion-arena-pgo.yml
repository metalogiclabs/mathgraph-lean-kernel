name: Beta fusion Arena-PGO instruction gate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  arena-pgo-ab:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'mathgraph-infer-beta-fusion'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Install Callgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Fetch Arena and build frozen discriminator corpus
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena
          cd /tmp/arena
          for t in init-prelude perf/beta-ladder perf/app-lam perf/let-ladder perf/grind-ring-5; do
            nix develop -c ./lka.py build-test "$t"
          done
      - name: Build exact V1 and fusion with Arena PGO recipe
        run: |
          set -euxo pipefail
          V1=1e209dad266d59b4d43cdea189876bc6ea551339
          git worktree add /tmp/base "$V1"
          cp -a /tmp/base /tmp/fusion
          python3 scripts/apply_infer_beta_fusion.py /tmp/fusion
          for arm in base fusion; do
            cat >/tmp/$arm/config.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4,"print_success_message":false}
          EOF
            rm -rf /tmp/$arm/pgo
            mkdir -p /tmp/$arm/pgo
            cd /tmp/arena
            nix develop -c bash -lc "cd /tmp/$arm && RUSTFLAGS='-C target-cpu=native -Cprofile-generate=/tmp/$arm/pgo' cargo build --release --locked"
            /tmp/$arm/target/release/sokonanoda /tmp/$arm/config.json < /tmp/arena/_build/tests/init-prelude.ndjson >/dev/null
            cd /tmp/arena
            nix develop -c bash -lc "llvm-profdata merge -o /tmp/$arm/pgo/merged.profdata /tmp/$arm/pgo"
            nix develop -c bash -lc "cd /tmp/$arm && RUSTFLAGS='-C target-cpu=native -Cprofile-use=/tmp/$arm/pgo/merged.profdata' cargo build --release --locked"
          done
      - name: Semantic equality and Callgrind instruction A/B
        run: |
          set -euxo pipefail
          : >/tmp/results.tsv
          cd /tmp/arena
          for t in perf/beta-ladder perf/app-lam perf/let-ladder perf/grind-ring-5; do
            f="_build/tests/${t}.ndjson"
            slug="${t#perf/}"
            /tmp/base/target/release/sokonanoda /tmp/base/config.json < "$f" >/tmp/base-$slug.out 2>/tmp/base-$slug.err
            /tmp/fusion/target/release/sokonanoda /tmp/fusion/config.json < "$f" >/tmp/fusion-$slug.out 2>/tmp/fusion-$slug.err
            cmp /tmp/base-$slug.out /tmp/fusion-$slug.out
            for arm in base fusion; do
              valgrind --tool=callgrind --callgrind-out-file=/tmp/$arm-$slug.cg /tmp/$arm/target/release/sokonanoda /tmp/$arm/config.json < "$f" >/dev/null 2>/tmp/$arm-$slug.cg.err
              ir=$(awk '/^summary:/ {print $2}' /tmp/$arm-$slug.cg)
              printf '%s\t%s\t%s\n' "$slug" "$arm" "$ir" | tee -a /tmp/results.tsv
            done
          done
      - name: Frozen decision
        run: |
          python3 - <<'PY' | tee /tmp/decision.txt
          from pathlib import Path
          rows={}
          for line in Path('/tmp/results.tsv').read_text().splitlines():
              test,arm,ir=line.split('\t')
              rows.setdefault(test,{})[arm]=int(ir)
          deltas={}
          for test,v in rows.items():
              d=(v['fusion']-v['base'])/v['base']
              deltas[test]=d
              print(f'{test}: base={v["base"]} fusion={v["fusion"]} delta={d:+.4%}')
          beta=deltas['beta-ladder']
          controls=max(deltas['app-lam'],deltas['let-ladder'],deltas['grind-ring-5'])
          if beta <= -0.20 and controls <= 0.01:
              verdict='BETA_FUSION_ARENA_PGO_PHASE_CHANGE__ESCALATE_REAL_WORLD'
          elif beta < 0 and controls <= 0.01:
              verdict='BETA_FUSION_SURVIVES_PGO_BUT_BELOW_PHASE_GATE'
          else:
              verdict='BETA_FUSION_REJECT_OR_REFINE'
          print('DECISION='+verdict)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-fusion-arena-pgo
          path: |
            /tmp/results.tsv
            /tmp/decision.txt
            /tmp/*.cg.err
