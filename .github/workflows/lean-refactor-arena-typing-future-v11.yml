name: Lean Refactor Arena V11 protected-future Typing obligation quotient

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lra-typing-residual-witness-v11'
    paths:
      - 'competitions/lean_refactor_arena/experiments/typing_future_obligation_v11.jsonl'
      - '.github/workflows/lean-refactor-arena-typing-future-v11.yml'

concurrency:
  group: lra-typing-future-v11
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PUBLIC_REPO_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      TARGET_NAME: Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress
      CANDIDATES: competitions/lean_refactor_arena/experiments/typing_future_obligation_v11.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned Cslib project
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_REPO_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_REPO_SHA"
          (cd /tmp/lean-refactor/competition && ./build-all.sh v4.33)
      - name: Freeze source-control and 3-bit obligation grammar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("competitions/lean_refactor_arena")
          read=lambda p:[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          xs=read(root/"experiments/typing_future_obligation_v11.jsonl")
          p=read(root/"portfolio/warmup_portfolio_v1.jsonl")
          t="Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress"
          assert len(xs)==9 and len({x["label"] for x in xs})==9
          incumbent=next(x for x in p if x["name"]==t)
          assert incumbent["label"]=="warranted_typing_movable_tli_grind_308"
          assert xs[0]["proof"]==xs[-1]["proof"]==incumbent["proof"]
          assert [x["label"] for x in xs[1:]]==[
            "typing_future_"+format(i,"03b") for i in range(8)]
          assert all(x["name"]==t for x in xs)
          assert all(x["proof"].startswith(incumbent["proof"].split("  case tapp ")[0]) for x in xs)
          print("FROZEN_V10_TYPING_OBLIGATION_GRAMMAR_2^3_AND_EXACT_SOURCE")
          PY
      - name: Score each of nine frozen protected-future proof candidates
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/typing-future-v11-scores.jsonl
          python3 - <<'PY' > /tmp/typing-future-v11-labels.txt
          import json
          from pathlib import Path
          xs=[json.loads(line) for line in Path('competitions/lean_refactor_arena/experiments/typing_future_obligation_v11.jsonl').read_text().splitlines() if line.strip()]
          assert len(xs)==9 and len({x['label'] for x in xs})==13
          assert all(x['name']=='Cslib.LambdaCalculus.LocallyNameless.Fsub.Typing.progress' for x in xs)
          for x in xs: print(x['label'])
          PY
          while IFS= read -r label; do
            echo "TYPING_PROBE=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.33 \
              --name "$TARGET_NAME" --candidate "$CANDIDATES" --label "$label"
            (
              cd /tmp/lean-refactor/competition
              python3 arena.py check --name "$TARGET_NAME"
            ) > /tmp/typing-future-v11-one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' \
              /tmp/typing-future-v11-one.json >> /tmp/typing-future-v11-scores.jsonl
          done < /tmp/typing-future-v11-labels.txt
      - name: Establish verified frontier and preserve negative results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(line) for line in Path('/tmp/typing-future-v11-scores.jsonl').read_text().splitlines() if line.strip()]
          assert len(rows)==9 and len({r['candidate_label'] for r in rows})==13
          valid=lambda r:(r.get('compiled') is True and r.get('statement_ok') is True
            and r.get('eligible') is True and float(r.get('survival_pct') or 0)==100.0
            and not r.get('forbidden') and not r.get('extra_toplevel_decls')
            and r.get('compat')=={'v4.33.0-rc2': True})
          incumbent=next(r for r in rows if r['candidate_label']=='typing_retained_308_control')
          assert valid(incumbent), 'PROTECTED_INCUMBENT_DID_NOT_VERIFY'
          qualified=[r for r in rows if valid(r)]
          improved=[r for r in qualified if r['candidate_label']!='typing_retained_308_control'
                     and float(r.get('objective_sum_pct') or 0)>float(incumbent['objective_sum_pct'])]
          best=max(improved,key=lambda r:(float(r['objective_sum_pct']),-r['length'],-r['heartbeats']),default=None)
          out={'schema':'mathgraph.lra.typing.future-obligation.v11',
            'status':'CANDIDATE_PRIMARY_GAIN__PENDING_EXACT_THREE_VERSION_CHECK' if best else 'REJECTED_BOUNDED_NO_PRIMARY_GAIN',
            'authority_pin':'7f3a401470d04f70013d293db4253b088ec8a0ae',
            'protected_controls':{'incumbent':incumbent['candidate_label'],'objective':incumbent['objective_sum_pct'],
                 'tokens':incumbent['length'],'heartbeats':incumbent['heartbeats']},
            'verified_candidates':[{'label':r['candidate_label'],'objective':r['objective_sum_pct'],
                 'tokens':r['length'],'heartbeats':r['heartbeats']} for r in qualified],
            'qualified_improvements':[{'label':r['candidate_label'],'objective':r['objective_sum_pct'],
                 'tokens':r['length'],'heartbeats':r['heartbeats']} for r in improved],
            'best':None if best is None else best['candidate_label'],
            'negative_residuals':[{'label':r['candidate_label'],
                 'errors':(r.get('per_version') or [{}])[0].get('errors',[])} for r in rows if not valid(r)],
            'promotion_boundary':'Exact V10 308-token control preserved; this is v4.33 primary only. Any winner must independently pass exact v4.33/v4.32/v4.31 before modifying portfolio; official submission untouched.'}
          Path('/tmp/typing-future-v11-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-typing-future-v11
          path: |
            /tmp/typing-future-v11-scores.jsonl
            /tmp/typing-future-v11-summary.json
