name: Force origin runtime atlas

on:
  pull_request:
    paths:
      - 'experiments/force-origin-runtime.trigger'
      - '.github/workflows/force-origin-runtime-atlas.yml'
      - 'scripts/apply_force_origin_atlas.py'
  workflow_dispatch:

jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build instrumented frozen V1
        run: |
          set -euxo pipefail
          V1=1e209dad266d59b4d43cdea189876bc6ea551339
          git worktree add /tmp/probe "$V1"
          python3 scripts/apply_force_origin_atlas.py /tmp/probe | tee /tmp/patcher.txt
          (cd /tmp/probe && cargo build --release --locked)
          cp /tmp/probe/target/release/sokonanoda /tmp/probe-bin
          cp /tmp/probe/force_origin_manifest.json /tmp/force_origin_manifest.json
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Build beta exports
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena
          cd /tmp/arena
          cp tests/perf/beta-ladder.lean tests/perf/beta-ladder-8000.lean
          sed -i 's/let n := 2000/let n := 8000/' tests/perf/beta-ladder-8000.lean
          printf 'description: beta ladder N=8000\nleanfile: tests/perf/beta-ladder-8000.lean\nexport-decls: ["beta_ladder"]\noutcome: accept\ncompare-perf: true\n' > tests/perf/beta-ladder-8000.yaml
          nix develop -c ./lka.py build-test perf/beta-ladder
          nix develop -c ./lka.py build-test perf/beta-ladder-8000

      - name: Runtime origin probe
        run: |
          set -euxo pipefail
          cd /tmp/arena
          /tmp/probe-bin /tmp/checker.json < _build/tests/perf/beta-ladder.ndjson >/tmp/beta2000.out 2>/tmp/beta2000.err
          /tmp/probe-bin /tmp/checker.json < _build/tests/perf/beta-ladder-8000.ndjson >/tmp/beta8000.out 2>/tmp/beta8000.err

      - name: Summarize dominant origins
        run: |
          python3 - <<'PY' | tee /tmp/summary.txt
          import json,re
          from pathlib import Path
          manifest={x['tag']:x for x in json.loads(Path('/tmp/force_origin_manifest.json').read_text())}
          pat=re.compile(r'FORCE_ORIGIN tag=(\d+) count=(\d+) pi=(\d+)')
          for label in ('beta2000','beta8000'):
              maxima={}
              for line in Path(f'/tmp/{label}.err').read_text().splitlines():
                  m=pat.search(line)
                  if not m: continue
                  t,c,p=map(int,m.groups())
                  if c >= maxima.get(t,(0,0))[0]: maxima[t]=(c,p)
              rows=sorted(maxima.items(), key=lambda kv: kv[1][0], reverse=True)
              print(f'=== {label} ===')
              for t,(c,p) in rows[:15]:
                  e=manifest[t]
                  print(f"tag={t} approx_count={c} pi={p} pi_frac={p/c if c else 0:.6f} site={e['file']}:{e['line']}")
          print('=== manifest ===')
          for t in sorted(manifest):
              e=manifest[t]
              print(f"tag={t} {e['file']}:{e['line']} receiver={e['receiver']}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: force-origin-runtime-atlas
          path: |
            /tmp/summary.txt
            /tmp/force_origin_manifest.json
            /tmp/beta2000.err
            /tmp/beta8000.err
