name: Flash WHNF no-store PMU seal v2

on:
  push:
    branches:
      - flash2-whnf-nostore-final-promotion-v1
    paths:
      - .github/workflows/flash2-whnf-nostore-final-promotion-v1.yml
  workflow_dispatch:

concurrency:
  group: flash2-whnf-nostore-pmu-seal-v2
  cancel-in-progress: true

jobs:
  pmu-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Probe hosted-runner PMU authority
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          PERF=$(nix shell nixpkgs#linuxPackages_latest.perf -c sh -c 'command -v perf')
          {
            echo "PERF=$PERF"
            "$PERF" --version
            echo "kernel.perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo unavailable)"
            echo "kernel.kptr_restrict=$(cat /proc/sys/kernel/kptr_restrict 2>/dev/null || echo unavailable)"
            echo "== user hardware instructions =="
            "$PERF" stat -e instructions -- true
            echo "USER_HW_RC=$?"
            echo "== sudo hardware instructions =="
            sudo "$PERF" stat -e instructions -- true
            echo "SUDO_HW_RC=$?"
            echo "== user software task-clock =="
            "$PERF" stat -e task-clock -- true
            echo "USER_SW_RC=$?"
            echo "== attempt lower paranoid =="
            sudo sysctl -w kernel.perf_event_paranoid=-1
            echo "SYSCTL_RC=$?"
            echo "kernel.perf_event_paranoid.after=$(cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo unavailable)"
            echo "== user hardware after sysctl =="
            "$PERF" stat -e instructions -- true
            echo "USER_HW_AFTER_RC=$?"
          } 2>&1 | tee /tmp/pmu-probe.txt

          user_hw=$(grep '^USER_HW_RC=' /tmp/pmu-probe.txt | tail -1 | cut -d= -f2)
          sudo_hw=$(grep '^SUDO_HW_RC=' /tmp/pmu-probe.txt | tail -1 | cut -d= -f2)
          after_hw=$(grep '^USER_HW_AFTER_RC=' /tmp/pmu-probe.txt | tail -1 | cut -d= -f2)
          if [ "$user_hw" = 0 ] || [ "$sudo_hw" = 0 ] || [ "$after_hw" = 0 ]; then
            echo PMU_HARDWARE_INSTRUCTIONS_AVAILABLE=YES | tee /tmp/pmu-status.txt
          else
            echo PMU_HARDWARE_INSTRUCTIONS_AVAILABLE=NO | tee /tmp/pmu-status.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash2-whnf-nostore-pmu-probe-v2
          path: |
            /tmp/pmu-probe.txt
            /tmp/pmu-status.txt
          if-no-files-found: error
