name: V4 Step20 MSI sticky prune memory ablation
on:
  workflow_dispatch:
  push:
    branches:
      - mathgraph-v4-bvdecide-residual
    paths:
      - .github/workflows/v4-step20-msi-sticky-prune-memory-ablation.yml
jobs:
  ablation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          set_as_trusted_user: true
      - name: Build Arena tests
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test init-prelude
          nix develop -c ./lka.py build-test std
      - name: Materialize retained7 and sticky candidate
        run: |
          set -euxo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          git -C /tmp/base checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          cp -a /tmp/base /tmp/cand
          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/5a1485ae13a0623ca8b7001aee9e0e155381daad/experiments/apply_v4_retained6.py -o /tmp/apply.py
          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/cdd1d63acf297bb14c4ca4c43f42610e9ae7e552/experiments/apply_v4_step20_sticky_prune.py -o /tmp/sticky.py
          for k in base cand; do
            python3 /tmp/apply.py /tmp/$k
            sed -i 's/WHNF_ADMIT_THRESHOLD: u8 = 2/WHNF_ADMIT_THRESHOLD: u8 = 1/' /tmp/$k/src/eval.rs
            grep -q 'WHNF_ADMIT_THRESHOLD: u8 = 1' /tmp/$k/src/eval.rs
            printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' > /tmp/$k/config.json
          done
          python3 /tmp/sticky.py /tmp/cand
          git -C /tmp/cand diff -- src > /tmp/candidate.diff
      - name: PGO builds
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/arena"
          for k in base cand; do
            cd /tmp/$k
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-generate=$PWD/pgo" cargo build --release --locked
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            nix shell nixpkgs#llvm -c llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            rm -rf target
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
          done
      - name: Deterministic Std Callgrind
        run: |
          set -euxo pipefail
          cd arena
          for k in base cand; do
            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/${k}.callgrind /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null
            grep '^summary:' /tmp/${k}.callgrind | awk '{print $2}' > /tmp/${k}.ir
          done
          b=$(cat /tmp/base.ir)
          c=$(cat /tmp/cand.ir)
          python3 -c "b=$b;c=$c;print(f'BASE_IR={b}\nCAND_IR={c}\nDELTA={c-b}\nDELTA_PCT={(c/b-1)*100:.6f}\nV4_MSI_STICKY_PRUNE={'PASS' if c < b else 'FAIL'}')" | tee /tmp/result.txt
      - name: Wall sanity
        run: |
          set -euxo pipefail
          cd arena
          : > /tmp/wall.tsv
          for i in 1 2 3; do
            for k in base cand; do
              /usr/bin/time -f "$k\t%e" -o /tmp/one.time /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null
              cat /tmp/one.time >> /tmp/wall.tsv
            done
          done
          cat /tmp/wall.tsv | tee -a /tmp/result.txt
          python3 -c "import statistics;d={'base':[],'cand':[]};[(d[k].append(float(v))) for k,v in (line.split() for line in open('/tmp/wall.tsv'))];b=statistics.median(d['base']);c=statistics.median(d['cand']);print(f'BASE_WALL_MEDIAN={b}\nCAND_WALL_MEDIAN={c}\nWALL_DELTA_PCT={(c/b-1)*100:.6f}')" | tee -a /tmp/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v4-step20-msi-sticky-prune-memory
          path: |
            /tmp/result.txt
            /tmp/candidate.diff
            /tmp/*.callgrind
            /tmp/*.ir
