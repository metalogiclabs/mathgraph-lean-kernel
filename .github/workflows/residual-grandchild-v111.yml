name: Residual grandchild atlas v111

on:
  push:
    branches:
      - experiment/residual-grandchild-atlas-v111
    paths:
      - 'scripts/apply_bounded_sparse_v105.py'
      - 'scripts/apply_sparse_admission_census_v107.py'
      - 'scripts/apply_sparse_feature_atlas_v108.py'
      - 'scripts/apply_app_shape_atlas_v109.py'
      - 'scripts/apply_residual_grandchild_v111.py'
      - 'scripts/analyze_residual_grandchild_v111.py'
      - 'experiments/run_residual_grandchild_v111.sh'
      - '.github/workflows/residual-grandchild-v111.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run residual grandchild atlas
        run: bash experiments/run_residual_grandchild_v111.sh
      - name: Preserve v111 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-grandchild-v111
          path: /tmp/residual-grandchild-v111/report/
          if-no-files-found: warn
