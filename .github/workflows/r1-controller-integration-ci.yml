name: R1 controller integration qualification

on:
  push:
    branches:
      - r1-representation-controller-v1
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Controller unit tests
        run: cargo test --release --locked representation::tests -- --nocapture
      - name: Full Rust tests
        run: cargo test --release --locked
      - name: Build release binary
        run: RUSTFLAGS='-C target-cpu=x86-64-v3' cargo build --release --locked
