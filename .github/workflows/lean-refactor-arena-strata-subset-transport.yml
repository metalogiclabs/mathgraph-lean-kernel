name: Lean Refactor Arena Strata subset transport

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/lean-refactor-arena-track1'
    paths:
      - 'competitions/lean_refactor_arena/experiments/strata_subset_transport_v1.jsonl'
      - '.github/workflows/lean-refactor-arena-strata-compact-heartbeat.yml'

concurrency:
  group: lra-strata-compact
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      PUBLIC_REPO_SHA: 7f3a401470d04f70013d293db4253b088ec8a0ae
      TARGET_NAME: CallElimCorrect.substOldPostSubset
      CANDIDATES: competitions/lean_refactor_arena/experiments/strata_subset_transport_v1.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Strata v4.26 workspace
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/aurasoph/lean-refactor.git /tmp/lean-refactor
          git -C /tmp/lean-refactor fetch --depth=1 origin "$PUBLIC_REPO_SHA"
          git -C /tmp/lean-refactor checkout --detach FETCH_HEAD
          git -C /tmp/lean-refactor sparse-checkout set competition
          test "$(git -C /tmp/lean-refactor rev-parse HEAD)" = "$PUBLIC_REPO_SHA"
          (cd /tmp/lean-refactor/competition && ./build-all.sh v4.26)
      - name: Verify compact and retained controls plus variants
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/strata-compact-scores.jsonl
          for label in strata_retained_control_188 strata_quant_pair_simp strata_app_pair_simp strata_app_pair_quant_pair strata_app_pair_one_liner strata_quant_simpall strata_ite_simpall strata_app_grind_only strata_app_split_all; do
            echo "CHECK=$label"
            python3 competitions/lean_refactor_arena/public_harness_bridge.py \
              --competition /tmp/lean-refactor/competition --project v4.26 \
              --name "$TARGET_NAME" --candidate "$CANDIDATES" --label "$label"
            (cd /tmp/lean-refactor/competition && python3 arena.py check --name "$TARGET_NAME") > /tmp/strata-one.json
            jq -c --arg label "$label" '. + {candidate_label:$label}' /tmp/strata-one.json \
              >> /tmp/strata-compact-scores.jsonl
          done
      - name: Fail-closed verified objective comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(s) for s in pathlib.Path('/tmp/strata-compact-scores.jsonl').read_text().splitlines() if s.strip()]
          assert len(rows)==9,len(rows)
          valid=lambda r:bool(r.get('compiled') and r.get('statement_ok') and r.get('eligible') and
            float(r.get('survival_pct') or 0)==100 and not r.get('forbidden') and not r.get('extra_toplevel_decls'))
          control=next(r for r in rows if r['candidate_label']=='strata_retained_control_188')
          assert valid(control),'STRATA_CONTROL_FAILED'
          qualified=[r for r in rows if valid(r) and r['candidate_label']!='strata_retained_control_188']
          better=[r for r in qualified if float(r.get('objective_sum_pct') or 0)>112.37]
          best=max(better,key=lambda r:float(r['objective_sum_pct']),default=None)
          out={'schema':'mathgraph.lra.strata.subset-transport.v1',
            'status':'WARRANTED_PRIMARY_GAIN' if best else 'NO_QUALIFIED_GAIN',
            'verified_control':{'label':control['candidate_label'],'length':control['length'],
               'heartbeats':control['heartbeats'],'objective':control['objective_sum_pct']},
            'qualified_variants':[{'label':r['candidate_label'],'length':r['length'],
               'heartbeats':r['heartbeats'],'objective':r['objective_sum_pct']} for r in qualified],
            'best':None if best is None else {'label':best['candidate_label'],'length':best['length'],
               'heartbeats':best['heartbeats'],'objective':best['objective_sum_pct']},
            'failures':[{'label':r['candidate_label'],'errors':(r.get('per_version') or [{}])[0].get('errors')} for r in rows if not valid(r)],
            'scope':'Pinned Strata v4.26 single toolchain; preserve 188-token incumbent absent measured gain.'}
          pathlib.Path('/tmp/strata-compact-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lra-strata-compact-heartbeat
          path: |
            /tmp/strata-compact-scores.jsonl
            /tmp/strata-compact-summary.json
