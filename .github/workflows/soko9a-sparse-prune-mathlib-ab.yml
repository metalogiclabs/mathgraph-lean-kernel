name: Soko9a exact full Mathlib sparse-prune PGO A/B

on:
  push:
    branches: [research/soko9a-sparse-prune-reset-20261102]
    paths: [.github/workflows/soko9a-sparse-prune-mathlib-ab.yml, experiments/lean-kernel/soko9a-sparse-prune-reset.patch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-mathlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_INPUT: 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1

      - name: Rehydrate exact trusted Mathlib bytes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mathlib-parts
          for part in \
            aa:11853198746:c468c622861bfdef1f5ec63f7847dca47650c52cb019a9c034a6e5127ff47ba6 \
            ab:11852254787:aab2a4f6b069b75a0c4123e91b440350846cf252e7bb362729e95d14f014b7da \
            ac:11854400199:7538292d02c16aeed628932431724b2f088893c4396bcd652fbabf6ba39f0d73 \
            ad:11853742466:ae5b674378b731fd3b62df99ba02d5867103efaa9313556de4506fb1a06c119a; do
            IFS=: read -r label artifact digest <<< "$part"
            ok=0
            for attempt in 1 2 3; do
              if gh api "repos/heathsanchez/test/actions/artifacts/$artifact/zip" >"/tmp/part-$label.zip"; then ok=1; break; fi
              sleep $((8*attempt))
            done
            test "$ok" -eq 1
            printf '%s  %s\n' "$digest" "/tmp/part-$label.zip" | sha256sum -c -
            test "$(unzip -Z -1 "/tmp/part-$label.zip" | wc -l)" -eq 1
            unzip -p "/tmp/part-$label.zip" >"/tmp/mathlib-parts/$label"
            rm "/tmp/part-$label.zip"
          done
          cat /tmp/mathlib-parts/{aa,ab,ac,ad} >/tmp/mathlib.ndjson.gz
          gzip -t /tmp/mathlib.ndjson.gz
          rm -rf /tmp/mathlib-parts
          gzip -d -c /tmp/mathlib.ndjson.gz >/tmp/mathlib.ndjson
          rm /tmp/mathlib.ndjson.gz
          test "$(stat -c '%s' /tmp/mathlib.ndjson)" -eq 6184415052
          printf '%s  %s\n' "$EXPECTED_INPUT" /tmp/mathlib.ndjson | sha256sum -c -
          sha256sum /tmp/mathlib.ndjson >/tmp/sparse-mathlib-input.sha256

      - name: Independently build same-source PGO baseline and precise patch
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/intgrah/sokonanoda /tmp/source-soko
          git -C /tmp/source-soko worktree add --detach /tmp/soko-base 9a021b66f804a1d1df68a981337c67413ef72f6b
          git -C /tmp/source-soko worktree add --detach /tmp/soko-candidate 9a021b66f804a1d1df68a981337c67413ef72f6b
          sha256sum experiments/lean-kernel/soko9a-sparse-prune-reset.patch >/tmp/sparse-source-patch.sha256
          git -C /tmp/soko-candidate apply --check "$GITHUB_WORKSPACE/experiments/lean-kernel/soko9a-sparse-prune-reset.patch"
          git -C /tmp/soko-candidate apply "$GITHUB_WORKSPACE/experiments/lean-kernel/soko9a-sparse-prune-reset.patch"
          git -C /tmp/soko-candidate diff --check
          git -C /tmp/soko-candidate diff -- src/checker/cache.rs src/checker/eval/environment.rs >/tmp/sparse-applied-source.diff
          test -s /tmp/sparse-applied-source.diff
          git -C /tmp/soko-base rev-parse HEAD >/tmp/sparse-upstream-source.txt
          sha256sum /tmp/soko-candidate/src/checker/cache.rs /tmp/soko-candidate/src/checker/eval/environment.rs >/tmp/sparse-patched-files.sha256
          rustup component add llvm-tools-preview --toolchain 1.99.1
          HOST="$(rustc +1.99.1 -vV | sed -n 's/^host: //p')"
          PROFDATA="$(rustc +1.99.1 --print sysroot)/lib/rustlib/$HOST/bin/llvm-profdata"
          test -x "$PROFDATA"
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip >/tmp/arena-frozen196.zip
          mkdir -p /tmp/arena-archive /tmp/frozen
          unzip -q /tmp/arena-frozen196.zip -d /tmp/arena-archive
          tar --no-same-owner -xzf /tmp/arena-archive/lean-arena-tests.tar.gz -C /tmp/frozen
          rm /tmp/arena-frozen196.zip
          for arm in base candidate; do
            (
              cd "/tmp/soko-$arm"
              mkdir -p pgo
              RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo +1.99.1 build --release --locked
              target/release/sokonanoda --stdin --nat-extension --string-extension --axiom-allow-all --threads 4 < /tmp/frozen/good/init-prelude.ndjson >/dev/null
              "$PROFDATA" merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
              RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo +1.99.1 build --release --locked
              test -s target/release/sokonanoda
            )
          done
          sha256sum /tmp/soko-{base,candidate}/target/release/sokonanoda >/tmp/sparse-pgo-binaries.sha256
          rm -rf /tmp/arena-archive /tmp/frozen
          df -h /tmp

      - name: Paired baseline/candidate full Mathlib 1-worker ACCEPT and cost
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/sparse-mathlib-timing
          printf 'rep,arm,exit,timefile\n' >/tmp/sparse-mathlib-verdicts.csv
          rep=0
          for arm in base candidate candidate base; do
            rep=$((rep+1))
            /usr/bin/time -f 'elapsed=%e user=%U system=%S max_rss_kb=%M' \
              -o "/tmp/sparse-mathlib-timing/$rep.time" \
              timeout --kill-after=10s 5680s \
              "/tmp/soko-$arm/target/release/sokonanoda" --stdin --nat-extension --string-extension --axiom-allow-all --threads 1 \
              < /tmp/mathlib.ndjson > "/tmp/sparse-mathlib-timing/$rep.out" 2> "/tmp/sparse-mathlib-timing/$rep.err"
            rc=$?
            printf '%s,%s,%s,%s\n' "$rep" "$arm" "$rc" "$rep.time" | tee -a /tmp/sparse-mathlib-verdicts.csv
          done
          python3 - <<'PY'
          import csv, json, pathlib, statistics
          p=pathlib.Path('/tmp/sparse-mathlib-verdicts.csv')
          rows=[]
          for record in csv.DictReader(p.open()):
            t=(pathlib.Path('/tmp/sparse-mathlib-timing')/record['timefile']).read_text().strip()
            measurements=dict(k.split('=',1) for k in t.split() if '=' in k)
            rows.append({**record,**measurements})
          ok=all(r['exit']=='0' for r in rows)
          samples={arm:[float(r['user']) for r in rows if r['arm']==arm] for arm in ['base','candidate']}
          med={arm:statistics.median(s) for arm,s in samples.items()}
          paired=[float(rows[1]['user'])<float(rows[0]['user']),float(rows[2]['user'])<float(rows[3]['user'])]
          ratio=med['candidate']/med['base']
          decision='CANDIDATE_COST_REDUCTION' if ok and ratio<=0.99 and all(paired) else 'REJECTED_OR_UNKNOWN_COST'
          report={'source':'9a021b66f804a1d1df68a981337c67413ef72f6b',
            'patch':'experiments/lean-kernel/soko9a-sparse-prune-reset.patch',
            'input_sha256':'22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6',
            'scope':'same native runner, exact source and input, identically trained PGO; NOT hardware PMU/official score',
            'all_accept':ok,'rows':rows,'median_user_cpu_s':med,'candidate_over_baseline_ratio':ratio,
            'paired_cpu_wins':paired,'decision':decision}
          pathlib.Path('/tmp/sparse-mathlib-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2),flush=True)
          if not ok:raise SystemExit('MATHLIB_CHECKER_VERDICT_RED')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soko9a-sparse-full-mathlib-pgo-abba
          path: |
            /tmp/sparse-mathlib-input.sha256
            /tmp/sparse-upstream-source.txt
            /tmp/sparse-source-patch.sha256
            /tmp/sparse-applied-source.diff
            /tmp/sparse-patched-files.sha256
            /tmp/sparse-pgo-binaries.sha256
            /tmp/sparse-mathlib-verdicts.csv
            /tmp/sparse-mathlib-report.json
            /tmp/sparse-mathlib-timing/*.time
          if-no-files-found: warn
