name: V4 BVDecide Locate Declaration
on:
  push:
    branches: [mathgraph-v4-bvdecide-residual-20260830]
    paths: ['.github/workflows/v4-bvdecide-locate-decl.yml']
  workflow_dispatch:
jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build Std and trace target name references
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          f=_build/tests/std.ndjson
          hit=$(grep -n -m1 'denote_blastDivSubtractShift_q' "$f")
          echo "NAME_HIT=$hit"
          id=$(printf '%s\n' "$hit" | sed -E 's/.*\{"in":([0-9]+).*/\1/')
          echo "NAME_ID=$id"
          grep -n "[:[,]$id[,}]\|\"$id\"" "$f" | tail -n 80 | tee /tmp/id-hits.txt || true
          python3 - "$f" "$id" <<'PY' | tee /tmp/structured-hits.txt
          import json,sys
          path=sys.argv[1]; target=int(sys.argv[2]); hits=[]
          def has(x):
              if x == target: return True
              if isinstance(x,dict): return any(has(v) for v in x.values())
              if isinstance(x,list): return any(has(v) for v in x)
              return False
          with open(path) as fh:
              for n,line in enumerate(fh,1):
                  try: x=json.loads(line)
                  except Exception: continue
                  if has(x):
                      hits.append((n,line.rstrip()))
          for n,line in hits[-120:]: print(f'{n}:{line}')
          print('TOTAL_STRUCTURED_HITS='+str(len(hits)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-bvdecide-locate-decl
          path: |
            /tmp/id-hits.txt
            /tmp/structured-hits.txt
