name: Structural projected-env open-cache A/B

on:
  pull_request:
    branches: [mathgraph]
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Build Arena workloads
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena /tmp/arena-struct
          cd /tmp/arena-struct
          for t in init-prelude init std mathlib; do nix develop -c ./lka.py build-test "$t"; done
          nix shell nixpkgs#llvmPackages_21.llvm -c llvm-profdata --version
          nix shell nixpkgs#valgrind -c valgrind --version

      - name: Build exact-V2 arms with Arena-style PGO
        run: |
          set -euxo pipefail
          V2=3d7585c21242f29fdaa48ae9a16e16c6afe42238
          PROFDATA="nix shell nixpkgs#llvmPackages_21.llvm -c llvm-profdata"
          for arm in base all apppi; do
            git worktree add "/tmp/v2-$arm" "$V2"
            if [ "$arm" != base ]; then
              python3 scripts/apply_structural_open_cache.py "/tmp/v2-$arm" "$arm"
            fi
            cd "/tmp/v2-$arm"
            cargo test --release --locked
            rm -rf pgo target
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release --locked
            cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
            target/release/sokonanoda /tmp/checker.json < /tmp/arena-struct/_build/tests/init-prelude.ndjson >/dev/null
            nix shell nixpkgs#llvmPackages_21.llvm -c llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            test -s "$PWD/pgo/merged.profdata"
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
            cp target/release/sokonanoda "/tmp/$arm-checker"
            CARGO_TARGET_DIR="/tmp/$arm-cg" RUSTFLAGS='-C target-cpu=x86-64' cargo build --release --locked
            cp "/tmp/$arm-cg/release/sokonanoda" "/tmp/$arm-cg-checker"
          done

      - name: Semantic equality
        run: |
          set -euxo pipefail
          cd /tmp/arena-struct
          for t in init std mathlib; do
            f="_build/tests/$t.ndjson"
            timeout 1200 /tmp/base-checker /tmp/checker.json < "$f" >/tmp/base-$t.out 2>/tmp/base-$t.err
            for arm in all apppi; do
              timeout 1200 "/tmp/$arm-checker" /tmp/checker.json < "$f" >"/tmp/$arm-$t.out" 2>"/tmp/$arm-$t.err"
              cmp "/tmp/base-$t.out" "/tmp/$arm-$t.out"
            done
          done

      - name: Deterministic instruction counts
        run: |
          set -euxo pipefail
          printf 'test,arm,instructions\n' >/tmp/struct-callgrind.csv
          cd /tmp/arena-struct
          for t in init std; do
            f="_build/tests/$t.ndjson"
            for arm in base all apppi; do
              cf="/tmp/cg-$t-$arm.out"
              timeout 1500 nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file="$cf" "/tmp/$arm-cg-checker" /tmp/checker.json < "$f" >/dev/null 2>"/tmp/cg-$t-$arm.err"
              ir=$(awk '/^summary:/ {print $2; exit}' "$cf")
              test -n "$ir"
              printf '%s,%s,%s\n' "$t" "$arm" "$ir" >>/tmp/struct-callgrind.csv
            done
          done

      - name: Paired Mathlib wall
        run: |
          set -euxo pipefail
          printf 'rep,arm,seconds\n' >/tmp/struct-wall.csv
          cd /tmp/arena-struct
          f=_build/tests/mathlib.ndjson
          for rep in 1 2; do
            if [ "$rep" = 1 ]; then arms='base all apppi'; else arms='apppi all base'; fi
            for arm in $arms; do
              tf="/tmp/time-$rep-$arm.txt"
              timeout 1200 /usr/bin/time -f '%e' -o "$tf" "/tmp/$arm-checker" /tmp/checker.json < "$f" >/dev/null 2>"/tmp/wall-$rep-$arm.err"
              printf '%s,%s,%s\n' "$rep" "$arm" "$(cat "$tf")" >>/tmp/struct-wall.csv
            done
          done

      - name: Decide
        run: |
          python3 - <<'PY' | tee /tmp/struct-summary.txt
          import csv, statistics
          ir=list(csv.DictReader(open('/tmp/struct-callgrind.csv')))
          wall=list(csv.DictReader(open('/tmp/struct-wall.csv')))
          def I(t,a): return int(next(r['instructions'] for r in ir if r['test']==t and r['arm']==a))
          def W(a): return statistics.median(float(r['seconds']) for r in wall if r['arm']==a)
          for arm in ['all','apppi']:
              print('\nARM',arm)
              wins=True
              for t in ['init','std']:
                  b=I(t,'base'); x=I(t,arm); q=x/b
                  print('IR',t,b,x,f'ratio={q:.6f}',f'delta={(q-1)*100:+.3f}%')
                  wins &= q < 1.0
              b=W('base'); x=W(arm); q=x/b
              print('WALL mathlib',b,x,f'ratio={q:.6f}',f'delta={(q-1)*100:+.3f}%')
              wins &= q < 1.0
              std_gain=1-I('std',arm)/I('std','base')
              if wins and std_gain >= .10: verdict='PHASE_CHANGE_GAIN__FULL_ARENA_GATE_NOW'
              elif wins and std_gain >= .05: verdict='MAJOR_GAIN__FULL_ARENA_GATE_NOW'
              elif wins and std_gain >= .02: verdict='MATERIAL_GAIN__EXPAND_AND_FULL_GATE'
              elif wins: verdict='SMALL_GAIN__DO_NOT_OVERFIT'
              else: verdict='NO_PROMOTION'
              print('VERDICT',verdict)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-open-cache-key-ab
          path: |
            /tmp/struct-callgrind.csv
            /tmp/struct-wall.csv
            /tmp/struct-summary.txt
            /tmp/*-init.err
            /tmp/*-std.err
            /tmp/*-mathlib.err
