name: msikernel observation closure boundary v23

on:
  push:
    branches: [msikernel-observation-closure-boundary-v23]
  workflow_dispatch:

jobs:
  observation-closure-boundary-v23:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build real Std and Cedar discovery prefixes
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          for c in std cedar; do
            head -n 400000 _build/tests/$c.ndjson >/tmp/$c.train.ndjson
            test "$(wc -l </tmp/$c.train.ndjson)" -eq 400000
          done
          cd ..
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
          cp OBSERVATION_CLOSURE_BOUNDARY_V23.md /tmp/prereg.md
      - name: Collect frozen-boundary observations and hidden V22 witness
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/probe
          python3 experiments/structural_substrate_runtime_v22.py /tmp/probe probe | tee /tmp/runtime-probe.txt
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/target-probe RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/probe/Cargo.toml --release --locked"
          for c in std cedar; do /tmp/target-probe/release/sokonanoda /tmp/checker.json </tmp/$c.train.ndjson >/tmp/$c.probe.out 2>/tmp/$c.probe.log; done
          cd ..
          python3 - <<'PY'
          import re,csv
          hdr=['corpus','event_id','safe','p0','p1','p2','p3','empty','closed','canonical'];counts={0:0,1:0};n=0
          with open('/tmp/v23_observations.csv','w',newline='') as f:
            w=csv.writer(f);w.writerow(hdr)
            for corpus in ('std','cedar'):
              event=0
              for line in open(f'/tmp/{corpus}.probe.log',errors='replace'):
                m=re.search(r'APPGEN_V22 safe=([01]) p0=(\d+) q0=(\d+) q1=(\d+) p3=(\d+) spine_empty=([01]) closed=([01]) canonical=([01])',line)
                if not m: continue
                vals=list(map(int,m.groups()));w.writerow([corpus,event,*vals]);event+=1;n+=1;counts[vals[0]]+=1
          print(f'V23_PROBE_EVENTS={n} SAFE={counts[1]} UNSAFE={counts[0]}');assert counts[1] and counts[0]
          PY
      - name: Prove universal closure boundary on real events
        run: |
          set -euxo pipefail
          python3 experiments/observation_closure_boundary_v23.py /tmp/v23_observations.csv | tee /tmp/v23_result.txt
          grep -q 'V23_REAL_SAFE_UNSAFE_COLLISION=PASS' /tmp/v23_result.txt
          grep -q 'V23_UNIVERSAL_FACTOR_THROUGH_SIGNATURE_BOUND=PASS' /tmp/v23_result.txt
          grep -q 'V23_BOUND_STRICTLY_BELOW_FULL_SAFE_FRONTIER=PASS' /tmp/v23_result.txt
          grep -q 'V23_NEW_PRIMITIVE_SOURCE_BREAKS_OBSTRUCTION=PASS' /tmp/v23_result.txt
      - name: Compile abstract Lean no-separator theorem
        run: |
          set -euxo pipefail
          cd arena
          nix develop -c bash -euxo pipefail -c "cd _build/tests/work/std/src && lake env lean '$GITHUB_WORKSPACE/lean/ObservationClosureBoundary.lean'"
          cd ..
          echo V23_LEAN_OBSERVATION_CLOSURE_THEOREM=PASS | tee -a /tmp/v23_result.txt
      - name: Final scientific classification
        run: |
          set -euxo pipefail
          echo OBSERVATION_CLOSURE_BOUNDARY_V23=GENUINE_INFORMATION_BOUNDARY | tee -a /tmp/v23_result.txt
          cat /tmp/v23_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msikernel-observation-closure-boundary-v23
          path: |
            /tmp/v23_result.txt
            /tmp/v23_analysis.txt
            /tmp/prereg.md
            /tmp/runtime-probe.txt
            /tmp/v23_observations.csv
