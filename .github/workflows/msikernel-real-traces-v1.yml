name: msikernel real traces v1

on:
  push:
    branches: [msikernel-real-traces-v1]

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build real checker and corpora
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          head -n 200000 _build/tests/std.ndjson >/tmp/std-200k.ndjson
          head -n 200000 _build/tests/cedar.ndjson >/tmp/cedar-200k.ndjson
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/msikernel-trace-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path $GITHUB_WORKSPACE/Cargo.toml --release --locked"
          nix develop -c bash -euxo pipefail -c "cargo test --manifest-path $GITHUB_WORKSPACE/Cargo.toml --locked"
          cd ..
          git clone --depth 1 --branch msikernel-groundup-v0 https://github.com/heathsanchez/Minimal-Sufficient-Interface.git /tmp/msi-spec
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Emit anonymous real continuation matrices
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          for corpus in std cedar; do
            /tmp/msikernel-trace-target/release/sokonanoda /tmp/checker.json </tmp/$corpus-200k.ndjson >/tmp/$corpus-clean.out
            MSIKERNEL_TRACE=1 /tmp/msikernel-trace-target/release/sokonanoda /tmp/checker.json </tmp/$corpus-200k.ndjson >/tmp/$corpus-trace.out 2>/tmp/$corpus-trace.raw
            cmp /tmp/$corpus-clean.out /tmp/$corpus-trace.out
            grep '^MSI_TRACE|' /tmp/$corpus-trace.raw >/tmp/$corpus.trace
            PYTHONPATH=/tmp/msi-spec python3 experiments/compile_real_msi_trace.py "$corpus" /tmp/$corpus.trace /tmp/$corpus-interface.json | tee -a /tmp/result.txt
            echo "${corpus^^}_TRACE_OUTPUT_EQ=PASS" | tee -a /tmp/result.txt
          done

      - name: Cross-workload gate
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee -a /tmp/result.txt
          import json
          s=json.load(open('/tmp/std-interface.json'))
          c=json.load(open('/tmp/cedar-interface.json'))
          assert s['complete'] and c['complete']
          assert s['outcome_relabel_invariant'] and c['outcome_relabel_invariant']
          assert s['classes'] > 1 and c['classes'] > 1
          assert s['compression'] > 10 and c['compression'] > 10
          assert s['c1_positive'] > 0 and c['c1_positive'] > 0
          print('REAL_TRACE_NONTRIVIAL_QUOTIENT=PASS')
          print('REAL_TRACE_CROSS_WORKLOAD=PASS')
          print(f"STD_CLASSES={s['classes']} CEDAR_CLASSES={c['classes']}")
          print(f"STD_COMPRESSION={s['compression']:.3f} CEDAR_COMPRESSION={c['compression']:.3f}")
          PY
          cat /tmp/result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: msikernel-real-traces-v1
          path: |
            /tmp/result.txt
            /tmp/std-interface.json
            /tmp/cedar-interface.json
            /tmp/std.trace
            /tmp/cedar.trace
