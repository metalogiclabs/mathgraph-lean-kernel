name: MSI non-thunk transfer v25

on:
  push:
    branches: [msi-nonthunk-fastpath-v24]
    paths:
      - '.github/workflows/msi-nonthunk-transfer-v25.yml'

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          set_as_trusted_user: true
      - name: Prepare corpora and binaries
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test std
          nix develop -c ./lka.py build-test cedar
          cd ..
          git clone --depth 1 --branch mathgraph https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          cp -a /tmp/base /tmp/cand
          cp experiments/apply_msi_nonthunk_fastpath_v24.py /tmp/cand/patch.py
          (cd /tmp/cand && python3 patch.py nonthunk)
          cd arena
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/base-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/base/Cargo.toml --release --locked"
          nix develop -c bash -euxo pipefail -c "CARGO_TARGET_DIR=/tmp/cand-target RUSTFLAGS='-C target-cpu=x86-64' cargo build --manifest-path /tmp/cand/Cargo.toml --release --locked"
          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF
      - name: Full Std and Cedar transfer
        shell: bash
        run: |
          set -euxo pipefail
          : >/tmp/result.txt
          for corpus in std cedar; do
            src="arena/_build/tests/${corpus}.ndjson"
            for i in 1 2 3; do
              /usr/bin/time -f "${corpus^^}_BASE_${i}=%e RSS=%M" /tmp/base-target/release/sokonanoda /tmp/checker.json < "$src" > "/tmp/${corpus}-base-${i}.out" 2>>/tmp/result.txt
              /usr/bin/time -f "${corpus^^}_CAND_${i}=%e RSS=%M" /tmp/cand-target/release/sokonanoda /tmp/checker.json < "$src" > "/tmp/${corpus}-cand-${i}.out" 2>>/tmp/result.txt
              cmp "/tmp/${corpus}-base-${i}.out" "/tmp/${corpus}-cand-${i}.out"
            done
          done
          python3 - <<'PY' | tee -a /tmp/result.txt
          import re, statistics
          s=open('/tmp/result.txt').read()
          ok=True
          for corpus in ['STD','CEDAR']:
              b=[float(x) for x in re.findall(fr'{corpus}_BASE_\d+=([0-9.]+)',s)]
              c=[float(x) for x in re.findall(fr'{corpus}_CAND_\d+=([0-9.]+)',s)]
              bm=statistics.mean(b); cm=statistics.mean(c)
              d=100*(cm-bm)/bm
              print(f'{corpus}_BASE_MEAN={bm:.6f}')
              print(f'{corpus}_CAND_MEAN={cm:.6f}')
              print(f'{corpus}_DELTA_PCT={d:.6f}')
              ok &= d < 0
          print('DECISION=' + ('PROMOTE_NONTHUNK_TRANSFER' if ok else 'HOLD_NONTHUNK_TRANSFER'))
          PY
          cat /tmp/result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: msi-nonthunk-transfer-v25
          path: /tmp/result.txt
