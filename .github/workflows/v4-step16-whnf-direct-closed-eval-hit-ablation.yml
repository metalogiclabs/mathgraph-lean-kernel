name: V4 Step16 WHNF Direct Closed-Eval Hit Ablation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v4-step16-whnf-direct-closed-eval-hit-ablation.yml'

jobs:
  ablate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build Arena tests
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cd arena
          nix develop -c ./lka.py build-test init-prelude
          nix develop -c ./lka.py build-test std
      - name: Materialize retained7 and direct closed-eval hit candidate
        run: |
          set -euxo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/base
          git -C /tmp/base checkout 2de1895a52d21ad266b77002defe3e6bc69bbcfd
          cp -a /tmp/base /tmp/cand
          curl -L https://raw.githubusercontent.com/metalogiclabs/mathgraph-lean-kernel/5a1485ae13a0623ca8b7001aee9e0e155381daad/experiments/apply_v4_retained6.py -o /tmp/apply.py
          python3 /tmp/apply.py /tmp/base
          python3 /tmp/apply.py /tmp/cand
          python3 - <<'PY'
          from pathlib import Path
          import re
          for root in ['/tmp/base','/tmp/cand']:
              p=Path(root)/'src/eval.rs'; s=p.read_text()
              s,n=re.subn(r'(WHNF_ADMIT_THRESHOLD\s*:\s*u8\s*=\s*)2', r'\g<1>1', s)
              assert n==1, n
              p.write_text(s)
          ep=Path('/tmp/cand/src/eval.rs'); s=ep.read_text()
          old='''        let &(full, e) = self.tc_cache.whnf_store.get(&k)?;\n        let (mine, verified) = self.global_key(v, depth).ok()?;\n        if !verified || mine != full {\n            return None;\n        }\n        let env = self.empty_env();\n        Some(self.eval(depth, env, e))'''
          new='''        let &(full, e) = self.tc_cache.whnf_store.get(&k)?;\n        let (mine, verified) = self.global_key(v, depth).ok()?;\n        if !verified || mine != full {\n            return None;\n        }\n        if let Some(cached) = self.tc_cache.closed_eval_cache.get(&e) {\n            return Some(cached);\n        }\n        let env = self.empty_env();\n        Some(self.eval(depth, env, e))'''
          assert old in s
          ep.write_text(s.replace(old,new,1))
          PY
          git -C /tmp/cand diff -- src | tee /tmp/cand.diff
          for d in base cand; do
            echo '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}' > /tmp/$d/config.json
          done
      - name: PGO build both
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/arena"
          for k in base cand; do
            d=/tmp/$k; cd "$d"
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-generate=$PWD/pgo" cargo build --release --locked
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            nix shell nixpkgs#llvm -c llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            rm -rf target
            RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked
          done
      - name: Deterministic Std Callgrind
        run: |
          set -euxo pipefail
          cd arena
          for k in base cand; do
            nix shell nixpkgs#valgrind -c valgrind --tool=callgrind --callgrind-out-file=/tmp/${k}.callgrind /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null
            grep '^summary:' /tmp/${k}.callgrind | awk '{print $2}' > /tmp/${k}.ir
          done
          python3 - <<'PY' | tee /tmp/result.txt
          a=int(open('/tmp/base.ir').read()); b=int(open('/tmp/cand.ir').read())
          print(f'RETAINED7_IR={a}')
          print(f'CAND_IR={b}')
          print(f'DELTA_IR={b-a}')
          print(f'DELTA_PCT={(b/a-1)*100:.6f}')
          print('V4_WHNF_DIRECT_CLOSED_EVAL_HIT=' + ('PASS' if b<a else 'FAIL'))
          PY
      - name: Alternating wall sanity
        run: |
          set -euxo pipefail
          cd arena
          : > /tmp/wall.tsv
          for i in 1 2 3; do
            for k in base cand; do
              /usr/bin/time -f "$k\t%e" -o /tmp/one.time /tmp/${k}/target/release/sokonanoda /tmp/${k}/config.json < _build/tests/std.ndjson >/dev/null
              cat /tmp/one.time >> /tmp/wall.tsv
            done
          done
          cat /tmp/wall.tsv | tee -a /tmp/result.txt
          python3 - <<'PY' | tee -a /tmp/result.txt
          import statistics
          d={'base':[],'cand':[]}
          for line in open('/tmp/wall.tsv'):
              k,v=line.split(); d[k].append(float(v))
          a=statistics.median(d['base']); b=statistics.median(d['cand'])
          print(f'base_WALL_MEDIAN={a}')
          print(f'cand_WALL_MEDIAN={b}')
          print(f'WALL_DELTA_PCT={(b/a-1)*100:.6f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-step16-whnf-direct-closed-eval-hit-ablation
          path: |
            /tmp/result.txt
            /tmp/cand.diff
            /tmp/*.callgrind
