name: MSI earned memory policy v40

on:
  push:
    branches: [msi-earned-memory-policy-v40]
  workflow_dispatch:

jobs:
  earned-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run frozen V40 protocol
        run: bash experiments/run_earned_memory_policy_v40.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-earned-memory-policy-v40
          path: |
            /tmp/result.txt
            /tmp/semantic-selection.json
            /tmp/semantic-selection.log
            /tmp/policy-selection.json
            /tmp/policy-selection.log
            /tmp/acquisition-control.txt
            /tmp/corpus-hashes.txt
            /tmp/acq-ungated.err
            /tmp/cg-acq1-*
            /tmp/cg-acq2-*
            /tmp/cg-std3-*
            /tmp/cg-std4-*
            /tmp/cg-cedar1-*
            /tmp/cg-cedar2-*
